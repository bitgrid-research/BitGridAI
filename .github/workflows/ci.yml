name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Format & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      # Single source of truth: same target as the local pre-PR gate (make check).
      - name: Lint (black --check + mypy --strict)
        run: make lint

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      # Runs the full suite (incl. adapters/ui/explain/integration/replay) and
      # enforces the coverage floor from pyproject. Same target as make check.
      - name: Tests (full suite + coverage gate)
        run: make test

  build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - name: Build core + UI images
        run: make build-ci
