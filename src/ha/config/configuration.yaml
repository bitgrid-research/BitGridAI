# Loads default set of integrations. Do not remove.
default_config:

homeassistant:
  packages: !include_dir_merge_named packages

frontend:
  themes: !include_dir_merge_named themes
  # Frontend-Modul für runde Ecken der power-flow-card-plus (card-mod ist nicht
  # installiert). Lädt unabhängig vom Lovelace resource_mode auf jeder Seite.
  extra_module_url:
    # ?v= Cache-Bust: bei jeder Änderung an bitgrid_card_shape.js hochzählen,
    # sonst lädt der Browser bzw. das Wandtablet (Kiosk) die alte gecachte
    # Version. Datum als Versionsstempel.
    - /local/bitgrid_card_shape.js?v=20260823

lovelace:
  resource_mode: yaml
  resources:
    # card-mod (HACS): CSS-Injektion in den Shadow-DOM von Karten. Zuerst laden,
    # damit card_mod: auf den folgenden Karten greift. Nötig für lesbare Eingabe-
    # Boxen im Glas-Look, die das Theme über die MDC-Textfield-Füllung nicht
    # erreicht. resource_mode: yaml -> HACS trägt die Resource nicht automatisch
    # ein, daher hier von Hand.
    - url: /hacsfiles/lovelace-card-mod/card-mod.js
      type: module
    - url: /hacsfiles/power-flow-card-plus/power-flow-card-plus.js
      type: module
    - url: /hacsfiles/button-card/button-card.js
      type: module
    - url: /hacsfiles/lovelace-layout-card/layout-card.js
      type: module
    - url: /hacsfiles/clock-weather-card/clock-weather-card.js
      type: module
    - url: /hacsfiles/lovelace-horizon-card/lovelace-horizon-card.js
      type: module
    # apexcharts-card (HACS): Wochen-Verlaufschart (PV/Verbrauch/Akku) auf dem
    # Demo-Home-Tab, scrollbar/zoombar über 7 Tage. Ordnername auf dem Server
    # verifiziert (ls www/community/): "apexcharts-card", NICHT "lovelace-
    # apexcharts-card" — anders als die HACS-Repo-Namen der übrigen Karten
    # oben (lovelace-card-mod, lovelace-layout-card, ...).
    - url: /hacsfiles/apexcharts-card/apexcharts-card.js
      type: module
    # bubble-card (HACS, Clooos/Bubble-Card): Balken-Listen fuer "Verbrauch
    # nach Gerätetyp" (Tab "EnergieInfo"), Nutzer-Wunsch 25.08.2026. War
    # bereits am 11.07.2026 uber HACS installiert (www/community/Bubble-Card/,
    # Grossschreibung wie der GitHub-Repo-Name), nur nie hier eingetragen —
    # deshalb bislang ungenutzt. Pfad-Grossschreibung beachten: anders als
    # die anderen HACS-Ordner oben (alle lowercase) heisst dieser exakt
    # "Bubble-Card", 25.08.2026 live per HTTP-Request verifiziert.
    - url: /hacsfiles/Bubble-Card/bubble-card.js
      type: module
  dashboards:
    # 03.09.2026, Nutzer-Wunsch: v1/v2 aus der Sidebar ausgeblendet
    # (show_in_sidebar: false), Config bleibt vollstaendig aktiv/erreichbar
    # unter /bitgridai-v1 bzw. /bitgridai-v2 — jederzeit reversibel.
    bitgridai-v1:
      mode: yaml
      filename: bitgrid_dashboard_v1.yaml
      title: BitGridAI v1
      icon: mdi:close
      show_in_sidebar: false
    bitgridai-v2:
      mode: yaml
      filename: bitgrid_dashboard_v2.yaml
      title: BitGridAI v2
      icon: mdi:close
      show_in_sidebar: false
    # URL-Pfad UND Dateiname 23./24.08.2026 von "demo" auf "v3" umbenannt
    # (Nutzer-Entscheidung, volle Konsistenz mit v1/v2) — bricht das
    # gespeicherte Kiosk-Bookmark auf dem Tischdemo-Geraet, muss dort einmal
    # manuell auf /bitgridai-v3/home neu gesetzt werden.
    bitgridai-v3:
      mode: yaml
      filename: bitgrid_dashboard_v3.yaml
      title: BitGridAI v3
      icon: mdi:bitcoin
      show_in_sidebar: true

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

# ── Recorder: 1 Jahr Rohdaten für Forschung und Szenario-Builder ─────────────
# Was gespeichert wird:
#   - Alle physischen Messungen (PV, Last, Netz, SoC, Miner, Heizstab)
#   - Systementscheidungen (bg_decision_*, R1-R5 Binärsensoren)
#   - Integral-Sensoren (für Midnight-Baseline-System)
# Was NICHT gespeichert wird:
#   - input_* Domains (Konfiguration, keine Messdaten)
#   - Abgeleitete Tages-Summen (stehen in mining_log.csv / stats_monthly.csv)
#   - Prognose- und Hilfssensoren (aus Rohdaten rekonstruierbar)
recorder:
  purge_keep_days: 365
  exclude:
    domains:
      - input_number
      - input_boolean
      - input_select
      - input_datetime
      - input_text
    entities:
      # Aus Rohdaten rekonstruierbar
      - sensor.surplus_kw
      - sensor.geraete_power_w
      - sensor.battery_power_w
      - sensor.battery_power_flowchart_w
      - sensor.block_id
      - sensor.block_window_start
      - sensor.bg_decision_priority
      # Prognose — kein historischer Wert
      - sensor.house_load_forecast_w
      - sensor.mining_window_free_w
      # 7d-Mittelwert — nur für Live-Prognose
      - sensor.house_load_mean_7d
      # Tages-Summen — stehen bereits in mining_log.csv und stats_monthly.csv
      - sensor.pv_energy_daily
      - sensor.mining_energy_daily
      - sensor.grid_import_daily
      - sensor.grid_export_daily
      - sensor.house_energy_daily
      - sensor.heizstab_energy_daily
      - sensor.waschmaschine_energy_daily
      - sensor.tv_energy_daily
      - sensor.kuehlschraenke_energy_daily
      - sensor.buero_energy_daily
      - sensor.lueftung_energy_daily
      - sensor.server_energy_daily
      - sensor.geraete_energy_daily
      - sensor.pv_self_use_savings_eur
      - sensor.grid_import_cost_eur
      - sensor.total_profit_today_eur
      - sensor.solar_coverage_pct
      - sensor.deadband_hit_rate_pct
      - sensor.efficiency_kwh_per_h_live
      - sensor.mining_window_used_pct
      - sensor.miner_uptime_today_fmt
      # History-Stats — Tages-Summen, kein Zeitreihenwert
      - sensor.miner_uptime_today_h
      - sensor.miner_super_hours_today
      - sensor.miner_eco_hours_today
      - sensor.miner_standard_hours_today
      - sensor.miner_standard_hours_today
      - sensor.mining_window_hours_today
      - sensor.miner_deadband_hours_today
      # Shell-Command Sensor — liest nur CSV, kein Messwert
      - sensor.mining_log_history

# ── MQTT ──────────────────────────────────────────────────────────────────────
# Broker wird über HA-UI konfiguriert: Einstellungen → Integrationen → MQTT
# Umbrel-IP aus .env: MQTT_HOST
#
# Temp/Humidity-Sensoren (via Zigbee2MQTT oder andere MQTT-Bridge):
mqtt:
  sensor:
    - name: temp_miner_room
      unique_id: temp_miner_room
      state_topic: "zigbee2mqtt/temp_miner_room"
      value_template: "{{ value_json.temperature | float | round(1) }}"
      unit_of_measurement: "°C"
      device_class: temperature
      state_class: measurement
      expire_after: 300

    - name: humidity_miner_room
      unique_id: humidity_miner_room
      state_topic: "zigbee2mqtt/temp_miner_room"
      value_template: "{{ value_json.humidity | float | round(1) }}"
      unit_of_measurement: "%"
      device_class: humidity
      state_class: measurement
      expire_after: 300

    - name: temp_living_room
      unique_id: temp_living_room
      state_topic: "zigbee2mqtt/temp_living_room"
      value_template: "{{ value_json.temperature | float | round(1) }}"
      unit_of_measurement: "°C"
      device_class: temperature
      state_class: measurement
      expire_after: 300

    - name: humidity_living_room
      unique_id: humidity_living_room
      state_topic: "zigbee2mqtt/temp_living_room"
      value_template: "{{ value_json.humidity | float | round(1) }}"
      unit_of_measurement: "%"
      device_class: humidity
      state_class: measurement
      expire_after: 300

    - name: pv_forecast_kw
      unique_id: pv_forecast_kw
      state_topic: "bitgrid/forecast/pv_kw"
      value_template: "{{ value | float | round(2) }}"
      unit_of_measurement: "kW"
      state_class: measurement
      expire_after: 7200

    # ── ₿itsy: Andockpunkt der Erklärschicht (Tab "₿itsy" in v2) ─────────
    # Kontrakt für src/explain/bitsy_status.py (Ollama/Qwen im lokalen Netz,
    # direkt angebunden, kein Agenten-Framework).
    # Muss HIER stehen, nicht in packages/: mqtt im Package-Merge liefert
    # "required key 'platform' not provided" (HA-Version unterstützt das
    # Mergen des mqtt-Keys aus Packages nicht).
    # bitsy_status.py publiziert (retained, explizit bei jedem Lauf, kein
    # LWT: das Skript läuft als kurzlebiger Batch-Job ohne Dauerverbindung):
    #   bitgrid/explain/bitsy/status → "online"|"offline"
    #   bitgrid/explain/bitsy/advice → JSON:
    #     {"headline": "...", "text": "...", "mood": "...",
    #      "model": "qwen3:14b", "generated_at": "ISO-8601"}
    #   bitgrid/explain/bitsy/chat → JSON (nur bei einer Frage, ask()):
    #     {"question": "...", "answer": "...", "answered_at": "ISO-8601"}
    # Read-only-Prinzip: kein Steuerpfad, nur Erklärung/Beratung. Solange
    # nichts publiziert wurde, ist der Sensor unavailable und der Tab zeigt
    # die deterministische, regelbasierte Sicht.
    - name: "Bitsy Advice"
      unique_id: bitsy_advice
      state_topic: "bitgrid/explain/bitsy/advice"
      # State = headline; HA-States sind auf 255 Zeichen begrenzt, deshalb
      # hart gekappt. Der Volltext lebt in den Attributen (text).
      value_template: "{{ (value_json.headline | default(''))[:250] }}"
      json_attributes_topic: "bitgrid/explain/bitsy/advice"
      availability_topic: "bitgrid/explain/bitsy/status"
      payload_available: "online"
      payload_not_available: "offline"
      icon: mdi:rodent

    # ── ₿itsy-Chat: Freitextantwort (Baustein 3, packages/bitsy_chat.yaml) ──
    # Ersetzt input_text.bitsy_answer (255-Zeichen-Hardlimit der input_text-
    # Domain in HA, nicht erhöhbar): State bleibt aus Konsistenzgründen
    # ebenso gekappt, aber die Attribute (answer/question) sind unbegrenzt,
    # genau wie bei "Bitsy Advice" oben.
    - name: "Bitsy Chat"
      unique_id: bitsy_chat
      state_topic: "bitgrid/explain/bitsy/chat"
      value_template: "{{ (value_json.answer | default(''))[:250] }}"
      json_attributes_topic: "bitgrid/explain/bitsy/chat"
      icon: mdi:comment-text-outline

# ── ₿itsy: "Jetzt aktualisieren"-Button (₿itsy-Tab, ki_beratung.yaml) ────────
# Ruft src/explain/bitsy_trigger_server.py auf, Docker-Container bitgrid-bitsy
# (infra/docker-compose.yml), laeuft auf DIESEM Host (.62, network_mode: host,
# daher localhost statt LAN-IP) mit restart:unless-stopped. Der Container laesst
# daraufhin src/explain/bitsy_status.py einmal durchlaufen (HA lesen, Ollama
# fragen, MQTT publizieren) und macht das intern zusaetzlich alle 10 Minuten
# von selbst. Kein Steuerpfad: startet nur einen Lese-/Erklaer-Durchlauf,
# core/ bleibt unberuehrt.
# Port 8766, NICHT 8765 (das ist fuer den geplanten bitgrid-ui-Dienst
# reserviert, siehe infra/docker-compose.override.yml).
rest_command:
  bitsy_trigger:
    url: "http://localhost:8766/trigger"
    method: POST
    timeout: 30

# ── BitGridAI Entscheidungs-Logik ─────────────────────────────────────────────
# Alle Regelparameter als editierbare Helper
input_boolean:
  simulation_mode:
    name: simulation_mode
    icon: mdi:flask
    initial: off
  r3_emergency_stop:
    name: r3_emergency_stop
    icon: mdi:alert
  override_active:
    name: override_active
    icon: mdi:hand
  replay_mode:
    name: replay_mode
    icon: mdi:play-box-multiple

input_select:
  system_state:
    name: system_state
    # ACHTUNG Quoting: unquoted OFF liest YAML 1.1 als Boolean false, HA bekam
    # dadurch die Option 'False' statt 'OFF' (live bestaetigt 2026-07-17:
    # options: ['False', 'ARMED', ...]). script.bg_stop setzt hier "OFF" als
    # String, was dann nie zu einer gueltigen Option passte. Gleiches gilt fuer
    # ON/YES/NO/TRUE (YAML-"Norway-Problem"): in dieser Liste immer quoten.
    options:
      - "OFF"
      - ARMED
      - RUNNING
      - THROTTLED
      - COOLDOWN
      - LOCKOUT
      - SAFE_MODE
      - ERROR
    initial: "OFF"
  decision_action:
    name: decision_action
    options:
      - START
      - STOP
      - THROTTLE
      - NOOP
    initial: NOOP
  autonomy_level:
    name: autonomy_level
    options:
      - MANUAL
      - ASSIST
      - SEMI_AUTO
      - AUTO
    initial: MANUAL
  override_action:
    name: override_action
    options:
      - START
      - STOP
      - THROTTLE
      - NOOP
    initial: NOOP
  active_miner:
    name: active_miner
    options:
      - BOTH
      - MINER1
      - MINER2
      - NONE
    initial: BOTH
  # 25.08.2026, Nutzer-Vorgabe: ein zentraler Zeitraum-Umschalter für den
  # Abschnitt "Historie" (Tab "EnergieInfo") — alle Kacheln sollen diesen
  # Zeitraum gemeinsam nutzen ("alle Kacheln nachziehen"), statt jede Karte
  # einzeln umzustellen. Vereinfacht auf reine rollierende Fenster (kein
  # kalendarisch ausgerichtetes Tag/Woche/Monat mehr, Nutzer-Vorgabe).
  historie_zeitraum:
    name: "Historie: Zeitraum"
    icon: mdi:history
    options:
      - "Letzte 24 Stunden"
      - "Letzte 7 Tage"
      - "Letzte 30 Tage"
      - "Letzte 12 Monate"
    initial: "Letzte 24 Stunden"
  # 25.08.2026, Nutzer-Vorgabe: nur noch EIN Graph gleichzeitig im Abschnitt
  # "Historie" (Tab "EnergieInfo"), Pfeile oben wechseln durch — gleiches
  # Muster wie der Haus/Garage-Umschalter im Tab "Grundriss" (input_boolean.
  # fp_view_garage), hier mit input_select statt input_boolean, da 7 statt
  # nur 2 Zustände. "Gesamtenergie" zusätzlich zu den 6 Räumen aufgenommen
  # ("nur einen graph anzeigen keine 2 spalten 2 graphen") — vorher stand
  # Gesamtenergie fest neben dem Raum-Umschalter in einer 2-Spalten-Zeile.
  # Reihenfolge der Räume identisch zur Raum-Reihenfolge im Abschnitt
  # "Verbrauch nach Räumen" (heute).
  historie_raum:
    name: "Historie: Ansicht"
    icon: mdi:home-search
    options:
      - "Gesamtenergie"
      - "Untergeschoss"
      - "Wohnzimmer"
      - "Küche"
      - "Schlafzimmer"
      - "Büro"
      - "Hauswirtschaft"
    initial: "Untergeschoss"

input_number:
  # ── Simulation-Inputs (Slider) ───────────────────────────────────────────
  pv_power_w:
    name: pv_power_w
    min: 0
    max: 20000
    step: 50
    mode: box
    initial: 0
  house_load_w:
    name: house_load_w
    min: 0
    max: 20000
    step: 50
    mode: box
    initial: 0
  grid_import_w:
    name: grid_import_w
    min: 0
    max: 20000
    step: 50
    mode: box
    initial: 0
  battery_soc_pct:
    name: battery_soc_pct
    min: 0
    max: 100
    step: 1
    mode: box
    initial: 50

  # ── Regelparameter ───────────────────────────────────────────────────────
  r1_surplus_min_kw:
    name: r1_surplus_min_kw
    min: 0
    max: 20
    step: 0.1
    mode: box
    initial: 6.5
  r2_soc_soft_min_pct:
    name: r2_soc_soft_min_pct
    min: 0
    max: 100
    step: 1
    mode: box
    initial: 58
  r2_soc_hard_min_pct:
    name: r2_soc_hard_min_pct
    min: 0
    max: 100
    step: 1
    mode: box
    initial: 50
  r2_max_grid_import_w:
    name: r2_max_grid_import_w
    min: 0
    max: 20000
    step: 50
    mode: box
    initial: 300
  r3_max_chip_temp_c:
    name: r3_max_chip_temp_c
    min: 0
    max: 130
    step: 1
    mode: box
    # 115 °C = R3-Stopp, gestufte Verteidigung ueber der MVP-Drosselung (112 °C)
    # und ueber dem in 7 Tagen gemessenen Maximum (113 °C). Vorher 90 °C, das lag
    # mitten im Normalbetrieb (74.9 % der Messpunkte darueber) und hat die
    # Geisterschicht dauernd ausgeloest. Siehe Warnblock bei binary_sensor.r3_*
    # und src/core/rules/r3_safety.py. Nicht ohne neue Messreihe senken.
    initial: 115
  r3_comm_timeout_sec:
    name: r3_comm_timeout_sec
    min: 0
    max: 600
    step: 5
    mode: box
    initial: 120
  r3_safety_lockout_min:
    name: r3_safety_lockout_min
    min: 0
    max: 120
    step: 1
    mode: box
    initial: 15
  r5_deadband_hold_blocks:
    name: r5_deadband_hold_blocks
    min: 0
    max: 24
    step: 1
    mode: box
    initial: 2
  r5_min_runtime_blocks:
    name: r5_min_runtime_blocks
    min: 0
    max: 24
    step: 1
    mode: box
    initial: 3
  r5_min_pause_blocks:
    name: r5_min_pause_blocks
    min: 0
    max: 24
    step: 1
    mode: box
    initial: 2
  block_minutes:
    name: block_minutes
    min: 1
    max: 60
    step: 1
    mode: box
    initial: 10
  override_duration_min:
    name: override_duration_min
    min: 1
    max: 180
    step: 1
    mode: box
    initial: 30

input_datetime:
  decision_timestamp:
    name: decision_timestamp
    has_date: true
    has_time: true
  deadband_valid_until:
    name: deadband_valid_until
    has_date: true
    has_time: true
  last_start_at:
    name: last_start_at
    has_date: true
    has_time: true
  last_stop_at:
    name: last_stop_at
    has_date: true
    has_time: true
  safety_lockout_until:
    name: safety_lockout_until
    has_date: true
    has_time: true
  override_valid_until:
    name: override_valid_until
    has_date: true
    has_time: true
  miner_start_yesterday:
    name: miner_start_yesterday
    has_date: true
    has_time: true
  miner_stop_yesterday:
    name: miner_stop_yesterday
    has_date: true
    has_time: true

input_text:
  # ── SMA-Konfiguration ─────────────────────────────────────────────────────
  # Nach SMA-Integration: Entity-ID der Batterie-SoC-Entität eintragen
  sma_battery_entity:
    name: SMA Battery SoC Entity
    max: 100
    initial: "sensor.sma_battery_state_of_charge"
  # ── Entscheidungs-State ───────────────────────────────────────────────────
  decision_reason:
    name: decision_reason
    max: 255
    initial: "Initial state"
  decision_explanation:
    name: decision_explanation
    max: 255
    initial: "System not started"
  decision_code:
    name: decision_code
    max: 120
    initial: "INIT"
  override_status:
    name: override_status
    max: 64
    initial: "inactive"

template:
  # ── Energie-Signale ───────────────────────────────────────────────────────
  - sensor:
      # PV-Leistung: SMA Wechselrichter (Sunny Tripower)
      - name: pv_power_w
        unique_id: pv_power_w
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        availability: "true"
        state: >-
          {% if is_state('input_boolean.simulation_mode', 'on') %}
            {{ states('input_number.pv_power_w') | float(0) }}
          {% else %}
            {{ states('sensor.sma_tripower_pv_power') | float(0) }}
          {% endif %}

      # Hauslast: PV + Batterie-Entladung + Netzbezug - Netzeinspeisung - Miner
      - name: house_load_w
        unique_id: house_load_w
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        state: >-
          {% if is_state('input_boolean.simulation_mode', 'on') %}
            {{ states('input_number.house_load_w') | float(0) }}
          {% else %}
            {% set pv    = states('sensor.sma_tripower_pv_power') | float(0) %}
            {% set bat_d = states('sensor.sma_storage_battery_power_discharge_total') | float(0) %}
            {% set bat_c = states('sensor.sma_storage_battery_power_charge_total') | float(0) %}
            {% set grid_in  = states('sensor.sma_storage_metering_power_absorbed') | float(0) %}
            {% set grid_out = states('sensor.sma_storage_metering_power_supplied') | float(0) %}
            {% set miner = states('sensor.miner_total_power_w') | float(0) %}
            {{ ([pv + bat_d - bat_c + grid_in - grid_out - miner, 0] | max) | round(0) }}
          {% endif %}

      # Netzbezug: SMA Batterie-Wechselrichter (Sunny Boy Storage)
      - name: grid_import_w
        unique_id: grid_import_w
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        state: >-
          {% if is_state('input_boolean.simulation_mode', 'on') %}
            {{ states('input_number.grid_import_w') | float(0) }}
          {% else %}
            {{ states('sensor.sma_storage_metering_power_absorbed') | float(0) }}
          {% endif %}

      # Batterie-SoC: SMA Batterie-Wechselrichter (Sunny Boy Storage)
      - name: battery_soc_pct
        unique_id: battery_soc_pct
        unit_of_measurement: "%"
        device_class: battery
        state_class: measurement
        state: >-
          {% if is_state('input_boolean.simulation_mode', 'on') %}
            {{ states('input_number.battery_soc_pct') | float(0) }}
          {% else %}
            {{ states('sensor.sma_storage_battery_soc_total') | float(0) }}
          {% endif %}

      # Batterie-Leistung: positiv = laden, negativ = entladen
      - name: battery_power_w
        unique_id: battery_power_w
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        state: >-
          {% if is_state('input_boolean.simulation_mode', 'on') %}
            {{ states('input_number.battery_power_w') | float(0) }}
          {% else %}
            {% set charge    = states('sensor.sma_storage_battery_power_charge_total') | float(0) %}
            {% set discharge = states('sensor.sma_storage_battery_power_discharge_total') | float(0) %}
            {{ (charge - discharge) | round(0) }}
          {% endif %}

      # Batterie-Leistung für Flowchart: positiv = entladen (power-flow-card-plus Konvention)
      # battery_power_w nutzt positiv=laden; der Flowchart erwartet positiv=entladen → invertiert
      - name: battery_power_flowchart_w
        unique_id: battery_power_flowchart_w
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        state: >-
          {% if is_state('input_boolean.simulation_mode', 'on') %}
            {{ -(states('input_number.battery_power_w') | float(0)) | round(0) }}
          {% else %}
            {% set charge    = states('sensor.sma_storage_battery_power_charge_total') | float(0) %}
            {% set discharge = states('sensor.sma_storage_battery_power_discharge_total') | float(0) %}
            {{ (discharge - charge) | round(0) }}
          {% endif %}

      # Überschuss für Regelengine = PV - Hauslast - Netzbezug (ohne Miner)
      - name: surplus_kw
        unique_id: surplus_kw
        unit_of_measurement: "kW"
        state_class: measurement
        state: >-
          {% set pv   = states('sensor.pv_power_w') | float(0) %}
          {% set load = states('sensor.house_load_w') | float(0) %}
          {% set grid = states('sensor.grid_import_w') | float(0) %}
          {{ ((pv - load - grid) / 1000) | round(3) }}

      # Netto-Überschuss (Display) = tatsächliche Netzeinspeisung
      - name: grid_export_w
        unique_id: grid_export_w
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        state: >-
          {% if is_state('input_boolean.simulation_mode', 'on') %}
            0
          {% else %}
            {{ states('sensor.sma_storage_metering_power_supplied') | float(0) }}
          {% endif %}

      # Miner-Gesamtleistung (Shelly Plug S Gen 3 — realer Wandverbrauch AC)
      - name: miner_total_power_w
        unique_id: miner_total_power_w
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        state: >-
          {% set m1 = states('sensor.shellyplugsg3_dcb4d9c5567c_leistung') | float(0) %}
          {% set m2 = states('sensor.shellyplugsg3_d0cf13d86254_leistung') | float(0) %}
          {{ (m1 + m2) | round(0) }}

      # Maximale Chip-Temp beider Miner
      - name: miner_max_chip_temp_c
        unique_id: miner_max_chip_temp_c
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        state: >-
          {% if is_state('input_boolean.simulation_mode', 'on') %}
            {{ states('input_number.miner_temp_c') | float(0) }}
          {% else %}
            {% set t1 = states('sensor.miner1_tmax') | float(0) %}
            {% set t2 = states('sensor.miner2_tmax') | float(0) %}
            {{ [t1, t2] | max }}
          {% endif %}

      # Heartbeat-Alter (Sim: aus Slider; sonst aus Miner-Verfügbarkeit abgeleitet)
      - name: miner_heartbeat_age_sec
        unique_id: miner_heartbeat_age_sec
        unit_of_measurement: s
        state_class: measurement
        state: >-
          {% if is_state('input_boolean.simulation_mode', 'on') %}
            {{ states('input_number.miner_heartbeat_age_sec') | float(0) }}
          {% else %}
            {{ 5 if (is_state('binary_sensor.miner1_available', 'on') and
                     is_state('binary_sensor.miner2_available', 'on')) else 120 }}
          {% endif %}

      # Block-Fenster
      - name: block_id
        unique_id: block_id
        state: >-
          {% set block = states('input_number.block_minutes') | int(10) %}
          {% set block = 1 if block < 1 else block %}
          {{ (as_timestamp(now()) // (block * 60)) | int }}

      - name: block_window_start
        unique_id: block_window_start
        state: >-
          {% set block = states('input_number.block_minutes') | int(10) %}
          {% set block = 1 if block < 1 else block %}
          {% set ts = ((as_timestamp(now()) // (block * 60)) * block * 60) | int %}
          {{ ts | timestamp_custom('%Y-%m-%d %H:%M:%S', true) }}

      # Entscheidungs-Sensor (read-only Zusammenfassung)
      - name: bg_decision_action
        unique_id: bg_decision_action
        state: >-
          {% set safety = is_state('binary_sensor.r3_safety_override', 'on') or is_state('binary_sensor.safety_lockout_active', 'on') %}
          {% set override = is_state('input_boolean.override_active', 'on') %}
          {% set override_action = states('input_select.override_action') %}
          {% set r2_hard = is_state('binary_sensor.r2_soc_hard', 'on') %}
          {% set r2_grid = is_state('binary_sensor.r2_grid_import_ok', 'on') %}
          {% set r1 = is_state('binary_sensor.r1_surplus_ok', 'on') %}
          {% set r2_soft = is_state('binary_sensor.r2_soc_soft', 'on') %}
          {% set miners_on = is_state('binary_sensor.miners_any_running', 'on') %}
          {% set min_runtime = is_state('binary_sensor.r5_min_runtime_active', 'on') %}
          {% set min_pause = is_state('binary_sensor.r5_min_pause_active', 'on') %}
          {% set deadband = is_state('binary_sensor.r5_deadband_active', 'on') %}
          {% if safety %}
            STOP
          {% elif override and override_action in ['START', 'STOP', 'THROTTLE', 'NOOP'] %}
            {{ override_action }}
          {% elif (not r2_hard) or (not r2_grid) %}
            STOP
          {% elif miners_on %}
            {% if not r2_soft %}THROTTLE
            {% elif min_runtime or deadband %}NOOP
            {% elif not r1 %}THROTTLE
            {% else %}NOOP
            {% endif %}
          {% else %}
            {% if min_pause or deadband %}NOOP
            {% elif r1 and r2_soft and r2_grid %}START
            {% else %}NOOP
            {% endif %}
          {% endif %}

      - name: bg_decision_priority
        unique_id: bg_decision_priority
        state: >-
          {% set safety = is_state('binary_sensor.r3_safety_override', 'on') or is_state('binary_sensor.safety_lockout_active', 'on') %}
          {% set override = is_state('input_boolean.override_active', 'on') %}
          {% set r2_hard = is_state('binary_sensor.r2_soc_hard', 'on') %}
          {% set r2_grid = is_state('binary_sensor.r2_grid_import_ok', 'on') %}
          {% set r5_hold = is_state('binary_sensor.r5_min_runtime_active', 'on') or is_state('binary_sensor.r5_min_pause_active', 'on') or is_state('binary_sensor.r5_deadband_active', 'on') %}
          {% set r1 = is_state('binary_sensor.r1_surplus_ok', 'on') %}
          {% if safety %}R3_SAFETY
          {% elif override %}OVERRIDE
          {% elif (not r2_hard) or (not r2_grid) %}R2_AUTARKY
          {% elif r5_hold %}R5_STABILITY
          {% elif r1 %}R1_SURPLUS
          {% else %}IDLE
          {% endif %}

      - name: bg_decision_code
        unique_id: bg_decision_code
        state: >-
          {{ states('sensor.bg_decision_action') ~ '_' ~ states('sensor.bg_decision_priority') }}

  # ── Regel-Binärsensoren ───────────────────────────────────────────────────
  - binary_sensor:
      # R1: Überschuss vorhanden
      - name: r1_surplus_ok
        unique_id: r1_surplus_ok
        state: >-
          {{ (states('sensor.surplus_kw') | float(0)) >=
             (states('input_number.r1_surplus_min_kw') | float(0)) }}

      # R2: SoC-Schutz (weich)
      - name: r2_soc_soft
        unique_id: r2_soc_soft
        state: >-
          {{ (states('sensor.battery_soc_pct') | float(0)) >=
             (states('input_number.r2_soc_soft_min_pct') | float(0)) }}

      # R2: SoC-Schutz (hart)
      - name: r2_soc_hard
        unique_id: r2_soc_hard
        state: >-
          {{ (states('sensor.battery_soc_pct') | float(0)) >=
             (states('input_number.r2_soc_hard_min_pct') | float(0)) }}

      # R2: Netzimport-Schutz
      # Netto-Bezug (import − export): verhindert Fehlauslösung bei 3-Phasen-Schieflage
      - name: r2_grid_import_ok
        unique_id: r2_grid_import_ok
        state: >-
          {{ ((states('sensor.grid_import_w') | float(0)) -
              (states('sensor.grid_export_w') | float(0))) <=
             (states('input_number.r2_max_grid_import_w') | float(0)) }}

      # ── R3-Sensoren: scharfer Sicherheitspfad, gestufte Verteidigung ────────
      # Diese r3_*-Sensoren spiegeln src/core/rules/r3_safety.py (Thesis-Kern)
      # UND steuern real: automation bg_safety_immediate_stop (automations.yaml)
      # triggert auf r3_overtemp/r3_comm_timeout/r3_emergency_stop -> 'on' und
      # ruft script.bg_force_safety_stop -> bg_stop -> select.minerN_workmode_set
      # auf Standby. Als einzige bg_*-Automation laeuft sie ungefiltert, die
      # anderen sind simulation_mode-gated. Das ist so gewollt: Safety gilt auch
      # in Produktion.
      #
      # Stufung (Nutzer-Entscheidung 2026-07-17, gegen 7 Tage Realdaten kalibriert:
      # n=1033, Mittel 90.8 °C, Max 113.0 °C):
      #   112 °C  mvp_tmax_std_threshold_c -> MVP drosselt Super auf Standard
      #   115 °C  r3_max_chip_temp_c       -> R3 stoppt beide Miner + 15 min Lockout
      #   120 °C  _ABSOLUTE_MAX_TEMP_C     -> Hardcap im Core, nicht konfigurierbar
      # R3 ist damit echte Reserve: in den 7 Tagen waere es kein einziges Mal
      # ausgeloest worden. Vorher stand r3_max_chip_temp_c auf 90 °C, also unter
      # 74.9 % des Normalbetriebs, und hat staendig gefeuert.
      #
      # Historie (nicht wiederholen): bis 2026-07-17 schaltete bg_stop das nicht
      # mehr existente switch.miner_relay. Der Aufruf erzeugte nur ein WARNING,
      # das Skript lief weiter und schrieb SAFE_MODE + Lockout + decision_code,
      # waehrend die Miner real in Super/Standard weiterliefen. Der
      # Sicherheits-Stopp war reine Buchhaltung. Wer hier Schwellen anfasst:
      # erst pruefen, ob der Pfad bis zum Aktor wirklich durchlaeuft.
      #
      # Gegenstueck: die mvp_minerN_watchdogs sind auf r3_safety_override /
      # safety_lockout_active gated (packages/mvp_auto.yaml), sonst wuerden sie
      # den R3-Stopp 2 Minuten spaeter ueberschreiben.
      # ────────────────────────────────────────────────────────────────────────

      # R3: Übertemperatur (max beider Miner) — siehe Block oben
      - name: r3_overtemp
        unique_id: r3_overtemp
        state: >-
          {{ (states('sensor.miner_max_chip_temp_c') | float(0)) >=
             (states('input_number.r3_max_chip_temp_c') | float(0)) }}

      # R3: Kommunikationsausfall (mindestens ein Miner offline)
      - name: r3_comm_timeout
        unique_id: r3_comm_timeout
        state: >-
          {{ is_state('binary_sensor.miner1_available', 'off') or
             is_state('binary_sensor.miner2_available', 'off') }}

      # R3: Notfall-Stop
      - name: r3_emergency_stop
        unique_id: r3_emergency_stop
        state: "{{ is_state('input_boolean.r3_emergency_stop', 'on') }}"

      # R3: Safety-Override (kombiniert)
      - name: r3_safety_override
        unique_id: r3_safety_override
        state: >-
          {{ is_state('binary_sensor.r3_overtemp', 'on') or
             is_state('binary_sensor.r3_comm_timeout', 'on') or
             is_state('binary_sensor.r3_emergency_stop', 'on') }}

      # Safety-Lockout aktiv
      # state_attr(..., 'timestamp') statt as_timestamp(states(...)): der State
      # eines input_datetime ist ein NAIVER String ("2026-07-17 14:18:36"), den
      # as_timestamp() als UTC liest, waehrend now() zeitzonenbewusst ist. Das
      # ergab hier exakt +7200 s Versatz (belegt 2026-07-17), der Lockout lief
      # also 15 min + 2 h. Das timestamp-Attribut liefert die korrekte Epoche.
      - name: safety_lockout_active
        unique_id: safety_lockout_active
        state: >-
          {% set until_ts = state_attr('input_datetime.safety_lockout_until', 'timestamp') %}
          {% if until_ts is none %}false
          {% else %}{{ now().timestamp() < until_ts | float(0) }}
          {% endif %}

      # Miner läuft (mindestens einer)
      - name: miners_any_running
        unique_id: miners_any_running
        state: >-
          {{ states('sensor.miner1_workmode_status') in ['Eco', 'Standard', 'Super'] or
             states('sensor.miner2_workmode_status') in ['Eco', 'Standard', 'Super'] }}

      # R5: Deadband — timestamp-Attribut, siehe Begruendung bei safety_lockout_active
      - name: r5_deadband_active
        unique_id: r5_deadband_active
        state: >-
          {% set until_ts = state_attr('input_datetime.deadband_valid_until', 'timestamp') %}
          {% if until_ts is none %}false
          {% else %}{{ now().timestamp() < until_ts | float(0) }}
          {% endif %}

      # R5: Mindest-Laufzeit
      - name: r5_min_runtime_active
        unique_id: r5_min_runtime_active
        state: >-
          {% set started = states('input_datetime.last_start_at') %}
          {% if not is_state('binary_sensor.miners_any_running', 'on') or started in ['unknown', 'unavailable', ''] %}
            false
          {% else %}
            {% set start_ts = as_timestamp(started) %}
            {% set hold_blocks = states('input_number.r5_min_runtime_blocks') | int(0) %}
            {% set block_minutes = states('input_number.block_minutes') | int(10) %}
            {{ as_timestamp(now()) < (start_ts + (hold_blocks * block_minutes * 60)) }}
          {% endif %}

      # Mining aktiv (für History Stats)
      - name: miners_in_super
        unique_id: miners_in_super
        state: >-
          {{ states('sensor.miner1_workmode_status') == 'Super' or
             states('sensor.miner2_workmode_status') == 'Super' }}

      - name: miners_in_eco
        unique_id: miners_in_eco
        state: >-
          {{ states('sensor.miner1_workmode_status') == 'Eco' or
             states('sensor.miner2_workmode_status') == 'Eco' }}

      # R5: Mindest-Pause
      - name: r5_min_pause_active
        unique_id: r5_min_pause_active
        state: >-
          {% set stopped = states('input_datetime.last_stop_at') %}
          {% if is_state('binary_sensor.miners_any_running', 'on') or stopped in ['unknown', 'unavailable', ''] %}
            false
          {% else %}
            {% set stop_ts = as_timestamp(stopped) %}
            {% set hold_blocks = states('input_number.r5_min_pause_blocks') | int(0) %}
            {% set block_minutes = states('input_number.block_minutes') | int(10) %}
            {{ as_timestamp(now()) < (stop_ts + (hold_blocks * block_minutes * 60)) }}
          {% endif %}

# ── Energie-Integration (W → kWh, Riemann-Summe) ─────────────────────────────
# Liefert kumulative kWh-Werte als Tagesbasis (Midnight-Delta in stats.yaml)
sensor:
  - platform: integration
    source: sensor.pv_power_w
    name: pv_energy_integral
    unique_id: pv_energy_integral
    unit_prefix: k
    round: 3
    method: trapezoidal

  - platform: integration
    source: sensor.miner_total_power_w
    name: mining_energy_integral
    unique_id: mining_energy_integral
    unit_prefix: k
    round: 3
    method: trapezoidal

  - platform: integration
    source: sensor.grid_import_w
    name: grid_import_integral
    unique_id: grid_import_integral
    unit_prefix: k
    round: 3
    method: trapezoidal

  - platform: integration
    source: sensor.grid_export_w
    name: grid_export_integral
    unique_id: grid_export_integral
    unit_prefix: k
    round: 3
    method: trapezoidal

  - platform: integration
    source: sensor.house_load_w
    name: house_energy_integral
    unique_id: house_energy_integral
    unit_prefix: k
    round: 3
    method: trapezoidal

  - platform: integration
    source: sensor.ac_elwa_2_power1_solar
    name: heizstab_energy_integral
    unique_id: heizstab_energy_integral
    unit_prefix: k
    round: 3
    method: trapezoidal
