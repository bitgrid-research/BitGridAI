  automation:
    # Midnight-Reset: Baselines auf aktuelle Plug-Zählerstände setzen.
    # 00:00:05 wie stats_midnight_baseline_reset. float-Default = alte
    # Baseline: ist ein Plug um Mitternacht offline, bleibt sie stehen
    # statt auf 0 zu fallen.
    - id: devices_midnight_baseline_reset
      alias: "Devices: Midnight Baseline Reset"
      trigger:
        - platform: time
          at: "00:00:05"
      action:
        - action: input_number.set_value
          target:
            entity_id: input_number.kuehlschrank_kueche_energy_midnight
          data:
            value: >-
              {{ states('sensor.shellyplugsg3_9070694c577c_energie')
                 | float(states('input_number.kuehlschrank_kueche_energy_midnight') | float(0)) }}
