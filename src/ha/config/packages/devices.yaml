# ═══════════════════════════════════════════════════════════════════════
# Verbraucher-Plugs (Shelly Plug S Gen3 / Plus Plug) — Tab "Geräte"
# ═══════════════════════════════════════════════════════════════════════
# 6 Haushalts-Verbraucher als eigene Messpunkte. Entity-IDs bleiben auf der
# MAC-basierten Werks-ID (stabil gegen Umbenennen), Zuordnung:
#   9070694abdf4 = Kühlschränke    d885ac1e9adc = Waschmaschine
#   9070694c99d4 = TV              d885ac18c3b4 = Büro
#   d4d4daf4eda4 = Lüftung (Plus Plug, s. mvp_auto.yaml Kühlungslogik)
#   d0cf13db3a00 = Server, NAS, KI-Agent
#
# Tages-kWh nach dem Midnight-Baseline-Muster aus packages/stats.yaml
# (utility_meter wurde in HA 2026.x entfernt). Quelle ist der native
# kWh-Zähler des Plugs (total_increasing). Zwei Abweichungen vom
# Integral-Muster, weil die Quelle ein Geräte-Zähler statt ein
# HA-Integral ist:
#   - Zähler-Reset (Plug-Neustart): cur < base → Sensor fällt auf den
#     Zählerwert selbst zurück statt auf 0 zu klemmen (Zähler beginnt
#     nach Reset bei 0 ≈ Verbrauch seit Neustart).
#   - Plug um Mitternacht nicht erreichbar: Baseline behält den alten
#     Wert statt auf 0 zu fallen (float-Default = alte Baseline).
devices:

  input_number:
    waschmaschine_energy_midnight:
      name: "Waschmaschine kWh Baseline Mitternacht"
      min: 0
      max: 1000000
      step: 0.001
      mode: box
    tv_energy_midnight:
      name: "TV kWh Baseline Mitternacht"
      min: 0
      max: 1000000
      step: 0.001
      mode: box
    kuehlschraenke_energy_midnight:
      name: "Kühlschränke kWh Baseline Mitternacht"
      min: 0
      max: 1000000
      step: 0.001
      mode: box
    buero_energy_midnight:
      name: "Büro kWh Baseline Mitternacht"
      min: 0
      max: 1000000
      step: 0.001
      mode: box
    lueftung_energy_midnight:
      name: "Lüftung kWh Baseline Mitternacht"
      min: 0
      max: 1000000
      step: 0.001
      mode: box
    server_energy_midnight:
      name: "Server kWh Baseline Mitternacht"
      min: 0
      max: 1000000
      step: 0.001
      mode: box

  template:
    - sensor:
        - name: "waschmaschine_energy_daily"
          unique_id: waschmaschine_energy_daily
          unit_of_measurement: "kWh"
          state_class: measurement
          state: >-
            {% set cur  = states('sensor.shellyplugsg3_d885ac1e9adc_energie') | float(0) %}
            {% set base = states('input_number.waschmaschine_energy_midnight') | float(0) %}
            {{ (cur - base if cur >= base else cur) | round(3) }}

        - name: "tv_energy_daily"
          unique_id: tv_energy_daily
          unit_of_measurement: "kWh"
          state_class: measurement
          state: >-
            {% set cur  = states('sensor.shellyplugsg3_9070694c99d4_energie') | float(0) %}
            {% set base = states('input_number.tv_energy_midnight') | float(0) %}
            {{ (cur - base if cur >= base else cur) | round(3) }}

        - name: "kuehlschraenke_energy_daily"
          unique_id: kuehlschraenke_energy_daily
          unit_of_measurement: "kWh"
          state_class: measurement
          state: >-
            {% set cur  = states('sensor.shellyplugsg3_9070694abdf4_energie') | float(0) %}
            {% set base = states('input_number.kuehlschraenke_energy_midnight') | float(0) %}
            {{ (cur - base if cur >= base else cur) | round(3) }}

        - name: "buero_energy_daily"
          unique_id: buero_energy_daily
          unit_of_measurement: "kWh"
          state_class: measurement
          state: >-
            {% set cur  = states('sensor.shellyplugsg3_d885ac18c3b4_energie') | float(0) %}
            {% set base = states('input_number.buero_energy_midnight') | float(0) %}
            {{ (cur - base if cur >= base else cur) | round(3) }}

        - name: "lueftung_energy_daily"
          unique_id: lueftung_energy_daily
          unit_of_measurement: "kWh"
          state_class: measurement
          state: >-
            {% set cur  = states('sensor.shellyplusplugs_d4d4daf4eda4_energie') | float(0) %}
            {% set base = states('input_number.lueftung_energy_midnight') | float(0) %}
            {{ (cur - base if cur >= base else cur) | round(3) }}

        - name: "server_energy_daily"
          unique_id: server_energy_daily
          unit_of_measurement: "kWh"
          state_class: measurement
          state: >-
            {% set cur  = states('sensor.shellyplugsg3_d0cf13db3a00_energie') | float(0) %}
            {% set base = states('input_number.server_energy_midnight') | float(0) %}
            {{ (cur - base if cur >= base else cur) | round(3) }}

        # Summen über alle 6 Plugs — für die Kopfkarte im Geräte-Tab.
        # Nicht erreichbare Plugs zählen als 0, damit die Summe nie kippt.
        - name: "geraete_power_w"
          unique_id: geraete_power_w
          unit_of_measurement: "W"
          device_class: power
          state_class: measurement
          state: >-
            {{ (states('sensor.shellyplugsg3_d885ac1e9adc_leistung') | float(0)
              + states('sensor.shellyplugsg3_9070694c99d4_leistung') | float(0)
              + states('sensor.shellyplugsg3_9070694abdf4_leistung') | float(0)
              + states('sensor.shellyplugsg3_d885ac18c3b4_leistung') | float(0)
              + states('sensor.shellyplusplugs_d4d4daf4eda4_leistung') | float(0)
              + states('sensor.shellyplugsg3_d0cf13db3a00_leistung') | float(0)) | round(1) }}

        - name: "geraete_energy_daily"
          unique_id: geraete_energy_daily
          unit_of_measurement: "kWh"
          state_class: measurement
          state: >-
            {{ (states('sensor.waschmaschine_energy_daily') | float(0)
              + states('sensor.tv_energy_daily') | float(0)
              + states('sensor.kuehlschraenke_energy_daily') | float(0)
              + states('sensor.buero_energy_daily') | float(0)
              + states('sensor.lueftung_energy_daily') | float(0)
              + states('sensor.server_energy_daily') | float(0)) | round(3) }}

  automation:
    # Midnight-Reset: Baselines auf aktuelle Plug-Zählerstände setzen.
    # 00:00:05 wie stats_midnight_baseline_reset (nach den YTD-Akkumulatoren).
    # float-Default = alte Baseline: ist ein Plug um Mitternacht offline,
    # bleibt die Baseline stehen statt auf 0 zu fallen.
    - id: devices_midnight_baseline_reset
      alias: "Devices: Midnight Baseline Reset"
      trigger:
        - platform: time
          at: "00:00:05"
      action:
        - action: input_number.set_value
          target:
            entity_id: input_number.waschmaschine_energy_midnight
          data:
            value: >-
              {{ states('sensor.shellyplugsg3_d885ac1e9adc_energie')
                 | float(states('input_number.waschmaschine_energy_midnight') | float(0)) }}
        - action: input_number.set_value
          target:
            entity_id: input_number.tv_energy_midnight
          data:
            value: >-
              {{ states('sensor.shellyplugsg3_9070694c99d4_energie')
                 | float(states('input_number.tv_energy_midnight') | float(0)) }}
        - action: input_number.set_value
          target:
            entity_id: input_number.kuehlschraenke_energy_midnight
          data:
            value: >-
              {{ states('sensor.shellyplugsg3_9070694abdf4_energie')
                 | float(states('input_number.kuehlschraenke_energy_midnight') | float(0)) }}
        - action: input_number.set_value
          target:
            entity_id: input_number.buero_energy_midnight
          data:
            value: >-
              {{ states('sensor.shellyplugsg3_d885ac18c3b4_energie')
                 | float(states('input_number.buero_energy_midnight') | float(0)) }}
        - action: input_number.set_value
          target:
            entity_id: input_number.lueftung_energy_midnight
          data:
            value: >-
              {{ states('sensor.shellyplusplugs_d4d4daf4eda4_energie')
                 | float(states('input_number.lueftung_energy_midnight') | float(0)) }}
        - action: input_number.set_value
          target:
            entity_id: input_number.server_energy_midnight
          data:
            value: >-
              {{ states('sensor.shellyplugsg3_d0cf13db3a00_energie')
                 | float(states('input_number.server_energy_midnight') | float(0)) }}
