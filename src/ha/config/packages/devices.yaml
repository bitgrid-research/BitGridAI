                + states('sensor.lueftung_energy_daily') | float(0)
                + states('sensor.heizung_energy_daily') | float(0)
                + states('sensor.server_energy_daily') | float(0)
            ) | round(3) }}

        # ── Gerätetyp-Summen (aktuelle Leistung) ────────────────────────
        # 25.08.2026: Kategorisierung nach echten Live-Friendly-Names (HA
        # Template-API abgefragt), nicht nach den Key-Namen aus dem alten
        # Kommentarblock oben, der teils veraltet war (siehe Raum-Summen-
        # Kommentar). Speist die Balkenliste "Verbrauch nach Gerätetyp"
