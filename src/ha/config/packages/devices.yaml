                + states('sensor.waschmaschine_energy_daily') | float(0)
                + states('sensor.kuehlschraenke_energy_daily') | float(0)
            ) | round(3) }}

        # Keller + Garage zusammengelegt zu "Untergeschoss", siehe
        # raum_untergeschoss_power_w oben für die Begründung.
        - name: "raum_untergeschoss_energy_daily"
          unique_id: raum_untergeschoss_energy_daily
