# ═══════════════════════════════════════════════════════════════════════
# Verbraucher-Plugs (Shelly Plug S/PM Gen3, Plus Plug, 1PM Gen4) — Tab "Geräte"
# ═══════════════════════════════════════════════════════════════════════
# 14 Haushalts-Verbraucher als eigene Messpunkte, nach Räumen gruppiert.
# Entity-IDs bleiben auf der MAC-basierten Werks-ID (stabil gegen Umbenennen).
# Bestehende Sensor-/Baseline-Keys (tv, buero, kuehlschraenke, waschmaschine,
# lueftung, server) sind BEWUSST unverändert, damit Verlauf/Statistik nicht
# abreißen — nur die Anzeige-Namen im View ändern sich (z. B. Büro → PC Büro).
#
# Zuordnung Key → Shelly-Slug → Raum:
#   kuehlschrank_kueche  shellyplugsg3_9070694c577c Küche
#   spuelmaschine        shellyplugsg3_9070694b2854 Küche
#   tv                   shellyplugsg3_9070694c99d4 Wohnzimmer
#   pc_schlafzimmer      shellyplugsg3_9070694d44bc Schlafzimmer
#   tv_schlafzimmer      shellyplugsg3_90706947f288 Schlafzimmer
#   buero                shellyplugsg3_d885ac18c3b4 Büro
#   drucker              shellyplugsg3_9070694a1b6c Büro
#   kuehlschraenke       shellyplugsg3_9070694abdf4 Hauswirtschaft
#   waschmaschine        shellyplugsg3_d885ac1e9adc Hauswirtschaft
#   trockner             shellyplugpmg3_9070695bb2a8 Hauswirtschaft
#   heizung              shelly1pmg4_e4b06377adc0   Garage
#   lueftung             shellyplusplugs_d4d4daf4eda4 Garage
#   server               shellyplugsg3_907069492f30 Garage
#   garage               shellyplugsg3_d0cf13db3a00 Garage (versorgt den Runtipi-Server, Key-Name "garage" bewusst unveraendert)
# (Keller und Garage sind derselbe Raum, gleiches Stockwerk — Label 2026-08-24 vereinheitlicht)
# (server/garage Shelly-IDs waren vertauscht — korrigiert 2026-08-24 nach physischer Prüfung)
#
# Tages-kWh nach dem Midnight-Baseline-Muster aus packages/stats.yaml
# (utility_meter wurde in HA 2026.x entfernt). Quelle ist der native
# kWh-Zähler des Plugs (total_increasing). Zwei Abweichungen vom
# Integral-Muster (Zähler-Reset → Sensor fällt auf Zählerwert; Plug um
# Mitternacht offline → Baseline behält alten Wert).
devices:

  input_number:
    kuehlschrank_kueche_energy_midnight:
      name: "Kühlschrank Küche kWh Baseline Mitternacht"
      min: 0
      max: 1000000
      step: 0.001
      mode: box
    spuelmaschine_energy_midnight:
      name: "Spülmaschine kWh Baseline Mitternacht"
      min: 0
      max: 1000000
      step: 0.001
      mode: box
    tv_energy_midnight:
      name: "TV Wohnzimmer kWh Baseline Mitternacht"
      min: 0
      max: 1000000
      step: 0.001
      mode: box
    pc_schlafzimmer_energy_midnight:
      name: "PC Schlafzimmer kWh Baseline Mitternacht"
      min: 0
      max: 1000000
      step: 0.001
      mode: box
    tv_schlafzimmer_energy_midnight:
      name: "TV Schlafzimmer kWh Baseline Mitternacht"
      min: 0
      max: 1000000
      step: 0.001
      mode: box
    buero_energy_midnight:
      name: "PC Büro kWh Baseline Mitternacht"
      min: 0
      max: 1000000
      step: 0.001
      mode: box
    drucker_energy_midnight:
      name: "3D-Drucker Büro kWh Baseline Mitternacht"
      min: 0
      max: 1000000
      step: 0.001
      mode: box
    kuehlschraenke_energy_midnight:
      name: "Kühlschränke kWh Baseline Mitternacht"
      min: 0
      max: 1000000
      step: 0.001
      mode: box
    waschmaschine_energy_midnight:
      name: "Waschmaschine kWh Baseline Mitternacht"
      min: 0
      max: 1000000
      step: 0.001
      mode: box
    trockner_energy_midnight:
      name: "Trockner kWh Baseline Mitternacht"
      min: 0
      max: 1000000
      step: 0.001
      mode: box
    heizung_energy_midnight:
      name: "Heizung kWh Baseline Mitternacht"
      min: 0
      max: 1000000
      step: 0.001
      mode: box
    lueftung_energy_midnight:
      name: "Lüftung kWh Baseline Mitternacht"
      min: 0
      max: 1000000
      step: 0.001
      mode: box
    server_energy_midnight:
      name: "Server/NAS/KI kWh Baseline Mitternacht"
      min: 0
      max: 1000000
      step: 0.001
      mode: box
    garage_energy_midnight:
      name: "Garagengeräte kWh Baseline Mitternacht"
      min: 0
      max: 1000000
      step: 0.001
      mode: box
    # 25.08.2026: Baselines für "Verbrauch nach Räumen (heute)" (Tab
    # "EnergieInfo") — Miner 1/2 einzeln (bisher nur kombiniert über
    # mining_energy_daily, ueber die integration-Plattform), GX-10 und
    # Wohnwand-Beleuchtung hatten bislang GAR keine Tages-kWh. Gleiches
    # Muster wie alle Geraete oben: native _energie-Zaehler des Shelly-Plugs
    # minus Mitternachts-Baseline.
    miner1_energy_midnight:
      name: "Miner 1 kWh Baseline Mitternacht"
      min: 0
      max: 100000000
      step: 0.001
      mode: box
    miner2_energy_midnight:
      name: "Miner 2 kWh Baseline Mitternacht"
      min: 0
      max: 100000000
      step: 0.001
      mode: box
    gx10_energy_midnight:
      name: "GX-10 kWh Baseline Mitternacht"
      min: 0
      max: 1000000
      step: 0.001
      mode: box
    wohnwand_energy_midnight:
      name: "Wohnwand-Beleuchtung kWh Baseline Mitternacht"
      min: 0
      max: 1000000
      step: 0.001
      mode: box

  # Aufklapp-Zustand der Raum-Listen im Tab "Grundriss" (bitgrid_dashboard_v3.
  # yaml, Grid-Areas "haus"/"garage"). Reiner UI-Zustand, keine Steuerlogik —
  # analog zu miner1/2_detail_* (avalonq_miner1.yaml) und
  # mvp_regelschwellen_detail (mvp_auto.yaml).
  input_boolean:
    fp_detail_kueche:
      name: "Grundriss-Detail Küche aufgeklappt"
      icon: mdi:silverware-fork-knife
    fp_detail_wohnzimmer:
      name: "Grundriss-Detail Wohnzimmer aufgeklappt"
      icon: mdi:sofa
    fp_detail_schlafzimmer1:
      name: "Grundriss-Detail Schlafzimmer 1 aufgeklappt"
      icon: mdi:bed
    fp_detail_schlafzimmer2:
      name: "Grundriss-Detail Schlafzimmer 2 aufgeklappt"
      icon: mdi:bed-outline
    fp_detail_buero:
      name: "Grundriss-Detail Büro aufgeklappt"
      icon: mdi:desk
    fp_detail_gaestezimmer:
      name: "Grundriss-Detail Gästezimmer aufgeklappt"
      icon: mdi:bed-double-outline
    fp_detail_bad:
      name: "Grundriss-Detail Bad aufgeklappt"
      icon: mdi:shower
    fp_detail_hauswirtschaft:
      name: "Grundriss-Detail Hauswirtschaft aufgeklappt"
      icon: mdi:hanger
    fp_detail_garage:
      name: "Grundriss-Detail Garage aufgeklappt"
      icon: mdi:garage

    # Welcher Grundriss im Tab "Grundriss" gerade sichtbar ist (24.08.2026,
    # Nutzer-Entscheidung: Haus 16:9 + Garage 16:21 hochkant übereinander war
    # eine sehr lange Scroll-Seite; jetzt nur einer sichtbar, Pfeile oben
    # schalten um). off = Haus, on = Garage.
    fp_view_garage:
      name: "Grundriss zeigt Garage (statt Haus)"
      icon: mdi:garage

    # Aufklapp-Zustand der Raum-Kacheln in "Verbrauch nach Räumen (heute)"
    # (Tab "EnergieInfo"). 25.08.2026: erst als custom:bubble-card-Pop-up
    # gebaut, auf Nutzer-Wunsch ("mach keine bubble cards") auf dasselbe
    # Akkordeon-Muster wie fp_detail_* oben umgestellt.
    raumkachel_untergeschoss:
      name: "Raum-Kachel Untergeschoss aufgeklappt"
      icon: mdi:home-floor-b
    raumkachel_wohnzimmer:
      name: "Raum-Kachel Wohnzimmer aufgeklappt"
      icon: mdi:sofa
    raumkachel_kueche:
      name: "Raum-Kachel Küche aufgeklappt"
      icon: mdi:countertop
    raumkachel_schlafzimmer1:
      name: "Raum-Kachel Schlafzimmer 1 aufgeklappt"
      icon: mdi:bed
    raumkachel_buero:
      name: "Raum-Kachel Büro aufgeklappt"
      icon: mdi:desk
    raumkachel_hauswirtschaft:
      name: "Raum-Kachel Hauswirtschaft aufgeklappt"
      icon: mdi:washing-machine

  template:
    - sensor:
        - name: "kuehlschrank_kueche_energy_daily"
          unique_id: kuehlschrank_kueche_energy_daily
          unit_of_measurement: "kWh"
          state_class: measurement
          state: >-
            {% set cur  = states('sensor.shellyplugsg3_9070694c577c_energie') | float(0) %}
            {% set base = states('input_number.kuehlschrank_kueche_energy_midnight') | float(0) %}
            {{ (cur - base if cur >= base else cur) | round(3) }}

        - name: "spuelmaschine_energy_daily"
          unique_id: spuelmaschine_energy_daily
          unit_of_measurement: "kWh"
          state_class: measurement
          state: >-
            {% set cur  = states('sensor.shellyplugsg3_9070694b2854_energie') | float(0) %}
            {% set base = states('input_number.spuelmaschine_energy_midnight') | float(0) %}
            {{ (cur - base if cur >= base else cur) | round(3) }}

        - name: "tv_energy_daily"
          unique_id: tv_energy_daily
          unit_of_measurement: "kWh"
          state_class: measurement
          state: >-
            {% set cur  = states('sensor.shellyplugsg3_9070694c99d4_energie') | float(0) %}
            {% set base = states('input_number.tv_energy_midnight') | float(0) %}
            {{ (cur - base if cur >= base else cur) | round(3) }}

        - name: "pc_schlafzimmer_energy_daily"
          unique_id: pc_schlafzimmer_energy_daily
          unit_of_measurement: "kWh"
          state_class: measurement
          state: >-
            {% set cur  = states('sensor.shellyplugsg3_9070694d44bc_energie') | float(0) %}
            {% set base = states('input_number.pc_schlafzimmer_energy_midnight') | float(0) %}
            {{ (cur - base if cur >= base else cur) | round(3) }}

        - name: "tv_schlafzimmer_energy_daily"
          unique_id: tv_schlafzimmer_energy_daily
          unit_of_measurement: "kWh"
          state_class: measurement
          state: >-
            {% set cur  = states('sensor.shellyplugsg3_90706947f288_energie') | float(0) %}
            {% set base = states('input_number.tv_schlafzimmer_energy_midnight') | float(0) %}
            {{ (cur - base if cur >= base else cur) | round(3) }}

        - name: "buero_energy_daily"
          unique_id: buero_energy_daily
          unit_of_measurement: "kWh"
          state_class: measurement
          state: >-
            {% set cur  = states('sensor.shellyplugsg3_d885ac18c3b4_energie') | float(0) %}
            {% set base = states('input_number.buero_energy_midnight') | float(0) %}
            {{ (cur - base if cur >= base else cur) | round(3) }}

        - name: "drucker_energy_daily"
          unique_id: drucker_energy_daily
          unit_of_measurement: "kWh"
          state_class: measurement
          state: >-
            {% set cur  = states('sensor.shellyplugsg3_9070694a1b6c_energie') | float(0) %}
            {% set base = states('input_number.drucker_energy_midnight') | float(0) %}
            {{ (cur - base if cur >= base else cur) | round(3) }}

        - name: "kuehlschraenke_energy_daily"
          unique_id: kuehlschraenke_energy_daily
          unit_of_measurement: "kWh"
          state_class: measurement
          state: >-
            {% set cur  = states('sensor.shellyplugsg3_9070694abdf4_energie') | float(0) %}
            {% set base = states('input_number.kuehlschraenke_energy_midnight') | float(0) %}
            {{ (cur - base if cur >= base else cur) | round(3) }}

        - name: "waschmaschine_energy_daily"
          unique_id: waschmaschine_energy_daily
          unit_of_measurement: "kWh"
          state_class: measurement
          state: >-
            {% set cur  = states('sensor.shellyplugsg3_d885ac1e9adc_energie') | float(0) %}
            {% set base = states('input_number.waschmaschine_energy_midnight') | float(0) %}
            {{ (cur - base if cur >= base else cur) | round(3) }}

        - name: "trockner_energy_daily"
          unique_id: trockner_energy_daily
          unit_of_measurement: "kWh"
          state_class: measurement
          state: >-
            {% set cur  = states('sensor.shellyplugpmg3_9070695bb2a8_energie') | float(0) %}
            {% set base = states('input_number.trockner_energy_midnight') | float(0) %}
            {{ (cur - base if cur >= base else cur) | round(3) }}

        - name: "heizung_energy_daily"
          unique_id: heizung_energy_daily
          unit_of_measurement: "kWh"
          state_class: measurement
          state: >-
            {% set cur  = states('sensor.shelly1pmg4_e4b06377adc0_energie') | float(0) %}
            {% set base = states('input_number.heizung_energy_midnight') | float(0) %}
            {{ (cur - base if cur >= base else cur) | round(3) }}

        - name: "lueftung_energy_daily"
          unique_id: lueftung_energy_daily
          unit_of_measurement: "kWh"
          state_class: measurement
          state: >-
            {% set cur  = states('sensor.shellyplusplugs_d4d4daf4eda4_energie') | float(0) %}
            {% set base = states('input_number.lueftung_energy_midnight') | float(0) %}
            {{ (cur - base if cur >= base else cur) | round(3) }}

        - name: "server_energy_daily"
          unique_id: server_energy_daily
          unit_of_measurement: "kWh"
          state_class: measurement
          state: >-
            {% set cur  = states('sensor.shellyplugsg3_907069492f30_energie') | float(0) %}
            {% set base = states('input_number.server_energy_midnight') | float(0) %}
            {{ (cur - base if cur >= base else cur) | round(3) }}

        - name: "garage_energy_daily"
          unique_id: garage_energy_daily
          unit_of_measurement: "kWh"
          state_class: measurement
          state: >-
            {% set cur  = states('sensor.shellyplugsg3_d0cf13db3a00_energie') | float(0) %}
            {% set base = states('input_number.garage_energy_midnight') | float(0) %}
            {{ (cur - base if cur >= base else cur) | round(3) }}

        # 25.08.2026: Miner 1/2 einzeln, GX-10, Wohnwand-Beleuchtung — siehe
        # Baseline-Kommentar oben. Speist die Raum-Tages-Summen weiter unten.
        - name: "miner1_energy_daily"
          unique_id: miner1_energy_daily
          unit_of_measurement: "kWh"
          state_class: measurement
          state: >-
            {% set cur  = states('sensor.shellyplugsg3_dcb4d9c5567c_energie') | float(0) %}
            {% set base = states('input_number.miner1_energy_midnight') | float(0) %}
            {{ (cur - base if cur >= base else cur) | round(3) }}

        - name: "miner2_energy_daily"
          unique_id: miner2_energy_daily
          unit_of_measurement: "kWh"
          state_class: measurement
          state: >-
            {% set cur  = states('sensor.shellyplugsg3_d0cf13d86254_energie') | float(0) %}
            {% set base = states('input_number.miner2_energy_midnight') | float(0) %}
            {{ (cur - base if cur >= base else cur) | round(3) }}

        - name: "gx10_energy_daily"
          unique_id: gx10_energy_daily
          unit_of_measurement: "kWh"
          state_class: measurement
          state: >-
            {% set cur  = states('sensor.shellyplugsg3_dcb4d9c6b46c_energie') | float(0) %}
            {% set base = states('input_number.gx10_energy_midnight') | float(0) %}
            {{ (cur - base if cur >= base else cur) | round(3) }}

        - name: "wohnwand_energy_daily"
          unique_id: wohnwand_energy_daily
          unit_of_measurement: "kWh"
          state_class: measurement
          state: >-
            {% set cur  = states('sensor.wohnwand_beleuchtung_energie') | float(0) %}
            {% set base = states('input_number.wohnwand_energy_midnight') | float(0) %}
            {{ (cur - base if cur >= base else cur) | round(3) }}

        # Summe über alle 14 Plugs — Kopfkarte im Geräte-Tab und die
        # Gesamter Echtzeitverbrauch = Hauslast (bereits "ohne Miner",
        # configuration.yaml/house_load_w) + Miner. Speist die Gauge-Karte
        # "Gesamter Echtzeitverbrauch" (Feld 3/3, Tab "EnergieInfo",
        # 25.08.2026, Nutzer-Wunsch). Bewusst NICHT ueber PV/Netz/Batterie
        # neu hergeleitet — house_load_w macht diese Bilanz schon korrekt
        # (configuration.yaml, Kommentar "Hauslast: PV + Batterie-Entladung
        # + Netzbezug - Netzeinspeisung - Miner"), hier nur der Miner-Anteil
        # wieder addiert, um wirklich ALLES zu erfassen.
        - name: "gesamt_echtzeitverbrauch_w"
          unique_id: gesamt_echtzeitverbrauch_w
          unit_of_measurement: "W"
          device_class: power
          state_class: measurement
          icon: mdi:speedometer
          state: >-
            {{ (states('sensor.house_load_w') | float(0)
                + states('sensor.miner_total_power_w') | float(0)
            ) | round(0) }}

        # "Geräte"-Bubble im Energiefluss (Home). Nicht erreichbare Plugs
        # zählen als 0, damit die Summe nie kippt.
        - name: "geraete_power_w"
          unique_id: geraete_power_w
          unit_of_measurement: "W"
          device_class: power
          state_class: measurement
          state: >-
            {{ (states('sensor.shellyplugsg3_9070694c577c_leistung') | float(0)
                + states('sensor.shellyplugsg3_9070694b2854_leistung') | float(0)
                + states('sensor.shellyplugsg3_9070694c99d4_leistung') | float(0)
                + states('sensor.shellyplugsg3_9070694d44bc_leistung') | float(0)
                + states('sensor.shellyplugsg3_90706947f288_leistung') | float(0)
                + states('sensor.shellyplugsg3_d885ac18c3b4_leistung') | float(0)
                + states('sensor.shellyplugsg3_9070694a1b6c_leistung') | float(0)
                + states('sensor.shellyplugsg3_9070694abdf4_leistung') | float(0)
                + states('sensor.shellyplugsg3_d885ac1e9adc_leistung') | float(0)
                + states('sensor.shellyplugpmg3_9070695bb2a8_leistung') | float(0)
                + states('sensor.shelly1pmg4_e4b06377adc0_leistung') | float(0)
                + states('sensor.shellyplusplugs_d4d4daf4eda4_leistung') | float(0)
                + states('sensor.shellyplugsg3_d0cf13db3a00_leistung') | float(0)
                + states('sensor.shellyplugsg3_907069492f30_leistung') | float(0)
            ) | round(1) }}

        - name: "geraete_energy_daily"
          unique_id: geraete_energy_daily
          unit_of_measurement: "kWh"
          state_class: measurement
          state: >-
            {{ (states('sensor.kuehlschrank_kueche_energy_daily') | float(0)
                + states('sensor.spuelmaschine_energy_daily') | float(0)
                + states('sensor.tv_energy_daily') | float(0)
                + states('sensor.pc_schlafzimmer_energy_daily') | float(0)
                + states('sensor.tv_schlafzimmer_energy_daily') | float(0)
                + states('sensor.buero_energy_daily') | float(0)
                + states('sensor.drucker_energy_daily') | float(0)
                + states('sensor.kuehlschraenke_energy_daily') | float(0)
                + states('sensor.waschmaschine_energy_daily') | float(0)
                + states('sensor.trockner_energy_daily') | float(0)
                + states('sensor.heizung_energy_daily') | float(0)
                + states('sensor.lueftung_energy_daily') | float(0)
                + states('sensor.server_energy_daily') | float(0)
                + states('sensor.garage_energy_daily') | float(0)
            ) | round(3) }}

        # ── Raum-Summen (aktuelle Leistung) ────────────────────────────
        # 25.08.2026: Bereichszuordnung live aus HAs Area-Registry verifiziert
        # (areas()/area_entities() per Template-API, nicht aus diesem Datei-
        # Kommentarblock oben oder dem lokalen .storage-Spiegel übernommen —
        # beide waren teils veraltet, 6 Geräte hatten in HA noch gar keinen
        # Bereich, siehe scripts/ha_assign_areas.py). Speist den Balken-Chart
        # "Verbrauch nach Räumen" (views/verbrauch_nach_raeumen.yaml, Tab
        # "EnergieInfo"). Anders als geraete_power_w zaehlt hier ALLES, was
        # im Raum Strom zieht (inkl. Heizstab, Miner, GX-10-Server), nicht nur
        # die reinen Haushalts-Plugs — Ziel ist die reale Raumlast, nicht die
        # PFCP-Datenrolle "Geräte".
        - name: "raum_wohnzimmer_power_w"
          unique_id: raum_wohnzimmer_power_w
          unit_of_measurement: "W"
          device_class: power
          state_class: measurement
          icon: mdi:sofa
          state: >-
            {{ (states('sensor.wohnwand_beleuchtung_leistung') | float(0)
                + states('sensor.shellyplugsg3_9070694c99d4_leistung') | float(0)
            ) | round(1) }}

        - name: "raum_kueche_power_w"
          unique_id: raum_kueche_power_w
          unit_of_measurement: "W"
          device_class: power
          state_class: measurement
          icon: mdi:countertop
          state: >-
            {{ (states('sensor.shellyplugsg3_9070694b2854_leistung') | float(0)
                + states('sensor.shellyplugsg3_9070694c577c_leistung') | float(0)
            ) | round(1) }}

        - name: "raum_buero_power_w"
          unique_id: raum_buero_power_w
          unit_of_measurement: "W"
          device_class: power
          state_class: measurement
          icon: mdi:desk
          state: >-
            {{ (states('sensor.shellyplugsg3_9070694a1b6c_leistung') | float(0)
                + states('sensor.shellyplugsg3_d885ac18c3b4_leistung') | float(0)
            ) | round(1) }}

        - name: "raum_schlafzimmer1_power_w"
          unique_id: raum_schlafzimmer1_power_w
          unit_of_measurement: "W"
          device_class: power
          state_class: measurement
          icon: mdi:bed
          state: >-
            {{ (states('sensor.shellyplugsg3_d0cf13db3a00_leistung') | float(0)
                + states('sensor.shellyplugsg3_90706947f288_leistung') | float(0)
                + states('sensor.shellyplugsg3_dcb4d9c6b46c_leistung') | float(0)
                + states('sensor.shellyplugsg3_9070694d44bc_leistung') | float(0)
            ) | round(1) }}

        - name: "raum_hauswirtschaft_power_w"
          unique_id: raum_hauswirtschaft_power_w
          unit_of_measurement: "W"
          device_class: power
          state_class: measurement
