                + states('sensor.shellyplugsg3_9070694abdf4_leistung') | float(0)
            ) | round(1) }}

        # 25.08.2026, Nutzer-Vorgabe: Keller + Garage zusammengelegt zu einem
        # Raum "Untergeschoss" (nur im Dashboard — die HA-Areas "Keller" und
        # "Garage" selbst bleiben unverändert, das ist reine Anzeige-
        # Zusammenlegung, keine Bereichs-Korrektur wie bei David PC).
        - name: "raum_untergeschoss_power_w"
          unique_id: raum_untergeschoss_power_w
          unit_of_measurement: "W"
          device_class: power
          state_class: measurement
          icon: mdi:home-floor-b
          state: >-
            {{ (states('sensor.ac_elwa_2_power1_solar') | float(0)
                + states('sensor.ac_elwa_2_power1_grid') | float(0)
                + states('sensor.shellyplugsg3_dcb4d9c5567c_leistung') | float(0)
                + states('sensor.shellyplugsg3_d0cf13d86254_leistung') | float(0)
                + states('sensor.shellyplusplugs_d4d4daf4eda4_leistung') | float(0)
                + states('sensor.shelly1pmg4_e4b06377adc0_leistung') | float(0)
                + states('sensor.shellyplugsg3_907069492f30_leistung') | float(0)
            ) | round(1) }}

        # ── Raum-Summen (Tages-kWh) ──────────────────────────────────────
        # 25.08.2026: Speist "Verbrauch nach Räumen (heute)" (Tab
        # "EnergieInfo", 2. Abschnitt links unten). Gleiche Raum-
        # Gruppierung wie raum_*_power_w oben, nur Tages-kWh statt
        # Momentanleistung — "garage_energy_daily"/"server_energy_daily" sind
        # historisch gewachsene Key-Namen (siehe Kommentar oben in dieser
        # Datei), zeigen aber laut Live-Area-Registry auf Schlafzimmer 1
        # bzw. Garage, nicht auf ihren Namen.
        - name: "raum_wohnzimmer_energy_daily"
          unique_id: raum_wohnzimmer_energy_daily
          unit_of_measurement: "kWh"
          state_class: measurement
          icon: mdi:sofa
          state: >-
            {{ (states('sensor.wohnwand_energy_daily') | float(0)
                + states('sensor.tv_energy_daily') | float(0)
