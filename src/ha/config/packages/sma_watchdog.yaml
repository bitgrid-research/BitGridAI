sma_watchdog:

  automation:
    - id: sma_session_watchdog
      alias: "SMA: Session Watchdog — Auto-Reload bei unavailable"
      mode: single
      max_exceeded: silent
      trigger:
        - platform: state
          entity_id: sensor.sma_tripower_pv_power
          to: "unavailable"
          for:
            minutes: 2
        # Wiederholter Trigger: der State-Trigger oben feuert nur EINMAL beim
        # Übergang. Bleibt der Sensor unavailable (Reload hat nicht gegriffen),
        # würde die Automation sonst nie wieder auslösen. Deshalb zusätzlich
        # periodisch prüfen, solange der Zustand anhält.
        - platform: time_pattern
          minutes: "/10"
      condition:
        - condition: state
          entity_id: sensor.sma_tripower_pv_power
          state: "unavailable"
      action:
        - action: homeassistant.reload_config_entry
          target:
            entity_id: sensor.sma_tripower_pv_power
        - action: persistent_notification.create
          data:
            title: "SMA Session wiederhergestellt"
            message: >
              pysmaplus wurde automatisch neu geladen um
              {{ now().strftime('%H:%M') }} Uhr.
            notification_id: sma_watchdog
