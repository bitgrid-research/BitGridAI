          --bg-fs-title: 2.125rem;
          /* Neuer Token, nur fuer group_header-Gruppentitel (02.09.2026,
             Nutzer-Wunsch "Ueberschriftgroessen fuer alle Gruppen in jedem
             Tab wie Home"): das geteilte group_header-Template (button_card_
             templates.yaml, auch von v1 genutzt) las bisher --bg-fs-body
             (22px), Home hatte zusaetzlich 6x einen Pro-Karte-Override auf
             1.6875rem (27px) — daher der Groessen-Unterschied zwischen
             Tabs. Einheitlich in allen v3-Views gesetzt, v1 bleibt
             unberuehrt (kennt die Variable nicht, Template faellt dort auf
             --bg-fs-body zurueck). */
          --bg-fs-group-header: 1rem;
        }
    cards:
      - type: custom:layout-card
        layout_type: custom:grid-layout
        layout:
          grid-template-columns: minmax(0, 1fr) minmax(0, 1fr)
          grid-gap: 14px
          padding: 14px
          box-sizing: border-box
        cards:
          # ── LINKS: alles, was antippbar/aenderbar ist ────────────────────
          # 26.08.2026, Nutzer-Vorgabe: saemtliche Einstellungen (vorher auf
          # beide Spalten verteilt) stehen jetzt geschlossen links. Rechts
          # bleiben nur noch reine Live-Status-Infos ohne input_*-Entities.
          # Abschnittstitel nutzen ab jetzt das Template `group_header`
          # (button_card_templates.yaml) statt einer eigenen markdown-Karte:
          # dieselbe transparente "Titel ueber der Karte"-Optik wie beim
          # bestehenden Poolertraege-Gruppentitel weiter oben im Dashboard,
          # damit der Titel nicht wie eine eigene Box aussieht bzw. mit der
          # Inhalts-Karte darunter verschmilzt (Nutzer-Feedback).
          - type: vertical-stack
            cards:
              # 26.08.2026: die sechs SoC-Schwellen (Hochschalten/Runter-
              # schalten, vormals hier editierbar) stehen seither NICHT mehr
              # in den Einstellungen — sie werden von automation.
              # mvp_saison_automatik (mvp_auto.yaml, feste 12-Monats-Tabelle)
              # gesetzt und sind nur noch auf dem Steuerung-Tab sichtbar
              # (Block + Tabelle), Nutzer-Vorgabe. Bearbeiten hier haette
              # ohnehin nur bis zum naechsten Automatik-Lauf gehalten.
              # 27.08.2026, Nutzer-Wunsch: Akku-Notbremse/Sicherheit/Nacht-
              # Sperre/Lueftung sind ebenfalls raus (waren die letzten vier
              # Gruppen ohne Automatik-Ueberschreibung, aber Bearbeiten ist
              # jetzt nicht mehr redundant zu Steuerung noetig). Editieren
              # geht ab jetzt ausschliesslich ueber die Zeilen im Steuerung-
              # Tab (echte button-cards mit tap_action: more-info, Template
              # settings_row/settings_row_icon — nicht mehr per onclick in
              # generiertem HTML, das verschluckte HAs CSP stumm).
              #
              # Wieder eingefuehrt 27.08.2026 (ADR 028, dritte Kehrtwende):
              # die Saison-Automatik ist wieder Live-Formel statt fester
              # Tabelle, diese beiden Werte sind wieder die einzigen echten
              # Stellschrauben dafuer. "Saisonale Tabelle" rechts spiegelt
              # sie live, siehe dort.
              - type: custom:button-card
                template: group_header
                icon: mdi:calendar-sync
                name: Saisonale Automatik
              - type: custom:layout-card
                layout_type: custom:grid-layout
                layout:
                  grid-template-columns: "1fr"
                  grid-template-rows: repeat(3, auto)
                  grid-gap: 4px
                cards:
                  - type: custom:button-card
                    template: [settings_row, settings_row_icon]
                    entity: input_number.mvp_night_baseload_w
                    name: Nächtliche Grundlast
                    icon: mdi:weather-night
                    label: "[[[ return Math.round(parseFloat(entity.state)) + ' W'; ]]]"
                    styles:
                      icon:
                        - color: "var(--primary-text-color)"
                      label:
                        - color: "var(--primary-text-color)"
                  - type: custom:button-card
                    template: [settings_row, settings_row_icon]
                    entity: input_number.battery_capacity_kwh
                    name: Batterie-Kapazität
                    icon: mdi:battery-high
                    label: "[[[ return parseFloat(entity.state).toFixed(1) + ' kWh'; ]]]"
                    styles:
                      icon:
                        - color: "var(--primary-text-color)"
                      label:
                        - color: "var(--primary-text-color)"
                  - type: custom:button-card
                    template: [settings_row, settings_row_icon]
                    entity: sensor.mvp_saison_status
                    name: Block diesen Monat
                    icon: mdi:calendar-month
                    label: "[[[ return entity.state; ]]]"
                    styles:
                      icon:
                        - color: "var(--primary-text-color)"
                      label:
                        - color: "var(--primary-text-color)"
              # 25.08.2026, Nutzer-Wunsch: Strompreis/Einspeisevergütung
              # (beide Entities existierten schon in packages/economics.yaml,
              # speisen die Finanz-Bilanz-Karte, waren aber bisher nirgends im
              # Dashboard editierbar) plus neu Investierte Hardware (reines
              # Eingabefeld, siehe Kommentar in economics.yaml — noch OHNE
              # Amortisations-/ROI-Berechnung, dafür fehlen Startdatum und die
              # Festlegung "nur Miner oder ganze Anlage").
              - type: custom:button-card
                template: group_header
                icon: mdi:finance
                name: Wirtschaftlichkeit
              - type: custom:layout-card
                layout_type: custom:grid-layout
                layout:
                  grid-template-columns: "1fr"
                  grid-template-rows: repeat(3, auto)
                  grid-gap: 4px
                cards:
                  - type: custom:button-card
                    template: [settings_row, settings_row_icon]
                    entity: input_number.grid_price_ct_kwh
                    name: Strompreis Netzbezug
                    icon: mdi:transmission-tower-import
                    label: "[[[ return parseFloat(entity.state).toFixed(2) + ' ct/kWh'; ]]]"
                    styles:
                      icon:
                        - color: "var(--bg-color-reserve)"
                      label:
                        - color: "var(--bg-color-reserve)"
                  - type: custom:button-card
                    template: [settings_row, settings_row_icon]
                    entity: input_number.feed_in_tariff_ct_kwh
                    name: Einspeisevergütung
                    icon: mdi:transmission-tower-export
                    label: "[[[ return parseFloat(entity.state).toFixed(1) + ' ct/kWh'; ]]]"
                    styles:
                      icon:
                        - color: "var(--bg-color-eco)"
                      label:
                        - color: "var(--bg-color-eco)"
                  - type: custom:button-card
                    template: [settings_row, settings_row_icon]
                    entity: input_number.hardware_cost_eur
                    name: Investierte Hardware
                    icon: mdi:cash-multiple
                    label: "[[[ return Math.round(parseFloat(entity.state)).toLocaleString('de-DE') + ' €'; ]]]"
                    styles:
                      icon:
                        - color: "var(--primary-text-color)"
                      label:
                        - color: "var(--primary-text-color)"

          # ── RECHTS: reine Live-Status-Infos, keine input_*-Entities ──────
          # 26.08.2026, Nutzer-Vorgabe: rechts stehen nur noch berechnete/
          # live Zustaende, nichts davon ist antippbar-aenderbar. Batterie-
          # waechter nutzt ausschliesslich bestehende Sensoren (sensor.
          # battery_soc_pct, sensor.battery_power_w, binary_sensor.mvp_soc_
          # kritisch_debounced aus packages/mvp_auto.yaml); die Notbremse-
          # Aktiv-Anzeige vergleicht live gegen die links gesetzten Schwellen
          # (input_number.mvp_batt_discharge_*_downgrade_w, R8) direkt per
          # button-card-JS, ohne einen neuen Template-Sensor anzulegen.
          # Lüftung-Info nutzt den bereits vorhandenen Shelly-Plug-Schalter
          # (switch.shellyplusplugs_d4d4daf4eda4, siehe R8/Lüftung-Watchdog
          # weiter oben in mvp_auto.yaml) und sensor.filterpflege_status
          # statt die Filterpflege-Faelligkeitslogik hier zu duplizieren.
          - type: vertical-stack
            cards:
              # ── Saisonale Tabelle (live) ───────────────────────────────
              # 27.08.2026 (ADR 028, dritte Kehrtwende): wieder live aus
              # Grundlast + Kapazitaet berechnet statt fester Zahlen —
              # "die naechtliche Grundlast soll die Automatik betreiben"
              # (Nutzer-Zitat). Rechnet dieselbe Formel wie sensor.
              # mvp_saison_status/automation.mvp_saison_automatik
              # (mvp_auto.yaml) unabhaengig nach. namespace(rows=[]) +
              # join('\n') bewusst so (nicht {% for %} mit Zeilen direkt im
              # Markdown): einzelne {% set %}-Zeilen zwischen Tabellenzeilen
              # hinterliessen sonst Leerzeilen, die GFM-Tabellen brechen
              # (live bestaetigt 27.08.2026, HA trimmt Template-Whitespace
              # offenbar nicht wie angenommen) — mit dieser Methode sind die
              # Zeilenumbrueche echte Daten (Python-join), nicht
              # Template-Whitespace, funktioniert unabhaengig von der
              # Jinja-Umgebungskonfiguration.
              - type: custom:button-card
                template: group_header
                icon: mdi:table
                name: Saisonale Tabelle
              - type: markdown
                card_mod:
                  style: |
                    ha-card { padding: 8px 14px; border-radius: var(--ha-card-border-radius); overflow: hidden; }
                    table { font-size: 0.9875rem; width: 100%; }
                    th, td { padding: 3px 6px !important; text-align: right !important; }
                    th:first-child, td:first-child { text-align: left !important; }
                    /* 01.09.2026: zwei Versuche, den aktuellen Monat per Hintergrund
                       hervorzuheben, scheiterten live (inline style="..." auf <tr> wurde
                       von HAs Markdown-Sanitizer entfernt; ein card_mod-nth-child mit
                       {{ now().month }}-Template blieb ebenfalls unsichtbar — Sanitizer
                       oder fehlende Reaktivitaet, nicht weiter verfolgt, Nutzer-Entscheid:
                       stattdessen simpler Kontrast ueber Schriftfarbe). Alle NICHT
                       aktuellen Monate werden im Content unten in <em> gewrappt (ueber-
                       lebt den Sanitizer, ist ein echtes Tag statt eines Attributs) und
                       hier auf secondary-text-color + font-style:normal gesetzt — der
                       aktuelle Monat bleibt primary-text-color + fett (<strong>).*/
                    /* 01.09.2026: erster Versuch ohne !important blieb komplett unsichtbar
                       (weder Graustufe noch Spaltenfarben noch die groessere Schrift kamen
                       live an) — HAs eigenes Markdown-Tabellen-CSS setzt color/font-style/
                       font-size offenbar mit hoeherer Spezifitaet vor, exakt der Grund,
                       warum padding/text-align oben bereits !important brauchten. Ab hier
                       konsequent !important, sonst zieht card_mod hier gar nichts. */
                    td em { color: var(--secondary-text-color) !important; font-style: normal !important; }
                    td strong { font-size: 1.1em !important; }
                    /* 01.09.2026, Nutzer-Wunsch: Schwellen-Spalten wie im Regelschwellen-
                       Chart (Zeile ~1046) einfaerben, gleiche Variablen. nth-child hat
                       hoehere Spezifitaet als "td em" oben, gewinnt also fuer alle
                       Monate, nicht nur den aktuellen — bewusst so: die Spalte gehoert
                       zur Regel, nicht zum Monat. */
                    th:nth-child(3), td:nth-child(3) { color: var(--bg-color-reserve, #EF5350) !important; }
                    th:nth-child(4), td:nth-child(4) { color: var(--bg-color-eco, #4CAF50) !important; }
                    th:nth-child(5), td:nth-child(5),
                    th:nth-child(6), td:nth-child(6) { color: var(--bg-color-standard, #26C6DA) !important; }
                    th:nth-child(7), td:nth-child(7),
                    th:nth-child(8), td:nth-child(8) { color: var(--bg-color-super, #F7931A) !important; }
                content: |
                  Grundlage: **{{ '%d'|format(states('input_number.mvp_night_baseload_w')|float(535)) }} W** nächtliche Grundlast / **{{ '%.1f'|format(states('input_number.battery_capacity_kwh')|float(12.5)) }} kWh** Akkukapazität (beide links editierbar) → bestimmt die Hausreserve, daraus folgen alle sechs Schwellen live.
                  {%- set ns_stunden = {1:15.75,2:14.5833,3:12.9667,4:11.0667,5:9.3167,6:8.0,7:8.8167,8:10.5,9:12.3167,10:14.1333,11:15.5167,12:15.85} -%}
                  {%- set monate = {1:'Januar',2:'Februar',3:'März',4:'April',5:'Mai',6:'Juni',7:'Juli',8:'August',9:'September',10:'Oktober',11:'November',12:'Dezember'} -%}
                  {%- set gw = states('input_number.mvp_night_baseload_w') | float(535) -%}
                  {%- set kk = states('input_number.battery_capacity_kwh') | float(12.5) -%}
                  {%- set ns = namespace(rows=[]) -%}
                  {%- for m in range(1, 13) -%}
                  {%- set h = ns_stunden[m] -%}
                  {%- set rp = (gw * h / 1000 / kk * 100) if kk > 0 else 100 -%}
                  {%- set sp = [15 + rp, 95] | min -%}
                  {%- set is_now = (m == now().month) -%}
                  {%- set ob = '<strong>' if is_now else '<em>' -%}
                  {%- set cb = '</strong>' if is_now else '</em>' -%}
                  {%- set std_off_raw = sp + 20 -%}
                  {%- set std_raw = sp + 25 -%}
                  {%- set sup_off_raw = sp + 35 -%}
                  {%- set sup_raw = sp + 40 -%}
                  {%- set std_off_s = (std_off_raw | round(0) | int | string ~ '%') if std_raw <= 100 else '—' -%}
                  {%- set std_s = (std_raw | round(0) | int | string ~ '%') if std_raw <= 100 else '—' -%}
                  {%- set sup_off_s = (sup_off_raw | round(0) | int | string ~ '%') if sup_raw <= 100 else '—' -%}
                  {%- set sup_s = (sup_raw | round(0) | int | string ~ '%') if sup_raw <= 100 else '—' -%}
                  {%- set block_s = 'Voll' if sup_raw <= 100 else ('Eco+Std' if std_raw <= 100 else 'Nur Eco') -%}
                  {%- set r1_s = (sp | round(0) | int | string) ~ '%' -%}
                  {%- set r7_s = ([sp+10,100]|min|round(0)|int|string) ~ '%' -%}
                  {%- set row = '<tr><td>' ~ ob ~ monate[m] ~ cb ~ '</td><td>' ~ ob ~ block_s ~ cb ~ '</td><td>' ~ ob ~ r1_s ~ cb ~ '</td><td>' ~ ob ~ r7_s ~ cb ~ '</td><td>' ~ ob ~ std_off_s ~ cb ~ '</td><td>' ~ ob ~ std_s ~ cb ~ '</td><td>' ~ ob ~ sup_off_s ~ cb ~ '</td><td>' ~ ob ~ sup_s ~ cb ~ '</td></tr>' -%}
                  {%- set ns.rows = ns.rows + [row] -%}
                  {%- endfor %}

                  <table>
                  <thead><tr><th>Monat</th><th>Block</th><th>Hausreserve (R1)</th><th>Eco ab (R7)</th><th>Std endet (R6)</th><th>Std ab (R5)</th><th>Sup endet (R4)</th><th>Sup ab (R3)</th></tr></thead>
                  <tbody>
                  {{ ns.rows | join('\n') }}
                  </tbody>
                  </table>

