title: BitGridAI v3

# Geteilte custom:button-card-Templates (miner_header/miner_btn/...). Nötig,
# weil der Steuerung-Tab views/miner_controls.yaml per !include einbindet, das
# diese Templates referenziert. button_card_templates ist ein Pro-Dashboard-
# Root-Key, fehlt er hier, rendert button-card "Konfigurationsfehler".
# Gemeinsame Quelle mit bitgrid_dashboard_v1.yaml: button_card_templates.yaml.
button_card_templates: !include button_card_templates.yaml

# ═══════════════════════════════════════════════════════════════════════
# Kiosk-Home-Screen für Wandtablet, zwei Spalten, je ein eigener vertical-
# stack (Hoehe pro Spalte entkoppelt, keine geteilten Grid-Zeilen). Höhe
# nicht auf einen Bildschirm geklemmt: die Karten bekommen ihre natürliche
# Höhe, die Seite scrollt nach unten (wie Tab 2).
#
#        LINKS                      RECHTS
#   ┌──────────────────────┐   ┌──────────────────────┐
#   │ BITGRIDAI              │   │ WETTER                │
#   │  Hamster-Erklärung   │   │  Wetter (Uhr+Stunden) │
#   ├──────────────────────┤   │                        │
#   │ ENERGIEFLUSS            │   │                        │
#   │     Energiefluss     │   │                        │
#   ├──────────────────────┤   ├──────────────────────┤
#   │ MINER                 │   │ VERLAUF (HEUTE)        │
#   │ Steuerung Quick-Action│   │   Verlauf-Chart        │
#   │                        │   ├──────────────────────┤
#   │                        │   │ FINANZEN               │
#   │                        │   │   Finanz-Bilanz        │
#   └──────────────────────┘   └──────────────────────┘
#
# Designprinzipien:
#   - 2-Spalten-Grid, beide Spalten 50% breit (minmax(0,1fr): verhindert,
#     dass der breite Miner-Quick-Action-Block seine Spalte sprengt, gleiche
#     Technik wie im Steuerung-Tab). Gruppen-Titelzeilen (BitGridAI/Energiefluss/Miner links,
#     Wetter/Verlauf (heute)/Finanzen rechts, template: group_header aus
#     button_card_templates.yaml) wieder eingeführt (31.08.2026, Nutzer-
#     Wunsch): anders als bei tl/tr in den übrigen Tabs stehen sie hier als
#     eigene Karte INNERHALB des jeweiligen vertical-stacks, direkt vor der
#     Karte(-ngruppe), die sie beschriften — kein gemeinsames Grid-Row-
#     Matching zwischen links und rechts nötig.
#   - Paarweises Grid-Row-Matching (Nutzer-Wunsch 31.08.2026, ersetzt die
#     vorherige Entkopplung): 3 Zeilen à 2 Spalten, jedes Paar (BitGridAI↔
#     Wetter, Energiefluss↔Verlauf, Miner↔Finanzen) sitzt in einer eigenen
#     Grid-Zeile und wird per align-items:stretch auf gleiche Höhe gebracht.
#     Ein früherer Versuch genau das (23.08.2026, Miner-Quick-Action ↔
#     damaliger Partner sowie Finanz-Bilanz ↔ Energiefluss) wurde verworfen,
#     weil reines Stretch bei blockgebundenem Inhalt hässlich aussah: leerer
#     Raum unter den Miner-Buttons, künstlich überdehnt wirkende Balken.
#     Diesmal zusätzlich abgefedert: die jeweils wachsende Karte bekommt
#     flex:1 (card_mod :host) UND zentriert ihren Inhalt statt ihn oben
#     anzupinnen bzw. zu verzerren — Balken-SVG behält sein viewBox-
#     Seitenverhältnis (nur Positionierung ändert sich), Miner-Buttons werden
#     vertikal zentriert. Nebeneffekt: die Gesamthöhe der Ansicht ist jetzt
#     strukturell ≥ vorher (Summe der Zeilen-Maxima statt Maximum der
#     Spalten-Summen) — die zoom-Kalibrierung weiter unten (1050px) ist
#     deshalb nur eine hochgeschätzte Annahme und braucht einen Live-Check.
#   - Rechts nur noch EIN Wetter-Baustein (Uhr+Icon + stündlicher Streifen),
#     die 5-Tage-Vorschau und der Sonnenstand entfallen im Demo-Layout.
#   - Finanz-Bilanz (views/finanz_bilanz.yaml) und Verlauf-Chart
#     (views/energieverlauf_tag.yaml) sind neu: Sensoren in
#     packages/economics.yaml. Verlauf nutzt custom:apexcharts-card (HACS,
#     lokal installiert) statt raw-SVG, weil die Karte reale Recorder-
#     Historie braucht (kein Cloud-Call). Zeigt den laufenden Tag
#     (00:00–24:00) als drei transluzente Flächen, angelehnt an die
#     Regelschwellen-Optik (Tab "Steuerung").
#   - Steuerung Quick-Action (views/steuerung_quick.yaml): schneller
#     Moduswechsel für beide Miner ohne die vollen Kennzahlen-Panels, Header
#     verlinkt in den Steuerung-Tab.
#   - fester Radius 20px, dunkle Glaskarten erben aus dem Theme BitGridAI;
#     www/bitgrid_card_shape.js clippt die Custom-Cards (inkl. apexcharts-
#     card) auf den Radius
#   - NaN-sicher: 'unavailable' → '—' statt 'NaN' (wichtig nach HA-Restart)
# ═══════════════════════════════════════════════════════════════════════

views:

  # Header-Titel = View-Titel, mittig zentriert via www/bitgrid_wide.js.
  # Version kommt aus pyproject.toml; deploy_ha.sh ersetzt den Versionsteil
  # beim Deploy durch ein sauberes v<semver> (ohne git-SHA/Build-Metadata).
  # Lovelace-View-Titel kennen kein Templating, daher Injection beim Deploy.
  # Der hier committete Wert ist nur Fallback fürs direkte Laden ohne Deploy.
  - title: BitGridAI - v0.3.0
    path: home
    icon: mdi:home
    theme: BitGridAI
    # Eigener Verlauf nur fuer v3/Demo (v1/v2 nutzen weiterhin unveraendert
    # das gemeinsame BitGridAI-Theme, themes/bitgrid.yaml lovelace-background).
    # Formale v3-Palette 24.08.2026 (Nutzer-Vorgabe): "Verlauf oben links"
    # -> "Verlauf unten rechts" = 135deg (to bottom right). Ersetzt jede
    # vorherige Iteration. Grund laut Vorgabe: Gruen ist Statusfarbe fuer
    # Zuhause/Akku (--bgai-home-v3), ein gruenstichiger Hintergrund senkt
    # dort den Kontrast.
    background: "linear-gradient(135deg, #0E1530 0%, #171A3A 100%)"
    panel: true
    # View-scoped Flaechen-/Textfarben (24.08.2026, Nutzer-Vorgabe): CSS-
    # Custom-Properties auf :host der View gesetzt, vererben sich an alle
    # Karten darunter (die bereits var(--card-background-color) etc.
    # referenzieren) — ohne zweites Theme, ohne v1/v2 zu beruehren. Sidebar/
    # Topbar liegen ausserhalb dieses DOM-Teilbaums und bleiben bewusst
    # unveraendert (Nutzer-Entscheidung 24.08.2026).
    card_mod:
      style: |
        :host {
          --card-background-color: var(--bgai-card-bg-v3, #182449);
          --divider-color: var(--bgai-divider-v3, #26356B);
          --primary-text-color: var(--bgai-text-primary-v3, #EAEFFB);
          --secondary-text-color: var(--bgai-text-secondary-v3, #A8B3D4);
          /* Schrift groesser, nur v3 (Nutzer-Wunsch 02.09.2026): ueberschreibt die
             Typo-Skala aus themes/bitgrid.yaml view-scoped, exakt dasselbe Muster
             wie die Flaechen-/Textfarben oben — v1/v2 bleiben unveraendert. Werte
             deutlich ueber der urspruenglich geplanten +3px-Stufe: die Home-Tab-
             Inhaltskarten haben ein zusaetzliches zoom:min(1,calc(100vh/1200px))
             (s. u.), das jede Erhoehung wieder verduennt — kompensiert durch
             groessere Basiswerte statt zoom-Formel anzufassen. */
          --bg-fs-label: 0.9375rem;
          --bg-fs-secondary: 1.1875rem;
          --bg-fs-body: 1.375rem;
          --bg-fs-title: 2.125rem;
          /* Neuer Token, nur fuer group_header-Gruppentitel (02.09.2026,
             Nutzer-Wunsch "Ueberschriftgroessen fuer alle Gruppen in jedem
             Tab wie Home"): das geteilte group_header-Template (button_card_
             templates.yaml, auch von v1 genutzt) las bisher --bg-fs-body
             (22px), Home hatte zusaetzlich 6x einen Pro-Karte-Override auf
             1.6875rem (27px) — daher der Groessen-Unterschied zwischen
             Tabs. Einheitlich in allen v3-Views gesetzt, v1 bleibt
             unberuehrt (kennt die Variable nicht, Template faellt dort auf
             --bg-fs-body zurueck). */
          --bg-fs-group-header: 1rem;
        }
    cards:
      - type: custom:layout-card
        # KEIN zoom:calc(100vh/...) mehr (31.08.2026, Nutzer-Wunsch "Zoom-
        # Einstellung aus dem Home-Tab raus"): das urspruengliche Ziel vom
        # 24.08.2026 ("Startseite soll nie scrollen") stand zunehmend im Weg,
        # nachdem der Home-Inhalt durch das paarweise Zeilen-Hoehen-Matching
        # (s. Kopfkommentar) strukturell gewachsen ist — ein einzelner
        # Zoom-Wert konnte "kein Abschneiden" und "gleiche Textgroesse wie
        # Steuerung" (Nutzer-Wunsch, s. group_header-Overrides unten) nicht
        # mehr gleichzeitig erfuellen, siehe die gescheiterten 900px/1150px-
        # Versuche direkt zuvor in der Git-Historie dieser Datei. Home
        # rendert jetzt in natuerlicher Groesse und scrollt bei Bedarf wie
        # Tab 2 (Steuerung behaelt seinen eigenen zoom unveraendert).
        layout_type: custom:grid-layout
        layout:
          # Beide Spalten 50% breit. minmax(0, 1fr) statt 1fr: der Steuerung-
          # Quick-Action-Block (Miner 1 | Miner 2 nebeneinander) ist in seinem
          # min-content breiter als 50% und würde sonst seine Spalte sprengen
          # (gleiche Technik wie Tab "Steuerung" beim vollen Miner-Block).
          # 3 Zeilen, jede ein Paar (g1=BitGridAI/Wetter, g2=Energiefluss/
          # Verlauf, g3=Miner/Finanzen). align-items:stretch bringt pro Zeile
          # die kuerzere Karte auf die Hoehe der laengeren (31.08.2026,
          # Nutzer-Wunsch, s. Kopfkommentar fuer die verworfene Vorgeschichte).
          grid-template-columns: minmax(0, 1fr) minmax(0, 1fr)
          grid-template-rows: auto auto auto
          grid-template-areas: '"g1l g1r" "g2l g2r" "g3l g3r"'
          align-items: stretch
          grid-gap: 14px
          padding: 14px
          box-sizing: border-box
        cards:

          # ═══════════════════════════════════════════════════════════
          # ZEILE 1 LINKS  —  Hamster-Erklärung (g1l), gepaart mit Wetter (g1r).
          # Eigener vertical-stack, per align-items:stretch auf Zeilenhöhe.
          # ═══════════════════════════════════════════════════════════
          - type: vertical-stack
            view_layout:
              grid-area: g1l
            # zoom hier statt einzeln auf der Hamster-Karte (02.09.2026,
            # Versuch #3 gegen den Versatz zur Wetter-Spalte): Verdacht ist ein
            # bekanntes zoom+flex-grow-Problem — flex-grow berechnet die
            # Zielhoehe, zoom skaliert die schon berechnete Box danach nochmal
            # nach unten, statt die Rechnung selbst zu beeinflussen. Zoom auf
            # der ganzen Spalte (VOR der flex-Verteilung zwischen Gruppentitel
            # und Hamster-Karte) umgeht das: die Streckung passiert komplett in
            # unskalierten Koordinaten, erst danach schrumpft alles zusammen.
            card_mod:
              style: |
                :host {
                  zoom: min(1, calc(100vh / 1200px)) !important;
                }
            cards:

              # ── Gruppen-Titel: BITGRIDAI (Hamster-Statuskarte) ──────────
              # Eigenes Maskottchen-Icon statt mdi (Nutzer-Wunsch 31.08.2026):
              # docs/media/hamster mdi2.png war reine Schwarz-Linienzeichnung
              # auf Transparenz, auf der dunklen Kartenfarbe unsichtbar. Als
              # www/hamster_mdi2.png in der Icon-Farbe der übrigen Gruppen-
              # Titel (#A8B3D4 = var(--secondary-text-color)) eingefärbt
              # deployt. Dieser button-card-Build (www/community/button-card/
              # button-card.js) kennt kein top-level "image:" (erste Fassung
              # blieb deshalb komplett leer, kein img-cell wurde gerendert,
              # siehe _buildIcon/_buildEntityPicture im Bundle) — Bilder laufen
              # hier ausschliesslich ueber entity_picture + show_entity_picture.
              - type: custom:button-card
                template: group_header
                # font-size 1.5rem (31.08.2026, Nutzer-Wunsch "Überschriften
                # in Home größer"): der Versuch, stattdessen die View-Zoom-
                # Basis an Steuerung anzugleichen, brach das Home-Layout
                # (Inhalt passte nicht mehr in den Viewport) und wurde
                # zurueckgerollt (zoom bleibt 1150px, s. o.).
                # Der fruehere Direkt-Override hier (font-size:1.6875rem)
                # ist entfallen (02.09.2026): das geteilte group_header-
                # Template liest jetzt selbst --bg-fs-group-header (view-
                # scoped, s. :host oben), kein Pro-Karte-Override mehr
                # noetig — zentraler Fix statt sechsfacher Duplikation.
                show_entity_picture: true
                entity_picture: /local/hamster_mdi2.png?v=20260831
                name: BitGridAI

              # ═══════════════════════════════════════════════════════════
              # HAMSTER  —  Energie-Gruppe oben (ham). flex:1 (31.08.2026):
              # waechst innerhalb des g1l-vertical-stacks auf die per
              # align-items:stretch vorgegebene Zeilenhoehe, der Gruppentitel
              # darueber bleibt bei seiner natuerlichen Hoehe. Der interne
              # justify-content:space-between (s. u. im Template-String)
              # verteilt zusaetzliche Hoehe als Luecke vor der Blockzeit/
              # Balance/Kurs-Fussleiste statt als toten Raum danach.
              # ═══════════════════════════════════════════════════════════
              - type: custom:button-card
                # zoom (31.08.2026, Nutzer-Wunsch "Karteninhalte verkleinern
                # damit alles wieder reinpasst, nur die Überschriftgröße
                # bleibt"): anders als der fruehere View-weite zoom sitzt er
                # jetzt NUR auf den Inhalts-Karten, nicht auf den
                # group_header-Karten (die bleiben bei 1.5rem, unskaliert).
                # 1200px ist ein erster Schaetzwert, kein Messwert — nach
                # Live-Screenshot in allen sieben Inhalts-Karten (s. gleiche
                # Kommentarzeile) gemeinsam nachjustieren, damit sie
                # gleichmaessig schrumpfen.
                card_mod:
                  style: |
                    :host {
                      /* flex-basis 0 statt auto (02.09.2026). zoom ist jetzt
                         eine Ebene hoeher auf der g1l-Spalte gesetzt (s. dort),
                         nicht mehr hier — Verdacht: zoom direkt auf einem
                         flex-grow-Element skaliert die schon fertig berechnete
                         Box nachtraeglich nochmal runter, statt die Rechnung
                         selbst zu beeinflussen (Versatz zur Wetter-Karte trotz
                         ha-card-Fix, s. u., unveraendert geblieben). */
                      flex: 1 1 0 !important;
                    }
                    /* ha-card explizit auf 100% von :host (02.09.2026): fuer
                       sich allein ebenfalls ohne sichtbaren Effekt geblieben,
                       bleibt trotzdem gesetzt (korrekter als kein Wert). */
                    ha-card {
                      height: 100% !important;
                    }
                    /* Lokaler --bg-fs-title-Override (02.09.2026, Nutzer-
                       Praezisierung "im Verhaeltnis zu den anderen Karten"):
                       nicht "absolut zu gross", sondern zu gross verglichen
                       mit dem Rest des Dashboards — 2.125rem (View-Default)
                       und selbst 2rem standen ohne vergleichbares Gegenstueck
                       da (dort ist --bg-fs-title sonst nirgends sichtbar im
                       Einsatz). 1.5rem = dieselbe Groesse wie die Miner-
                       Kartentitel (views/steuerung_quick.yaml), damit haben
                       Blockzeit/Balance/Kurs/Ueberschrift jetzt ein echtes,
                       bereits akzeptiertes Gegenstueck auf demselben Tab. */
                    :host {
                      --bg-fs-title: 1.5rem;
                    }
                show_name: false
                show_icon: false
                show_state: false
                tap_action:
                  action: none
                custom_fields:
                  hamster: >
                    [[[
                      const fnum = (id) => {
                        const v = parseFloat(states[id]?.state);
                        return isNaN(v) ? null : v;
                      };
                      const cfg = (id, fb) => { const v = fnum(id); return v === null ? fb : v; };
                      const pct = (v) => v.toLocaleString('de-DE', {maximumFractionDigits: 0});
                      const kw  = (w) => (w / 1000).toLocaleString('de-DE', {minimumFractionDigits: 1, maximumFractionDigits: 1});

                      const h = new Date().getHours();
                      const night = states['binary_sensor.mvp_nacht_sperre_aktiv']?.state === 'on'
                        || (h >= 22 || h < 6);
                      const modeRaw = states['sensor.miner1_workmode_status']?.state
                                  || states['sensor.miner2_workmode_status']?.state || '';
                      const mode = (modeRaw === 'unavailable' || modeRaw === 'unknown') ? '' : modeRaw;
                      const running = ['Eco', 'Standard', 'Super'].includes(mode);
                      const socV   = fnum('sensor.battery_soc_pct');
                      const pvV    = fnum('sensor.pv_power_w');
                      const minerV = fnum('sensor.miner_total_power_w');
                      const chipV  = fnum('sensor.miner_max_chip_temp_c');
                      const socKnown = socV !== null;
                      const soc    = socV ?? 0;
                      const pvW    = pvV ?? 0;

                      // Schwellen aus den HA-Config-Entities (Platzhalter-Legende soc_band_tagesverlauf.md)
                      const socStop   = cfg('input_number.mvp_soc_stop_pct', 50);
                      const ecoStart  = cfg('input_number.mvp_soc_eco_start_pct', 60);
                      const socStd    = cfg('input_number.mvp_soc_std_pct', 75);
                      const socStdStp = ecoStart;
                      const socSuper  = cfg('input_number.mvp_soc_super_pct', 90);
                      const socSupStp = socStd;
                      const pvStartW  = cfg('input_number.mvp_pv_start_w', 6000);
                      const maxChip   = cfg('input_number.mvp_tmax_std_threshold_c', 112);

                      // Erklärtext A (statisch/regelbasiert) aus soc_band_tagesverlauf.md,
                      // Platzhalter live aus den gebundenen Entities ersetzt. Zustand = sichtbare
                      // Wahrheit (Workmode + Temperatur + SoC), NICHT bg_decision_code (entkoppelt).
                      let head, sub, img;
                      if (!socKnown && !running) {
                        head = 'Verbindung wird aufgebaut';
                        sub  = 'Die Sensoren melden sich gerade nach einem Neustart.<br>'
                             + 'Sobald Ladezustand und PV anliegen, zeigt die Karte den Betriebszustand.';
                        img  = 'bithamster_wait.png';
                      } else if (night) {
                        head = 'Nachtsperre aktiv';
                        sub  = `Es ist ${h}:00 Uhr, Beginn des Nachtfensters von 22:00 bis 06:00 Uhr.<br>`
                             + 'In dieser Zeit ist das Mining unabhängig vom Ladezustand ausgesetzt.<br>'
                             + 'Der Normalbetrieb beginnt wieder ab 06:00 Uhr.';
                        img  = 'bithamster_sleep.png';
                      } else if (chipV !== null && chipV >= maxChip) {
                        head = 'Sicherheits-Stopp: zu heiß';
                        sub  = `Die Chip-Temperatur liegt mit ${pct(chipV)} °C über der Sicherheitsgrenze von ${pct(maxChip)} °C.<br>`
                             + 'Der Miner wird sofort gestoppt, nicht überstimmbar.<br>'
                             + 'Ein Wiederanlauf erfolgt erst nach Abkühlung.';
                        img  = 'bithamster_wait.png';
                      } else if (mode === 'Eco') {
                        head = 'Miner läuft sparsam (Eco)';
                        sub  = `Der Ladezustand liegt mit ${pct(soc)} % im Eco-Band, die PV bei ${kw(pvW)} kW.<br>`
                             + `Der Miner minet gedrosselt im Eco-Modus${pvW < pvStartW ? ' aus dem Akku weiter' : ''}.<br>`
                             + `Unter ${pct(socStop)} % greift die Hausreserve, ab ${pct(socStd)} % schaltet er auf Standard.`;
                        img  = 'bithamster_eco.png';
                      } else if (mode === 'Standard') {
                        head = 'Miner läuft in Standard';
                        sub  = `Der Ladezustand liegt mit ${pct(soc)} % im Standard-Band.<br>`
                             + 'Der Miner läuft im Standard-Modus.<br>'
                             + `Ab ${pct(socSuper)} % folgt Super, unter ${pct(socStdStp)} % fällt er auf Eco zurück.`;
                        img  = 'bithamster_standard.png';
                      } else if (mode === 'Super') {
                        head = 'Miner läuft auf Volllast (Super)';
                        sub  = `Der Ladezustand liegt mit ${pct(soc)} % im Super-Band (ab ${pct(socSuper)} %).<br>`
                             + 'Der Miner läuft mit voller Last im Super-Modus.<br>'
                             + `Unter ${pct(socSupStp)} % fällt er auf Standard zurück.`;
                        img  = 'bithamster_super.png';
                      } else if (soc < socStop) {
                        head = 'Akku lädt zuerst';
                        sub  = `Der Ladezustand ist mit ${pct(soc)} % unter die Hausreserve von ${pct(socStop)} % gefallen.<br>`
                             + 'Der Miner bleibt aus und lädt zuerst wieder auf.<br>'
                             + `Ein Start ist erst ab ${pct(ecoStart)} % möglich.`;
                        img  = 'bithamster_wait.png';
                      } else if (soc < ecoStart) {
                        head = 'Akku im Halteband';
                        sub  = `Der Ladezustand liegt mit ${pct(soc)} % im Halteband (${pct(socStop)}–${pct(ecoStart)} %).<br>`
                             + 'Ein Neustart ist hier gesperrt, der Miner bleibt aus.<br>'
                             + `Ein Start ist erst ab ${pct(ecoStart)} % möglich.`;
                        img  = 'bithamster_wait.png';
                      } else {
                        head = 'Warte auf Sonne';
                        sub  = `Der Ladezustand liegt mit ${pct(soc)} % im Eco-Band, doch die PV reicht mit ${kw(pvW)} kW nicht (nötig ${kw(pvStartW)} kW).<br>`
                             + 'Der Miner bleibt aus.<br>'
                             + `Ab ${kw(pvStartW)} kW startet er im Eco-Modus.`;
                        img  = 'bithamster_wait.png';
                      }

                      // Stat-Werte auf var(--bg-fs-title) statt Fixwert 1.5rem
                      // (31.08.2026, Nutzer-Wunsch "Schriftgroesse pro Art"):
                      // der Token ist in themes/bitgrid.yaml explizit fuer
                      // "Karten-Headline / grosse Stat-Werte" definiert, genau
                      // diese Rolle haben Blockzeit/Balance/Kurs hier.
                      const stat = (label, value, sub) => `
                        <div style="text-align:center">
                          <div style="font-size:var(--bg-fs-label);text-transform:uppercase;letter-spacing:0.06em;
                                      color:var(--secondary-text-color);opacity:0.65;margin-bottom:1px">${label}</div>
                          <div style="font-size:var(--bg-fs-title);font-weight:700;line-height:1;
                                      white-space:nowrap">${value}</div>
                          ${sub ? `<div style="font-size:var(--bg-fs-secondary);color:var(--secondary-text-color);opacity:0.7;
                                      white-space:nowrap;margin-top:1px">${sub}</div>` : ''}
                        </div>`;

                      // Bitcoin-Fußleiste (wie altes Dashboard): Blockzeit, Kurs, Balance
                      const blockH   = fnum('sensor.bitcoin_block_height');
                      const balBtc   = fnum('sensor.pool_balance_btc');
                      const eurRate  = fnum('sensor.btc_eur_price');
                      const blockStr = blockH  !== null ? Math.round(blockH).toLocaleString('de-DE')          : '—';
                      // Block-Tick: bei neuem Block flippt die Zahl orange auf und glueht
                      // FLASH_MS lang aus. Die Karte re-rendert bei jedem Sensor-Tick (PV,
                      // SoC, ...) komplett neu; darum negative animation-delay = Blockalter,
                      // so setzt jeder Re-Render die Animation nahtlos an der richtigen
                      // Stelle fort, statt sie neu zu starten.
                      const FLASH_MS = 60000;
                      const bhLc  = states['sensor.bitcoin_block_height']?.last_changed;
                      const bhAge = bhLc ? Date.now() - new Date(bhLc).getTime() : Infinity;
                      const blockAnim = (bhAge >= 0 && bhAge < FLASH_MS)
                        ? `animation:bgz-block-tick ${FLASH_MS}ms linear ${-Math.round(bhAge)}ms both;`
                        : '';
                      let priceStr = eurRate !== null ? Math.round(eurRate).toLocaleString('de-DE') + ' <span style="font-size:0.6em;font-weight:400;color:var(--secondary-text-color);opacity:0.7">€</span>' : '—';
                      const haveBal  = balBtc !== null && balBtc > 0;
                      const satsStr  = haveBal ? Math.round(balBtc * 1e8).toLocaleString('de-DE') + ' <span style="font-size:0.6em;font-weight:400;color:var(--secondary-text-color);opacity:0.7">SATs</span>' : '—';
                      const euroSub  = (haveBal && eurRate !== null && eurRate > 0)
                        ? '≈ ' + (balBtc * eurRate).toLocaleString('de-DE', {minimumFractionDigits: 2, maximumFractionDigits: 2}) + ' €'
                        : '';

                      // ── Vergleich zu gestern ──────────────────────────────────────
                      // Kurs: % gegen den Tagesstart-Kurs (= gestriger Schlusskurs eines
                      // 24/7-Assets), gesichert um 00:00 in input_number.btc_eur_day_start
                      // (Automation pool_midnight_baseline_reset). Vor dem ersten
                      // Mitternachts-Lauf ist der Wert 0 → kein Delta, Karte bleibt sauber.
                      const up = 'var(--bg-color-eco,#4CAF50)', down = 'var(--bg-color-reserve,#EF5350)';
                      // em-relativ: skaliert mit der jeweiligen Zeile. Das Inline-Delta hinter
                      // SATs steht auf der grossen Stat-Zeile und wird klein gehalten (0.5em),
                      // damit es nicht ueber den Kartenrand laeuft; das Euro-Delta in der
                      // kleinen Unterzeile bleibt bei 0.72em.
                      const dchip = (txt, col, em) => `<span style="font-size:${em || 0.72}em;font-weight:600;margin-left:4px;color:${col}">${txt}</span>`;
                      const eurPrev = fnum('input_number.btc_eur_day_start');
                      let priceSub = '';
                      if (eurRate !== null && eurPrev !== null && eurPrev > 0) {
                        const dp = (eurRate - eurPrev) / eurPrev * 100;
                        const s  = (dp >= 0 ? '+' : '−')
                                 + Math.abs(dp).toLocaleString('de-DE', {minimumFractionDigits: 2, maximumFractionDigits: 2});
                        priceStr += dchip(`(${s} %)`, dp >= 0 ? up : down, 0.5);
                      }

                      // Balance: gestern geminte SATs (Tagesertrag). Gleiche Quellen und
                      // Priorität wie der Mining-Verlauf (views/miner_stats.yaml): Settlement-
                      // History → payout_history → pool_btc_daily_log, damit beide Karten
                      // exakt denselben Tageswert zeigen. Auszahlungs-robust, da der Ertrag
                      // (nicht das schwankende Pool-Guthaben) gezählt wird.
                      const yIso = (() => { const d = new Date(); d.setDate(d.getDate() - 1);
                        return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; })();
                      let yBtc = null;
                      (states['sensor.pool_settlement_history']?.attributes?.transactions ?? []).forEach(tx => {
                        const md = tx.mining_extra?.mining_date; if (!md) return;
                        const sd = new Date(md * 1000); sd.setUTCDate(sd.getUTCDate() - 1);
                        if (sd.toISOString().slice(0, 10) !== yIso) return;
                        const v = parseFloat(tx.amount ?? tx.changed_balance);
                        if (v > 0) yBtc = v;
                      });
                      if (yBtc === null) {
                        (states['sensor.pool_balance_btc']?.attributes?.payout_history ?? []).forEach(e => {
                          if (!e[0] || !e[2]) return;
                          const sd = new Date(e[0]); sd.setUTCDate(sd.getUTCDate() - 1);
                          if (sd.toISOString().slice(0, 10) === yIso) yBtc = e[2];
                        });
                      }
                      if (yBtc === null) {
                        const raw = states['input_text.pool_btc_daily_log']?.state ?? '';
                        (raw && raw !== 'unknown' && raw !== 'unavailable' ? raw.split('|') : []).forEach(e => {
                          const [d, b] = e.split(','); if (d === yIso) { const v = parseFloat(b); if (v > 0) yBtc = v; }
                        });
                      }
                      const haveYield = yBtc !== null && yBtc > 0;
                      const satsDelta = haveYield ? dchip('(+' + Math.round(yBtc * 1e8).toLocaleString('de-DE') + ')', up, 0.5) : '';
                      const euroDelta = (haveYield && eurRate !== null && eurRate > 0)
                        ? dchip('(+' + (yBtc * eurRate).toLocaleString('de-DE', {minimumFractionDigits: 2, maximumFractionDigits: 2}) + ' €)', up)
                        : '';
                      const satsLine = haveBal ? satsStr + satsDelta : satsStr;
                      const balSub   = euroSub ? euroSub + euroDelta : '';

                      return `
                        <style>
                          @keyframes bgz-block-tick {
                            0%   { transform:rotateX(90deg); color:var(--bg-color-super,#F7931A); text-shadow:0 0 16px rgba(247,147,26,.8); }
                            1%   { transform:rotateX(0);     color:var(--bg-color-super,#F7931A); text-shadow:0 0 16px rgba(247,147,26,.8); }
                            70%  { transform:rotateX(0);     color:var(--bg-color-super,#F7931A); text-shadow:0 0 8px rgba(247,147,26,.4); }
                            100% { transform:rotateX(0);     color:var(--primary-text-color); text-shadow:0 0 0 rgba(247,147,26,0); }
                          }
                        </style>
                        <div style="display:flex;flex-direction:column;height:100%;width:100%;justify-content:space-between">
                          <div style="display:flex;gap:16px;align-items:center">
                            <img src="/local/${img}?v=20260625"
                                 style="width:20%;max-width:110px;aspect-ratio:1;border-radius:50%;flex-shrink:0;
                                        object-fit:cover;border:2px solid var(--divider-color)">
                            <div style="flex:1;min-width:0">
                              <div style="font-size:var(--bg-fs-title);font-weight:700;line-height:1.1;
                                          white-space:normal;overflow-wrap:break-word;
                                          color:var(--primary-text-color);margin-bottom:6px">${head}</div>
                              <div style="font-size:var(--bg-fs-body);color:var(--secondary-text-color);line-height:1.3;
                                          white-space:normal;overflow-wrap:break-word">${sub}</div>
                            </div>
                          </div>
                          <div style="display:flex;justify-content:space-between;padding-top:8px;
                                      border-top:1px solid var(--divider-color)">
                            <div style="width:24%;max-width:135px;flex-shrink:0;text-align:center">
                              <div style="font-size:var(--bg-fs-label);text-transform:uppercase;letter-spacing:0.06em;
                                          color:var(--secondary-text-color);opacity:0.65;margin-bottom:1px">Blockzeit</div>
                              <div style="font-size:var(--bg-fs-title);font-weight:700;line-height:1;white-space:nowrap;${blockAnim}">${blockStr}</div>
                            </div>
                            ${stat('Balance', satsLine, balSub)}
                            ${stat('Kurs', priceStr, priceSub)}
                          </div>
                        </div>`;
                    ]]]
                styles:
                  card:
                    # Neutrales Glas, identisch zu Wetter/Horizont: alle Werte
                    # aus dem Theme (ha-card-*), kein Modus-Tint mehr.
                    - background: var(--ha-card-background)
                    - border-radius: var(--ha-card-border-radius)
                    # Der sichtbare Radius wird (wie bei den anderen Karten) hart
                    # von www/bitgrid_card_shape.js erzwungen (BUTTON-CARD im Set);
                    # styles.card border-radius allein greift hier nicht sichtbar.
                    # overflow:hidden clippt zusaetzlich den Inhalt auf den Radius.
                    - overflow: hidden
                    - border: var(--ha-card-border-width) solid var(--ha-card-border-color)
                    - box-shadow: var(--ha-card-box-shadow)
                    - padding: 12px
                  grid:
                    - grid-template-areas: '"hamster"'
                    - grid-template-columns: 1fr
                  custom_fields:
                    hamster:
                      - height: 100%
                      - width: 100%
                      - justify-self: stretch
                      - align-self: stretch

          # ═══════════════════════════════════════════════════════════
          # ZEILE 2 LINKS  —  Energiefluss (g2l), gepaart mit Verlauf (g2r).
          # ═══════════════════════════════════════════════════════════
          - type: vertical-stack
            view_layout:
              grid-area: g2l
            cards:

              # ── Gruppen-Titel: ENERGIEFLUSS ──────────────────────────────
              # "Energie" verworfen (31.08.2026, Nutzer-Feedback "passt noch
              # nicht ganz"): war der generische Gruppenname aus v2, als
              # Hamster+Energiefluss noch EINE gemeinsame Gruppe bildeten.
              # Seit der BitGridAI/Energie-Aufspaltung beschriftet er nur noch
              # die Flussdiagramm-Karte, "Energiefluss" (wie im Code-Kommentar
              # darunter) trifft den Inhalt genauer und passt zur Konvention
              # der übrigen Titel (Miner, Wetter, Verlauf (heute), Finanzen:
              # alle benennen konkret, was folgt, nicht die Oberkategorie).
              - type: custom:button-card
                template: group_header
                icon: mdi:lightning-bolt
                name: Energiefluss

              # ═══════════════════════════════════════════════════════════
              # ENERGIEFLUSS  —  Energie-Gruppe unten (flu, volle linke Breite)
              # KEIN flex:1/Höhenangleichung an Verlauf — zweiter Fehlversuch
              # (02.09.2026, Nutzer-Feedback "kaputt", identisches Symptom wie
              # der erste am 31.08.2026): selbst mit dem aus dem Bundle-Code
              # verifizierten .card-content-Selektor (position:relative;
              # margin:0 auto, keine eigene Hoehe) blieb der Flow-Diagramm-
              # Inhalt spuerbar unzentriert mit grossem Leerraum unten. PFCP
              # spielt intern offenbar grundsaetzlich nicht zuverlaessig mit
              # Hoehen-Streckung mit, unabhaengig vom Selektor — kein dritter
              # Versuch ohne neue Erkenntnis. Energiefluss bleibt bei seiner
              # natuerlichen Hoehe, genau wie Finanz-Bilanz das schon fuer
              # denselben Grund seit 23.08.2026 tut.
              # ═══════════════════════════════════════════════════════════
              - type: custom:power-flow-card-plus
                # zoom-Kommentar s. Hamster-Karte oben.
                card_mod:
                  style: |
                    :host {
                      zoom: min(1, calc(100vh / 1200px)) !important;
                    }
                    /* Padding einheitlich 12px (02.09.2026, wie Verlauf/
                       Finanzen): PFCP setzt selbst kein eigenes Padding
                       (Bundle-Code verifiziert: .card-content{position:
                       relative;margin:0 auto}, keine padding-Zeile), erbt
                       den HA-Standard von 16px. */
                    .card-content {
                      padding: 12px !important;
                    }
                    /* Schrift groesser (Nutzer-Wunsch 02.09.2026). Klassen aus
                       dem echten Bundle-Quellcode (power-flow-card-plus.js,
                       github.com/flixlix/power-flow-card-plus) verifiziert,
                       nicht geraten: .label sind die Knotennamen (PV/Netz/
                       Haus/...), .secondary-info die Watt-/Prozent-Werte,
                       beide fix auf 12px ohne eigenes !important. Diese Zeile
                       hat KEIN align-items:stretch-Pairing mit Verlauf (s.
                       Kommentar oben), daher niedrigeres Ueberlauf-Risiko als
                       bei der Hamster-Karte. */
                    .label,
                    .secondary-info {
                      font-size: 14px !important;
                    }
                clickable_entities: true
                # Runde Ecken/Hintergrund kommen vom Theme (ha-card-border-radius)
                # plus www/bitgrid_card_shape.js: PFCP clippt seinen Hintergrund
                # nicht selbst auf den Theme-Radius, und card-mod ist hier nicht
                # installiert. Das Modul injiziert den Radius in den Shadow-Root.
                # Farbpalette 24.08.2026 auf die v3-Datenrollen umgestellt
                # (--bgai-*-v3, themes/bitgrid.yaml): PV gelb, Netz violett,
                # Zuhause+Batterie gruen, Geraete eigene Rosé-Rolle. Ersetzt
                # die vorherige eigenstaendige Pastell-Insel — nur in v3, v1/v2
                # behalten ihre eigene PFCP-Instanz unveraendert (separate Datei).
                entities:
                  grid:
                    entity:
                      consumption: sensor.grid_import_w
                      production: sensor.grid_export_w
                    color:
                      consumption: "var(--bgai-grid-v3, #7C83E8)"
                      production: "var(--bgai-grid-v3, #7C83E8)"
                  solar:
                    entity: sensor.pv_power_w
                    color: "var(--bgai-pv-v3, #FFD24A)"
                  battery:
                    entity: sensor.battery_power_flowchart_w
                    state_of_charge: sensor.battery_soc_pct
                    color:
                      consumption: "var(--bgai-home-v3, #3FD07F)"
                      production: "var(--bgai-home-v3, #3FD07F)"
                  home:
                    entity: sensor.house_load_w
                    # "Haus" statt PFCP-Default "Zuhause" (24.08.2026, Nutzer-
                    # Wunsch): einheitlich mit "Hausverbrauch" im Verlauf-Chart
                    # und "PV-Eigenverbrauch" in der Finanz-Bilanz-Karte.
                    name: Haus
                    # Ringfarbe (nicht das Icon, das bleibt weiss) 24.08.2026
                    # auf die Geraete/Rosa-Rolle umgestellt (Nutzer-Wunsch),
                    # analog zu Hausverbrauch im Verlauf-Chart. Batterie
                    # behaelt die Zuhause/Akku-Gruen-Rolle (s.u.). Literales
                    # Hex statt var(--bgai-geraete-v3, ...): mit var() blieb
                    # der Ring gruen, obwohl dieselbe var()-Zeile bei der
                    # "Geraete"-individual-Bubble korrekt Rosa rendert —
                    # Verdacht: PFCPs dedizierter "home"-Knoten verarbeitet
                    # die Farbe JS-seitig (Schatten/Glow o.ae.) und loest
                    # dabei var() nicht auf, waehrend "individual"-Eintraege
                    # den String nur als CSS durchreichen (gleiche Bugklasse
                    # wie apexcharts-card, s.o.). Noch nicht am Live-Dashboard
                    # verifiziert, nur die naheliegendste Erklaerung.
                    color: "#C08AD8"
                  # Zwei Miner statt eines Summen-Knotens (gleiche Shelly-Quellen,
                  # aus denen sensor.miner_total_power_w summiert). Die Bubble-Farbe
                  # wird NICHT hier statisch gesetzt, sondern live nach Leistung von
                  # www/bitgrid_card_shape.js eingefärbt (< 500 W grau, 500–1000 W grün,
                  # 1000–1500 W cyan, ab 1500 W orange): das Modul liest den Shelly-Sensor und
                  # überschreibt die PFCP-CSS-Variable --individual-<slot>-color.
                  # color: hier ist nur der Fallback, falls das Modul (noch) nicht
                  # greift — neutrales Grau, damit nichts grell aufblitzt.
                  # Slot-Zuordnung über den Bubble-Namen (span.label).
                  individual:
                    - entity: sensor.shellyplugsg3_dcb4d9c5567c_leistung
                      name: Miner 1
                      icon: mdi:pickaxe
                      color: "#757575"
                      display_zero: false
                      display_zero_tolerance: 25
                    - entity: sensor.shellyplugsg3_d0cf13d86254_leistung
                      name: Miner 2
                      icon: mdi:pickaxe
                      color: "#757575"
                      display_zero: false
                      display_zero_tolerance: 25
                    # Heizstab: keine der sechs Datenrollen trifft zu (kein PV/
                    # Mining/Zuhause/Netz/Geraete/Summe-Konzept) — Farbe bewusst
                    # unveraendert gelassen, siehe Rueckfrage an Nutzer.
                    - entity: sensor.ac_elwa_2_power1_solar
                      name: Heizstab
                      icon: mdi:water
                      color: "#5C9EE2"
                    # Summierte Haushalts-Plugs aus dem Geräte-Tab (Kühlschränke,
                    # Waschmaschine, TV, Büro, Lüftung, Server/NAS/KI-Agent;
                    # packages/devices.yaml). Teilmenge
                    # der Haus-Last, wie die Miner: PFCP zieht das nicht vom
                    # Haus-Knoten ab, die Bubble macht den Anteil nur sichtbar.
                    - entity: sensor.geraete_power_w
                      name: Geräte
                      icon: mdi:power-plug
                      color: "var(--bgai-geraete-v3, #C08AD8)"
                      display_zero: false
                      display_zero_tolerance: 10

          # ═══════════════════════════════════════════════════════════
          # ZEILE 3 LINKS  —  Miner-Steuerung (g3l), gepaart mit Finanzen (g3r).
          # ═══════════════════════════════════════════════════════════
          - type: vertical-stack
            view_layout:
              grid-area: g3l
            # align-self:start wieder da (02.09.2026, zweiter Fehlversuch,
            # Nutzer-Feedback "kaputt, zu viel Padding nach unten"): der
            # flex:1 1 0 + justify-content:space-between-Ansatz in
            # steuerung_quick.yaml sah live trotzdem nicht gut aus — gleiche
            # Lehre wie bei Energiefluss/PFCP am selben Tag (s. dort).
            # Miner-Boxen bleiben bei natuerlicher Hoehe, oben in der Zeile.
            card_mod:
              style: |
                :host {
                  align-self: start !important;
                }
            cards:

              # ── Gruppen-Titel: MINER ─────────────────────────────────────
              - type: custom:button-card
                template: group_header
                icon: mdi:pickaxe
                name: Miner

              # ═══════════════════════════════════════════════════════════
              # STEUERUNG QUICK-ACTION  —  schneller Moduswechsel für beide
              # Miner, ohne Kennzahlen-Panel. views/steuerung_quick.yaml,
              # Header verlinkt in den vollen Steuerung-Tab.
              # ═══════════════════════════════════════════════════════════
              - !include views/steuerung_quick.yaml

          # ═══════════════════════════════════════════════════════════
          # ZEILE 1 RECHTS  —  Wetter (g1r, nur Uhr+Icon + stündlicher
          # Streifen), gepaart mit BitGridAI/Hamster (g1l).
          # ═══════════════════════════════════════════════════════════
          - type: vertical-stack
            view_layout:
              grid-area: g1r
            cards:

              # ── Gruppen-Titel: WETTER ────────────────────────────────────
              - type: custom:button-card
                template: group_header
                icon: mdi:weather-partly-cloudy
                name: Wetter

              # ═══════════════════════════════════════════════════════════
              # WETTER  —  einzige Wetteranzeige im Demo-Layout: Uhr+Icon
              # (clock-weather-card, nur Heute-Bereich) über dem stündlichen
              # Streifen (weather-forecast). 5-Tage-Vorschau und Sonnenstand
              # entfallen hier bewusst (siehe Kopfkommentar).
              # clock-weather-card (HACS: pkissling/clock-weather-card), nur der
              # Heute-Bereich: Icon, aktuelle Lage, Uhr, Datum.
              # Runde Ecken: Theme liefert ha-card-border-radius, aber die Karte
              # clippt ihren Hintergrund nicht selbst darauf, das übernimmt
              # www/bitgrid_card_shape.js (card-mod ist hier nicht installiert).
              # fill-Icons statt animiert: farbig wie der Entwurf, aber leichter
              # für das Wandtablet (Qualitätsziel Nachhaltigkeit/Edge-Schonung).
              # ═══════════════════════════════════════════════════════════
              - type: custom:clock-weather-card
                # zoom-Kommentar s. Hamster-Karte oben.
                card_mod:
                  style: |
                    :host {
                      zoom: min(1, calc(100vh / 1200px)) !important;
                    }
                    /* Padding oben kleiner (02.09.2026, Nutzer-Feedback
                       "oben noch zu viel Padding"): die Karte setzt selbst
                       kein eigenes Padding (styles.ts, github.com/pkissling/
                       clock-weather-card), erbt den HA-Standard von
                       .card-content (16px). Asymmetrisch wie bei den
                       Miner-Karten (steuerung_quick.yaml). */
                    .card-content {
                      padding: 4px 12px 12px 12px !important;
                    }
                    /* Schrift groesser (Nutzer-Wunsch 02.09.2026). Der erste
                       Versuch (div, span) griff nicht: clock-weather-card
                       (pkissling/clock-weather-card) rendert intern keine divs/
                       spans, sondern eigene Pseudo-Tags als Styling-Hooks (s.
                       styles.ts im Quellcode, github.com/pkissling/clock-weather-
                       card). Jetzt gezielt auf die tatsaechlichen Tag-Namen:
                       -center ist die grosse Uhr (Basis 3.5rem, feste height:4rem
                       in der Karte selbst — height hier mit erhoehen, sonst wird
                       die vergroesserte Zeit oben/unten abgeschnitten). */
                    clock-weather-card-today-right-wrap-top,
                    clock-weather-card-today-right-wrap-bottom {
                      font-size: 1.0625em !important;
                    }
                    clock-weather-card-today-right-wrap-center {
                      font-size: 3.57rem !important;
                      height: auto !important;
                    }
                    /* Wetterbeschreibung ("Teils bewoelkt, 19°C") unters Icon
                       statt ueber die Uhrzeit (02.09.2026, Nutzer-Wunsch). Die
                       Karte hat dafuer kein Config-Feld (README komplett
                       geprueft, nur hide_*-Toggles) — echtes DOM-Reordering
                       ist bei dieser Fremd-Karte nicht moeglich, daher per
                       display:contents die Zwischen-Container "aufloesen" und
                       Icon/Beschreibung/Uhr/Datum neu auf ein eigenes 2x2-Grid
                       verteilen. -today ist laut Quellcode (styles.ts,
                       github.com/pkissling/clock-weather-card) der echte
                       Flex-Container fuer Icon-links/Text-rechts. */
                    clock-weather-card-today {
                      display: grid !important;
                      grid-template-columns: 35% 65%;
                      grid-template-rows: auto auto;
                      grid-template-areas: "icon clock" "cond date";
                      align-items: center;
                    }
                    clock-weather-card-today-left {
                      /* width:100% (02.09.2026, Nutzer-Feedback "Icon
                         mittig"): die Karte selbst setzt hier width:35%
                         (war relativ zum urspruenglichen Flex-Container
                         gedacht) — im neuen Grid ist das 35% von der
                         bereits 35% breiten Spalte, macht die Box viel zu
                         schmal und linksbuendig. Die Karten-eigene
                         justify-content:center (styles.ts) zentriert das Icon
                         dann korrekt innerhalb der vollen Zellbreite. */
                      grid-area: icon;
                      width: 100% !important;
                    }
                    /* Icon jetzt per Hoehe begrenzt statt per Breite
                       (02.09.2026, Nutzer-Feedback "oben zu viel Platz"):
                       die Karte selbst gibt dem Icon keine feste Groesse
                       (.grow-img: max-width/max-height:100%) — es fuellte
                       bisher seine eigene Bild-Intrinsic-Hoehe, die groesser
                       war als die Uhr, wodurch die Grid-Zeile "icon|clock"
                       sich an der Icon-Hoehe orientierte und die Uhr mit
                       Luft drumrum mittig sass (s. Kommentar bei
                       align-items:center auf -today weiter oben). Explizite
                       max-height, an die Uhr-Zeilenhoehe angeglichen, statt
                       width-Prozent: die Zeile richtet sich jetzt nach der
                       Uhr, nicht mehr nach dem Icon. */
                    clock-weather-card-today-left .grow-img {
                      width: auto !important;
                      max-height: 7rem !important;
                    }
                    clock-weather-card-today-right,
                    clock-weather-card-today-right-wrap {
                      display: contents !important;
                    }
                    clock-weather-card-today-right-wrap-top {
                      grid-area: cond;
                      text-align: center !important;
                      justify-self: center !important;
                    }
                    clock-weather-card-today-right-wrap-center {
                      grid-area: clock;
                    }
                    clock-weather-card-today-right-wrap-bottom {
                      /* text-align:end aus der Karte selbst (war fuer die
                         rechtsbuendige alte Position gedacht) explizit
                         auf center umgestellt, sonst rutscht das Datum an
                         den rechten Rand der Spalte statt unter die per
                         Flexbox zentrierte Uhrzeit (02.09.2026, Nutzer-
                         Feedback "Datum ist nicht unter der Uhrzeit"). */
                      grid-area: date;
                      text-align: center !important;
                      justify-self: center !important;
                    }
                entity: weather.forecast_home
                sun_entity: sun.sun
                # clock-weather-card-i18n kennt nur Kurz-Codes (de, en, …); 'de-DE'
