                    /* Schrift groesser (Nutzer-Wunsch 02.09.2026). Der erste
                       Versuch (div, span, 1.3em) traf zwar echte divs (dies ist
                       eine eingebaute HA-Karte, kein fremdes Custom-Element wie
                       clock-weather-card), aber em ist hier relativ zum
                       VERERBTEN Font-Size des Elternelements, nicht zum
                       bisherigen eigenen Wert der Karte (--ha-font-size-s/-l) —
                       der Sprung war real, nur zu klein, um aufzufallen. Jetzt
                       direkt auf die tatsaechlichen Klassen aus dem HA-
