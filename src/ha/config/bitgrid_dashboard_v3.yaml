             Inhaltskarten haben ein zusaetzliches zoom:min(1,calc(100vh/1200px))
             (s. u.), das jede Erhoehung wieder verduennt — kompensiert durch
             groessere Basiswerte statt zoom-Formel anzufassen. */
          --bg-fs-label: 0.9375rem;
          --bg-fs-secondary: 1.1875rem;
          --bg-fs-body: 1.375rem;
          --bg-fs-title: 2.125rem;
          /* Neuer Token, nur fuer group_header-Gruppentitel (02.09.2026,
             Nutzer-Wunsch "Ueberschriftgroessen fuer alle Gruppen in jedem
             Tab wie Home"): das geteilte group_header-Template (button_card_
             templates.yaml, auch von v1 genutzt) las bisher --bg-fs-body
             (22px), Home hatte zusaetzlich 6x einen Pro-Karte-Override auf
             1.6875rem (27px) — daher der Groessen-Unterschied zwischen
             Tabs. Einheitlich in allen v3-Views gesetzt, v1 bleibt
             unberuehrt (kennt die Variable nicht, Template faellt dort auf
             --bg-fs-body zurueck). */
          --bg-fs-group-header: 1rem;
        }
    cards:
      # 25.08.2026, Nutzer-Vorgabe: "Echtzeitverlauf und Historie in einem
      # 2er Spaltengrid belassen, aber unter Verbrauch pro Raum soll nur
      # eine Spalte sein und die ganze Breite benutzen dürfen" — dritte
      # Grid-Zeile "full" über beide Spalten hinweg, extra Zeile in
      # grid-template-areas/-rows dafür.
      - type: custom:layout-card
        layout_type: custom:grid-layout
        layout:
          grid-template-columns: minmax(0, 1fr) minmax(0, 1fr)
          grid-template-rows: auto auto
          grid-template-areas: '"left right" "full full"'
          grid-gap: 14px
          padding: 14px
          box-sizing: border-box
        cards:
          - type: vertical-stack
            view_layout:
              grid-area: left
            cards:
              # 25.08.2026, Nutzer-Vorgabe: Abschnittstitel nicht als
              # gekachelte Markdown-Karte, sondern im transparenten
              # Gruppentitel-Stil der übrigen Tabs (z. B. "Haus"/"Garage"
              # im Tab "EnergieInfo", views/geraete.yaml — Karte ohne
              # Hintergrund/Rand/Schatten, Icon + Großbuchstaben-Label).
              - type: custom:button-card
                icon: mdi:flash
                name: Echtzeitverbrauch
                show_state: false
                tap_action:
                  action: none
                styles:
                  card:
                    - background: none
                    - box-shadow: none
                    - border: none
                    - padding: 4px 4px 0
                  grid:
                    - grid-template-areas: '"i n"'
                    - grid-template-columns: min-content 1fr
                    - align-items: center
                  img_cell:
                    - justify-content: start
                    - align-self: center
                  icon:
                    - color: var(--secondary-text-color)
                    - width: 24px
                    - height: 24px
                  name:
                    - font-size: 1rem
                    - font-weight: 700
                    - text-transform: uppercase
                    - letter-spacing: 0.07em
                    - color: var(--secondary-text-color)
                    - justify-self: start
                    - padding-left: 10px
              # 2 Spalten (Nutzer-Vorgabe 25.08.2026, nach anfänglich 3
              # gleich breiten Feldern): links Gesamt, rechts Gerätetyp
              # (7-Zeilen-Liste, von Natur aus am höchsten) — gleicht die
              # Spaltenhöhen besser aus als 3 gleich breite Felder mit viel
              # Leerraum links. Ersetzt die vorherige Zeilenliste (views/
              # echtzeitverbrauch.yaml, Datei bleibt erhalten, aktuell
              # nirgends eingebunden).
              # views/verbrauch_nach_raeumen.yaml (03.09.2026 aus der linken
              # Spalte entfernt, Nutzer-Wunsch): stand vorher gestapelt unter
              # Gesamt, Datei bleibt erhalten, aktuell nirgends eingebunden.
              # custom:layout-card ersetzt durch natives horizontal-stack
              # (02.09.2026, Nutzer-Wunsch "Abstand wie bei den anderen
              # Tabs"): der eigentliche Root Cause war strukturell — ein
              # verschachteltes Fremd-Plugin-layout-card als zweites Element
              # im umgebenden vertical-stack verhaelt sich nachweislich nicht
              # wie eine normale Karte (mehrere margin-top-Werte, 0 bis
              # -16px, aenderten sichtbar nichts). horizontal-stack ist aus
              # derselben nativen Stack-Karten-Familie wie vertical-stack und
              # fuegt sich daher zuverlaessig in dessen Standard-Abstand ein.
              # align-items:flex-start (card_mod) ersetzt das vorherige
              # layout.align-items:start, sonst wuerde horizontal-stacks
              # Default (stretch) die kuerzere linke Spalte auf die Hoehe
              # der laengeren Geraetetyp-Liste rechts ziehen.
              - type: horizontal-stack
                card_mod:
                  style: |
                    :host {
                      align-items: flex-start !important;
                    }
                cards:
                  - !include views/gesamter_echtzeitverbrauch.yaml
                  - !include views/verbrauch_nach_geraetetyp.yaml
          # ── Rechte Spalte: Historie (Verbrauch) ──────────────────────
          # 25.08.2026, Nutzer-Vorgabe: 2 Spalten statt 3×3 — oben links
          # Zeitraum-Umschalter, oben rechts Gesamtenergie, darunter ein
          # Graph pro Raum in derselben Reihenfolge wie im Echtzeitverbrauch-
          # Abschnitt (verbrauch_nach_raeumen_heute.yaml): Untergeschoss,
          # Wohnzimmer, Küche, Schlafzimmer, Büro, Hauswirtschaft. Reine
          # Flächendiagramme ohne Geräte-Liste ("nur graph ohne die anzeigen
          # wo die geräte untendrunter angezeigt werden").
          - type: vertical-stack
            view_layout:
              grid-area: right
            cards:
              # 25.08.2026, Nutzer-Vorgabe (nach mehreren Anläufen mit einem
              # eingebetteten <select> bzw. 2-Spalten-Titel+Dropdown, siehe
              # Git-Historie dieser Datei für die gescheiterten Versuche):
              # Titel wieder normal wie die übrigen Abschnitte (nicht mehr
              # 2-spaltig), Zeitraum-Umschalter als eigener Pfeil-Cycler
              # (gleiches Muster wie der Raum-Umschalter darunter), beides
              # je eine volle Zeile statt einer 2-Spalten-Kopfzeile.
              - type: custom:button-card
                icon: mdi:chart-timeline-variant
                name: Historie
                show_state: false
                tap_action:
                  action: none
                styles:
                  card:
                    - background: none
                    - box-shadow: none
                    - border: none
                    - padding: 4px 4px 0
                  grid:
                    - grid-template-areas: '"i n"'
                    - grid-template-columns: min-content 1fr
                    - align-items: center
                  img_cell:
                    - justify-content: start
                    - align-self: center
                  icon:
                    - color: var(--secondary-text-color)
                    - width: 24px
                    - height: 24px
                  name:
                    - font-size: 1rem
                    - font-weight: 700
                    - text-transform: uppercase
                    - letter-spacing: 0.07em
                    - color: var(--secondary-text-color)
                    - justify-self: start
                    - padding-left: 10px
              - !include views/historie_raeume_cycler.yaml
              - !include views/historie_zeitraum_cycler.yaml

          # ── Volle Breite darunter: Verbrauch nach Räumen (heute) ──────
          - type: vertical-stack
            view_layout:
              grid-area: full
            cards:
              - !include views/verbrauch_nach_raeumen_heute.yaml

