              # gleich breiten Feldern): links Gesamt, rechts Gerätetyp
              # (7-Zeilen-Liste, von Natur aus am höchsten) — gleicht die
              # Spaltenhöhen besser aus als 3 gleich breite Felder mit viel
              # Leerraum links. Ersetzt die vorherige Zeilenliste (views/
              # echtzeitverbrauch.yaml, Datei bleibt erhalten, aktuell
              # nirgends eingebunden).
              # views/verbrauch_nach_raeumen.yaml (03.09.2026 aus der linken
              # Spalte entfernt, Nutzer-Wunsch): stand vorher gestapelt unter
              # Gesamt, Datei bleibt erhalten, aktuell nirgends eingebunden.
              # custom:layout-card ersetzt durch natives horizontal-stack
              # (02.09.2026, Nutzer-Wunsch "Abstand wie bei den anderen
              # Tabs"): der eigentliche Root Cause war strukturell — ein
              # verschachteltes Fremd-Plugin-layout-card als zweites Element
              # im umgebenden vertical-stack verhaelt sich nachweislich nicht
              # wie eine normale Karte (mehrere margin-top-Werte, 0 bis
              # -16px, aenderten sichtbar nichts). horizontal-stack ist aus
              # derselben nativen Stack-Karten-Familie wie vertical-stack und
              # fuegt sich daher zuverlaessig in dessen Standard-Abstand ein.
              # align-items:flex-start (card_mod) ersetzt das vorherige
              # layout.align-items:start, sonst wuerde horizontal-stacks
              # Default (stretch) die kuerzere linke Spalte auf die Hoehe
              # der laengeren Geraetetyp-Liste rechts ziehen.
              # 26.09.2026, Nutzer-Wunsch "damit beide Karten mehr Platz haben":
              # horizontal-stack aufgeloest, Geraetetyp-Liste steht jetzt UNTER
              # dem Tacho, beide in voller Spaltenbreite direkt im umgebenden
              # vertical-stack (gleiche Stack-Familie, Standard-Abstand).
              # Tacho-SVG ist in der Karte auf 480px gedeckelt, sonst wuerde
              # der Halbkreis bei voller Breite die halbe Bildschirmhoehe fuellen.
              # 27.09.2026, Nutzer-Wunsch "aus den zwei Karten eine machen":
              # Tacho und Geraetetyp-Liste liegen jetzt in EINEM Kartenrahmen,
              # getrennt durch eine Linie. Umgesetzt als vertical-stack mit
              # card_mod-Rahmen (gleiches Muster wie die Wetter-Karte oben in
              # dieser Datei und die Automatik-Schwellen-Gruppe), NICHT als eine
              # zusammenkopierte Datei: so bleiben die beiden View-Dateien
              # getrennt wartbar und der lange Tacho-SVG-Code muss nicht
              # dupliziert werden. Beide Kindkarten haben ihren eigenen Rahmen
              # abgelegt (siehe dort), die Trennlinie ist das border-top der
              # zweiten Karte.
              # Punkt-Schluessel-Form (style: {".": |...}) statt style: |, weil
              # vertical-stack-card ein dokumentierter card_mod-Sonderfall ist
              # und border-radius sonst nicht greift (ausfuehrlich begruendet
              # bei der Wetter-Karte weiter oben in dieser Datei).
              - type: vertical-stack
                card_mod:
                  style:
                    ".": |
                      :host {
                        --vertical-stack-card-gap: 0 !important;
                        --stack-card-gap: 0 !important;
                        border-radius: var(--bgai-card-radius-v3) !important;
                      }
                      #root {
                        gap: 0 !important;
                        background: var(--ha-card-background) !important;
                        border-radius: var(--bgai-card-radius-v3) !important;
                        border: var(--bgai-card-border-width-v3) solid var(--bgai-card-border-v3) !important;
                        box-shadow: var(--bgai-card-shadow-v3) !important;
                        overflow: hidden !important;
                      }
                cards:
                  - !include views/gesamter_echtzeitverbrauch.yaml
                  - !include views/verbrauch_nach_geraetetyp.yaml
          # ── Rechte Spalte: Historie (Verbrauch) ──────────────────────
          # 25.08.2026, Nutzer-Vorgabe: 2 Spalten statt 3×3 — oben links
          # Zeitraum-Umschalter, oben rechts Gesamtenergie, darunter ein
          # Graph pro Raum in derselben Reihenfolge wie im Echtzeitverbrauch-
          # Abschnitt (verbrauch_nach_raeumen_heute.yaml): Untergeschoss,
          # Wohnzimmer, Küche, Schlafzimmer, Büro, Hauswirtschaft. Reine
          # Flächendiagramme ohne Geräte-Liste ("nur graph ohne die anzeigen
          # wo die geräte untendrunter angezeigt werden").
          - type: vertical-stack
            view_layout:
              grid-area: right
            cards:
              # 25.08.2026, Nutzer-Vorgabe (nach mehreren Anläufen mit einem
              # eingebetteten <select> bzw. 2-Spalten-Titel+Dropdown, siehe
              # Git-Historie dieser Datei für die gescheiterten Versuche):
              # Titel wieder normal wie die übrigen Abschnitte (nicht mehr
              # 2-spaltig), Zeitraum-Umschalter als eigener Pfeil-Cycler
              # (gleiches Muster wie der Raum-Umschalter darunter), beides
              # je eine volle Zeile statt einer 2-Spalten-Kopfzeile.
              - type: custom:button-card
                template: group_header
                icon: mdi:chart-timeline-variant
                name: Verbrauchsverlauf
              # 16.09.2026, Nutzer-Vorgabe "es soll eine Karte sein": Raum-
              # Umschalter, Chart und Zeitraum-Umschalter standen als drei
              # getrennte Elemente auf der Grastextur, die Umschalter ganz ohne
              # Flaeche. Jetzt eine gemeinsame Huelle, exakt dasselbe Muster wie
              # beim Wetter-Merge im Home-Tab: der Stack traegt Flaeche, Rand und
              # Schatten, die Kinder sind flach (s. views/historie_*.yaml).
              - type: vertical-stack
                card_mod:
                  style: |
                    #root {
                      background: var(--ha-card-background) !important;
                      border-radius: var(--bgai-card-radius-v3) !important;
                      border: var(--bgai-card-border-width-v3) solid var(--bgai-card-border-v3) !important;
                      box-shadow: var(--bgai-card-shadow-v3) !important;
                      overflow: hidden !important;
                      gap: 0 !important;
                      padding: 6px 0 10px 0 !important;
                      box-sizing: border-box !important;
                    }
                cards:
                  - !include views/historie_raeume_cycler.yaml
                  - !include views/historie_zeitraum_cycler.yaml
                  # 25.09.2026, Nutzer-Vorgabe: Geräte-Aufschlüsselung aus
                  # "Verbrauch nach Räumen (heute)" hier als Perioden-Summe
                  # ergänzt (s. Kopfkommentar historie_geraete_liste.yaml).
                  # Zweiter Schritt der Migration (26.09.2026): der Abschnitt
                  # "Verbrauch nach Räumen (heute)" (grid-area "full") wurde
                  # nach Live-Verifikation entfernt, diese Liste deckt die
                  # Geräte-Aufschlüsselung jetzt allein ab. Die zugrunde
                  # liegenden Dateien (verbrauch_nach_raeumen_heute.yaml,
                  # raumkachel_*.yaml, input_boolean.raumkachel_*) bleiben
                  # unangetastet im Repo, nur nirgends mehr eingebunden —
                  # gleiches Muster wie views/echtzeitverbrauch.yaml oder
                  # views/verbrauch_nach_raeumen.yaml an anderer Stelle in
                  # diesem Tab.
                  - !include views/historie_geraete_liste.yaml

