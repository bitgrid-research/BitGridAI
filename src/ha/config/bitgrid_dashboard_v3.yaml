          # live Zustaende, nichts davon ist antippbar-aenderbar. Batterie-
          # waechter nutzt ausschliesslich bestehende Sensoren (sensor.
          # battery_soc_pct, sensor.battery_power_w, binary_sensor.mvp_soc_
          # kritisch_debounced aus packages/mvp_auto.yaml); die Notbremse-
          # Aktiv-Anzeige vergleicht live gegen die links gesetzten Schwellen
          # (input_number.mvp_batt_discharge_*_downgrade_w, R8) direkt per
          # button-card-JS, ohne einen neuen Template-Sensor anzulegen.
          # Lüftung-Info nutzt den bereits vorhandenen Shelly-Plug-Schalter
          # (switch.shellyplusplugs_d4d4daf4eda4, siehe R8/Lüftung-Watchdog
          # weiter oben in mvp_auto.yaml) und sensor.filterpflege_status
          # statt die Filterpflege-Faelligkeitslogik hier zu duplizieren.
          - type: vertical-stack
            view_layout:
              grid-area: r
            cards:
              # ── Saisonale Tabelle (live) ───────────────────────────────
              # 27.09.2026, Nutzer-Wunsch: Tabellenschrift war mit 0.72rem
              # deutlich kleiner als der Rest des Dashboards, jetzt auf den
              # normalen Fliesstext-Token var(--bg-fs-body) (1rem) angehoben,
              # Einleitungssatz 0.9rem -> ebenfalls 1rem, Zellenabstaende von
              # 3px/4px auf 6px/7px mitgewachsen. Spaltenkopf "Nachtstunden"
              # auf "Nacht" gekuerzt (die Einheit steht ohnehin in jedem Wert,
              # z.B. "15,8 h"). Weil table-layout:fixed OHNE Breitenangaben alle
              # neun Spalten gleich breit macht, haette der kuerzere Kopf allein
              # keinen Platz gespart — deshalb zusaetzlich ein colgroup mit
              # inhaltsgerechten Breiten (Nacht 8%, Monat 14%, Block 13%, Rest
              # 8.5-12.5%), das erst den Platzgewinn bringt und den groesseren
              # Zahlen Raum verschafft.
              # 27.09.2026, Nachbesserung nach Live-Befund auf schmalerem Fenster
              # (Tabelle ~665px statt der 769px im Test): "15,8 h" brach zwischen
              # Zahl und Einheit um, "Hausreserve" lief als ein Wort ueber die
              # Spalte hinaus in die Nachbarspalte. Fixes: geschuetztes
              # Leerzeichen (&nbsp;) vor dem h, weicher Trennstrich (&shy;) in
              # "Hausreserve" (bricht nur bei Platzmangel, dann mit Bindestrich),
              # fester <br> in allen zweiwortigen Koepfen, damit sie unabhaengig
              # von der Fensterbreite immer gleich zweizeilig stehen. Nacht- und
              # Monat-Spalte etwas breiter, die zweizeiligen Koepfe brauchen dafuer
              # weniger.
              # 27.08.2026 (ADR 028, dritte Kehrtwende): wieder live aus
              # Grundlast + Kapazitaet berechnet statt fester Zahlen —
              # "die naechtliche Grundlast soll die Automatik betreiben"
              # (Nutzer-Zitat). Rechnet dieselbe Formel wie sensor.
              # mvp_saison_status/automation.mvp_saison_automatik
              # (mvp_auto.yaml) unabhaengig nach. namespace(rows=[]) +
              # join('\n') bewusst so (nicht {% for %} mit Zeilen direkt im
              # Markdown): einzelne {% set %}-Zeilen zwischen Tabellenzeilen
              # hinterliessen sonst Leerzeilen, die GFM-Tabellen brechen
              # (live bestaetigt 27.08.2026, HA trimmt Template-Whitespace
              # offenbar nicht wie angenommen) — mit dieser Methode sind die
              # Zeilenumbrueche echte Daten (Python-join), nicht
              # Template-Whitespace, funktioniert unabhaengig von der
              # Jinja-Umgebungskonfiguration.
              - type: custom:button-card
                template: group_header
                icon: mdi:table
                name: Saisonale Schwellwerte
              # 25.09.2026: von `type: markdown` auf `custom:button-card` umgestellt —
              # Root Cause fuer "gar keine Farbe kommt an" gefunden: HAs Markdown-Karte
              # sanitized nicht nur style="..."-Attribute (das war schon bekannt, s.
              # Historie unten), sondern die live bestaetigt gegen echten Hard-Refresh
              # getestete card_mod-CSS (Grau fuer inaktive Monate, Spaltenfarben,
              # Block-Faerbung ueber b/i/u) griff durchgehend NICHT — die dortige eigene
              # Tabellen-CSS von HA gewinnt die Spezifitaets-Kollision offenbar auch mit
              # !important auf jeder hier versuchten Selektor-Ebene. Button-card
              # rendert sein custom_fields-HTML dagegen ungesanitized (exakt das
              # Muster, das im Dashboard bereits mehrfach fuer JS-generierte Tabellen/
              # Listen genutzt wird, z. B. window.bgGroupHeader weiter oben im
              # Steuerung-Tab) — Farben/Groessen stehen deshalb jetzt direkt als
              # style="..." im zurueckgegebenen HTML, keine CSS-Spezifitaets-Abhaengigkeit
              # mehr. Nutzer-Feedback "eher grau statt nur dimmen" gleich mit umgesetzt:
              # NUR die aktuelle Monatszeile zeigt die vollen Modusfarben (Block +
              # Hausreserve/Eco/Standard/Super), alle anderen elf Zeilen komplett in
              # --disabled-text-color — vorher galt "Spaltenfarbe gewinnt immer gegen
              # Monat" (01.09.2026), das ist mit diesem Redesign bewusst aufgegeben:
              # der Sinn von "grau = nicht aktiv" waere untergraben, wenn elf graue
              # Zeilen trotzdem bunte Zahlen zeigen.
              - type: custom:button-card
                show_name: false
                show_icon: false
                show_state: false
                styles:
                  card:
                    # 17.10.2026: fuellt die Spaltenhoehe (Karten nebeneinander buendig, www/bitgrid_wide.js).
                    - height: 100%
                    - background: var(--ha-card-background)
                    - border-radius: var(--bgai-card-radius-v3)
                    - padding: 8px 14px
                    - overflow: hidden
                  grid:
                    - grid-template-areas: '"body"'
                    - grid-template-columns: 1fr
                    # 18.10.2026: Inhalt fuellt die Karte (Tabelle waechst, s. flex:1 an <table>),
                    # statt in der Mitte zu schweben (~70 px Leerraum ueber der Formel).
                    - grid-template-rows: 1fr
                    - align-items: stretch
                  custom_fields:
                    body:
                      - width: 100%
                      - height: 100%
                      - display: flex
                      - flex-direction: column
                      - justify-self: stretch
                      - box-sizing: border-box
                      # 25.09.2026, Fix nach Live-Befund "Text wird abgeschnitten":
                      # button-card setzt auf custom_fields per Default white-space:
                      # nowrap + overflow:hidden (fuer kurze Labels gedacht), das hat
                      # sowohl den Einleitungssatz nach wenigen Worten abgeschnitten
                      # als auch (in Kombination mit nowrap auf th/td unten) die
                      # Tabelle ueber die Kartenbreite hinaus getrieben. Explizit
                      # zurueckgesetzt.
                      - white-space: normal
                      - overflow: visible
                      - text-overflow: clip
                custom_fields:
                  body: >
                    [[[
                      const nsStunden = {1:15.75,2:14.5833,3:12.9667,4:11.0667,5:9.3167,6:8.0,7:8.8167,8:10.5,9:12.3167,10:14.1333,11:15.5167,12:15.85};
                      const monate = {1:'Januar',2:'Februar',3:'März',4:'April',5:'Mai',6:'Juni',7:'Juli',8:'August',9:'September',10:'Oktober',11:'November',12:'Dezember'};
                      const gw = parseFloat(states['input_number.mvp_night_baseload_w']?.state) || 535;
                      const kk = parseFloat(states['input_number.battery_capacity_kwh']?.state) || 12.5;
                      // Lab-Replay (17.10.2026): Monat des abgespielten Tages
                      // (sensor.lab_sim_profile gibt es nur im Lab), sonst heute.
                      const simDayS = states['input_boolean.simulation_mode']?.state === 'on'
                        ? (states['sensor.lab_sim_profile']?.state || '') : '';
                      const curMonth = /^\d{4}-\d{2}-\d{2}$/.test(simDayS)
                        ? parseInt(simDayS.slice(5, 7), 10) : new Date().getMonth() + 1;
                      const gray = 'var(--disabled-text-color, #6b6b6b)';
                      const white = 'var(--primary-text-color)';
                      const ecoC = 'var(--bg-color-eco, #4CAF50)';
                      const stdC = 'var(--bg-color-standard, #26C6DA)';
                      const supC = 'var(--bg-color-super, #F7931A)';
                      const resC = 'var(--bg-color-reserve, #EF5350)';
                      const th = (label, color) => `<th style="text-align:right;padding:6px 4px;color:${color || white};border:1px solid rgba(255,255,255,0.12);">${label}</th>`;
                      let rows = '';
                      for (let m = 1; m <= 12; m++) {
                        const h = nsStunden[m];
                        const hS = h.toFixed(1).replace('.', ',') + '&nbsp;h';
                        const rp = kk > 0 ? (gw * h / 1000 / kk * 100) : 100;
                        const sp = Math.min(15 + rp, 95);
                        const isNow = m === curMonth;
                        const stdOffRaw = sp + 20, stdRaw = sp + 25, supOffRaw = sp + 35, supRaw = sp + 40;
                        const stdOffS = stdRaw <= 100 ? Math.round(stdOffRaw) + '%' : '—';
                        const stdS = stdRaw <= 100 ? Math.round(stdRaw) + '%' : '—';
                        const supOffS = supRaw <= 100 ? Math.round(supOffRaw) + '%' : '—';
                        const supS = supRaw <= 100 ? Math.round(supRaw) + '%' : '—';
                        let blockName, blockColor;
                        if (supRaw <= 100) { blockName = 'Voll'; blockColor = supC; }
                        else if (stdRaw <= 100) { blockName = 'Eco/Std'; blockColor = stdC; }
                        else { blockName = 'Nur Eco'; blockColor = ecoC; }
                        const r1S = Math.round(sp) + '%';
                        const r7S = Math.round(Math.min(sp + 10, 100)) + '%';
                        const weight = isNow ? '700' : '400';
                        const size = isNow ? '1.08em' : '1em';
                        const td = (val, color, align) => `<td style="text-align:${align || 'right'};padding:10px 4px;color:${isNow ? (color || white) : gray};font-weight:${weight};font-size:${size};white-space:${align === 'left' ? 'nowrap' : 'normal'};border:1px solid rgba(255,255,255,0.08);">${val}</td>`;
                        rows += `<tr>${td(monate[m], white, 'left')}${td(hS)}${td(blockName, blockColor)}${td(r1S, resC)}${td(r7S, ecoC)}${td(stdS, stdC)}${td(stdOffS, stdC)}${td(supS, supC)}${td(supOffS, supC)}</tr>`;
                      }
                      // 27.09.2026, Nutzer-Wunsch "damit man die Rechnung versteht",
                      // danach "uff Bleiwueste": erste Fassung erklaerte den Rechenweg
                      // in vier Fliesstext-Absaetzen, das war zu viel zum Lesen. Jetzt
                      // drei scanbare Zeilen: eine Formelzeile mit den beiden
                      // editierbaren Werten als Chips, eine Chip-Reihe mit den festen
                      // Aufschlaegen (Farben = Spaltenfarben der Tabelle), eine kleine
                      // Fussnote mit "ueber 100%" plus durchgerechnetem Beispiel.
                      // Alle Zahlen live aus denselben Variablen wie die Tabellenzeilen,
                      // keine fest eingetippten Werte im Text.
                      const hNow = nsStunden[curMonth];
                      const kwhNow = gw * hNow / 1000;
                      const antNow = kk > 0 ? (kwhNow / kk * 100) : 100;
                      const resNow = Math.min(15 + antNow, 95);
                      const n1 = (v) => v.toLocaleString('de-DE', {minimumFractionDigits: 1, maximumFractionDigits: 1});
                      const n0 = (v) => Math.round(v).toLocaleString('de-DE');
                      const chip = (txt, color, strong) => `<span style="display:inline-flex;align-items:center;padding:2px 9px;border-radius:9px;background:rgba(255,255,255,0.07);border:1px solid ${color};color:${white};font-size:0.88em;font-weight:${strong ? 700 : 600};white-space:nowrap;">${txt}</span>`;
                      const op = (t) => `<span style="opacity:0.75;">${t}</span>`;
                      return `<div style="font-size:var(--bg-fs-body, 1rem);line-height:1.5;color:${white};margin-bottom:10px;">
                          <div style="display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:7px;margin-bottom:7px;">
                            ${chip(n0(gw) + ' W', white, true)}${op('×')}${op('Nachtstunden')}${op('÷')}${chip(n1(kk) + ' kWh', white, true)}${op('+ 15')}${op('=')}${chip('Hausreserve', resC, true)}
                          </div>
                          <div style="display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px;margin-bottom:7px;">
                            ${op('darüber:')}${chip('Eco ab +10', ecoC)}${chip('Standard ab +25', stdC)}${chip('Standard endet +20', stdC)}${chip('Super ab +40', supC)}${chip('Super endet +35', supC)}
                          </div>
                          <div style="text-align:center;font-size:0.88em;opacity:0.8;">
                            Über 100 % = im Monat nicht erreichbar (—), daraus folgt <strong>Block</strong>.
                          </div>
                          <div style="text-align:center;font-size:0.88em;opacity:0.8;margin-top:3px;white-space:nowrap;">
                            ${monate[curMonth]}: ${n1(kwhNow)}&nbsp;kWh ÷ ${n1(kk)}&nbsp;kWh = ${n0(antNow)}&nbsp;% + 15 = <strong>${n0(resNow)}&nbsp;%</strong>
                          </div>
                        </div>
                        <table style="width:100%;flex:1 1 auto;table-layout:fixed;border-collapse:collapse;font-size:var(--bg-fs-body, 1rem);">
                          <colgroup>
                            <col style="width:14%"><col style="width:9.5%"><col style="width:12.5%">
                            <col style="width:11%"><col style="width:8.5%"><col style="width:11.5%">
                            <col style="width:11%"><col style="width:11%"><col style="width:11%">
                          </colgroup>
                          <thead><tr>
                            ${th('Monat').replace('text-align:right', 'text-align:left')}
                            ${th('Nacht')}
                            ${th('Block')}
                            ${th('Haus&shy;reserve', resC)}
                            ${th('Eco<br>ab', ecoC)}
                            ${th('Std.<br>ab', stdC)}
                            ${th('Std.<br>endet', stdC)}
                            ${th('Super<br>ab', supC)}
                            ${th('Super<br>endet', supC)}
                          </tr></thead>
                          <tbody>${rows}</tbody>
                        </table>`;
                    ]]]
