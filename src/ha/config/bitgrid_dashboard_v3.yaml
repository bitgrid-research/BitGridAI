    # Formale v3-Palette 24.08.2026 (Nutzer-Vorgabe): "Verlauf oben links"
    # -> "Verlauf unten rechts" = 135deg (to bottom right). Ersetzt jede
    # vorherige Iteration. Grund laut Vorgabe: Gruen ist Statusfarbe fuer
    # Zuhause/Akku (--bgai-home-v3), ein gruenstichiger Hintergrund senkt
    # dort den Kontrast.
    # 12.09.2026, Nutzer-Vorgabe: Pixel-Grastextur (docs/media/design/
    # hintergrund.png, als bg_grass.jpg re-encodiert 127KB statt 1,3MB PNG,
    # Qualitätsziel Nachhaltigkeit/Edge-Schonung fürs Wandtablet) statt reinem
    # Verlauf. Erst center/cover versucht, auf dem Wandtablet sichtbar
    # hochskaliert/unscharf. Dann auf repeat in Originalgroesse (1774x887px)
    # umgestellt — sah auf dem Tablet-Viewport IMMER NOCH wie ein einzelnes
    # grosses Bild aus, weil bei der Bildschirmbreite nur ~1,5 Kacheln
    # nebeneinander passten (kein Skalierungsfehler mehr, sondern schlicht
    # eine zu grosse Kachel fuer "unendliches Muster"-Optik). Explizite
    # background-size verkleinert die Kachel auf 320x160px (Seitenverhaeltnis
    # 2:1 beibehalten), damit sichtbar mehrere Wiederholungen nebeneinander
    # erscheinen. Verlauf bleibt als zweiter Background-Layer darunter
    # (CSS-Mehrfach-Background) — reiner Ladefehler-Fallback.
    # 13.09.2026, Nutzer-Wunsch Tag/Nacht-Wechsel: natives background: kennt
    # kein Templating, daher Bild+Verlauf hier entfernt und stattdessen unten
    # im ohnehin vorhandenen view-card_mod (:host-Block) per Jinja auf
    # sun.sun umgeschaltet (reaktiv, kein Reload noetig). Nacht-Kachel
    # bg_grass_night.jpg ist analog zu bg_grass.jpg aus hintergrund_night.png
    # re-encodiert (Pillow, quality=85, optimize=True, ~122KB), gleiches
    # Nachhaltigkeits-/Edge-Kriterium wie beim Tagbild.
    # 26.09.2026, Nutzer-Vorgabe: beide Kacheln neu aus hintergrund_32_ohne_blume(_night).png
    # (1842x854, gleiche Pillow-Encodierung, ~170KB). Seitenverhaeltnis ist nicht mehr 2:1,
    # deshalb background-size 800px auto statt 800px 400px (sonst gestaucht).
    panel: true
    # View-scoped Flaechen-/Textfarben (24.08.2026, Nutzer-Vorgabe): CSS-
    # Custom-Properties auf :host der View gesetzt, vererben sich an alle
    # Karten darunter (die bereits var(--card-background-color) etc.
    # referenzieren) — ohne zweites Theme, ohne v1/v2 zu beruehren. Sidebar/
    # Topbar liegen ausserhalb dieses DOM-Teilbaums und bleiben bewusst
    # unveraendert (Nutzer-Entscheidung 24.08.2026).
    # Keine View-scoped Design-Overrides mehr (16.09.2026): sie waren
    # wirkungslos, weil HA die Theme-Variablen als Inline-Style auf genau
    # dieses View-Element schreibt und damit jede card_mod-":host"-Regel
    # schlaegt. Alle Designwerte stehen jetzt an der Wurzel in
    # themes/bitgrid.yaml.
    cards:
      - type: custom:layout-card
        layout_type: custom:grid-layout
        layout:
          # 16.09.2026, Nutzer-Vorgabe "Tabelle rechts, Automatik links":
          # vorher lief das Grid auf Auto-Placement, und die unsichtbare
          # Hintergrundkarte belegte die erste Zelle. Der Kommentar dort
          # ("position:fixed loest die Karte aus dem Grid-Fluss") gilt fuer die
          # ha-card, NICHT fuer deren Grid-Item, dadurch rutschte alles eine
          # Zelle weiter. Jetzt benannte Areas wie im Home-Tab; die
          # Hintergrundkarte teilt sich "l" mit dem linken Stapel und
          # ueberlagert ihn folgenlos (fixed, z-index -1).
          grid-template-columns: minmax(0, 1fr) minmax(0, 1fr)
          grid-template-areas: '"l r"'
          grid-gap: 14px
          padding: 14px
          box-sizing: border-box
        cards:
          # Unsichtbare Vollbild-Hintergrundkarte, Tag/Nacht via sun.sun
          # (Begruendung/Funktionsweise: s. Tab "BitGridAI", identisches
          # Muster). Kein view_layout noetig: dieses Grid kennt keine
          # benannten Areas, Auto-Placement reicht (position:fixed loest die
          # Karte ohnehin aus dem Grid-Fluss).
          - type: markdown
            view_layout:
              grid-area: l
            content: " "
            card_mod:
              style: |
                ha-card {
                  position: fixed;
                  inset: 0;
                  z-index: -1;
                  border: none;
                  box-shadow: none;
                  border-radius: 0;
                  {% if is_state('sun.sun', 'above_horizon') %}
                  background: url('/local/bg_grass.jpg?v=20260926') repeat 0 0 / 800px auto, linear-gradient(135deg, #5F8F4A 0%, #3F6B2E 100%);
                  {% else %}
                  background: url('/local/bg_grass_night.jpg?v=20260926') repeat 0 0 / 800px auto, linear-gradient(135deg, #16232f 0%, #0d151c 100%);
                  {% endif %}
                }
          # ── LINKS: alles, was antippbar/aenderbar ist ────────────────────
          # 26.08.2026, Nutzer-Vorgabe: saemtliche Einstellungen (vorher auf
          # beide Spalten verteilt) stehen jetzt geschlossen links. Rechts
          # bleiben nur noch reine Live-Status-Infos ohne input_*-Entities.
          # Abschnittstitel nutzen ab jetzt das Template `group_header`
          # (button_card_templates.yaml) statt einer eigenen markdown-Karte:
          # dieselbe transparente "Titel ueber der Karte"-Optik wie beim
          # bestehenden Poolertraege-Gruppentitel weiter oben im Dashboard,
          # damit der Titel nicht wie eine eigene Box aussieht bzw. mit der
          # Inhalts-Karte darunter verschmilzt (Nutzer-Feedback).
          - type: vertical-stack
            view_layout:
              grid-area: l
            cards:
              # 26.08.2026: die sechs SoC-Schwellen (Hochschalten/Runter-
              # schalten, vormals hier editierbar) stehen seither NICHT mehr
              # in den Einstellungen — sie werden von automation.
              # mvp_saison_automatik (mvp_auto.yaml, feste 12-Monats-Tabelle)
              # gesetzt und sind nur noch auf dem Steuerung-Tab sichtbar
              # (Block + Tabelle), Nutzer-Vorgabe. Bearbeiten hier haette
              # ohnehin nur bis zum naechsten Automatik-Lauf gehalten.
              # 27.08.2026, Nutzer-Wunsch: Akku-Notbremse/Sicherheit/Nacht-
              # Sperre/Lueftung sind ebenfalls raus (waren die letzten vier
              # Gruppen ohne Automatik-Ueberschreibung, aber Bearbeiten ist
              # jetzt nicht mehr redundant zu Steuerung noetig). Editieren
              # geht ab jetzt ausschliesslich ueber die Zeilen im Steuerung-
              # Tab (echte button-cards mit tap_action: more-info, Template
              # settings_row/settings_row_icon — nicht mehr per onclick in
              # generiertem HTML, das verschluckte HAs CSP stumm).
              #
              # Wieder eingefuehrt 27.08.2026 (ADR 028, dritte Kehrtwende):
              # die Saison-Automatik ist wieder Live-Formel statt fester
              # Tabelle, diese beiden Werte sind wieder die einzigen echten
              # Stellschrauben dafuer. "Saisonale Tabelle" rechts spiegelt
              # sie live, siehe dort.
              - type: custom:button-card
                template: group_header
                icon: mdi:calendar-sync
                name: Saisonsteuerung
              # 25.09.2026, Nutzer-Wunsch "Karte um die Bubbles": statt custom:
              # layout-card jetzt vertical-stack mit card_mod-Rahmen, exakt
              # dasselbe Muster wie die Hochstufen/Runterstufen-Gruppen im
