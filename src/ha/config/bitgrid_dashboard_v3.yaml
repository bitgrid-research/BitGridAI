  # TAB: HEIZUNG  —  zwei Tabellen nebeneinander, Öl-Heizung (links) und
  # Heizstab/AC-ELWA-2 (rechts). Neu 26.08.2026, Nutzer-Wunsch.
  # Kein direkter Öl-/Brennwertsensor in HA eingebunden: die linke Tabelle
