  # gewandert — siehe dort. Hier bleiben nur die beiden Grundriss-Bilder).
  # Haus: picture-elements auf www/grundriss/base.png, State-Overlays für
  #       Plugs/Sensoren aus packages/devices.yaml (views/floorplan.yaml).
  # Garage: eigener Plan/Asset, State-Overlays aus packages/devices.yaml +
  #       avalonq_miner1/2.yaml (views/garage_floorplan.yaml).
  # ═══════════════════════════════════════════════════════════════════════
  - title: Grundriss
    path: floorplan
    icon: mdi:floor-plan
    show_icon_and_title: true
    theme: BitGrid v3
    # Eigener Verlauf nur fuer v3/Demo (v1/v2 nutzen weiterhin unveraendert
    # das gemeinsame BitGridAI-Theme, themes/bitgrid.yaml lovelace-background).
    # Formale v3-Palette 24.08.2026 (Nutzer-Vorgabe): "Verlauf oben links"
    # -> "Verlauf unten rechts" = 135deg (to bottom right). Ersetzt jede
    # vorherige Iteration. Grund laut Vorgabe: Gruen ist Statusfarbe fuer
    # Zuhause/Akku (--bgai-home-v3), ein gruenstichiger Hintergrund senkt
    # dort den Kontrast.
    # 12.09.2026, Nutzer-Vorgabe: Pixel-Grastextur (docs/media/design/
    # hintergrund.png, als bg_grass.jpg re-encodiert 127KB statt 1,3MB PNG,
    # Qualitätsziel Nachhaltigkeit/Edge-Schonung fürs Wandtablet) statt reinem
    # Verlauf. Erst center/cover versucht, auf dem Wandtablet sichtbar
    # hochskaliert/unscharf. Dann auf repeat in Originalgroesse (1774x887px)
    # umgestellt — sah auf dem Tablet-Viewport IMMER NOCH wie ein einzelnes
    # grosses Bild aus, weil bei der Bildschirmbreite nur ~1,5 Kacheln
    # nebeneinander passten (kein Skalierungsfehler mehr, sondern schlicht
    # eine zu grosse Kachel fuer "unendliches Muster"-Optik). Explizite
    # background-size verkleinert die Kachel auf 320x160px (Seitenverhaeltnis
    # 2:1 beibehalten), damit sichtbar mehrere Wiederholungen nebeneinander
    # erscheinen. Verlauf bleibt als zweiter Background-Layer darunter
    # (CSS-Mehrfach-Background) — reiner Ladefehler-Fallback.
    # 13.09.2026, Nutzer-Wunsch Tag/Nacht-Wechsel: natives background: kennt
    # kein Templating, daher Bild+Verlauf hier entfernt und stattdessen unten
    # im ohnehin vorhandenen view-card_mod (:host-Block) per Jinja auf
    # sun.sun umgeschaltet (reaktiv, kein Reload noetig). Nacht-Kachel
    # bg_grass_night.jpg ist analog zu bg_grass.jpg aus hintergrund_night.png
    # re-encodiert (Pillow, quality=85, optimize=True, ~122KB), gleiches
    # Nachhaltigkeits-/Edge-Kriterium wie beim Tagbild.
    # 26.09.2026, Nutzer-Vorgabe: beide Kacheln neu aus hintergrund_32_ohne_blume(_night).png
    # (1842x854, gleiche Pillow-Encodierung, ~170KB). Seitenverhaeltnis ist nicht mehr 2:1,
    # deshalb background-size 800px auto statt 800px 400px (sonst gestaucht).
    panel: true
    # View-scoped Flaechen-/Textfarben (24.08.2026, Nutzer-Vorgabe): CSS-
    # Custom-Properties auf :host der View gesetzt, vererben sich an alle
    # Karten darunter (die bereits var(--card-background-color) etc.
    # referenzieren) — ohne zweites Theme, ohne v1/v2 zu beruehren. Sidebar/
    # Topbar liegen ausserhalb dieses DOM-Teilbaums und bleiben bewusst
    # unveraendert (Nutzer-Entscheidung 24.08.2026).
    # Keine View-scoped Design-Overrides mehr (16.09.2026): sie waren
    # wirkungslos, weil HA die Theme-Variablen als Inline-Style auf genau
    # dieses View-Element schreibt und damit jede card_mod-":host"-Regel
    # schlaegt. Alle Designwerte stehen jetzt an der Wurzel in
    # themes/bitgrid.yaml.
    cards:
      - type: vertical-stack
        card_mod:
          style: |
            :host {
              padding: 14px;
              box-sizing: border-box;
              overflow-y: hidden;
            }
        cards:
          # Unsichtbare Vollbild-Hintergrundkarte, Tag/Nacht via sun.sun
          # (Begruendung/Funktionsweise: s. Tab "BitGridAI", identisches Muster).
          # Kein view_layout noetig: dieser vertical-stack hat kein Grid.
          - type: markdown
            content: " "
            card_mod:
              style: |
                ha-card {
                  position: fixed;
                  inset: 0;
                  z-index: -1;
                  border: none;
                  box-shadow: none;
                  border-radius: 0;
                  {% if is_state('sun.sun', 'above_horizon') %}
                  background: url('/local/bg_grass.jpg?v=20260926') repeat 0 0 / 800px auto, linear-gradient(135deg, #5F8F4A 0%, #3F6B2E 100%);
                  {% else %}
                  background: url('/local/bg_grass_night.jpg?v=20260926') repeat 0 0 / 800px auto, linear-gradient(135deg, #16232f 0%, #0d151c 100%);
                  {% endif %}
                }

          # ── Umschalter Obergeschoss/Untergeschoss ───────────────────────
          # Ersetzt die frühere Übereinander-Stapelung (Haus 16:9 + Garage
          # 16:21 hochkant = sehr lange Scroll-Seite, Nutzer-Feedback
          # 24.08.2026). Ganze Kopfzeile tappbar (nicht nur die Pfeile),
          # toggelt input_boolean.fp_view_garage (packages/devices.yaml,
          # Entity-ID unveraendert gelassen, nur die Anzeige-Labels
          # umbenannt 26.08.2026 — passt zur bestehenden Konvention, die
          # Keller+Garage im Raum-Modell bereits zu "Untergeschoss"
          # zusammenlegt, siehe packages/devices.yaml Z.596).
          # Bei genau 2 Ansichten tun beide Pfeile dasselbe (Vor/Zurück =
          # Toggle), rein optische Navigations-Metapher.
          - type: custom:button-card
            show_name: false
            show_icon: false
            show_state: false
            entity: input_boolean.fp_view_garage
            tap_action:
              action: toggle
            styles:
              card:
                - background: none
                - box-shadow: none
                - border: none
                - padding: 4px 4px 0
              grid:
                - grid-template-areas: '"body"'
                - grid-template-columns: 1fr
              custom_fields:
                body:
                  - width: 100%
                  - justify-self: stretch
            custom_fields:
              body: >
                [[[
                  const showGarage = entity.state === 'on';
                  const icon = showGarage ? 'mdi:home-floor-b' : 'mdi:home-floor-a';
                  const label = showGarage ? 'Untergeschoss' : 'Obergeschoss';
                  // 12.09.2026, Nutzer-Wunsch: dieser Umschalter sitzt direkt auf der
                  // gruenen Grastextur (View-Hintergrund), nicht auf einer Karte — bewusst
                  // literale Farbe statt --secondary-text-color (das bleibt hell, fuer
                  // den dunkelblauen Kartenhintergrund ueberall sonst im Dashboard).
                  // Erst Schwarz mit hellem Halo versucht (Textur hat helle+dunkle
                  // Gruentoene, eine Flachfarbe allein hat nirgends garantierten
                  // Kontrast) — auf Nutzer-Wunsch auf Weiss mit dunklem Schatten
                  // gedreht, gleiches Prinzip (Kontrast-Rand statt Flachfarbe),
                  // nur invertiert. drop-shadow-Filter fuers SVG-Icon, da text-shadow
                  // dort nicht greift.
                  const halo = 'filter: drop-shadow(0 0 2px rgba(0,0,0,0.85)) drop-shadow(0 0 2px rgba(0,0,0,0.85));';
                  return `
                    <div style="display:flex;align-items:center;justify-content:center;gap:22px;padding:6px 0;cursor:pointer;">
                      <ha-icon icon="mdi:chevron-left" style="--mdc-icon-size:36px;color:#FFFFFF;${halo}"></ha-icon>
                      <div style="display:flex;align-items:center;gap:12px;min-width:170px;justify-content:center;">
                        <ha-icon icon="${icon}" style="--mdc-icon-size:30px;color:#FFFFFF;${halo}"></ha-icon>
                        <span style="font-size:1.4875rem;font-weight:700;text-transform:uppercase;letter-spacing:0.07em;color:#FFFFFF;text-shadow:0 0 4px rgba(0,0,0,0.85),0 0 4px rgba(0,0,0,0.85),0 0 4px rgba(0,0,0,0.85);">${label}</span>
                      </div>
                      <ha-icon icon="mdi:chevron-right" style="--mdc-icon-size:36px;color:#FFFFFF;${halo}"></ha-icon>
                    </div>`;
                ]]]

          - type: conditional
            conditions:
              - entity: input_boolean.fp_view_garage
                state: "off"
            # 26.09.2026 spaet, Nutzer-Wunsch: Legenden (floorplan_legende.yaml,
            # garage_floorplan_legende.yaml) aus dem Grundriss-Tab entfernt, das
            # 3:1-Raster damit ebenfalls. Grundriss wieder volle Breite.
            card: !include views/floorplan.yaml

          - type: conditional
            conditions:
              - entity: input_boolean.fp_view_garage
                state: "on"
            card: !include views/garage_floorplan.yaml

