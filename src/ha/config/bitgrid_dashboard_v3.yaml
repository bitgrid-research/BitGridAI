                      icon:
                        - color: "var(--primary-text-color)"
                      label:
                        - color: "var(--primary-text-color)"
                  - type: custom:button-card
                    template: [settings_row, settings_row_icon, settings_row_soft]
                    entity: input_number.battery_capacity_kwh
