          # BitcoinInfo/EnergieInfo angeglichen (dort steckt der Gruppentitel
          # immer im selben vertical-stack wie die Karte darunter, mit dessen
          # eigenem, kleineren Standard-Abstand) statt eine eigene "tl/tr"-
