title: BitGridAI v3
# Hinweis (16.09.2026): HA cached den Parse dieses Dashboards und prueft dafuer
# die Zeitstempel der !include-Dateien offenbar NICHT. Wer nur eine Datei unter
# views/ deployt, sieht die Aenderung erst, nachdem auch diese Wurzeldatei
# angefasst wurde (oder nach einem Neustart). Beim Deploy einzelner Views also
# hier eine Zeile aendern. Zuletzt angefasst: 27.09.2026 (View-Zoom 0.8 auf
# den sechs Home-Spalten, Hamster-Texte gegen packages/mvp_auto.yaml
# faktenkorrigiert; davor: Divider-Linien, Ueberschriftgroessen,
# Regelschwellen-Legende, REGELWERK-Titel entfernt).

# Geteilte custom:button-card-Templates (miner_header/miner_btn/...). Nötig,
# weil der Steuerung-Tab views/miner_controls.yaml per !include einbindet, das
# diese Templates referenziert. button_card_templates ist ein Pro-Dashboard-
# Root-Key, fehlt er hier, rendert button-card "Konfigurationsfehler".
# Gemeinsame Quelle mit bitgrid_dashboard_v1.yaml: button_card_templates.yaml.
button_card_templates: !include button_card_templates.yaml

# ═══════════════════════════════════════════════════════════════════════
# Kiosk-Home-Screen für Wandtablet, zwei Spalten, je ein eigener vertical-
# stack (Hoehe pro Spalte entkoppelt, keine geteilten Grid-Zeilen). Höhe
# nicht auf einen Bildschirm geklemmt: die Karten bekommen ihre natürliche
# Höhe, die Seite scrollt nach unten (wie Tab 2).
#
#        LINKS                      RECHTS
#   ┌──────────────────────┐   ┌──────────────────────┐
#   │ BITGRIDAI              │   │ WETTER                │
#   │  Hamster-Erklärung   │   │  Wetter (Uhr+Stunden) │
#   ├──────────────────────┤   │                        │
#   │ ENERGIEFLUSS            │   │                        │
#   │     Energiefluss     │   │                        │
#   ├──────────────────────┤   ├──────────────────────┤
#   │ MINER                 │   │ VERLAUF (HEUTE)        │
#   │ Steuerung Quick-Action│   │   Verlauf-Chart        │
#   │                        │   ├──────────────────────┤
#   │                        │   │ FINANZEN               │
#   │                        │   │   Finanz-Bilanz        │
#   └──────────────────────┘   └──────────────────────┘
#
# Designprinzipien:
#   - 2-Spalten-Grid, beide Spalten 50% breit (minmax(0,1fr): verhindert,
#     dass der breite Miner-Quick-Action-Block seine Spalte sprengt, gleiche
#     Technik wie im Steuerung-Tab). Gruppen-Titelzeilen (BitGridAI/Energiefluss/Miner links,
#     Wetter/Verlauf (heute)/Finanzen rechts, template: group_header aus
#     button_card_templates.yaml) wieder eingeführt (31.08.2026, Nutzer-
#     Wunsch): anders als bei tl/tr in den übrigen Tabs stehen sie hier als
#     eigene Karte INNERHALB des jeweiligen vertical-stacks, direkt vor der
#     Karte(-ngruppe), die sie beschriften — kein gemeinsames Grid-Row-
#     Matching zwischen links und rechts nötig.
#   - Paarweises Grid-Row-Matching (Nutzer-Wunsch 31.08.2026, ersetzt die
#     vorherige Entkopplung): 3 Zeilen à 2 Spalten, jedes Paar (BitGridAI↔
#     Wetter, Energiefluss↔Verlauf, Miner↔Finanzen) sitzt in einer eigenen
#     Grid-Zeile und wird per align-items:stretch auf gleiche Höhe gebracht.
#     Ein früherer Versuch genau das (23.08.2026, Miner-Quick-Action ↔
#     damaliger Partner sowie Finanz-Bilanz ↔ Energiefluss) wurde verworfen,
#     weil reines Stretch bei blockgebundenem Inhalt hässlich aussah: leerer
#     Raum unter den Miner-Buttons, künstlich überdehnt wirkende Balken.
#     Diesmal zusätzlich abgefedert: die jeweils wachsende Karte bekommt
#     flex:1 (card_mod :host) UND zentriert ihren Inhalt statt ihn oben
#     anzupinnen bzw. zu verzerren — Balken-SVG behält sein viewBox-
#     Seitenverhältnis (nur Positionierung ändert sich), Miner-Buttons werden
#     vertikal zentriert. Nebeneffekt: die Gesamthöhe der Ansicht ist jetzt
#     strukturell ≥ vorher (Summe der Zeilen-Maxima statt Maximum der
#     Spalten-Summen) — die zoom-Kalibrierung weiter unten (1050px) ist
#     deshalb nur eine hochgeschätzte Annahme und braucht einen Live-Check.
#   - Rechts nur noch EIN Wetter-Baustein (Uhr+Icon + stündlicher Streifen),
#     die 5-Tage-Vorschau und der Sonnenstand entfallen im Demo-Layout.
#   - Finanz-Bilanz (views/finanz_bilanz.yaml) und Verlauf-Chart
#     (views/energieverlauf_tag.yaml) sind neu: Sensoren in
#     packages/economics.yaml. Verlauf nutzt custom:apexcharts-card (HACS,
#     lokal installiert) statt raw-SVG, weil die Karte reale Recorder-
#     Historie braucht (kein Cloud-Call). Zeigt den laufenden Tag
#     (00:00–24:00) als drei transluzente Flächen, angelehnt an die
#     Regelschwellen-Optik (Tab "Steuerung").
#   - Steuerung Quick-Action (views/steuerung_quick.yaml): schneller
#     Moduswechsel für beide Miner ohne die vollen Kennzahlen-Panels, Header
#     verlinkt in den Steuerung-Tab.
#   - fester Radius 20px, dunkle Glaskarten erben aus dem Theme BitGridAI;
#     www/bitgrid_card_shape.js clippt die Custom-Cards (inkl. apexcharts-
#     card) auf den Radius
#   - NaN-sicher: 'unavailable' → '—' statt 'NaN' (wichtig nach HA-Restart)
# ═══════════════════════════════════════════════════════════════════════

views:

  # Header-Titel = View-Titel, mittig zentriert via www/bitgrid_wide.js.
  # 26.09.2026: frueher stand hier "BitGridAI - v<semver>", per deploy_ha.sh
  # (stamp_dashboard()) aus pyproject.toml eingespritzt. Auf Nutzer-Wunsch
  # entfernt (Laien-Verstaendlichkeit der Tab-Namen), der Stempel-Mechanismus
  # in deploy_ha.sh ist ersatzlos gestrichen.
  - title: Übersicht
    path: home
    icon: mdi:home
    show_icon_and_title: true
    theme: BitGrid v3
    # Eigener Verlauf nur fuer v3/Demo (v1/v2 nutzen weiterhin unveraendert
    # das gemeinsame BitGridAI-Theme, themes/bitgrid.yaml lovelace-background).
    # Formale v3-Palette 24.08.2026 (Nutzer-Vorgabe): "Verlauf oben links"
    # -> "Verlauf unten rechts" = 135deg (to bottom right). Ersetzt jede
    # vorherige Iteration. Grund laut Vorgabe: Gruen ist Statusfarbe fuer
    # Zuhause/Akku (--bgai-home-v3), ein gruenstichiger Hintergrund senkt
    # dort den Kontrast.
    # 12.09.2026, Nutzer-Vorgabe: Pixel-Grastextur (docs/media/design/
    # hintergrund.png, als bg_grass.jpg re-encodiert 127KB statt 1,3MB PNG,
    # Qualitätsziel Nachhaltigkeit/Edge-Schonung fürs Wandtablet) statt reinem
    # Verlauf. Erst center/cover versucht, auf dem Wandtablet sichtbar
    # hochskaliert/unscharf. Dann auf repeat in Originalgroesse (1774x887px)
    # umgestellt — sah auf dem Tablet-Viewport IMMER NOCH wie ein einzelnes
    # grosses Bild aus, weil bei der Bildschirmbreite nur ~1,5 Kacheln
    # nebeneinander passten (kein Skalierungsfehler mehr, sondern schlicht
    # eine zu grosse Kachel fuer "unendliches Muster"-Optik). Explizite
    # background-size verkleinert die Kachel auf 320x160px (Seitenverhaeltnis
    # 2:1 beibehalten), damit sichtbar mehrere Wiederholungen nebeneinander
    # erscheinen. Verlauf bleibt als zweiter Background-Layer darunter
    # (CSS-Mehrfach-Background) — reiner Ladefehler-Fallback.
    # 13.09.2026, Nutzer-Wunsch Tag/Nacht-Wechsel: natives background: kennt
    # kein Templating, daher Bild+Verlauf hier entfernt und stattdessen unten
    # im ohnehin vorhandenen view-card_mod (:host-Block) per Jinja auf
    # sun.sun umgeschaltet (reaktiv, kein Reload noetig). Nacht-Kachel
    # bg_grass_night.jpg ist analog zu bg_grass.jpg aus hintergrund_night.png
    # re-encodiert (Pillow, quality=85, optimize=True, ~122KB), gleiches
    # Nachhaltigkeits-/Edge-Kriterium wie beim Tagbild.
    # 26.09.2026, Nutzer-Vorgabe: beide Kacheln neu aus hintergrund_32_ohne_blume(_night).png
    # (1842x854, gleiche Pillow-Encodierung, ~170KB). Seitenverhaeltnis ist nicht mehr 2:1,
    # deshalb background-size 800px auto statt 800px 400px (sonst gestaucht).
    panel: true
    # View-scoped Flaechen-/Textfarben (24.08.2026, Nutzer-Vorgabe): CSS-
    # Custom-Properties auf :host der View gesetzt, vererben sich an alle
    # Karten darunter (die bereits var(--card-background-color) etc.
    # referenzieren) — ohne zweites Theme, ohne v1/v2 zu beruehren. Sidebar/
    # Topbar liegen ausserhalb dieses DOM-Teilbaums und bleiben bewusst
    # unveraendert (Nutzer-Entscheidung 24.08.2026).
    # Keine View-scoped Design-Overrides mehr (16.09.2026): sie waren
    # wirkungslos, weil HA die Theme-Variablen als Inline-Style auf genau
    # dieses View-Element schreibt und damit jede card_mod-":host"-Regel
    # schlaegt. Alle Designwerte stehen jetzt an der Wurzel in
    # themes/bitgrid.yaml.
    cards:
      - type: custom:layout-card
        # KEIN zoom:calc(100vh/...) mehr (31.08.2026, Nutzer-Wunsch "Zoom-
        # Einstellung aus dem Home-Tab raus"): das urspruengliche Ziel vom
        # 24.08.2026 ("Startseite soll nie scrollen") stand zunehmend im Weg,
        # nachdem der Home-Inhalt durch das paarweise Zeilen-Hoehen-Matching
        # (s. Kopfkommentar) strukturell gewachsen ist — ein einzelner
        # Zoom-Wert konnte "kein Abschneiden" und "gleiche Textgroesse wie
        # Steuerung" (Nutzer-Wunsch, s. group_header-Overrides unten) nicht
        # mehr gleichzeitig erfuellen, siehe die gescheiterten 900px/1150px-
        # Versuche direkt zuvor in der Git-Historie dieser Datei. Home
        # rendert jetzt in natuerlicher Groesse und scrollt bei Bedarf wie
        # Tab 2 (Steuerung behaelt seinen eigenen zoom unveraendert).
        #
        # 12.09.2026: kurzer Testlauf mit grid-template-rows:27.5fr 45fr
        # 27.5fr + height:100vh (fixe Zeilen-Prozente), auf Nutzer-Wunsch
        # wieder zurueckgebaut — Reihe 2 (Energiefluss/Verlauf) durfte nicht
        # gestaucht werden koennen, das stand im selben Zielkonflikt wie oben
        # beschrieben. Zurueck auf auto/scrollt-bei-Bedarf.
        layout_type: custom:grid-layout
        layout:
          # Beide Spalten 50% breit. minmax(0, 1fr) statt 1fr: der Steuerung-
          # Quick-Action-Block (Miner 1 | Miner 2 nebeneinander) ist in seinem
          # min-content breiter als 50% und würde sonst seine Spalte sprengen
          # (gleiche Technik wie Tab "Steuerung" beim vollen Miner-Block).
          # 3 Zeilen, jede ein Paar (g1=BitGridAI/Wetter, g2=Energiefluss/
          # Verlauf, g3=Miner/Finanzen). align-items:stretch bringt pro Zeile
          # die kuerzere Karte auf die Hoehe der laengeren (31.08.2026,
          # Nutzer-Wunsch, s. Kopfkommentar fuer die verworfene Vorgeschichte).
          grid-template-columns: minmax(0, 1fr) minmax(0, 1fr)
          grid-template-rows: auto auto auto
          grid-template-areas: '"g1l g1r" "g2l g2r" "g3l g3r"'
          align-items: stretch
          grid-gap: 14px
          padding: 14px
          box-sizing: border-box
        cards:
          # Unsichtbare Vollbild-Hintergrundkarte (13.09.2026, Tag/Nacht-
          # Umschaltung): view-level und layout-card/vertical-stack-card_mod
          # (:host bzw. hui-view) griffen nachweislich NICHT — card-mod wirkt
          # laut Community-Praxis zuverlässig nur auf Karten mit echtem
          # ha-card-Element, nicht auf reine Layout-/Stack-Wrapper. Deshalb
          # eine eigene, inhaltsleere Karte mit echtem ha-card, per position:
          # fixed aus dem Grid-Fluss gelöst und mit z-index:-1 hinter alle
          # echten Karten gelegt. grid-area wird trotzdem gesetzt (Pflichtfeld
          # fürs Grid), wirkt sich aber wegen position:fixed nicht mehr auf
          # die sichtbare Platzierung aus.
          - type: markdown
            content: " "
            view_layout:
              grid-area: g1l
            card_mod:
              style: |
                ha-card {
                  position: fixed;
                  inset: 0;
                  z-index: -1;
                  border: none;
                  box-shadow: none;
                  border-radius: 0;
                  {% if is_state('sun.sun', 'above_horizon') %}
                  background: url('/local/bg_grass.jpg?v=20260926') repeat 0 0 / 800px auto, linear-gradient(135deg, #5F8F4A 0%, #3F6B2E 100%);
                  {% else %}
                  background: url('/local/bg_grass_night.jpg?v=20260926') repeat 0 0 / 800px auto, linear-gradient(135deg, #16232f 0%, #0d151c 100%);
                  {% endif %}
                }

          # ═══════════════════════════════════════════════════════════
          # ZEILE 1 LINKS  —  Hamster-Erklärung (g1l), gepaart mit Wetter (g1r).
          # Eigener vertical-stack, per align-items:stretch auf Zeilenhöhe.
          # ═══════════════════════════════════════════════════════════
          - type: vertical-stack
            view_layout:
              grid-area: g1l
            # ── View-Skalierung 80% (27.09.2026, Nutzer-Vorgabe) ───────────
            # Fester zoom:0.8 auf JEDER der sechs Spalten-Stacks statt einer
            # Formel wie dem frueheren min(1,calc(100vh/1200px)): der Nutzer
            # hat einen konkreten Prozentwert vorgegeben, keine
            # Viewport-Kopplung. Die uebrigen fuenf Stacks tragen dieselbe
            # Regel, Begruendung nur hier (Referenz: "s. g1l").
            #
            # Platzierung auf der SPALTE, nicht auf der layout-card und nicht
            # auf den Inhaltskarten — beides bewusst:
            #  - layout-card/hui-view: card-mod greift verlaesslich nur auf
            #    Karten mit echtem ha-card-Element, nicht auf reine Layout-
            #    Wrapper (mehrfach in dieser Datei belegt, s. Kommentar bei der
            #    Hintergrundkarte oben). Zusaetzlich liegt dort die
            #    position:fixed-Hintergrundkarte drin, die unter einem
            #    zoom-Vorfahren ihre Viewport-Abdeckung verlieren kann.
            #  - Inhaltskarte einzeln: zoom auf einem flex-grow-Element
            #    skaliert die bereits berechnete Box nachtraeglich nochmal
            #    runter und erzeugte einen Versatz zwischen den Spalten
            #    (02.09.2026 gemessen). Auf der Spalte passiert die
            #    flex-Verteilung komplett in unskalierten Koordinaten, erst
            #    danach schrumpft alles gemeinsam.
            # Nebenwirkung, bewusst so: grid-gap/padding (je 14px) der
            # layout-card bleiben unskaliert, der Aussenrand der View wird
            # also nicht mit verkleinert.
            card_mod:
              style: |
                :host {
                  zoom: 0.8 !important;
                }
            cards:

              # ── Gruppen-Titel: BITGRIDAI (Hamster-Statuskarte) ──────────
              # 12.09.2026, Nutzer-Wunsch: zurueck auf ein Standard-mdi-Icon
              # statt des eigenen Maskottchen-Bitmaps (www/hamster_mdi2.png,
              # Vorgeschichte s. git-Historie dieser Zeile). MDI kennt kein
              # Icon namens "hamster" (gegen den Iconify-Index verifiziert,
              # 12.09.2026), mdi:rodent ist das naechstliegende Tier-Icon im
              # Set (mdi:mouse* sind ausschliesslich Computer-Maeuse). Damit
              # nutzt dieser Gruppentitel jetzt dieselbe icon:-Zeile wie alle
              # uebrigen (Energiefluss/Miner/Wetter/Verlauf/Finanzen) und folgt
              # automatisch bgai-section-label-v3 statt eines hart exportierten
              # PNG-Farbtons.
              - type: custom:button-card
                template: group_header
                # font-size 1.5rem (31.08.2026, Nutzer-Wunsch "Überschriften
                # in Home größer"): der Versuch, stattdessen die View-Zoom-
                # Basis an Steuerung anzugleichen, brach das Home-Layout
                # (Inhalt passte nicht mehr in den Viewport) und wurde
                # zurueckgerollt (zoom bleibt 1150px, s. o.).
                # Der fruehere Direkt-Override hier (font-size:1.6875rem)
                # ist entfallen (02.09.2026): das geteilte group_header-
                # Template liest jetzt selbst --bg-fs-group-header (view-
                # scoped, s. :host oben), kein Pro-Karte-Override mehr
                # noetig — zentraler Fix statt sechsfacher Duplikation.
                icon: mdi:rodent
                name: BitGridAI

              # ═══════════════════════════════════════════════════════════
              # HAMSTER  —  Energie-Gruppe oben (ham). flex:1 (31.08.2026):
              # waechst innerhalb des g1l-vertical-stacks auf die per
              # align-items:stretch vorgegebene Zeilenhoehe, der Gruppentitel
              # darueber bleibt bei seiner natuerlichen Hoehe. Der interne
              # justify-content:space-between (s. u. im Template-String)
              # verteilt zusaetzliche Hoehe als Luecke vor der Blockzeit/
              # Balance/Kurs-Fussleiste statt als toten Raum danach.
              # ═══════════════════════════════════════════════════════════
              - type: custom:button-card
                # zoom (31.08.2026, Nutzer-Wunsch "Karteninhalte verkleinern
                # damit alles wieder reinpasst, nur die Überschriftgröße
                # bleibt"): anders als der fruehere View-weite zoom sitzt er
                # jetzt NUR auf den Inhalts-Karten, nicht auf den
                # group_header-Karten (die bleiben bei 1.5rem, unskaliert).
                # 1200px ist ein erster Schaetzwert, kein Messwert — nach
                # Live-Screenshot in allen sieben Inhalts-Karten (s. gleiche
                # Kommentarzeile) gemeinsam nachjustieren, damit sie
                # gleichmaessig schrumpfen.
                card_mod:
                  style: |
                    :host {
                      /* flex-basis 0 statt auto (02.09.2026). zoom ist jetzt
                         eine Ebene hoeher auf der g1l-Spalte gesetzt (s. dort),
                         nicht mehr hier — Verdacht: zoom direkt auf einem
                         flex-grow-Element skaliert die schon fertig berechnete
                         Box nachtraeglich nochmal runter, statt die Rechnung
                         selbst zu beeinflussen (Versatz zur Wetter-Karte trotz
                         ha-card-Fix, s. u., unveraendert geblieben). */
                      /* 12.09.2026, Nutzer-Wunsch "Hoehe fest 260px wie
                         Wetter" — kurz versucht (flex:0 0 260px; height:260px
                         !important auf :host), aber 260px war nur eine grobe,
                         NICHT live gemessene Schaetzung (s. Chat-Herleitung)
                         und lag ueber der tatsaechlichen natuerlichen Hoehe:
                         Ergebnis war eine insgesamt zu hohe Zeile (Nutzer-
                         Befund "irgendwie ist es jetzt zu gross"), weil :host
                         nicht mehr mitschrumpfen konnte und Wetter ueber
                         align-items:stretch mitwuchs. Zurueckgebaut auf das
                         urspruengliche, bereits funktionierende Verhalten kurz
                         zurueckgebaut, Nutzer-Befund danach aber "jetzt zu
                         klein" — 260px zu viel, natuerliche Hoehe zu wenig.
                         Nutzer-Wunsch "Mittelweg": 220px als naechster
                         Testwert, Mechanismus (flex:0 0 statt 1 1 0, damit
                         :host nicht mehr wachsen/schrumpfen kann) bereits
                         bestaetigt wirksam, nur die Zahl war beim ersten
                         Versuch zu hoch. */
                      /* 17.10.2026, Nutzer-Wunsch "Karten nebeneinander immer
                         buendig": 238px bleibt die Mindesthoehe (der Mittelweg
                         von oben), die Karte darf aber auf die Zeilenhoehe
                         wachsen, wenn die Wetter-Karte daneben hoeher ist.
                         Das Wachsen selbst steuert www/bitgrid_wide.js (der
                         hui-card-Wrapper um diese Karte ist display:block,
                         flex hier allein wirkt nicht), Messung s. dort. */
                      flex: 1 1 auto !important;
                      min-height: 238px !important;
                    }
                    ha-card {
                      height: 100% !important;
                      /* 12.09.2026, Hell-Umbau: die View-:host-Custom-Property-
                         Umleitung (--ha-card-background/--card-background-color
                         weiter oben in dieser Datei) erreicht dieses button-card
                         aus ungeklaertem Grund nicht (Karte blieb dunkel, auch
                         nach hartem Reload verifiziert) — direkt hier auf der
                         eigenen ha-card erzwungen, gleiches Muster wie die
                         bereits wirksame height-Regel oben. */
                      background: var(--ha-card-background) !important;
                    }
                    /* Lokaler --bg-fs-title-Override (02.09.2026, Nutzer-
                       Praezisierung "im Verhaeltnis zu den anderen Karten"):
                       nicht "absolut zu gross", sondern zu gross verglichen
                       mit dem Rest des Dashboards — 2.125rem (View-Default)
                       und selbst 2rem standen ohne vergleichbares Gegenstueck
                       da (dort ist --bg-fs-title sonst nirgends sichtbar im
                       Einsatz). 1.5rem = dieselbe Groesse wie die Miner-
                       Kartentitel (views/steuerung_quick.yaml), damit haben
                       Blockzeit/Balance/Kurs/Ueberschrift jetzt ein echtes,
                       bereits akzeptiertes Gegenstueck auf demselben Tab. */
                    :host {
                      --bg-fs-title: 1.5rem;
                    }
                show_name: false
                show_icon: false
                show_state: false
                tap_action:
                  action: none
                custom_fields:
                  hamster: >
                    [[[
                      const fnum = (id) => {
                        const v = parseFloat(states[id]?.state);
                        return isNaN(v) ? null : v;
                      };
                      const cfg = (id, fb) => { const v = fnum(id); return v === null ? fb : v; };
                      const pct = (v) => v.toLocaleString('de-DE', {maximumFractionDigits: 0});
                      const kw  = (w) => (w / 1000).toLocaleString('de-DE', {minimumFractionDigits: 1, maximumFractionDigits: 1});

                      // Nachtfenster aus den Config-Entities statt hart 22-6 (27.09.2026):
                      // beide Grenzen sind input_datetime (mvp_night_block_start/_end,
                      // Default 22:00/06:00) und im Einstellungen-Tab veraenderbar. Der
                      // hartkodierte Fallback hier hat die Karte nach einer Verstellung
                      // still falsch werden lassen, und der alte Anzeigetext rundete die
                      // Uhrzeit auf die volle Stunde ab ("Es ist 3:00 Uhr" um 03:47).
                      const hhmm = (id, fb) => {
                        const s = states[id]?.state;
                        return (typeof s === 'string' && /^\d{1,2}:\d{2}/.test(s))
                          ? s.slice(0, 5).padStart(5, '0')
                          : fb;
                      };
                      const toMin = (t) => parseInt(t.slice(0, 2), 10) * 60 + parseInt(t.slice(3, 5), 10);
                      const nightFrom = hhmm('input_datetime.mvp_night_block_start', '22:00');
                      const nightTo   = hhmm('input_datetime.mvp_night_block_end', '06:00');
                      // 15.10.2026, Lab-Replay: solange simulation_mode an ist und die
                      // Sim-Uhr (sensor.lab_sim_clock, existiert nur im Lab) laeuft, zaehlt
                      // deren Uhrzeit statt der echten. Sonst sagte die Karte um 17:49 echter
                      // Zeit "Nachtsperre", waehrend das Replay Mittag zeigt (und umgekehrt).
                      const simClk  = states['input_boolean.simulation_mode']?.state === 'on'
                        ? states['sensor.lab_sim_clock']?.state : null;
                      const simOn   = typeof simClk === 'string' && /^\d{2}:\d{2}$/.test(simClk);
                      const nowD    = new Date();
                      const nowMin  = simOn ? toMin(simClk) : nowD.getHours() * 60 + nowD.getMinutes();
                      const nowStr  = simOn ? simClk : `${String(nowD.getHours()).padStart(2, '0')}:${String(nowD.getMinutes()).padStart(2, '0')}`;
                      const fromMin = toMin(nightFrom);
                      const untilMin = toMin(nightTo);
                      // Fenster ueber Mitternacht (Start > Ende) genauso behandeln wie
                      // binary_sensor.mvp_nacht_sperre_aktiv es tut (packages/mvp_auto.yaml).
                      const inNightWindow = fromMin > untilMin
                        ? (nowMin >= fromMin || nowMin < untilMin)
                        : (nowMin >= fromMin && nowMin < untilMin);
                      // Im Replay nur das Sim-Fenster: der echte Nachtsperre-Sensor rechnet
                      // mit der echten Uhr.
                      const night = (!simOn && states['binary_sensor.mvp_nacht_sperre_aktiv']?.state === 'on')
                        || inNightWindow;
                      const modeRaw = states['sensor.miner1_workmode_status']?.state
                                  || states['sensor.miner2_workmode_status']?.state || '';
                      const mode = (modeRaw === 'unavailable' || modeRaw === 'unknown') ? '' : modeRaw;
                      const running = ['Eco', 'Standard', 'Super'].includes(mode);
                      const socV   = fnum('sensor.battery_soc_pct');
                      const pvV    = fnum('sensor.pv_power_w');
                      const minerV = fnum('sensor.miner_total_power_w');
                      const chipV  = fnum('sensor.miner_max_chip_temp_c');
                      const socKnown = socV !== null;
                      const soc    = socV ?? 0;
                      const pvW    = pvV ?? 0;

                      // ── Schwellen aus den HA-Config-Entities ─────────────────────────
                      // 27.09.2026, Faktencheck gegen packages/mvp_auto.yaml (R1-R8). Zwei
                      // Klassen von Fehlern gefunden und hier behoben:
                      //  1. Die Fallback-Werte wichen von den echten input_number-Defaults
                      //     ab (50/60/75/90 statt 60/70/85/100). Sichtbar wird das nur
                      //     waehrend eines Sensor-Ausfalls, dann aber mit erfundenen Zahlen.
                      //  2. Zwei Ausstiegs-Schwellen zeigten auf die falschen Entities:
                      //     socStdStp auf den Eco-START (70) statt auf mvp_soc_std_off_pct
                      //     (83), socSupStp auf den Standard-START (85) statt auf
                      //     mvp_soc_super_off_pct (95). Die Karte hat damit Rueckfall-
                      //     Punkte genannt, an denen real nichts passiert — bei Super lag
                      //     der genannte Wert 10 Prozentpunkte unter der echten Schwelle.
                      // Alle Werte werden monatlich von mvp_saison_automatik neu gesetzt
                      // (ADR 028), deshalb ausschliesslich live lesen, nie hart schreiben.
                      const socStop   = cfg('input_number.mvp_soc_stop_pct', 60);       // R1 Stopp
                      const ecoStart  = cfg('input_number.mvp_soc_eco_start_pct', 70);  // R7 Eco-Start
                      const socStd    = cfg('input_number.mvp_soc_std_pct', 85);        // R5 Standard-Start
                      const socStdStp = cfg('input_number.mvp_soc_std_off_pct', 83);    // R6 Standard-Ausstieg
                      const socSuper  = cfg('input_number.mvp_soc_super_pct', 100);     // R3 Super-Start
                      const socSupStp = cfg('input_number.mvp_soc_super_off_pct', 95);  // R4 Super-Ausstieg
                      const pvStartW  = cfg('input_number.mvp_pv_start_w', 6000);       // R7 PV-Bypass

                      // Temperatur ist GESTUFT (configuration.yaml, Kommentarblock bei
                      // r3_max_chip_temp_c): 112 °C drosselt Super auf Standard (R2, 3 h
                      // Super-Sperre), erst 115 °C stoppt beide Miner (R3, 15 min Lockout).
                      // Die Karte hat bis 27.09.2026 die 112 °C als "Sicherheitsgrenze,
                      // Miner wird sofort gestoppt" ausgegeben — der Text der 115er-Stufe
                      // an der Schwelle der 112er-Stufe, also doppelt falsch: falsche
                      // Konsequenz und falscher Wert.
                      const chipThrottle = cfg('input_number.mvp_tmax_std_threshold_c', 112);
                      const chipStop     = cfg('input_number.r3_max_chip_temp_c', 115);

                      // Saison-Sperre (ADR 028, Bugfix 25.09.2026): in Monaten ohne
                      // "Voll (Eco/Standard/Super)" gibt die Schaltlogik Super nicht frei,
                      // bei "Nur Eco" zusaetzlich kein Standard. Ohne diese Pruefung kuendigt
                      // die Karte Modi an, die in diesem Monat gar nicht kommen koennen.
                      // Fail-Verhalten identisch zur Automation: Super nur bei exaktem
                      // "Voll"-String (fail-closed), Standard bei allem ausser "Nur Eco"
                      // (fail-open), damit ein unbekannter Sensorzustand die Anzeige nicht
                      // anders bewertet als die Regel selbst.
                      // Replay: Saison des abgespielten Tages (sensor.lab_sim_saison_status,
                      // nur Lab), sonst die Live-Saison aus dem echten Monat.
                      const saison  = (simOn ? states['sensor.lab_sim_saison_status']?.state : null)
                        || states['sensor.mvp_saison_status']?.state || '';
                      const superOk = saison === 'Voll (Eco/Standard/Super)';
                      const stdOk   = saison !== 'Nur Eco';

                      // Erklärtext A (statisch/regelbasiert) aus soc_band_tagesverlauf.md,
                      // Platzhalter live aus den gebundenen Entities ersetzt. Zustand = sichtbare
                      // Wahrheit (Workmode + Temperatur + SoC), NICHT bg_decision_code (entkoppelt).
                      let head, sub, img, key;
                      if (!socKnown && !running) {
                        key  = 'conn';
                        head = 'Verbindung wird aufgebaut';
                        sub  = 'Die Sensoren melden sich gerade nach einem Neustart.<br>'
                             + 'Sobald Ladezustand und PV anliegen, zeigt die Karte den Betriebszustand.';
                        // 17.10.2026: eigenes Bild (WLAN-Zeichen mit Fragezeichen).
                        img  = 'bithamster_connect.png';
                      } else if (night) {
                        key  = 'night';
                        head = 'Nachtsperre aktiv';
                        sub  = `Es ist ${nowStr}\u00a0Uhr, die Nachtsperre gilt von ${nightFrom} bis ${nightTo}\u00a0Uhr.<br>`
                             + 'In dieser Zeit ist das Mining unabhängig vom Ladezustand ausgesetzt.<br>'
                             + `Der Normalbetrieb beginnt wieder ab ${nightTo}\u00a0Uhr.`;
                        img  = 'bithamster_sleep.png';
                      } else if (chipV !== null && chipV >= chipStop) {
                        key  = 'stop';
                        head = 'Sicherheits-Stopp: zu heiß';
                        sub  = `Die höchste Chip-Temperatur liegt mit ${pct(chipV)}\u00a0°C auf oder über der Stopp-Grenze von ${pct(chipStop)}\u00a0°C.<br>`
                             + 'Beide Miner werden gestoppt, das ist nicht überstimmbar (Regel R3).<br>'
                             // 17.10.2026 gegen scripts.yaml bg_stop geprueft: die Sperre laeuft
                             // 15 min ab dem Stopp, zusaetzlich gesperrt solange >= Grenze
                             // (binary_sensor.r3_overtemp), nicht "15 min nach dem Abkuehlen".
                             + 'Ein Wiederanlauf ist frühestens 15\u00a0Minuten nach dem Stopp möglich und erst, wenn der Chip wieder unter der Grenze liegt.';
                        // 17.10.2026: eigenes Bild (ueberhitzter Hamster am Miner) statt des
                        // meditierenden Warte-Hamsters, der der Notabschaltung widersprach.
                        img  = 'bithamster_overheat.png';
                      } else if (chipV !== null && chipV >= chipThrottle && mode === 'Super') {
                        // Eigener Zweig seit 27.09.2026: vorher lief dieser Fall unter der
                        // Stopp-Ueberschrift, obwohl bei 112 °C nur gedrosselt wird.
                        key  = 'throttle';
                        head = 'Gedrosselt: zu warm';
                        sub  = `Die höchste Chip-Temperatur liegt mit ${pct(chipV)}\u00a0°C auf oder über der Drossel-Grenze von ${pct(chipThrottle)}\u00a0°C.<br>`
                             + 'Der Miner geht von Super auf Standard zurück, gestoppt wird er nicht (Regel R2).<br>'
                             + `Super bleibt danach 3\u00a0Stunden gesperrt, gestoppt wird erst ab ${pct(chipStop)}\u00a0°C.`;
                        // 17.10.2026: eigenes Bild (faechelt sich Luft zu, Hitzeflimmern)
                        // statt des Standard-Hamsters, der keine Hitze zeigte.
                        img  = 'bithamster_hot.png';
                      } else if (mode === 'Eco') {
                        key  = 'eco';
                        head = 'Miner läuft sparsam (Eco)';
                        // "im Eco-Band" ist hier ersatzlos raus (27.09.2026): der Miner kann
                        // mit deutlich hoeherem Ladezustand in Eco stehen, solange der
                        // 1h-Runterschalt-Cooldown das Hochschalten blockiert. Die Karte
                        // behauptete dann ein Band, in dem der Akku gar nicht war.
                        sub  = `Der Ladezustand liegt bei ${pct(soc)}\u00a0%, die PV bei ${kw(pvW)}\u00a0kW.<br>`
                             + `Der Miner minet gedrosselt im Eco-Modus${pvW < pvStartW ? ' aus dem Akku weiter' : ''}.<br>`
                             + (stdOk
                                 ? `Unter ${pct(socStop)}\u00a0% greift die Hausreserve, ab ${pct(socStd)}\u00a0% schaltet er auf Standard.`
                                 : `Unter ${pct(socStop)}\u00a0% greift die Hausreserve. Standard ist in diesem Monat gesperrt.`);
                        img  = 'bithamster_eco.png';
                      } else if (mode === 'Standard') {
                        key  = 'standard';
                        head = 'Miner läuft in Standard';
                        sub  = `Der Ladezustand liegt bei ${pct(soc)}\u00a0%.<br>`
                             + 'Der Miner läuft im Standard-Modus.<br>'
                             + (superOk
                                 ? `Ab ${pct(socSuper)}\u00a0% folgt Super, unter ${pct(socStdStp)}\u00a0% fällt er auf Eco zurück.`
                                 : `Unter ${pct(socStdStp)}\u00a0% fällt er auf Eco zurück. Super ist in diesem Monat gesperrt.`);
                        img  = 'bithamster_standard.png';
                      } else if (mode === 'Super') {
                        key  = 'super';
                        head = 'Miner läuft auf Volllast (Super)';
                        sub  = `Der Ladezustand liegt bei ${pct(soc)}\u00a0%, Super gilt ab ${pct(socSuper)}\u00a0%.<br>`
                             + 'Der Miner läuft mit voller Last im Super-Modus.<br>'
                             + `Unter ${pct(socSupStp)}\u00a0% fällt er auf Standard zurück.`;
                        img  = 'bithamster_super.png';
                      } else if (soc < socStop) {
                        key  = 'charge';
                        head = 'Akku lädt zuerst';
                        sub  = `Der Ladezustand ist mit ${pct(soc)}\u00a0% unter die Hausreserve von ${pct(socStop)}\u00a0% gefallen.<br>`
                             + 'Der Miner bleibt aus und lädt zuerst wieder auf.<br>'
                             + `Ein Start ist erst ab ${pct(ecoStart)}\u00a0% möglich.`;
                        // 17.10.2026: eigenes Bild (doesender Hamster am ladenden Akku,
                        // Persona "ruhend bei Hausreserve") statt des Warte-Hamsters.
                        img  = 'bithamster_charging.png';
                      } else if (soc < ecoStart) {
                        key  = 'hold';
                        head = 'Akku im Halteband';
                        sub  = `Der Ladezustand liegt mit ${pct(soc)}\u00a0% im Halteband (${pct(socStop)}–${pct(ecoStart)}\u00a0%).<br>`
                             + 'Ein Neustart ist hier gesperrt, der Miner bleibt aus.<br>'
                             + `Ein Start ist erst ab ${pct(ecoStart)}\u00a0% möglich.`;
                        // 17.10.2026: eigenes Bild (silbergraue Aura mit Ring, ruhender
                        // Hamster) statt des Warte-Hamsters.
                        img  = 'bithamster_hold.png';
                      } else {
                        // 27.09.2026 korrigiert: der alte Text behauptete "im Eco-Band"
                        // (stimmt ab dem Standard-Start nicht mehr) und nannte die PV als
                        // einzige Startbedingung. R7 kennt zwei Wege — PV-Bypass (>= PV-
                        // Schwelle, fruehestens 15 min nach dem letzten Abschalten) ODER
                        // den regulaeren 1h-Cooldown. Wer nur den ersten liest, wartet bei
                        // Bewoelkung auf einen Start, der ohnehin von selbst kommt.
                        // 17.10.2026: liegt die PV schon ueber der Bypass-Schwelle, wartet
                        // er nicht auf Sonne, sondern nur auf die 15 min nach dem Abschalten
                        // (mvp_auto.yaml pv_bypass_in). Vorher stand dort "ab 6,0 kW startet
                        // er vorzeitig" neben 8,4 kW PV, also eine falsche Begruendung.
                        const sunOk = pvW >= pvStartW;
                        key  = 'waitsun';
                        head = sunOk ? 'Kurze Sperre nach dem Abschalten' : 'Warte auf Sonne';
                        sub  = `Der Ladezustand reicht mit ${pct(soc)}\u00a0% aus (nötig ${pct(ecoStart)}\u00a0%), die PV liegt bei ${kw(pvW)}\u00a0kW.<br>`
                             + 'Der Miner bleibt noch aus, in der Regel wegen der Wartezeit seit dem letzten Abschalten.<br>'
                             + (sunOk
                                 ? `Die PV reicht für den vorzeitigen Start (ab ${kw(pvStartW)}\u00a0kW), er startet frühestens 15\u00a0Minuten nach dem Abschalten im Eco-Modus.`
                                 : `Ab ${kw(pvStartW)}\u00a0kW PV startet er vorzeitig im Eco-Modus, sonst spätestens eine Stunde nach dem Abschalten.`);
                        // 17.10.2026: eigenes Bild (Morgendaemmerung mit Sonnenstrahlen);
                        // bei genug Sonne der ruhende Warte-Hamster, die Sonne fehlt ja nicht.
                        img  = sunOk ? 'bithamster_hold.png' : 'bithamster_waitsun.png';
                      }

                      // 17.10.2026, Studie A/B (Nutzer-Entscheidung): zwei Sprachfassungen der
                      // Erklaerung mit denselben Fakten, Zahlen und Bildern, nur der Sprachstil
                      // unterscheidet sich (beide in der 3. Person, keine direkte Anrede).
                      // A = umgangssprachlich (keine Abkuerzungen, keine Regel-IDs),
                      // B = technisch (SoC/PV, Operatoren, Regel-IDs R1-R7 aus packages/mvp_auto.yaml;
                      // die 115-Grad-Abschaltung hat dort keine R-Nummer und steht nur mit Namen).
                      // Die Variante haengt am Dashboard: nur das Lab registriert /bitgridai-a/ und
                      // /bitgridai-b/ auf diese Datei; v3 und Prod behalten die bisherigen Texte.
                      // ENTWURF, Freigabe durch den Nutzer steht aus.
                      // Verblindung (17.10.2026): das Probanden-Dashboard /bitgridai-home/ (nur Lab,
                      // Titel "BitGridAI") ist fuer beide Gruppen dasselbe; die Variante kommt dort aus
                      // input_select.lab_studie_gruppe (lab_only/lab_studie.yaml), gesetzt von der
                      // Versuchsleitung in der Sim-Steuerung. In Prod gibt es weder Pfad noch Helfer.
                      const studyPath = /^\/bitgridai-home\//.test(location.pathname);
                      const studyGroup = (states['input_select.lab_studie_gruppe']?.state || '').toLowerCase();
                      const variant = ((location.pathname.match(/^\/bitgridai-([ab])\//) || [])[1])
                        || (studyPath && ['a', 'b'].includes(studyGroup) ? studyGroup : '');
                      if (variant && key) {
                        // 17.10.2026 (Nutzer: "viel zu viel Text"): je Zustand zwei kurze
                        // Saetze statt drei. Satz 1 = was gerade gilt (Messwert + Schwelle),
                        // Satz 2 = was als Naechstes passiert und ab wann. Dabei behoben:
                        // Super unter 100 % behauptete in B "99 % auf oder ueber 100 %"
                        // (jetzt eigener Hysterese-Satz), die Drossel-Saetze versprechen
                        // keine 3-h-Sperre mehr, die das Replay 10 min spaeter widerlegt.
                        const supOn = soc >= socSuper;
                        const V = {
                          a: {
                            // Ohne Ursache (17.10.2026): B nennt nur den Datenzustand, die
                            // fruehere A-Fassung behauptete "nach dem Neustart" (Faktengleichheit).
                            conn: () => ['Gleich geht es los',
                              'Die Messwerte für Akku und Solar fehlen noch.<br>'
                              + 'Gleich steht hier, was der Miner macht.'],
                            // Nacht ohne Uhrzeit (17.10.2026): im Replay ist sie die Blockzeit
                            // (10-min-Raster), die Uhr daneben zaehlt minutengenau.
                            night: () => ['Nachtruhe',
                              `Von ${nightFrom} bis ${nightTo}\u00a0Uhr hat der Miner Pause.<br>`
                              + `Ab ${nightTo}\u00a0Uhr darf er wieder rechnen.`],
                            stop: () => ['Zu heiß, Miner sind aus',
                              `Ein Chip hat ${pct(chipV)}\u00a0°C erreicht, ab ${pct(chipStop)}\u00a0°C wird abgeschaltet.<br>`
                              + 'Weiter geht es frühestens nach 15\u00a0Minuten und erst abgekühlt.'],
                            throttle: () => ['Zu warm, Miner tritt kürzer',
                              `Ein Chip ist ${pct(chipV)}\u00a0°C heiß, gedrosselt wird ab ${pct(chipThrottle)}\u00a0°C.<br>`
                              + `Er geht von Super auf Standard, aus erst bei ${pct(chipStop)}\u00a0°C.`],
                            // Eco/Standard ueber der naechsten Schwelle: das Hochschalten wartet
                            // auf den Cooldown nach dem letzten Wechsel (mvp_auto.yaml, 3600 s).
                            // Bewusst ohne Minutenangabe: der aufgezeichnete Replay-Tag schaltet
                            // nach dem Neustart 13:40 schon nach 20 min hoch.
                            eco: () => ['Miner läuft gemütlich (Eco)',
                              `Akku ${pct(soc)}\u00a0%, Solar ${kw(pvW)}\u00a0kW${pvW < pvStartW ? ', Rest aus dem Akku' : ''}.<br>`
                              + (!stdOk
                                  ? `Unter ${pct(socStop)}\u00a0% geht er aus, mehr Tempo gibt es diesen Monat nicht.`
                                  : soc >= socStd
                                    ? `Höher schaltet er erst nach einer Wartezeit, unter ${pct(socStop)}\u00a0% geht er aus.`
                                    : `Ab ${pct(socStd)}\u00a0% legt er zu, unter ${pct(socStop)}\u00a0% geht er aus.`)],
                            standard: () => ['Miner läuft normal (Standard)',
                              `Akku ${pct(soc)}\u00a0%.<br>`
                              + (!superOk
                                  ? `Unter ${pct(socStdStp)}\u00a0% schaltet er zurück, Vollgas gibt es diesen Monat nicht.`
                                  : soc >= socSuper
                                    ? `Vollgas erst nach einer Wartezeit, unter ${pct(socStdStp)}\u00a0% schaltet er zurück.`
                                    : `Ab ${pct(socSuper)}\u00a0% gibt er Vollgas, unter ${pct(socStdStp)}\u00a0% schaltet er zurück.`)],
                            super: () => ['Miner gibt Vollgas (Super)',
                              (supOn ? `Der Akku ist voll (${pct(soc)}\u00a0%).<br>` : `Der Akku ist zu ${pct(soc)}\u00a0% voll.<br>`)
                              + `Vollgas läuft${supOn ? '' : ' weiter'}, bis er unter ${pct(socSupStp)}\u00a0% fällt.`],
                            charge: () => ['Erst mal Akku laden',
                              `Der Akku ist zu ${pct(soc)}\u00a0% voll, unter der Reserve fürs Haus von ${pct(socStop)}\u00a0%.<br>`
                              + `Losgehen kann es erst ab ${pct(ecoStart)}\u00a0%.`],
                            hold: () => ['Akku in der Wartezone',
                              `Der Akku ist zu ${pct(soc)}\u00a0% voll, zwischen ${pct(socStop)} und ${pct(ecoStart)}\u00a0%.<br>`
                              + `Neu starten darf der Miner erst ab ${pct(ecoStart)}\u00a0%.`],
                            waitsun: () => pvW >= pvStartW
                              ? ['Kurze Pause',
                                `Akku (${pct(soc)}\u00a0%) und Solar (${kw(pvW)}\u00a0kW) reichen, er war aber gerade erst aus.<br>`
                                + 'Frühestens 15\u00a0Minuten danach startet er wieder sparsam.']
                              : ['Wartet auf mehr Sonne',
                                `Der Akku reicht (${pct(soc)}\u00a0%, nötig ${pct(ecoStart)}\u00a0%), der Miner war aber gerade erst aus.<br>`
                                + `Ab ${kw(pvStartW)}\u00a0kW Solar startet er früher, sonst nach einer Stunde.`],
                          },
                          b: {
                            conn: () => ['Initialisierung',
                              'SoC und PV-Leistung fehlen noch (unavailable).<br>'
                              + 'Die Anzeige folgt, sobald beide vorliegen.'],
                            night: () => ['Nachtsperre aktiv',
                              `Sperrfenster ${nightFrom}–${nightTo}\u00a0Uhr.<br>`
                              + `Freigabe der Schaltregeln ab ${nightTo}\u00a0Uhr.`],
                            stop: () => ['Übertemperatur-Abschaltung',
                              `Chiptemperatur ${pct(chipV)}\u00a0°C ≥ ${pct(chipStop)}\u00a0°C: beide Miner im Standby.<br>`
                              + `Wiederanlauf frühestens 15\u00a0min nach Abschaltung, nur unter ${pct(chipStop)}\u00a0°C.`],
                            // "Sperre" raus (17.10.2026): der Replay-Tag laeuft 10 min spaeter
                            // wieder in Super, eine angekuendigte Sperre waere dort widerlegt.
                            throttle: () => ['Temperaturdrosselung (R2)',
                              `Chiptemperatur ${pct(chipV)}\u00a0°C ≥ ${pct(chipThrottle)}\u00a0°C: Rückstufung Super → Standard.<br>`
                              + `Abschaltung erst bei ≥ ${pct(chipStop)}\u00a0°C.`],
                            eco: () => ['Betriebsmodus Eco',
                              `SoC ${pct(soc)}\u00a0%, PV ${kw(pvW)}\u00a0kW${pvW < pvStartW ? ', Rest aus dem Speicher' : ''}.<br>`
                              + (!stdOk
                                  ? `R1 stoppt unter ${pct(socStop)}\u00a0%, Standard ist saisonal gesperrt.`
                                  : soc >= socStd
                                    ? `Hochstufung (R5) wartet auf den Cooldown, R1 stoppt unter ${pct(socStop)}\u00a0%.`
                                    : `R5 stuft ab ${pct(socStd)}\u00a0% hoch, R1 stoppt unter ${pct(socStop)}\u00a0%.`)],
                            standard: () => ['Betriebsmodus Standard',
                              `SoC ${pct(soc)}\u00a0%.<br>`
                              + (!superOk
                                  ? `R6 stuft unter ${pct(socStdStp)}\u00a0% auf Eco zurück, Super ist saisonal gesperrt.`
                                  : soc >= socSuper
                                    ? `Hochstufung (R3) wartet auf den Cooldown, R6 stuft unter ${pct(socStdStp)}\u00a0% zurück.`
                                    : `R3 stuft ab ${pct(socSuper)}\u00a0% auf Super hoch, R6 unter ${pct(socStdStp)}\u00a0% auf Eco zurück.`)],
                            super: () => ['Betriebsmodus Super',
                              (supOn ? `SoC ${pct(soc)}\u00a0% ≥ Super-Schwelle ${pct(socSuper)}\u00a0% (R3).<br>` : `SoC ${pct(soc)}\u00a0%, Super-Hysterese aktiv.<br>`)
                              + `Super bleibt aktiv bis SoC < ${pct(socSupStp)}\u00a0% (R4).`],
                            charge: () => ['Hausreserve unterschritten (R1)',
                              `SoC ${pct(soc)}\u00a0% liegt unter der Hausreserve von ${pct(socStop)}\u00a0%.<br>`
                              + `Start erst bei SoC ≥ ${pct(ecoStart)}\u00a0% (R7).`],
                            hold: () => ['SoC im Halteband (Hysterese)',
                              `SoC ${pct(soc)}\u00a0% liegt im Halteband ${pct(socStop)}–${pct(ecoStart)}\u00a0%.<br>`
                              + `Neustart gesperrt bis SoC ≥ ${pct(ecoStart)}\u00a0% (R7).`],
                            waitsun: () => pvW >= pvStartW
                              ? ['Startbedingung R7 ausstehend',
                                `SoC ${pct(soc)}\u00a0% ≥ ${pct(ecoStart)}\u00a0%, PV ${kw(pvW)}\u00a0kW ≥ ${kw(pvStartW)}\u00a0kW.<br>`
                                + 'PV-Bypass greift 15\u00a0min nach der Abschaltung, Start in Eco.']
                              : ['Startbedingung R7 ausstehend',
                                `SoC ${pct(soc)}\u00a0% ≥ ${pct(ecoStart)}\u00a0%, Start durch Cooldown seit der Abschaltung blockiert.<br>`
                                + `PV-Bypass ab ${kw(pvStartW)}\u00a0kW, sonst nach 1\u00a0h.`],
                          },
                        };
                        const txt = V[variant][key];
                        if (txt) [head, sub] = txt();
                      } else if (studyPath) {
                        // Ohne gueltige Gruppe nie die alten v3-Texte zeigen (waere ein dritter Reiz).
                        head = 'Einen Moment';
                        sub = 'Die Anzeige wird vorbereitet.';
                      }

                      // Stat-Werte auf var(--bg-fs-title) statt Fixwert 1.5rem
                      // (31.08.2026, Nutzer-Wunsch "Schriftgroesse pro Art"):
                      // der Token ist in themes/bitgrid.yaml explizit fuer
                      // "Karten-Headline / grosse Stat-Werte" definiert, genau
                      // diese Rolle haben Blockzeit/Balance/Kurs hier.
                      // Schwarzer Text-Schatten auf jeder Zeile der Karte
                      // (12.09.2026, Nutzer-Wunsch): dasselbe Token wie die
                      // Gruppentitel-Halo (button_card_templates.yaml,
                      // bgai-header-halo-v3), hier nur zur Kontraststeigerung
                      // wiederverwendet, nicht weil diese Karte auf der Gras-
                      // Textur liegt (sie hat einen eigenen, deckenden
                      // Kartenhintergrund).
                      const halo = 'text-shadow:var(--bgai-header-halo-v3);';
                      // 12.09.2026, Nutzer-Wunsch "Bezeichner mittig zwischen
                      // Hoehe der Divider": die Divider daneben stretchen per
                      // align-self:stretch auf die volle Zeilenhoehe, der
                      // Text-Stack hier stand aber ohne eigene Zentrierung
                      // oben in seiner Box — display:flex;flex-direction:
                      // column;justify-content:center zentriert Label/Wert/
                      // Unterwert jetzt vertikal in derselben Hoehe.
                      // Root-Cause des Ausrichtungs-Problems (13.09.2026, Nutzer-Befund
                      // "Balance auf gleicher Zeilenhoehe wie Blockzeit/Kurs" - der
                      // vorherige margin-top:8px-Ausgleich reichte nicht): Balance hat
                      // (mit balSub) drei Zeilen (Label/Wert/Unterwert), Blockzeit/Kurs
                      // nur zwei (Kurs' priceSub bleibt leer) - justify-content:center
                      // zentriert jede Spalte auf ihre EIGENE Zeilenzahl, wodurch die
                      // Wert-Zeile je nach Spalte an unterschiedlicher Hoehe landet.
                      // Fix: Unterwert-Zeile IMMER rendern (leer = "&nbsp;" statt
                      // weggelassen), damit alle drei Spalten dieselbe Zeilenzahl und
                      // damit dieselbe Wert-Position haben - kein Magic-Number-Ausgleich
                      // mehr noetig.
                      const stat = (label, value, sub, extraStyle = '') => `
                        <div style="flex:1;min-width:0;text-align:center;display:flex;flex-direction:column;justify-content:center;${extraStyle}">
                          <div style="font-size:var(--bg-fs-label);text-transform:uppercase;letter-spacing:0.06em;
                                      color:var(--bgai-section-label-v3);margin-bottom:1px;${halo}">${label}</div>
                          <div style="font-size:var(--bg-fs-title);font-weight:700;line-height:1;
                                      white-space:nowrap;${halo}">${value}</div>
                          <div style="font-size:var(--bg-fs-secondary);color:var(--secondary-text-color);opacity:0.7;
                                      white-space:nowrap;margin-top:1px;${halo}">${sub || '&nbsp;'}</div>
                        </div>`;

                      // Bitcoin-Fußleiste (wie altes Dashboard): Blockzeit, Kurs, Balance
                      const blockH   = fnum('sensor.bitcoin_block_height');
                      const balBtc   = fnum('sensor.pool_balance_btc');
                      const eurRate  = fnum('sensor.btc_eur_price');
                      const blockStr = blockH  !== null ? Math.round(blockH).toLocaleString('de-DE')          : '—';
                      // Block-Tick: bei neuem Block flippt die Zahl orange auf und glueht
                      // FLASH_MS lang aus. Die Karte re-rendert bei jedem Sensor-Tick (PV,
                      // SoC, ...) komplett neu; darum negative animation-delay = Blockalter,
                      // so setzt jeder Re-Render die Animation nahtlos an der richtigen
                      // Stelle fort, statt sie neu zu starten.
                      // 15.10.2026, Lab-Replay: dort kommt ein Block je 10 Sim-Minuten, also
                      // alle lab_demo_block_s Sekunden (z. B. 11,1 s); 60 s Leuchten liefen nie
                      // aus. Im Replay leuchtet die Zahl darum nur 2 Sim-Minuten, aus dem
                      // eingestellten Tempo berechnet. Das Blockalter zaehlt dort ab der Ankunft
                      // im Browser (bei ~2 s Fenster verschluckte ein paar Sekunden Versatz
                      // zwischen Browser- und HA-Uhr das Leuchten sonst ganz). Prod unveraendert.
                      const simBlockS = (simOn && states['sensor.lab_sim_profile'])
                        ? parseFloat(states['input_number.lab_demo_block_s']?.state) : NaN;
                      const FLASH_MS = simBlockS > 0 ? Math.round(2 * simBlockS / 10 * 1000) : 60000;
                      let bhAge;
                      if (simBlockS > 0) {
                        const seen = (window.__bgzBlockSeen = window.__bgzBlockSeen || {});
                        if (seen.h !== blockH) { seen.h = blockH; seen.at = Date.now(); }
                        bhAge = Date.now() - seen.at;
                      } else {
                        const bhLc = states['sensor.bitcoin_block_height']?.last_changed;
                        bhAge = bhLc ? Date.now() - new Date(bhLc).getTime() : Infinity;
                      }
                      const blockAnim = (bhAge >= 0 && bhAge < FLASH_MS)
                        ? `animation:bgz-block-tick ${FLASH_MS}ms linear ${-Math.round(bhAge)}ms both;`
                        : '';
                      let priceStr = eurRate !== null ? Math.round(eurRate).toLocaleString('de-DE') + ' <span style="font-size:0.6em;font-weight:400;color:var(--secondary-text-color);opacity:0.7">€</span>' : '—';
                      const haveBal  = balBtc !== null && balBtc > 0;
                      const satsStr  = haveBal ? Math.round(balBtc * 1e8).toLocaleString('de-DE') + ' <span style="font-size:0.6em;font-weight:400;color:var(--secondary-text-color);opacity:0.7">SATs</span>' : '—';
                      const euroSub  = (haveBal && eurRate !== null && eurRate > 0)
                        ? '≈ ' + (balBtc * eurRate).toLocaleString('de-DE', {minimumFractionDigits: 2, maximumFractionDigits: 2}) + ' €'
                        : '';

                      // ── Vergleich zu gestern ──────────────────────────────────────
                      // Kurs: % gegen den Tagesstart-Kurs (= gestriger Schlusskurs eines
                      // 24/7-Assets), gesichert um 00:00 in input_number.btc_eur_day_start
                      // (Automation pool_midnight_baseline_reset). Vor dem ersten
                      // Mitternachts-Lauf ist der Wert 0 → kein Delta, Karte bleibt sauber.
                      const up = 'var(--bg-color-eco,#4CAF50)', down = 'var(--bg-color-reserve,#EF5350)';
                      // em-relativ: skaliert mit der jeweiligen Zeile. Das Inline-Delta hinter
                      // SATs steht auf der grossen Stat-Zeile und wird klein gehalten (0.5em),
                      // damit es nicht ueber den Kartenrand laeuft; das Euro-Delta in der
                      // kleinen Unterzeile bleibt bei 0.72em.
                      const dchip = (txt, col, em) => `<span style="font-size:${em || 0.72}em;font-weight:600;margin-left:4px;color:${col}">${txt}</span>`;
                      const eurPrev = fnum('input_number.btc_eur_day_start');
                      let priceSub = '';
                      if (eurRate !== null && eurPrev !== null && eurPrev > 0) {
                        const dp = (eurRate - eurPrev) / eurPrev * 100;
                        const s  = (dp >= 0 ? '+' : '−')
                                 + Math.abs(dp).toLocaleString('de-DE', {minimumFractionDigits: 2, maximumFractionDigits: 2});
                        priceStr += dchip(`(${s} %)`, dp >= 0 ? up : down, 0.5);
                      }

                      // Balance: gestern geminte SATs (Tagesertrag). Gleiche Quellen und
                      // Priorität wie der Mining-Verlauf (views/miner_stats.yaml): Settlement-
                      // History → payout_history → pool_btc_daily_log, damit beide Karten
                      // exakt denselben Tageswert zeigen. Auszahlungs-robust, da der Ertrag
                      // (nicht das schwankende Pool-Guthaben) gezählt wird.
                      // Lab-Replay (17.10.2026): "gestern" relativ zum Sim-Datum.
                      const simDayY = states['input_boolean.simulation_mode']?.state === 'on'
                        ? (states['sensor.lab_sim_profile']?.state || '') : '';
                      const yIso = (() => { const d = /^\d{4}-\d{2}-\d{2}$/.test(simDayY)
                          ? new Date(simDayY + 'T12:00:00') : new Date(); d.setDate(d.getDate() - 1);
                        return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; })();
                      let yBtc = null;
                      (states['sensor.pool_settlement_history']?.attributes?.transactions ?? []).forEach(tx => {
                        const md = tx.mining_extra?.mining_date; if (!md) return;
                        const sd = new Date(md * 1000); sd.setUTCDate(sd.getUTCDate() - 1);
                        if (sd.toISOString().slice(0, 10) !== yIso) return;
                        const v = parseFloat(tx.amount ?? tx.changed_balance);
                        if (v > 0) yBtc = v;
                      });
                      if (yBtc === null) {
                        (states['sensor.pool_balance_btc']?.attributes?.payout_history ?? []).forEach(e => {
                          if (!e[0] || !e[2]) return;
                          const sd = new Date(e[0]); sd.setUTCDate(sd.getUTCDate() - 1);
                          if (sd.toISOString().slice(0, 10) === yIso) yBtc = e[2];
                        });
                      }
                      if (yBtc === null) {
                        const raw = states['input_text.pool_btc_daily_log']?.state ?? '';
                        (raw && raw !== 'unknown' && raw !== 'unavailable' ? raw.split('|') : []).forEach(e => {
                          const [d, b] = e.split(','); if (d === yIso) { const v = parseFloat(b); if (v > 0) yBtc = v; }
                        });
                      }
                      const haveYield = yBtc !== null && yBtc > 0;
                      const satsDelta = haveYield ? dchip('(+' + Math.round(yBtc * 1e8).toLocaleString('de-DE') + ')', up, 0.5) : '';
                      const euroDelta = (haveYield && eurRate !== null && eurRate > 0)
                        ? dchip('(+' + (yBtc * eurRate).toLocaleString('de-DE', {minimumFractionDigits: 2, maximumFractionDigits: 2}) + ' €)', up)
                        : '';
                      const satsLine = haveBal ? satsStr + satsDelta : satsStr;
                      const balSub   = euroSub ? euroSub + euroDelta : '';

                      // 17.10.2026, Nutzer-Wunsch "die Linie ueber Blockzeit/Balance/Kurs auf
                      // einer Hoehe mit der Linie in der Wetterkarte": beide Fussbereiche
                      // sind am Kartenboden verankert (hier space-between, im Wetter
                      // justify-content:flex-end), die Linie liegt damit in jeder Kartenhoehe
                      // gleich weit ueber dem Rand. Mindesthoehe der Fussleiste = Hoehe des
                      // Stundenstreifens im Wetter (gemessen 69,7 px = .forecast, Rand 12 px
                      // in beiden Karten identisch). Angegeben in CSS-px dieser Karte, die
                      // im 0,87-Spaltenzoom 0,87 sichtbare px ergeben: 80,1 x 0,87 = 69,7.
                      const footMin = 80.1;
                      return `
                        <style>
                          @keyframes bgz-block-tick {
                            0%   { transform:rotateX(90deg); color:var(--bg-color-super,#F7931A); text-shadow:0 0 16px rgba(247,147,26,.8); }
                            1%   { transform:rotateX(0);     color:var(--bg-color-super,#F7931A); text-shadow:0 0 16px rgba(247,147,26,.8); }
                            70%  { transform:rotateX(0);     color:var(--bg-color-super,#F7931A); text-shadow:0 0 8px rgba(247,147,26,.4); }
                            100% { transform:rotateX(0);     color:var(--primary-text-color); text-shadow:0 0 0 rgba(247,147,26,0); }
                          }
                        </style>
                        <div style="display:flex;flex-direction:column;height:100%;width:100%;justify-content:space-between;gap:10px">
                          <div style="display:flex;gap:16px;align-items:center">
                            <div style="flex:1;min-width:0;display:flex;justify-content:center">
                              <img src="/local/${img}?v=20261017-6"
                                   style="width:100%;max-width:160px;aspect-ratio:1;border-radius:50%;
                                          object-fit:cover;filter:drop-shadow(0 0 1px rgba(0,0,0,.6))">
                            </div>
                            <div style="width:2px;align-self:stretch;background:linear-gradient(to bottom, transparent, var(--divider-color) 15%, var(--divider-color) 85%, transparent)"></div>
                            <div style="flex:2;min-width:0">
                              <div style="font-size:var(--bg-fs-title);font-weight:700;line-height:1.1;
                                          white-space:normal;overflow-wrap:break-word;
                                          color:var(--primary-text-color);margin-bottom:6px;${halo}">${head}</div>
                              <div style="font-size:var(--bg-fs-body);color:var(--secondary-text-color);line-height:1.3;
                                          white-space:normal;overflow-wrap:break-word;${halo}">${sub}</div>
                            </div>
                          </div>
                          <div style="display:flex;padding-top:8px;box-sizing:border-box;min-height:${footMin}px;
                                      background:linear-gradient(to right, transparent, var(--divider-color) 15%, var(--divider-color) 85%, transparent);
                                      background-repeat:no-repeat;background-size:100% 2px;background-position:top">
                            <div style="flex:1;min-width:0;text-align:center;display:flex;flex-direction:column;justify-content:center">
                              <div style="font-size:var(--bg-fs-label);text-transform:uppercase;letter-spacing:0.06em;
                                          color:var(--bgai-section-label-v3);margin-bottom:1px;${halo}">Blockzeit</div>
                              <div style="font-size:var(--bg-fs-title);font-weight:700;line-height:1;white-space:nowrap;${halo}${blockAnim}">${blockStr}</div>
                              <div style="font-size:var(--bg-fs-secondary);color:var(--secondary-text-color);opacity:0.7;
                                          white-space:nowrap;margin-top:1px;${halo}">&nbsp;</div>
                            </div>
                            <div style="width:2px;align-self:stretch;background:linear-gradient(to bottom, transparent, var(--divider-color) 15%, var(--divider-color) 85%, transparent)"></div>
                            ${stat('Balance', satsLine, balSub)}
                            <div style="width:2px;align-self:stretch;background:linear-gradient(to bottom, transparent, var(--divider-color) 15%, var(--divider-color) 85%, transparent)"></div>
                            ${stat('Kurs', priceStr, priceSub)}
                          </div>
                        </div>`;
                    ]]]
                styles:
                  card:
                    # Neutrales Glas, identisch zu Wetter/Horizont: alle Werte
                    # aus dem Theme (ha-card-*), kein Modus-Tint mehr.
                    - background: var(--ha-card-background)
                    - border-radius: var(--bgai-card-radius-v3)
                    # Der sichtbare Radius wird (wie bei den anderen Karten) hart
                    # von www/bitgrid_card_shape.js erzwungen (BUTTON-CARD im Set);
                    # styles.card border-radius allein greift hier nicht sichtbar.
                    # overflow:hidden clippt zusaetzlich den Inhalt auf den Radius.
                    - overflow: hidden
                    - border: var(--bgai-card-border-width-v3) solid var(--bgai-card-border-v3)
                    - box-shadow: var(--bgai-card-shadow-v3)
                    - padding: 12px
                  grid:
                    - grid-template-areas: '"hamster"'
                    - grid-template-columns: 1fr
                  custom_fields:
                    hamster:
                      - height: 100%
                      - width: 100%
                      - justify-self: stretch
                      - align-self: stretch

          # ═══════════════════════════════════════════════════════════
          # ZEILE 2 LINKS  —  Energiefluss (g2l), gepaart mit Verlauf (g2r).
          # ═══════════════════════════════════════════════════════════
          - type: vertical-stack
            view_layout:
              grid-area: g2l
            # View-Skalierung 80%, Begruendung s. g1l.
            card_mod:
              style: |
                :host {
                  zoom: 0.8 !important;
                }
            cards:

              # ── Gruppen-Titel: ENERGIEFLUSS ──────────────────────────────
              # "Energie" verworfen (31.08.2026, Nutzer-Feedback "passt noch
              # nicht ganz"): war der generische Gruppenname aus v2, als
              # Hamster+Energiefluss noch EINE gemeinsame Gruppe bildeten.
              # Seit der BitGridAI/Energie-Aufspaltung beschriftet er nur noch
              # die Flussdiagramm-Karte, "Energiefluss" (wie im Code-Kommentar
              # darunter) trifft den Inhalt genauer und passt zur Konvention
              # der übrigen Titel (Miner, Wetter, Verlauf (heute), Finanzen:
              # alle benennen konkret, was folgt, nicht die Oberkategorie).
              - type: custom:button-card
                template: group_header
                icon: mdi:lightning-bolt
                name: Energiefluss

              # ═══════════════════════════════════════════════════════════
              # ENERGIEFLUSS  —  Energie-Gruppe unten (flu, volle linke Breite)
              # KEIN flex:1/Höhenangleichung an Verlauf — zweiter Fehlversuch
              # (02.09.2026, Nutzer-Feedback "kaputt", identisches Symptom wie
              # der erste am 31.08.2026): selbst mit dem aus dem Bundle-Code
              # verifizierten .card-content-Selektor (position:relative;
              # margin:0 auto, keine eigene Hoehe) blieb der Flow-Diagramm-
              # Inhalt spuerbar unzentriert mit grossem Leerraum unten. PFCP
              # spielt intern offenbar grundsaetzlich nicht zuverlaessig mit
              # Hoehen-Streckung mit, unabhaengig vom Selektor — kein dritter
              # Versuch ohne neue Erkenntnis. Energiefluss bleibt bei seiner
              # natuerlichen Hoehe, genau wie Finanz-Bilanz das schon fuer
              # denselben Grund seit 23.08.2026 tut.
              # ═══════════════════════════════════════════════════════════
              - type: custom:power-flow-card-plus
                card_mod:
                  style: |
                    /* Padding einheitlich 12px (02.09.2026, wie Verlauf/
                       Finanzen): PFCP setzt selbst kein eigenes Padding
                       (Bundle-Code verifiziert: .card-content{position:
                       relative;margin:0 auto}, keine padding-Zeile), erbt
                       den HA-Standard von 16px. */
                    .card-content {
                      padding: 12px !important;
                    }
                    /* 12.09.2026, Hell-Umbau: diese Karte hatte laut Kommentar
                       unten nie eigenes card_mod fuer Hintergrund/Rand ("kommen
                       vom Theme") — bezog sich auf die generischen ha-card-*-
                       Tokens, deren View-:host-Umleitung nachweislich nicht
                       ankommt. Direkt hier erzwungen wie bei den anderen
                       Home-Karten. */
                    ha-card {
                      background: var(--ha-card-background) !important;
                      border-radius: var(--bgai-card-radius-v3) !important;
                      border: var(--bgai-card-border-width-v3) solid var(--bgai-card-border-v3) !important;
                      box-shadow: var(--bgai-card-shadow-v3) !important;
                    }
                    /* Schrift groesser (Nutzer-Wunsch 02.09.2026). Klassen aus
                       dem echten Bundle-Quellcode (power-flow-card-plus.js,
                       github.com/flixlix/power-flow-card-plus) verifiziert,
                       nicht geraten: .label sind die Knotennamen (PV/Netz/
                       Haus/...), .secondary-info die Watt-/Prozent-Werte,
                       beide fix auf 12px ohne eigenes !important. Diese Zeile
                       hat KEIN align-items:stretch-Pairing mit Verlauf (s.
                       Kommentar oben), daher niedrigeres Ueberlauf-Risiko als
                       bei der Hamster-Karte. */
                    /* 12.09.2026, laengere Nutzer-Wunschrunde: zwischen
                       vollem globalen Halo (identisch Hamster-Karte, zweimal
                       als "zu viel" abgelehnt) und komplett ohne Halo
                       (ebenfalls abgelehnt, "nicht ganz weg") pendelt der
                       Nutzer-Wunsch zur selben, lokal abgeschwaechten Fassung
                       zurueck (0 0 2px statt 0 0 4px, zweilagig statt
                       dreilagig, .85 statt .85 Deckkraft aber duennerer
                       Blur) — gilt nur hier, der globale Wert bleibt fuer
                       alle anderen Karten unangetastet. NICHT erneut auf
                       "voller Hamster-Halo" hochsetzen, ohne dass der Nutzer
                       das explizit nochmal verlangt. */
                    :host {
                      --primary-text-color: #F5F8FC;
                      --secondary-text-color: #F5F8FC;
                      --bgai-header-halo-v3: 0 0 2px rgba(0,0,0,.85), 0 0 2px rgba(0,0,0,.85);
                      --bgai-header-icon-halo-v3: drop-shadow(0 0 1.5px rgba(0,0,0,.75));
                    }
                    /* 13.09.2026, Nutzer-Wunsch: Bubble-Bezeichner (PV/Netz/
                       Haus/Geraete/...) nicht mehr fett, dafuer getrennt von
                       .secondary-info (Watt-/Prozent-Werte), die fett bleiben. */
                    .label {
                      font-size: 14px !important;
                      font-weight: 400 !important;
                      color: #F5F8FC !important;
                      text-shadow: var(--bgai-header-halo-v3) !important;
                    }
                    .secondary-info {
                      font-size: 14px !important;
                      font-weight: 700 !important;
                      color: #F5F8FC !important;
                      text-shadow: var(--bgai-header-halo-v3) !important;
                    }
                    /* span-Selektoren bewusst spezifisch (Tag+Klasse), sonst
                       treffen sie auch gleichnamige SVG-Kreissegmente/-Pfade.
                       Klassen gegen den echten Bundle-Quellcode verifiziert
                       (power-flow-card-plus.js, github.com/flixlix/power-
                       flow-card-plus heruntergeladen und durchsucht, nicht
                       geraten): Solar-Wert und Batterie-Prozent haben keine
                       .secondary-info-Klasse (eigener <span class="solar">
                       bzw. nur id="battery-state-of-charge-text"), Grid-/
                       Batterie-Pfeile laufen ueber eigene Klassen (.consumption/
                       .return/.battery-in/.battery-out), individuelle Geraete
                       (Heizstab/Geraete) ueber .individual-top/-bottom, der
                       Haus-Wert ist unverpackter Text direkt in #home-circle. */
                    span.solar,
                    #battery-state-of-charge-text,
                    span.consumption,
                    span.return,
                    span.battery-in,
                    span.battery-out,
                    span.individual-top,
                    span.individual-bottom,
                    #home-circle {
                      font-weight: 700 !important;
                      color: #F5F8FC !important;
                      text-shadow: var(--bgai-header-halo-v3) !important;
                    }
                    /* Pfeil-ha-icons faerben sich per currentColor selbst ueber
                       eine spezifischere interne Regel ein, color auf dem Text
                       greift nicht auf das verschachtelte ha-icon-Kind — hier
                       direkt erzwungen. Node-Icons (#grid-icon/#solar-icon/...)
                       per Attribut-Selektor in einem Rutsch statt jede ID
                       einzeln. */
                    /* Die Pfeil-Icons an den Flusslinien bleiben weiss: sie
                       gehoeren zur Linie, nicht zum Knoten. */
                    .consumption ha-icon,
                    .return ha-icon,
                    .battery-in ha-icon,
                    .battery-out ha-icon {
                      color: #F5F8FC !important;
                      filter: var(--bgai-header-icon-halo-v3) !important;
                    }
                    /* 16.09.2026, Nutzer-Wunsch "Bubblefarbe auf das Icon
                       nachziehen": die Knoten-Icons standen bisher per
                       [id$="-icon"] pauschal auf Weiss, was jede Knotenfarbe
                       ueberschrieben hat. Jetzt nur noch der Halo hier, die
                       Farbe kommt aus PFCPs --icon-*-Variablen (unten gesetzt
                       bzw., fuer die Individual-Bubbles, label-basiert aus
                       www/bitgrid_card_shape.js). */
                    [id$="-icon"] {
                      filter: var(--bgai-header-icon-halo-v3) !important;
                    }
                    /* !important ist hier Pflicht: PFCP schreibt diese vier
                       Variablen SELBST als Inline-Style auf das Kartenelement
                       (im Bundle verifiziert: e.style.setProperty("--icon-solar-
                       color", ...)). Eine gewoehnliche CSS-Regel auf demselben
                       Element verliert gegen Inline, eine !important-Regel
                       gewinnt. Ohne das blieben die Knoten-Icons weiss, waehrend
                       die Individual-Bubbles korrekt einfaerbten, weil
                       www/bitgrid_card_shape.js dort ebenfalls inline schreibt. */
                    :host {
                      --icon-solar-color: var(--bgai-pv-v3) !important;
                      --icon-grid-color: var(--bgai-grid-v3) !important;
                      --icon-battery-color: var(--bgai-home-v3) !important;
                      /* Haus bleibt neutral (Nutzer-Vorgabe 16.09.2026): sein
                         Ring ist eine Herkunftsanzeige aus Segmenten, keine
                         Rollenfarbe. Nur die uebrigen Knoten tragen Farbe. */
                      --icon-home-color: #F5F8FC !important;
                    }
                    /* 12.09.2026, Nutzer-Befund "PV-Bubble schliesst nicht
                       sauber an die Linien an", praezisiert: "durch Schatten
                       schlimmer" (nicht vorbestehend). Ursache: der Blur des
                       Linienenden-Schattens reicht optisch ueber das
                       tatsaechliche Linienende hinaus — bei einem Ring, der
                       nur ein Strich ist (kein gefuellter Kreis), wirkt das
                       wie ein tieferes Hineinreichen in den Ring. Fix:
                       Linien bekommen einen deutlich kleineren, eigenen
                       Schatten statt des Icon/Ring-Werts. */
                    .circle {
                      filter: var(--bgai-header-icon-halo-v3) !important;
                    }
                    /* Der frueher hier stehende, fest auf .individual-right-top
                       verdrahtete Heizstab-Override ist entfallen (16.09.2026):
                       er war ein Workaround fuer PFCPs Cascade-Tie und haette
                       jede andere Bubble blau gefaerbt, sobald sie in diesem
                       Slot landet. Die Farbe kommt jetzt label-basiert aus
                       www/bitgrid_card_shape.js. */
                    /* 12.09.2026, Nutzer-Wunsch "Ringe 1px dicker": erster
                       Versuch traf ALLE .circle-Elemente inkl. Home und brach
                       dort sichtbar (Doppelring/Versatz) — PFCP-Bundle
                       bestaetigt ein eigenes ".home-circle-sections"-Element
                       beim Home-Knoten (Solar-/Netz-Anteilsfarbe), dessen
                       Geometrie auf den 2px-Standardrand abgestimmt ist und
                       bei einem dickeren Rand nicht mehr passt. Jetzt gezielt
                       ueber .circle-container.home ausgeschlossen (echte
                       Wrapper-Klasse, verifiziert im Bundle), alle anderen
                       Ringe (PV, Netz, Batterie, Miner, Geraete) werden
                       dicker, Home bleibt beim PFCP-Default. */
                    .circle-container:not(.home) .circle {
                      border-width: 3px !important;
                    }
                    /* 12.09.2026, Nutzer-Wunsch "Bubbles schwarze Outline
                       1px" versucht + auf Nutzer-Wunsch wieder entfernt
                       ("duenner oder wegmachen"). */
                    .lines svg {
                      filter: drop-shadow(0 0 0.75px rgba(0,0,0,.75)) !important;
                    }
                    /* 12.09.2026: erster Anlauf "Linien dicker" kam gekoppelt
                       mit einem z-index-Stacking-Fix, der den Home-Ring kaputt
                       gemacht hat — diesmal NUR die Stroke-Width, kein
                       Stacking angefasst. PFCP-Bundle-Default fuer die Fluss-
                       Linien (<path> in .lines) ist stroke-width:1 (SVG-
                       Nutzereinheit, per viewBox hochskaliert, kein echtes
                       CSS-Pixel). */
                    .lines svg path {
                      stroke-width: 1.5 !important;
                    }
                    /* 12.09.2026, Nutzer-Befund "nicht alle Striche wurden
                       dicker": vermutlich liegen die individuellen
                       Verbindungslinien (Miner/Geraete/Heizstab) in einem
                       eigenen, anders verschachtelten Container als die 4
                       statischen Knoten (PV/Netz/Batterie/Home) — breiterer
                       Selektor ohne die .lines-Bedingung, um wirklich jeden
                       <path> in jedem <svg> dieser Karte zu treffen. */
                    svg path {
                      stroke-width: 1.5 !important;
                    }
                clickable_entities: true
                # Runde Ecken/Hintergrund kommen vom Theme (ha-card-border-radius)
                # plus www/bitgrid_card_shape.js: PFCP clippt seinen Hintergrund
                # nicht selbst auf den Theme-Radius, und card-mod ist hier nicht
                # installiert. Das Modul injiziert den Radius in den Shadow-Root.
                # Farbpalette 24.08.2026 auf die v3-Datenrollen umgestellt
                # (--bgai-*-v3, themes/bitgrid.yaml): PV gelb, Netz violett,
                # Zuhause+Batterie gruen, Geraete eigene Rosé-Rolle. Ersetzt
                # die vorherige eigenstaendige Pastell-Insel — nur in v3, v1/v2
                # behalten ihre eigene PFCP-Instanz unveraendert (separate Datei).
                entities:
                  grid:
                    entity:
                      consumption: sensor.grid_import_w
                      production: sensor.grid_export_w
                    color:
                      consumption: "var(--bgai-grid-v3)"
                      production: "var(--bgai-grid-v3)"
                  solar:
                    entity: sensor.pv_power_w
                    color: "var(--bgai-pv-v3)"
                    # 12.09.2026, Nutzer-Wunsch "nur eine Sonne": ersetzt PFCPs
                    # Default-Icon (Solarpanel+Blitz) durch ein reines Sonnen-
                    # Symbol. mdi:weather-sunny zunaechst versucht, dann auf
                    # Nutzer-Wunsch auf mdi:white-balance-sunny umgestellt.
                    icon: mdi:white-balance-sunny
                  battery:
                    entity: sensor.battery_power_flowchart_w
                    state_of_charge: sensor.battery_soc_pct
                    color:
                      consumption: "var(--bgai-home-v3)"
                      production: "var(--bgai-home-v3)"
                  home:
                    entity: sensor.house_load_w
                    # "Haus" statt PFCP-Default "Zuhause" (24.08.2026, Nutzer-
                    # Wunsch): einheitlich mit "Hausverbrauch" im Verlauf-Chart
                    # und "PV-Eigenverbrauch" in der Finanz-Bilanz-Karte.
                    name: Haus
                    # Ringfarbe (nicht das Icon, das bleibt weiss) 24.08.2026
                    # auf die Geraete/Rosa-Rolle umgestellt (Nutzer-Wunsch),
                    # analog zu Hausverbrauch im Verlauf-Chart. Batterie
                    # behaelt die Zuhause/Akku-Gruen-Rolle (s.u.). Literales
                    # Hex statt var(--bgai-geraete-v3): mit var() blieb
                    # der Ring gruen, obwohl dieselbe var()-Zeile bei der
                    # "Geraete"-individual-Bubble korrekt Rosa rendert —
                    # Verdacht: PFCPs dedizierter "home"-Knoten verarbeitet
                    # die Farbe JS-seitig (Schatten/Glow o.ae.) und loest
                    # dabei var() nicht auf, waehrend "individual"-Eintraege
                    # den String nur als CSS durchreichen (gleiche Bugklasse
                    # wie apexcharts-card, s.o.). Noch nicht am Live-Dashboard
                    # verifiziert, nur die naheliegendste Erklaerung.
                    color: "#f49891"
                  # Zwei Miner statt eines Summen-Knotens (gleiche Shelly-Quellen,
                  # aus denen sensor.miner_total_power_w summiert). Die Bubble-Farbe
                  # wird NICHT hier statisch gesetzt, sondern live nach Leistung von
                  # www/bitgrid_card_shape.js eingefärbt (< 500 W grau, 500–1000 W grün,
                  # 1000–1500 W cyan, ab 1500 W orange): das Modul liest den Shelly-Sensor und
                  # überschreibt die PFCP-CSS-Variable --individual-<slot>-color.
                  # color: hier ist nur der Fallback, falls das Modul (noch) nicht
                  # greift — neutrales Grau, damit nichts grell aufblitzt.
                  # Slot-Zuordnung über den Bubble-Namen (span.label).
                  individual:
                    - entity: sensor.miner1_sim_power   # Sim: /2 der Sim-Miner-Leistung, sonst Passthrough Shelly
                      name: "Miner #1"
                      icon: mdi:pickaxe
                      # 16.09.2026: war #757575 Grau, ein Rest der entfernten
                      # leistungsabhaengigen Einfaerbung. Jetzt die Mining-Rolle
                      # aus der Datenrollen-Palette (bgai-mining-v3).
                      color: "#F7931A"
                      display_zero: false
                      display_zero_tolerance: 25
                    - entity: sensor.miner2_sim_power   # Sim: /2 der Sim-Miner-Leistung, sonst Passthrough Shelly
                      name: "Miner #2"
                      icon: mdi:pickaxe
                      # 16.09.2026: war #757575 Grau, ein Rest der entfernten
                      # leistungsabhaengigen Einfaerbung. Jetzt die Mining-Rolle
                      # aus der Datenrollen-Palette (bgai-mining-v3).
                      color: "#F7931A"
                      display_zero: false
                      display_zero_tolerance: 25
                    # Heizstab: keine der sechs Datenrollen trifft zu (kein PV/
                    # Mining/Zuhause/Netz/Geraete/Summe-Konzept) — Farbe bewusst
                    # unveraendert gelassen, siehe Rueckfrage an Nutzer.
                    - entity: sensor.ac_elwa_2_power1_solar
                      name: Heizstab
                      icon: mdi:water
                      color: "#5C9EE2"
                    # Summierte Haushalts-Plugs aus dem Geräte-Tab (Kühlschränke,
                    # Waschmaschine, TV, Büro, Lüftung, Server/NAS/KI-Agent;
                    # packages/devices.yaml). Teilmenge
                    # der Haus-Last, wie die Miner: PFCP zieht das nicht vom
                    # Haus-Knoten ab, die Bubble macht den Anteil nur sichtbar.
                    - entity: sensor.geraete_power_w
                      name: Geräte
                      icon: mdi:power-plug
                      # 12.09.2026, Testversuch nach mehreren gescheiterten
                      # Fixes (Theme-Token korrigiert, dynamisches Faerbe-
                      # Skript ganz entfernt — Bubble blieb trotzdem grau):
                      # literaler Hex statt var(), analog zum PFCP-Home-Ring
                      # (Zeile oben), der laut Kommentar dort var() ebenfalls
                      # nicht zuverlaessig aufloest. War fuer "individual"-
                      # Eintraege bisher nur VERMUTET, nicht bestaetigt, dass
                      # var() hier funktioniert.
                      color: "#f49891"
                      display_zero: false
                      display_zero_tolerance: 10

          # ═══════════════════════════════════════════════════════════
          # ZEILE 3 LINKS  —  Miner-Steuerung (g3l), gepaart mit Finanzen (g3r).
          # ═══════════════════════════════════════════════════════════
          - type: vertical-stack
            view_layout:
              grid-area: g3l
            # align-self:start wieder da (02.09.2026, zweiter Fehlversuch,
            # Nutzer-Feedback "kaputt, zu viel Padding nach unten"): der
            # flex:1 1 0 + justify-content:space-between-Ansatz in
            # steuerung_quick.yaml sah live trotzdem nicht gut aus — gleiche
            # Lehre wie bei Energiefluss/PFCP am selben Tag (s. dort).
            # Miner-Boxen bleiben bei natuerlicher Hoehe, oben in der Zeile.
            # zoom: View-Skalierung 80%, Begruendung s. g1l.
            card_mod:
              style: |
                :host {
                  align-self: start !important;
                  zoom: 0.8 !important;
                }
            cards:

              # ── Gruppen-Titel: MINER ─────────────────────────────────────
              - type: custom:button-card
                template: group_header
                icon: mdi:pickaxe
                name: Miner

              # ═══════════════════════════════════════════════════════════
              # STEUERUNG QUICK-ACTION  —  schneller Moduswechsel für beide
              # Miner, ohne Kennzahlen-Panel. views/steuerung_quick.yaml,
              # Header verlinkt in den vollen Steuerung-Tab.
              # ═══════════════════════════════════════════════════════════
              - !include views/steuerung_quick.yaml

          # ═══════════════════════════════════════════════════════════
          # ZEILE 1 RECHTS  —  Wetter (g1r, nur Uhr+Icon + stündlicher
          # Streifen), gepaart mit BitGridAI/Hamster (g1l).
          # ═══════════════════════════════════════════════════════════
          - type: vertical-stack
            view_layout:
              grid-area: g1r
            # View-Skalierung 80%, Begruendung s. g1l.
            card_mod:
              style: |
                :host {
                  zoom: 0.8 !important;
                }
            cards:

              # ── Gruppen-Titel: WETTER ────────────────────────────────────
              - type: custom:button-card
                template: group_header
                icon: mdi:weather-partly-cloudy
                name: Wetter

              # ═══════════════════════════════════════════════════════════
              # WETTER  —  einzige Wetteranzeige im Demo-Layout: Uhr+Icon
              # (clock-weather-card, nur Heute-Bereich) über dem stündlichen
              # Streifen (weather-forecast). 5-Tage-Vorschau und Sonnenstand
              # entfallen hier bewusst (siehe Kopfkommentar).
              # 12.09.2026, Nutzer-Wunsch "die 2 Wetterkarten zusammen in eine
              # Karte machen und einen Strich wie bei BitGridAI dazwischen":
              # clock-weather-card und weather-forecast bleiben zwei getrennte
              # Custom-Elemente (koennen nicht wie beim Hamster-Button-Card zu
              # einer einzigen HTML-Struktur verschmolzen werden), werden aber
              # in einen eigenen inneren vertical-stack gepackt, der die
              # sichtbare Aussenkarte uebernimmt (Hintergrund/Rand/Schatten auf
              # #root statt auf jeder ha-card einzeln). --vertical-stack-card-
              # gap:0 (offizielle Variable der Karte, github.com/home-
              # assistant/frontend hui-vertical-stack-card.ts) entfernt den
              # Default-Abstand (8px) zwischen den beiden Kindern; der Abstand
              # zum "WETTER"-Gruppentitel darueber bleibt unveraendert (der
              # liegt im AEUSSEREN g1r-Stack, dessen eigener Gap unangetastet
              # bleibt). Jede innere Karte verliert ihre EIGENE border/box-
              # shadow (sonst Doppel-Rand/-Schatten an der Naht), die Trennlinie
              # kommt als einzelner border-top auf die untere Karte (weather-
              # forecast), 1:1 dieselbe Optik wie der Strich in der Hamster-
              # Karte (var(--divider-color)).
              # ═══════════════════════════════════════════════════════════
              - type: vertical-stack
                card_mod:
                  # 12.09.2026, Nutzer-Befund "immer noch eckig" trotz gleicher
                  # :host/#root-Regeln wie unten schon versucht: recherchiert
                  # (github.com/thomasloven/lovelace-card-mod Issues/Docs) statt
                  # weiter geraten — vertical-stack-card gilt dort als bekannter
                  # Sonderfall, "funktioniert nicht direkt" mit dem einfachen
                  # style:|-String; der dokumentierte Workaround ist die
                  # Punkt-Schluessel-Form (style: {".": |...}), die card_mod
                  # zwingt, wirklich die Karte selbst (nicht irgendeinen
                  # Kind-Shadow-Root) als Ziel zu nehmen. Erklaert im Nachhinein
                  # auch, warum gap/Hintergrund/Rand/Schatten schon griffen
                  # (Custom Properties + einfache Farb-Props koennen ueber
                  # Vererbung "durchsickern"), aber ausgerechnet border-radius
                  # nicht sichtbar wurde.
                  style:
                    ".": |
                      :host {
                        --vertical-stack-card-gap: 0 !important;
                        --stack-card-gap: 0 !important;
                        border-radius: var(--bgai-card-radius-v3) !important;
                        /* 17.10.2026, Nutzer-Wunsch "Karten nebeneinander immer
                           buendig": die Huelle waechst wie die Hamster-Karte
                           daneben auf die Hoehe der Spalte, den Wrapper darum
                           streckt www/bitgrid_wide.js; height:100% auf #root
                           gibt die Hoehe an den sichtbaren Rahmen weiter. */
                        flex: 1 1 auto !important;
                      }
                      /* Die Uhr-Karte (erstes Kind) fuellt den Rest der Huelle ueber
                         der Vorschau (18.10.2026; am 17.10. war es die Vorschau, dort
                         blieb ~20px Leerraum). Der hui-card-Wrapper ist display:block,
                         flex auf der Karte selbst griff nie. Die Vorschau behaelt ihre
                         natuerliche Hoehe am Boden, ihre Linie liegt so in jeder
                         Kartenhoehe gleich hoch wie die der Hamster-Karte. */
                      #root > :first-child {
                        flex: 1 1 auto !important;
                        display: flex !important;
                        flex-direction: column !important;
                      }
                      #root > :first-child > * {
                        flex: 1 1 auto !important;
                      }
                      #root {
                        height: 100% !important;
                        box-sizing: border-box !important;
                        gap: 0 !important;
                        background: var(--ha-card-background) !important;
                        border-radius: var(--bgai-card-radius-v3) !important;
                        border: var(--bgai-card-border-width-v3) solid var(--bgai-card-border-v3) !important;
                        box-shadow: var(--bgai-card-shadow-v3) !important;
                        overflow: hidden !important;
                      }
                cards:
                  # clock-weather-card (HACS: pkissling/clock-weather-card), nur der
                  # Heute-Bereich: Icon, aktuelle Lage, Uhr, Datum.
                  # Runde Ecken: Theme liefert ha-card-border-radius, aber die Karte
                  # clippt ihren Hintergrund nicht selbst darauf, das übernimmt
                  # www/bitgrid_card_shape.js (card-mod ist hier nicht installiert).
                  # fill-Icons statt animiert: farbig wie der Entwurf, aber leichter
                  # für das Wandtablet (Qualitätsziel Nachhaltigkeit/Edge-Schonung).
                  - type: custom:clock-weather-card
                    card_mod:
                      style: |
                        /* 12.09.2026, Nutzer-Befund "immer noch dunkelblau/grau"
                           trotz color:#F5F8FC !important direkt auf den Wrap-Tags
                           UND auf allen Nachfahren: keine dieser Regeln kam durch,
                           obwohl font-size/text-shadow auf denselben Selektoren
                           sichtbar griffen. Ursache gefunden in www/bitgrid_
                           card_shape.js: clock-weather-card-today hat einen
                           EIGENEN, tieferen Shadow-Root (todayEl.shadowRoot), card_
                           mod injiziert nur in den AEUSSEREN Shadow-Root der Karte
                           — eine dortige color-Regel erreicht -wrap-top/-bottom
                           also nie, waeh­rend font-size/text-shadow als vererbte
                           (nicht dort neu deklarierte) Werte durch den zweiten
                           Shadow-Root hindurch ankommen. shape.js injiziert seine
                           eigene Farbregel (CLOCK_TODAY_TEXT_CSS) deshalb explizit
                           per injectInto() direkt in todayEl.shadowRoot, liest dort
                           aber var(--primary-/--secondary-text-color) — genau
                           diese zwei Variablen hier lokal auf Weiss zu setzen
                           durchdringt jeden Shadow-Root (Custom Properties tun das
                           immer, eine normale color-Deklaration nicht) und war
                           darum der tatsaechlich wirksame Fix. */
                        :host {
                          --primary-text-color: #F5F8FC;
                          --secondary-text-color: #F5F8FC;
                        }
                        /* Padding oben kleiner (02.09.2026, Nutzer-Feedback
                           "oben noch zu viel Padding"): die Karte setzt selbst
                           kein eigenes Padding (styles.ts, github.com/pkissling/
                           clock-weather-card), erbt den HA-Standard von
                           .card-content (16px). Asymmetrisch wie bei den
                           Miner-Karten (steuerung_quick.yaml). */
                        .card-content {
                          padding: 4px 12px 12px 12px !important;
                        }
                        /* 12.09.2026, Hell-Umbau: s. Kommentar oben ("card-mod
                           ist hier nicht installiert") bezog sich nur auf Radius/
                           Hintergrund via generische Theme-Tokens, deren View-
                           :host-Umleitung nicht ankommt — hier direkt erzwungen.
                           border/box-shadow HIER RAUS (12.09.2026, Wetterkarten-
                           Merge, s. Kopfkommentar oben): die aeussere vertical-
                           stack-Huelle traegt jetzt Rand+Schatten fuer beide
                           Karten zusammen, ein zweiter Rand hier waere ein
                           sichtbarer Doppel-Rand an der Naht/aussen. background
                           bleibt (identischer Token wie die Huelle, keine
                           sichtbare Naht, aber schadet auch nicht als Fallback).
                           border:none EXPLIZIT (12.09.2026, Nutzer-Befund
                           "Bogen an der Naht sichtbar"): ha-card hat einen
                           Theme-Standardrand (--ha-card-border-width/-color),
                           der greift, sobald KEINE eigene border-Deklaration
                           mehr da ist (Weglassen ist nicht dasselbe wie
                           none) — genau der duenne gerundete Bogen an der
                           unteren Kante war dieser Default-Rand um die
                           eigene (shape.js-gerundete) Ecke der Karte. */
                        ha-card {
                          background: var(--ha-card-background) !important;
                          border-radius: var(--bgai-card-radius-v3) !important;
                          border: none !important;
                          /* 18.10.2026, Nutzer-Wunsch "Wettersymbol und Uhr mittig
                             zentriert, buendig wie links": die Karte fuellt den Platz
                             ueber der Trennlinie (Wrapper s. Inner-Stack unten) und
                             zentriert Symbol/Uhr vertikal darin, wie die Hamster-
                             Karte ihren Inhalt zwischen Rand und Linie. */
                          height: 100% !important;
                          box-sizing: border-box !important;
                          flex-direction: column !important;
                          justify-content: center !important;
                          /* Zwischen dieser Karte und der Trennlinie liegen ~10 px
                             Streifenrand: Mitte der Flaeche ueber der Linie = Mitte
                             der Karte + 5 px, daher oben 11,5 px (0,87-Zoom). */
                          padding-top: 11.5px !important;
                          /* 16.09.2026, Theme-Konsolidierung: box-shadow muss hier
                             EXPLIZIT none sein, nicht nur weggelassen. Der
                             Theme-Wurzelwert ist seitdem die scharfe 2px-Outline
                             (vorher ein weicher Schatten, der an der Naht nicht
                             auffiel) — ohne diese Zeile bekaeme die innere Karte
                             eine eigene schwarze Kontur im Merge-Stack. */
                          box-shadow: none !important;
                        }
                        /* Schriftgroessen (12.09.2026, Nutzer-Wunsch "wie bei
                           BitGridAI-Karte angleichen"): Wetterlage wie die
                           Erklaerzeile der Hamster-Karte (--bg-fs-body), Datum wie
                           deren kleine Stat-Unterzeile (--bg-fs-secondary), Farbe/
                           Deckkraft jeweils 1:1 von dort uebernommen (nicht nur die
                           Groesse). Frueherer Kommentar zur Tag-Namen-Eigenheit der
                           Karte (clock-weather-card rendert keine divs/spans,
                           sondern eigene Pseudo-Tags, s. styles.ts, github.com/
                           pkissling/clock-weather-card) gilt unveraendert weiter.
                           -center (die grosse Uhr) NICHT an --bg-fs-title gekoppelt:
                           ein Angleich-Versuch (12.09.2026) schrumpfte sie auf
                           1.5rem, Nutzer-Feedback direkt danach war ausdruecklich
                           "soll gross sein wie vorher oder sogar einen Tick
                           groesser" — bewusster Bruch mit der sonstigen 1:1-
                           Typo-Angleichung dieser Karte, die Uhr bleibt die
                           Ausnahme. 3.75rem statt vormals 3.57rem (Basis 3.5rem aus
                           der Karte selbst, feste height:4rem — height bleibt
                           deshalb explizit auto, sonst schneidet die groessere
                           Zeit ab). */
                        /* Groesse/Gewicht/Halo (12.09.2026, mehrere Nutzer-
                           Wunschrunden: Groesse an Hamster-Fliesstext angleichen,
                           dann weiss statt gedaempft, dann Fettung gegen den vom
                           dicken Halo optisch "grau" wirkenden duennen Strich).
                           KEIN color hier: eine direkte color-Regel auf diesen
                           Tags erreicht die eigentlichen Text-Nodes nachweislich
                           nicht (todayEl hat einen EIGENEN, tieferen Shadow-Root,
                           s. www/bitgrid_card_shape.js CLOCK_TODAY_TEXT_CSS,
                           injiziert per injectInto direkt dort hinein). Farbe
                           laeuft stattdessen ueber --primary-/--secondary-text-
                           color, lokal auf diesem Karten-:host oben auf Weiss
                           gesetzt (s. Kommentar dort) — Custom Properties
                           durchqueren jeden Shadow-Root, eine normale color-
                           Deklaration nicht. */
                        clock-weather-card-today-right-wrap-top,
                        clock-weather-card-today-right-wrap-bottom {
                          /* 1.15rem statt 1rem (18.10.2026; 1.25 und 1.5 getestet, zu gross, Nutzer-Wunsch "Sonnig, 32°C und das Datum
                             größer skalieren"). */
                          font-size: 1.15rem !important;
                          font-weight: 700 !important;
                          text-shadow: var(--bgai-header-halo-v3) !important;
                        }
                        clock-weather-card-today-right-wrap-center {
                          font-size: 4.25rem !important;
                          /* 12.09.2026, Nutzer-Wunsch "Uhrzeit nicht bold": die
                             Karte rendert die Uhr offenbar von sich aus fett,
                             hier explizit auf normal zurueckgesetzt. */
                          font-weight: normal !important;
                          height: auto !important;
                          text-shadow: var(--bgai-header-halo-v3) !important;
                        }
                        /* Wetterbeschreibung ("Teils bewoelkt, 19°C") unters Icon
                           statt ueber die Uhrzeit (02.09.2026, Nutzer-Wunsch). Die
                           Karte hat dafuer kein Config-Feld (README komplett
                           geprueft, nur hide_*-Toggles) — echtes DOM-Reordering
                           ist bei dieser Fremd-Karte nicht moeglich, daher per
                           display:contents die Zwischen-Container "aufloesen" und
                           Icon/Beschreibung/Uhr/Datum neu auf ein eigenes 2x2-Grid
                           verteilen. -today ist laut Quellcode (styles.ts,
                           github.com/pkissling/clock-weather-card) der echte
                           Flex-Container fuer Icon-links/Text-rechts. */
                        clock-weather-card-today {
                          display: grid !important;
                          grid-template-columns: 35% 65%;
                          grid-template-rows: auto auto;
                          grid-template-areas: "icon clock" "cond date";
                          align-items: center;
                          /* 12.09.2026, Nutzer-Wunsch "auch beim Wetter Divider-
                             Striche wie bei BitGridAI": echtes Grid-Element
                             hinzufuegen ist bei dieser Fremd-Karte nicht
                             moeglich (kein Zugriff auf ihr Template), daher
                             ein ::before-Pseudo-Element per position:absolute
                             an der Spaltengrenze (35%) plazieren — nimmt am
                             Grid nicht teil (out-of-flow), stoert "icon clock"/
                             "cond date" also nicht. */
                          position: relative;
                        }
                        clock-weather-card-today::before {
                          content: "";
                          position: absolute;
                          left: 35%;
                          top: 4px;
                          bottom: 4px;
                          width: 2px;
                          background: linear-gradient(to bottom, transparent, var(--divider-color) 15%, var(--divider-color) 85%, transparent);
                        }
                        clock-weather-card-today-left {
                          /* width:100% (02.09.2026, Nutzer-Feedback "Icon
                             mittig"): die Karte selbst setzt hier width:35%
                             (war relativ zum urspruenglichen Flex-Container
                             gedacht) — im neuen Grid ist das 35% von der
                             bereits 35% breiten Spalte, macht die Box viel zu
                             schmal und linksbuendig. Die Karten-eigene
                             justify-content:center (styles.ts) zentriert das Icon
                             dann korrekt innerhalb der vollen Zellbreite. */
                          grid-area: icon;
                          width: 100% !important;
                        }
                        /* Icon jetzt per Hoehe begrenzt statt per Breite
                           (02.09.2026, Nutzer-Feedback "oben zu viel Platz"):
                           die Karte selbst gibt dem Icon keine feste Groesse
                           (.grow-img: max-width/max-height:100%) — es fuellte
                           bisher seine eigene Bild-Intrinsic-Hoehe, die groesser
                           war als die Uhr, wodurch die Grid-Zeile "icon|clock"
                           sich an der Icon-Hoehe orientierte und die Uhr mit
                           Luft drumrum mittig sass (s. Kommentar bei
                           align-items:center auf -today weiter oben). Explizite
                           max-height, an die Uhr-Zeilenhoehe angeglichen, statt
                           width-Prozent: die Zeile richtet sich jetzt nach der
                           Uhr, nicht mehr nach dem Icon. */
                        clock-weather-card-today-left .grow-img {
                          width: auto !important;
                          max-height: 7rem !important;
                        }
                        clock-weather-card-today-right,
                        clock-weather-card-today-right-wrap {
                          display: contents !important;
                        }
                        clock-weather-card-today-right-wrap-top {
                          grid-area: cond;
                          text-align: center !important;
                          justify-self: center !important;
                        }
                        clock-weather-card-today-right-wrap-center {
                          grid-area: clock;
                        }
                        clock-weather-card-today-right-wrap-bottom {
                          /* text-align:end aus der Karte selbst (war fuer die
                             rechtsbuendige alte Position gedacht) explizit
                             auf center umgestellt, sonst rutscht das Datum an
                             den rechten Rand der Spalte statt unter die per
                             Flexbox zentrierte Uhrzeit (02.09.2026, Nutzer-
                             Feedback "Datum ist nicht unter der Uhrzeit"). */
                          grid-area: date;
                          text-align: center !important;
                          justify-self: center !important;
                        }
                    # Lab: deploy_ha_lab.py biegt diese Entity auf weather.lab_sim_weather
                    # (aufgezeichnetes Wetter des Replay-Tages) um, Prod bleibt unveraendert.
                    entity: weather.forecast_home
                    sun_entity: sun.sun
                    # clock-weather-card-i18n kennt nur Kurz-Codes (de, en, …); 'de-DE'
                    # fällt auf Englisch zurück. Luxon (date_pattern) rendert 'de'
                    # ebenfalls deutsch, also deckt 'de' beides ab.
                    locale: de
                    time_format: '24'
                    date_pattern: 'cccc, dd.LL.yyyy'
                    weather_icon_type: fill
                    animated_icon: false
                    hide_today_section: false
                    hide_forecast_section: true
                    hide_clock: false
                    hide_date: false

                  # Eingebaute weather-forecast-Karte, stündlich: horizontaler
                  # Zeitstrahl. show_current aus, weil die Karte darüber (Uhr) die
                  # aktuelle Lage schon zeigt. Runde Ecken: in
                  # www/bitgrid_card_shape.js mit aufgenommen (HUI-WEATHER-
                  # FORECAST-CARD), damit sie wie die anderen garantiert auf den
                  # Radius geclippt wird.
                  - type: weather-forecast
                    # flex:1 (31.08.2026): waechst auf die g1-Zeilenhoehe
                    # (Partner: Hamster-Karte, g1l), der stuendliche Streifen
                    # wird vertikal zentriert statt oben angepinnt.
                    card_mod:
                      style: |
                        :host {
                          flex: 1 1 auto !important;
                          /* s. clock-weather-card oben: gleicher lokaler Override,
                             damit .temp unten dieselbe --bg-fs-title-Groesse
                             bekommt wie die Stat-Werte der Hamster-Karte. */
                          --bg-fs-title: 1.5rem;
                          /* 26.09.2026: lokaler Override --secondary-text-color:
                             #F5F8FC (12.09.2026, damals sollten die Stunden-
                             Uhrzeiten weiss sein) entfernt. Nutzer-Wunsch jetzt:
                             Uhrzeit/Temperatur im Grauton der Hamster-Erklaerung,
                             also das Theme-Token #D3DEEA. FORECAST_CSS in
                             www/bitgrid_card_shape.js liest dafuer
                             var(--secondary-text-color), mit dem Override haette
                             das in dieser Karte weiter Weiss ergeben. */
                        }
                        /* 12.09.2026, Wetterkarten-Merge (s. Kopfkommentar
                           oben): border ersetzt durch einen einzelnen border-
                           top als Trennlinie zur Karte darueber, 1:1 Optik des
                           Strichs in der Hamster-Karte (border-top:1px solid
                           var(--divider-color)). Kein
                           eigenes box-shadow mehr — die aeussere vertical-
                           stack-Huelle traegt jetzt Rand+Schatten fuer beide
                           Karten zusammen (sonst Doppel-Schatten an der Naht). */
                        ha-card {
                          display: flex !important;
                          flex-direction: column !important;
                          /* flex-end statt center (17.10.2026, "Linien beider Karten
                             auf einer Hoehe"): der Streifen sitzt am Kartenboden,
                             seine Trennlinie liegt so in jeder Kartenhoehe 12px +
                             Streifenhoehe ueber dem Rand, passend zur Fussleiste der
                             Hamster-Karte. */
                          justify-content: flex-end !important;
                          padding: 12px !important;
                          background: var(--ha-card-background) !important;
                          /* border:none zuerst, danach gezielt nur die
                             Oberkante (12.09.2026, gleicher Fund wie bei
                             clock-weather-card oben): ohne das explizite
                             none haette der Theme-Standardrand links/rechts/
                             unten die eigene (shape.js-gerundete) Ecke der
                             Karte sichtbar umrandet statt sauber im #root-
                             Rand der Huelle aufzugehen. Kein eigenes border-
                             top hier mehr (12.09.2026, Nutzer-Befund "anderer
                             Strich als bei BitGridAI"): border-top DIREKT auf
                             ha-card sitzt am Aussenrand der Box (unabhaengig
                             von ha-cards eigenem Padding), lief also randlos
                             durch statt mit Platz an den Seiten wie beim
                             Hamster-Strich — UND ueberlagerte sich mit der
                             neuen, eingerueckten Trennlinie auf .forecast
                             (bitgrid_card_shape.js, styleWeatherMergeStack),
                             zwei Linien statt einer sauberen. Trennlinie
                             lebt jetzt ausschliesslich dort. */
                          border: none !important;
                          /* box-shadow explizit none, s. clock-weather-card oben
                             (16.09.2026, Theme-Konsolidierung). */
                          box-shadow: none !important;
                        }
                        /* 12.09.2026: Stundenlabel/Temperatur-Styling (Groesse,
                           Gewicht, Farbe, Halo, Grid-Reorder + Trenner) komplett
                           nach www/bitgrid_card_shape.js (FORECAST_CSS) verschoben.
                           Grund: die eingebaute Karte vergibt fuer die Uhrzeit
                           KEINE Klasse (nur .forecast > div > div:first-child
                           trifft sie strukturell), ".forecast-item-label" war ein
                           erfundener, nie treffender Selektor — card_mod kann sie
                           ausserdem nicht ins richtige Shadow-Root-Level injizieren
                           (dasselbe Problem wie bei clock-weather-card-today-
                           right-wrap-top/-bottom oben). shape.js injiziert direkt
                           in den Karten-Shadow-Root und erreicht sie zuverlaessig. */
                        /* 42.12px = 46.8px minus nochmal 10% (12.09.2026,
                           Nutzer-Wunsch, zweite Runde). */
                        .forecast-image-icon > * {
                          width: 42.12px !important;
                          height: 42.12px !important;
                        }
                    entity: weather.forecast_home
                    forecast_type: hourly
                    show_current: false
                    show_forecast: true
                    # 12.09.2026, Nutzer-Wunsch "keine Nachkommastelle": echtes
                    # Config-Feld der Karte (offizielle HA-Doku, dashboards/
                    # weather-forecast/), rundet serverseitig/im Frontend-Code der
                    # Karte selbst statt per nachtraeglicher Text-Manipulation.
                    # Ersetzt den vorherigen JS-Workaround in www/bitgrid_card_
                    # shape.js (roundForecastTemps/MutationObserver), der trotz
                    # mehrerer Anlaeufe (Intervall, dann MutationObserver) beim
                    # Nutzer weiterhin die Kommazahl zeigte.
                    round_temperature: true

          # ═══════════════════════════════════════════════════════════
          # ZEILE 2 RECHTS  —  Verlauf-Chart (g2r), gepaart mit Energiefluss
          # (g2l).
          #
          # 12.09.2026: Versuch, die Kartenhoehe ueber eine Flexbox-Kette
          # durch #root/:host/.bgai-card automatisch an Energiefluss'
          # natuerliche Hoehe anzugleichen, live gescheitert (Karte wurde
          # HOEHER statt gleich hoch, vermutlich weil ApexCharts' height:
          # "100%" gegen eine ueber mehrere Shadow-DOM-Grenzen unsicher
          # aufgeloeste Prozent-Kette einen unkontrollierten Wert bekam) —
          # zurueckgebaut auf Nutzer-Anweisung ("einfach Verlauf 15px
          # groesser"). Card_mod-Override hier bewusst wieder entfernt.
          # ═══════════════════════════════════════════════════════════
          - type: vertical-stack
            view_layout:
              grid-area: g2r
            # View-Skalierung 80%, Begruendung s. g1l.
            card_mod:
              style: |
                :host {
                  zoom: 0.8 !important;
                }
            cards:

              # ── Gruppen-Titel: VERLAUF (HEUTE) ───────────────────────────
              - type: custom:button-card
                template: group_header
                icon: mdi:chart-areaspline
                name: Tagesverlauf

              # ═══════════════════════════════════════════════════════════
              # VERLAUF  —  PV-Ertrag / Verbrauch / Akku-Stand für den
              # laufenden Tag (00:00–24:00) als transluzente Flächen
              # (apexcharts-card, HACS). views/energieverlauf_tag.yaml.
              # Reihenfolge mit Finanz-Bilanz getauscht (26.08.2026,
              # Nutzer-Wunsch): Verlauf jetzt oben.
              # ═══════════════════════════════════════════════════════════
              - !include views/energieverlauf_tag.yaml

          # ═══════════════════════════════════════════════════════════
          # ZEILE 3 RECHTS  —  Finanz-Bilanz (g3r), gepaart mit Miner (g3l).
          # ═══════════════════════════════════════════════════════════
          - type: vertical-stack
            view_layout:
              grid-area: g3r
            # View-Skalierung 80%, Begruendung s. g1l.
            card_mod:
              style: |
                :host {
                  zoom: 0.8 !important;
                }
            cards:

              # ── Gruppen-Titel: FINANZEN ──────────────────────────────────
              - type: custom:button-card
                template: group_header
                icon: mdi:finance
                name: Tagesbilanz

              # ═══════════════════════════════════════════════════════════
              # FINANZ-BILANZ  —  Ersparnis PV-Eigennutzung, Mining-Ertrag,
              # Netzbezugskosten, Gesamt-Profit heute. views/finanz_bilanz.yaml,
              # Sensoren in packages/economics.yaml.
              # ═══════════════════════════════════════════════════════════
              - !include views/finanz_bilanz.yaml

  # ═══════════════════════════════════════════════════════════════════════
  # TAB: ENERGIEINFO  —  war der Redesign-Entwurf "EnergieInfo v2" (ab
  # 25.08.2026 schrittweise nach Nutzer-Anweisung aufgebaut). Zweispaltig:
  # links Echtzeitverbrauch, rechts Historie/Verlauf, darunter Verbrauch nach
  # Räumen volle Breite. Der alte, gleichnamige Tab (Raum-für-Raum-Listen,
  # path energieinfo) wurde 25.08.2026 gelöscht, dieser Tab hat seinen Namen
  # (ohne "v2") und Pfad "energieinfo" übernommen und wurde auf Position 2
  # der Tab-Reihenfolge verschoben (Nutzer-Vorgabe).
  # ═══════════════════════════════════════════════════════════════════════
  - title: Steuerung
    path: steuerung
    icon: mdi:pickaxe
    show_icon_and_title: true
    theme: BitGrid v3
    # Eigener Verlauf nur fuer v3/Demo (v1/v2 nutzen weiterhin unveraendert
    # das gemeinsame BitGridAI-Theme, themes/bitgrid.yaml lovelace-background).
    # Formale v3-Palette 24.08.2026 (Nutzer-Vorgabe): "Verlauf oben links"
    # -> "Verlauf unten rechts" = 135deg (to bottom right). Ersetzt jede
    # vorherige Iteration. Grund laut Vorgabe: Gruen ist Statusfarbe fuer
    # Zuhause/Akku (--bgai-home-v3), ein gruenstichiger Hintergrund senkt
    # dort den Kontrast.
    # 12.09.2026, Nutzer-Vorgabe: Pixel-Grastextur (docs/media/design/
    # hintergrund.png, als bg_grass.jpg re-encodiert 127KB statt 1,3MB PNG,
    # Qualitätsziel Nachhaltigkeit/Edge-Schonung fürs Wandtablet) statt reinem
    # Verlauf. Erst center/cover versucht, auf dem Wandtablet sichtbar
    # hochskaliert/unscharf. Dann auf repeat in Originalgroesse (1774x887px)
    # umgestellt — sah auf dem Tablet-Viewport IMMER NOCH wie ein einzelnes
    # grosses Bild aus, weil bei der Bildschirmbreite nur ~1,5 Kacheln
    # nebeneinander passten (kein Skalierungsfehler mehr, sondern schlicht
    # eine zu grosse Kachel fuer "unendliches Muster"-Optik). Explizite
    # background-size verkleinert die Kachel auf 320x160px (Seitenverhaeltnis
    # 2:1 beibehalten), damit sichtbar mehrere Wiederholungen nebeneinander
    # erscheinen. Verlauf bleibt als zweiter Background-Layer darunter
    # (CSS-Mehrfach-Background) — reiner Ladefehler-Fallback.
    # 13.09.2026, Nutzer-Wunsch Tag/Nacht-Wechsel: natives background: kennt
    # kein Templating, daher Bild+Verlauf hier entfernt und stattdessen unten
    # im ohnehin vorhandenen view-card_mod (:host-Block) per Jinja auf
    # sun.sun umgeschaltet (reaktiv, kein Reload noetig). Nacht-Kachel
    # bg_grass_night.jpg ist analog zu bg_grass.jpg aus hintergrund_night.png
    # re-encodiert (Pillow, quality=85, optimize=True, ~122KB), gleiches
    # Nachhaltigkeits-/Edge-Kriterium wie beim Tagbild.
    # 26.09.2026, Nutzer-Vorgabe: beide Kacheln neu aus hintergrund_32_ohne_blume(_night).png
    # (1842x854, gleiche Pillow-Encodierung, ~170KB). Seitenverhaeltnis ist nicht mehr 2:1,
    # deshalb background-size 800px auto statt 800px 400px (sonst gestaucht).
    panel: true
    # View-scoped Flaechen-/Textfarben (24.08.2026, Nutzer-Vorgabe): CSS-
    # Custom-Properties auf :host der View gesetzt, vererben sich an alle
    # Karten darunter (die bereits var(--card-background-color) etc.
    # referenzieren) — ohne zweites Theme, ohne v1/v2 zu beruehren. Sidebar/
    # Topbar liegen ausserhalb dieses DOM-Teilbaums und bleiben bewusst
    # unveraendert (Nutzer-Entscheidung 24.08.2026).
    # Keine View-scoped Design-Overrides mehr (16.09.2026): sie waren
    # wirkungslos, weil HA die Theme-Variablen als Inline-Style auf genau
    # dieses View-Element schreibt und damit jede card_mod-":host"-Regel
    # schlaegt. Alle Designwerte stehen jetzt an der Wurzel in
    # themes/bitgrid.yaml.
    cards:
      - type: custom:layout-card
        # KEIN zoom:calc(100vh/900px) mehr (31.08.2026, Nutzer-Wunsch "Zoom
        # aus Tab Steuerung raus", nachdem dieselbe Technik im Home-Tab
        # zuvor schon entfernt wurde, s. dortiger Kommentar fuer die volle
        # Begruendung: rem-Werte wurden unter zoom unvorhersehbar, das
        # erschwerte jede Schriftgroessen-Anpassung). Rendert jetzt in
        # natuerlicher Groesse, scrollt bei Bedarf statt zu skalieren —
        # akzeptiert (24.08.2026 war "nie scrollen" das Ziel, das wird hier
        # bewusst aufgegeben zugunsten von vorhersehbaren rem-Groessen).
        layout_type: custom:grid-layout
        layout:
          # Zwei gleich breite Spalten (wie Tab 1), Gruppentitel in einer
          # min-content-Zeile darüber. Die Regelschwellen-Spalte ist kürzer
          # und lässt darunter Leerraum (akzeptiert) — Gesamthöhe des Grids
          # wird jetzt per zoom oben auf die Fensterhöhe skaliert statt zu
          # scrollen (24.08.2026, Nutzer-Wunsch).
          # minmax(0, 1fr) statt 1fr: 1fr = minmax(auto, 1fr), und das auto-Minimum
          # ist die min-content-Breite. Der Miner-Block (7-Button-Energiezeile,
          # 2-Miner-Steuergrid) ist im min-content breiter als 50% und würde sonst
          # seine Spalte sprengen und die rechte auf ~0 drücken. minmax(0, …)
          # klemmt beide Spalten hart auf ihren 50%-Anteil (gleiche Technik wie
          # Tab 1 bei den Zeilen).
          grid-template-columns: minmax(0, 1fr) minmax(0, 1fr)
          grid-template-rows: auto
          grid-template-areas: '"miner regel"'
          # Titel+Inhalt jetzt in EINEM vertical-stack pro Spalte statt in
          # getrennten Grid-Zeilen (02.09.2026, Nutzer-Wunsch "genau so wie
          # bei den anderen Tabs, kein row-gap"): strukturell an Home/
          # BitcoinInfo/EnergieInfo angeglichen (dort steckt der Gruppentitel
          # immer im selben vertical-stack wie die Karte darunter, mit dessen
          # eigenem, kleineren Standard-Abstand) statt eine eigene "tl/tr"-
          # Kopfzeile separat zu grid-platzieren. Der vorherige row-gap:8px-
          # Workaround war nur eine Zahlen-Annaeherung, keine echte
          # strukturelle Angleichung.
          grid-gap: 14px
          padding: 14px
          box-sizing: border-box
        cards:
          # Unsichtbare Vollbild-Hintergrundkarte, Tag/Nacht via sun.sun
          # (Begruendung/Funktionsweise: s. Tab "BitGridAI", identisches Muster).
          - type: markdown
            content: " "
            view_layout:
              grid-area: miner
            card_mod:
              style: |
                ha-card {
                  position: fixed;
                  inset: 0;
                  z-index: -1;
                  border: none;
                  box-shadow: none;
                  border-radius: 0;
                  {% if is_state('sun.sun', 'above_horizon') %}
                  background: url('/local/bg_grass.jpg?v=20260926') repeat 0 0 / 800px auto, linear-gradient(135deg, #5F8F4A 0%, #3F6B2E 100%);
                  {% else %}
                  background: url('/local/bg_grass_night.jpg?v=20260926') repeat 0 0 / 800px auto, linear-gradient(135deg, #16232f 0%, #0d151c 100%);
                  {% endif %}
                }

          # ── Spalte links: MINER (Titel + Steuerungs-Grid, geteilt aus
          # views/miner_controls.yaml) ────────────────────────────────
          - type: vertical-stack
            view_layout:
              grid-area: miner
            cards:
              # Gruppentitel jetzt ueber das geteilte group_header-Template
              # (button_card_templates.yaml) statt einer eigenen Inline-Kopie
              # (16.09.2026, Nutzer-Wunsch "Karten-Outline + Ueberschriften/
              # Icon wie im Home-Tab"): die vorherige Kopie hatte weder den
              # -webkit-text-stroke-Textumriss noch den echten SVG-Icon-Stroke
              # des Templates, nur dessen (auf var(--bgai-header-icon-halo-v3) faktisch wirkungslosen, s. STYLEGUIDE_HOME_V3.md Abschnitt
              # 0) weichen Filter-Halo.
              - type: custom:button-card
                template: group_header
                icon: mdi:pickaxe
                name: Miner
              # Der Log (input_text.mvp_miner1_debug/mvp_miner2_debug) war hier
              # bis 31.08.2026 eine eigene markdown-Karte unter beiden Minern
              # (27.08.2026, Nutzer-Wunsch). Jetzt als 6. Akkordeon je Miner in
              # views/miner_controls.yaml selbst (konsistent mit den anderen
              # 5 Detail-Listen), daher hier entfernt statt dupliziert.
              - !include views/miner_controls.yaml

          # ── Regelschwellen rechts: SoC-Bänder + Start/Sicherheit/Nacht ──
          # Im schmaleren rechten 50%-Streifen vertikal gestapelt (statt
          # nebeneinander wie früher über die volle Breite).
          #
          # 26.08.2026: WIEDERHERGESTELLT, nachdem eine vorherige Aenderung
          # dieses Chart faelschlich komplett entfernt hatte (Nutzer-
          # Feedback: "der Graph ist mir sehr wichtig"). Der SVG-Chart ist
          # 1:1 aus bitgrid_dashboard_v2.yaml uebernommen (dort identisch
          # vorhanden, verifiziert gleiche Zeilenzahl/Struktur) — die exakte
          # v3-Fassung war nicht mehr rekonstruierbar, da nur Teile davon in
          # der Session sichtbar waren, aus der geloescht wurde. Die 6
          # vormals aufklappbaren read-only-Detailgruppen (Hochschalten/
          # Runterschalten/Notbremse/Temperatur/Nachtsperre/Lueftung) sind
          # NICHT wiederhergestellt: nur 2 von 6 waren vollstaendig aus der
          # Session rekonstruierbar, der Rest haette geraten werden muessen
          # — das wollte ich nicht stillschweigend tun. Season-Automatik-
          # Tabelle steht stattdessen darunter.
          - type: vertical-stack
            view_layout:
              grid-area: regel
            # EINE Karte fuer Chart + Details-Header + alle 6 Gruppen (31.08.2026,
            # Nutzer-Wunsch "soll auch alles in einer Karte stecken", analog zu den
            # Miner-Karten). Ein card_mod direkt HIER (auf dem view_layout-
            # verankerten Aussen-Wrapper) rendert nachweislich OHNE Rahmen (live
            # getestet 31.08.2026: "es fehlt die Karte" trotz identischem :host-
            # Snippet) — vermutlich verschluckt custom:grid-layout hier eine
            # Ebene. Deshalb bleibt DIESER Wrapper bewusst card_mod-frei (wie
            # auch grid-area:miner nebenan keinen eigenen hat) und der Rahmen
            # sitzt stattdessen auf dem inneren vertical-stack direkt unten,
            # der jetzt ALLES umfasst statt nur den Chart.
            cards:
              # ── Gruppen-Titel: REGELSCHWELLEN (02.09.2026 hierher verschoben,
