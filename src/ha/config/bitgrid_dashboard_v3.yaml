              # direkt auf einem view_layout-verankerten custom:grid-layout-
              # Wrapper NICHT rendert). Die einzelnen Pillen bleiben ueber
              # settings_row_solid weiterhin eigenstaendig sichtbar, jetzt
              # zusaetzlich von einer gemeinsamen, leicht helleren Flaeche
              # umschlossen statt frei auf der Grastextur zu schweben.
              # 26.09.2026, Nutzer-Wunsch "Outline weg, wie Hochstufen/Runterstufen/
              # Nacht-Sperre im Steuerung-Tab": die Zeilen dieser vier Gruppen
