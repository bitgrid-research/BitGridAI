  # zoom-Lock, normales Scrollen — der Inhalt ist kurz genug).
  # ═══════════════════════════════════════════════════════════════════════
  - title: Heizung
    path: heizung
    # 03.09.2026, Nutzer-Wunsch: Tab aus der Leiste ausgeblendet (visible:
    # false), View-Config bleibt vollstaendig erhalten, kein Loeschen von
    # Inhalt — jederzeit reversibel durch Entfernen dieser einen Zeile.
    visible: false
    # Tab-Icon (27.08.2026, Nutzer-Wunsch): dasselbe mdi:water wie die
    # Heizstab-Bubble im Energiefluss auf dem Home-Tab (siehe "individual"-
    # Eintrag sensor.ac_elwa_2_power1_solar weiter oben in dieser Datei),
    # nicht mdi:radiator (das bleibt als Icon der Öl-Gruppentitel-Karte
    # innerhalb des Tabs erhalten, dort semantisch passender).
    icon: mdi:water
    show_icon_and_title: true
    theme: BitGrid v3
    # Eigener Verlauf nur fuer v3/Demo (v1/v2 nutzen weiterhin unveraendert
    # das gemeinsame BitGridAI-Theme, themes/bitgrid.yaml lovelace-background).
    # 12.09.2026, Nutzer-Vorgabe: Pixel-Grastextur (docs/media/design/
    # hintergrund.png, als bg_grass.jpg re-encodiert 127KB statt 1,3MB PNG,
    # Qualitätsziel Nachhaltigkeit/Edge-Schonung fürs Wandtablet) statt reinem
    # Verlauf. Erst center/cover versucht, auf dem Wandtablet sichtbar
    # hochskaliert/unscharf. Dann auf repeat in Originalgroesse (1774x887px)
    # umgestellt — sah auf dem Tablet-Viewport IMMER NOCH wie ein einzelnes
    # grosses Bild aus, weil bei der Bildschirmbreite nur ~1,5 Kacheln
    # nebeneinander passten (kein Skalierungsfehler mehr, sondern schlicht
    # eine zu grosse Kachel fuer "unendliches Muster"-Optik). Explizite
    # background-size verkleinert die Kachel auf 320x160px (Seitenverhaeltnis
    # 2:1 beibehalten), damit sichtbar mehrere Wiederholungen nebeneinander
    # erscheinen. Verlauf bleibt als zweiter Background-Layer darunter
    # (CSS-Mehrfach-Background) — reiner Ladefehler-Fallback.
    # 13.09.2026, Nutzer-Wunsch Tag/Nacht-Wechsel: natives background: kennt
    # kein Templating, daher Bild+Verlauf hier entfernt und stattdessen unten
    # im ohnehin vorhandenen view-card_mod (:host-Block) per Jinja auf
    # sun.sun umgeschaltet (reaktiv, kein Reload noetig). Nacht-Kachel
    # bg_grass_night.jpg ist analog zu bg_grass.jpg aus hintergrund_night.png
    # re-encodiert (Pillow, quality=85, optimize=True, ~122KB), gleiches
    # Nachhaltigkeits-/Edge-Kriterium wie beim Tagbild.
    # 26.09.2026, Nutzer-Vorgabe: beide Kacheln neu aus hintergrund_32_ohne_blume(_night).png
    # (1842x854, gleiche Pillow-Encodierung, ~170KB). Seitenverhaeltnis ist nicht mehr 2:1,
    # deshalb background-size 800px auto statt 800px 400px (sonst gestaucht).
    panel: true
    # View-scoped Flaechen-/Textfarben, wie alle uebrigen v3-Tabs.
    # Keine View-scoped Design-Overrides mehr (16.09.2026): sie waren
    # wirkungslos, weil HA die Theme-Variablen als Inline-Style auf genau
    # dieses View-Element schreibt und damit jede card_mod-":host"-Regel
    # schlaegt. Alle Designwerte stehen jetzt an der Wurzel in
    # themes/bitgrid.yaml.
    cards:
      - type: custom:layout-card
        layout_type: custom:grid-layout
        layout:
          grid-template-columns: minmax(0, 1fr) minmax(0, 1fr)
          grid-template-rows: auto
          grid-template-areas: '"left right"'
          # Titel+Inhalt jetzt in EINEM vertical-stack pro Spalte statt in
          # getrennten Grid-Zeilen (02.09.2026, Nutzer-Wunsch "genau so wie
          # bei den anderen Tabs, kein row-gap") — s. Kopfkommentar bei der
          # Miner-Spalte im Tab "Steuerung" fuer die volle Begruendung,
          # identischer Fix hier.
          grid-gap: 14px
          padding: 14px
          box-sizing: border-box
        cards:
          # Unsichtbare Vollbild-Hintergrundkarte, Tag/Nacht via sun.sun
          # (Begruendung/Funktionsweise: s. Tab "BitGridAI", identisches Muster).
          - type: markdown
            content: " "
            view_layout:
              grid-area: left
            card_mod:
              style: |
                ha-card {
                  position: fixed;
                  inset: 0;
                  z-index: -1;
                  border: none;
                  box-shadow: none;
                  border-radius: 0;
                  {% if is_state('sun.sun', 'above_horizon') %}
                  background: url('/local/bg_grass.jpg?v=20260926') repeat 0 0 / 800px auto, linear-gradient(135deg, #5F8F4A 0%, #3F6B2E 100%);
                  {% else %}
                  background: url('/local/bg_grass_night.jpg?v=20260926') repeat 0 0 / 800px auto, linear-gradient(135deg, #16232f 0%, #0d151c 100%);
                  {% endif %}
                }

          # ── Spalte links: HEIZUNG (ÖL), Titel + Inhalt ───────────────
          - type: vertical-stack
            view_layout:
              grid-area: left
            cards:
              - type: custom:button-card
                template: group_header
                icon: mdi:radiator
                name: Heizung (Öl)
              - !include views/heizung_oel_diagramm.yaml
              - !include views/heizung_oel.yaml

          # ── Spalte rechts: HEIZSTAB (ELEKTRISCH), Titel + Inhalt ─────
          - type: vertical-stack
            view_layout:
              grid-area: right
            cards:
              - type: custom:button-card
                template: group_header
                icon: mdi:water-boiler
                name: Heizstab (elektrisch)
              - !include views/heizstab_diagramm.yaml
              - !include views/heizstab.yaml

