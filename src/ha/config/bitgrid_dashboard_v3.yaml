  # TAB 3: GRUNDRISS  —  1 Spalte: Haus-Grundriss oben, Garage-Grundriss
  # darunter (24.08.2026, Nutzer-Entscheidung: vorher 2 Spalten nebeneinander,
  # die Raumlisten darunter sind jetzt in den eigenen Tab "EnergieInfo"
  # gewandert — siehe dort. Hier bleiben nur die beiden Grundriss-Bilder).
  # Haus: picture-elements auf www/grundriss/base.png, State-Overlays für
  #       Plugs/Sensoren aus packages/devices.yaml (views/floorplan.yaml).
  # Garage: eigener Plan/Asset, State-Overlays aus packages/devices.yaml +
  #       avalonq_miner1/2.yaml (views/garage_floorplan.yaml).
  # ═══════════════════════════════════════════════════════════════════════
  - title: Grundriss
    path: floorplan
    icon: mdi:floor-plan
    theme: BitGridAI
    # Eigener Verlauf nur fuer v3/Demo (v1/v2 nutzen weiterhin unveraendert
    # das gemeinsame BitGridAI-Theme, themes/bitgrid.yaml lovelace-background).
    # Formale v3-Palette 24.08.2026 (Nutzer-Vorgabe): "Verlauf oben links"
    # -> "Verlauf unten rechts" = 135deg (to bottom right). Ersetzt jede
    # vorherige Iteration. Grund laut Vorgabe: Gruen ist Statusfarbe fuer
    # Zuhause/Akku (--bgai-home-v3), ein gruenstichiger Hintergrund senkt
    # dort den Kontrast.
    background: "linear-gradient(135deg, #0E1530 0%, #171A3A 100%)"
    panel: true
    # View-scoped Flaechen-/Textfarben (24.08.2026, Nutzer-Vorgabe): CSS-
    # Custom-Properties auf :host der View gesetzt, vererben sich an alle
    # Karten darunter (die bereits var(--card-background-color) etc.
    # referenzieren) — ohne zweites Theme, ohne v1/v2 zu beruehren. Sidebar/
    # Topbar liegen ausserhalb dieses DOM-Teilbaums und bleiben bewusst
    # unveraendert (Nutzer-Entscheidung 24.08.2026).
    card_mod:
      style: |
        :host {
          --card-background-color: var(--bgai-card-bg-v3, #182449);
          --divider-color: var(--bgai-divider-v3, #26356B);
          --primary-text-color: var(--bgai-text-primary-v3, #EAEFFB);
          --secondary-text-color: var(--bgai-text-secondary-v3, #A8B3D4);
          /* Schrift groesser, nur v3 (Nutzer-Wunsch 02.09.2026), wie in allen
             uebrigen v3-Tabs (s. Kommentar Home-Tab-Host fuer die Begruendung
             der Werte). */
          --bg-fs-label: 0.9375rem;
          --bg-fs-secondary: 1.1875rem;
          --bg-fs-body: 1.375rem;
          --bg-fs-title: 2.125rem;
          /* Neuer Token, nur fuer group_header-Gruppentitel (02.09.2026,
             Nutzer-Wunsch "Ueberschriftgroessen fuer alle Gruppen in jedem
             Tab wie Home"): das geteilte group_header-Template (button_card_
             templates.yaml, auch von v1 genutzt) las bisher --bg-fs-body
             (22px), Home hatte zusaetzlich 6x einen Pro-Karte-Override auf
             1.6875rem (27px) — daher der Groessen-Unterschied zwischen
             Tabs. Einheitlich in allen v3-Views gesetzt, v1 bleibt
             unberuehrt (kennt die Variable nicht, Template faellt dort auf
             --bg-fs-body zurueck). */
          --bg-fs-group-header: 1rem;
          /* Nutzer-Wunsch 24.08.2026: Grundriss-Tab soll nie scrollen. Das
             Bild selbst schrumpft schon per svh-Breitenformel in
             views/floorplan.yaml / views/garage_floorplan.yaml auf die
             Fensterhoehe; overflow-y hier ist nur das Sicherheitsnetz falls
             das Reserviert-Budget dort mal knapp daneben liegt (dann wird
             im Zweifel 1-2px abgeschnitten statt eine Scrollbar zu zeigen). */
          overflow-y: hidden;
        }
    cards:
      - type: vertical-stack
        card_mod:
          style: |
            :host {
              padding: 14px;
              box-sizing: border-box;
              overflow-y: hidden;
            }
        cards:

          # ── Umschalter Obergeschoss/Untergeschoss ───────────────────────
          # Ersetzt die frühere Übereinander-Stapelung (Haus 16:9 + Garage
          # 16:21 hochkant = sehr lange Scroll-Seite, Nutzer-Feedback
          # 24.08.2026). Ganze Kopfzeile tappbar (nicht nur die Pfeile),
          # toggelt input_boolean.fp_view_garage (packages/devices.yaml,
          # Entity-ID unveraendert gelassen, nur die Anzeige-Labels
          # umbenannt 26.08.2026 — passt zur bestehenden Konvention, die
          # Keller+Garage im Raum-Modell bereits zu "Untergeschoss"
          # zusammenlegt, siehe packages/devices.yaml Z.596).
          # Bei genau 2 Ansichten tun beide Pfeile dasselbe (Vor/Zurück =
          # Toggle), rein optische Navigations-Metapher.
          - type: custom:button-card
            show_name: false
            show_icon: false
            show_state: false
            entity: input_boolean.fp_view_garage
            tap_action:
              action: toggle
            styles:
              card:
                - background: none
                - box-shadow: none
                - border: none
                - padding: 4px 4px 0
              grid:
                - grid-template-areas: '"body"'
                - grid-template-columns: 1fr
              custom_fields:
                body:
                  - width: 100%
                  - justify-self: stretch
            custom_fields:
              body: >
                [[[
                  const showGarage = entity.state === 'on';
                  const icon = showGarage ? 'mdi:home-floor-b' : 'mdi:home-floor-a';
                  const label = showGarage ? 'Untergeschoss' : 'Obergeschoss';
                  return `
                    <div style="display:flex;align-items:center;justify-content:center;gap:22px;padding:6px 0;cursor:pointer;">
                      <ha-icon icon="mdi:chevron-left" style="--mdc-icon-size:36px;color:var(--secondary-text-color);"></ha-icon>
                      <div style="display:flex;align-items:center;gap:12px;min-width:170px;justify-content:center;">
                        <ha-icon icon="${icon}" style="--mdc-icon-size:30px;color:var(--secondary-text-color);"></ha-icon>
                        <span style="font-size:1.4875rem;font-weight:700;text-transform:uppercase;letter-spacing:0.07em;color:var(--secondary-text-color);">${label}</span>
                      </div>
                      <ha-icon icon="mdi:chevron-right" style="--mdc-icon-size:36px;color:var(--secondary-text-color);"></ha-icon>
                    </div>`;
                ]]]

          - type: conditional
            conditions:
              - entity: input_boolean.fp_view_garage
                state: "off"
            card:
              type: vertical-stack
              cards:
                - !include views/floorplan.yaml

          - type: conditional
            conditions:
              - entity: input_boolean.fp_view_garage
                state: "on"
            card:
              type: vertical-stack
              cards:
                - !include views/garage_floorplan.yaml

