          # ── Regelschwellen rechts: SoC-Bänder + Start/Sicherheit/Nacht ──
          # Im schmaleren rechten 50%-Streifen vertikal gestapelt (statt
          # nebeneinander wie früher über die volle Breite).
          #
          # 26.08.2026: WIEDERHERGESTELLT, nachdem eine vorherige Aenderung
          # dieses Chart faelschlich komplett entfernt hatte (Nutzer-
          # Feedback: "der Graph ist mir sehr wichtig"). Der SVG-Chart ist
          # 1:1 aus bitgrid_dashboard_v2.yaml uebernommen (dort identisch
