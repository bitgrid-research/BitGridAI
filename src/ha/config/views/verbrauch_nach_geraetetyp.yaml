# ═══════════════════════════════════════════════════════════════════════
# VERBRAUCH NACH GERÄTETYP — Feld 2 von 3 im Abschnitt "Echtzeitverbrauch"
# (Tab "EnergieInfo").
#
# 25.08.2026, Kurskorrektur: erster Anlauf war eine Kette aus 7 einzelnen
# custom:bubble-card-Pillen unter einem separaten Markdown-Header (siehe
# Git-Historie) — Nutzer-Feedback: "die in eine kachel bündeln damit das
# design und bezeichner nicht aus der reihe fallen soll so aussehen wie bei
# den anderen kacheln". Jetzt EINE Karte im selben Kartenrahmen wie die
# direkten Nachbarfelder in diesem Abschnitt (Feld 1 "Verbrauch nach
# Räumen", verbrauch_nach_raeumen.yaml; Feld 3 "Gesamter Echtzeitverbrauch",
# gesamter_echtzeitverbrauch.yaml — beide var(--ha-card-background) mit
# Standard-HA-Rahmen, Titel oben links im Karteninneren), Bubble Card damit
# hier nicht mehr genutzt. Die einzelnen Zeilen (Icon-Kreis, Label, Wert,
# Ring-Gauge) übernehmen dieselbe Optik wie die Geräte-Zeilen in den
# Raum-Kacheln (raumkachel_*.yaml, window.bgRoomKachel) für ein
# durchgängiges Bild über den ganzen Tab.
#
# Ring-Anteil je Kategorie = Kategorie-W / Summe aller 7 Kategorien-W (nicht
# gegen Gesamtenergie, das zeigt Feld 3 bereits direkt daneben).
# Kategorien/Sensoren: packages/devices.yaml, typ_*_power_w — Zuordnung nach
# den echten Live-Friendly-Names der Shelly-Plugs, nicht nach altem
# Kommentarblock in devices.yaml.
# Eingebunden via !include in bitgrid_dashboard_v3.yaml, Tab "EnergieInfo".
# ═══════════════════════════════════════════════════════════════════════
type: custom:button-card
show_name: false
show_icon: false
show_state: false
tap_action:
  action: none
styles:
  card:
    - background: var(--ha-card-background)
    - border-radius: var(--ha-card-border-radius)
    - overflow: hidden
    - border: var(--ha-card-border-width) solid var(--ha-card-border-color)
    - box-shadow: var(--ha-card-box-shadow)
    - padding: 16px 14px
  grid:
    - grid-template-areas: '"body"'
    - grid-template-columns: 1fr
  custom_fields:
    body:
      - width: 100%
      - justify-self: stretch
      - box-sizing: border-box
custom_fields:
  body: >
    [[[
      const categories = [
        ['mdi:pickaxe', 'Mining', 'sensor.typ_mining_power_w'],
        ['mdi:desktop-tower-monitor', 'Computer', 'sensor.typ_computer_power_w'],
        ['mdi:fridge-outline', 'Kühlung', 'sensor.typ_kuehlung_power_w'],
        ['mdi:television', 'Unterhaltung', 'sensor.typ_unterhaltung_power_w'],
        ['mdi:water-boiler', 'Warmwasserbereiter', 'sensor.typ_warmwasser_power_w'],
        ['mdi:washing-machine', 'Haushaltsgeräte', 'sensor.typ_haushaltsgeraete_power_w'],
        ['mdi:power-socket-eu', 'Sonstiges', 'sensor.typ_sonstiges_power_w'],
      ];
      const vals = categories.map(([, , id]) => {
        const w = parseFloat(states[id]?.state);
        return isNaN(w) ? 0 : w;
      });
      const total = vals.reduce((a, b) => a + b, 0);

      const ring = (frac, idx) => {
        const size = 34, sw = 3.5;
        const p = Math.max(0, Math.min(1, frac)) * 100;
        return `<div style="width:${size}px;height:${size}px;flex-shrink:0;border-radius:50%;
          background:conic-gradient(from 0deg,
            #4CAF50 0%, #4CAF50 ${Math.min(35, p).toFixed(2)}%,
            #26C6DA ${Math.min(52.5, p).toFixed(2)}%,
            #F7931A ${Math.min(70, p).toFixed(2)}%,
            #F7931A ${p.toFixed(2)}%,
            rgba(255,255,255,0.15) ${p.toFixed(2)}% 100%);
          -webkit-mask:radial-gradient(farthest-side, transparent calc(100% - ${sw}px), #000 calc(100% - ${sw}px));
          mask:radial-gradient(farthest-side, transparent calc(100% - ${sw}px), #000 calc(100% - ${sw}px));
        "></div>`;
      };

      const rowHtml = categories.map(([ic, label], i) => {
        const val = vals[i];
        const frac = total > 0 ? val / total : 0;
        const valStr = (val < 10 ? val.toFixed(1) : Math.round(val).toLocaleString('de-DE')) + ' W';
        return `<div style="display:flex;align-items:center;padding:7px 2px;gap:8px;">
          <div style="width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,0.08);display:flex;align-items:center;justify-content:center;flex-shrink:0;">
            <ha-icon icon="${ic}" style="--mdc-icon-size:15px;color:rgba(255,255,255,0.7);"></ha-icon>
          </div>
          <span style="flex:1;min-width:0;color:var(--secondary-text-color);font-size:0.92rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${label}</span>
          <span style="font-size:0.95rem;font-weight:700;color:var(--secondary-text-color);white-space:nowrap;">${valStr}</span>
          ${ring(frac, i)}
        </div>`;
      }).join('<div style="border-top:1px solid rgba(255,255,255,0.06);margin:0 2px;"></div>');

      return `<div style="display:flex;flex-direction:column;width:100%">
        <div style="font-size:1rem;font-weight:700;color:var(--primary-text-color);margin-bottom:6px;padding-left:2px;">Echtzeitverbrauch nach Gerätetyp</div>
        ${rowHtml}
      </div>`;
    ]]]
