# ═══════════════════════════════════════════════════════════════════════
# Statistik-Übersicht — 3 kombinierte Karten (Heute / Monat / 2026)
# mit Energie- und Mining-KPIs, darunter Mining Verlauf.
# Eingebunden via !include in bitgrid_dashboard_v2.yaml → Tab "Statistik".
# ═══════════════════════════════════════════════════════════════════════
type: vertical-stack
cards:

  - type: horizontal-stack
    cards:

      # ── Heute ────────────────────────────────────────────────────────
      - type: custom:button-card
        show_name: false
        show_icon: false
        show_state: false
        tap_action:
          action: none
        styles:
          card:
            - padding: 12px 16px
          custom_fields:
            stats_heute:
              - width: 100%
              - justify-self: stretch
              - box-sizing: border-box
        custom_fields:
          stats_heute: >
            [[[
              const pvKwh      = states['sensor.pv_energy_daily']?.state ?? '—';
              const pvExpKwh   = states['sensor.grid_export_daily']?.state ?? '—';
              const gridImpKwh = states['sensor.grid_import_daily']?.state ?? '—';
              const hausKwh    = states['sensor.house_energy_daily']?.state ?? '—';
              const hzKwh      = states['sensor.heizstab_energy_daily']?.state ?? '—';
              const mineKwh    = states['sensor.mining_energy_daily']?.state ?? '—';
              const upFmt      = states['sensor.miner_uptime_today_fmt']?.state ?? '—';
              const ecoH       = states['sensor.miner_eco_hours_today']?.state ?? '—';
              const stdH       = states['sensor.miner_standard_hours_today']?.state ?? '—';
              const supH       = states['sensor.miner_super_hours_today']?.state ?? '—';
              const pvN    = parseFloat(pvKwh);
              const pvExpN = parseFloat(pvExpKwh);
              const impN   = parseFloat(gridImpKwh);
              const hausN  = parseFloat(hausKwh);
              const pvSelfUse = (!isNaN(pvN) && !isNaN(pvExpN) && pvN > 0) ? Math.max(0, pvN - pvExpN) : null;
              const autarkie  = (!isNaN(hausN) && !isNaN(impN) && hausN > 0)
                ? Math.max(0, Math.min(100, (hausN - impN) / hausN * 100)) : null;
              const autColor  = autarkie === null ? 'var(--secondary-text-color)'
                : autarkie >= 80 ? '#4CAF50' : autarkie >= 50 ? '#f59e0b' : '#ef5350';

              const fmtKwh = v => { const n = parseFloat(v); return isNaN(n) ? '—' : n.toFixed(2) + ' kWh'; };
              const fmtH   = v => { const n = parseFloat(v); return isNaN(n) ? '—' : n.toFixed(1) + ' h'; };
              const fmtPct = v => v !== null ? v.toFixed(0) + ' %' : '—';

              const row = (icon, label, val, iconColor) =>
                `<div style="display:flex;align-items:center;padding:2px 0;gap:6px;width:100%;">
                  <ha-icon icon="${icon}" style="--mdc-icon-size:14px;color:${iconColor};flex-shrink:0;"></ha-icon>
                  <span style="color:var(--secondary-text-color);font-size:0.78rem;flex:1;min-width:0;">${label}</span>
                  <span style="font-size:0.85rem;font-weight:600;white-space:nowrap;">${val}</span>
                </div>`;
              const modeBox = (label, val, color) =>
                `<div style="background:var(--secondary-background-color);border-radius:8px;padding:5px 4px;text-align:center;">
                  <div style="font-size:0.65rem;color:${color};font-weight:600;">${label}</div>
                  <div style="font-size:0.85rem;font-weight:700;color:${color};">${val}</div>
                </div>`;
              const sep = () => `<div style="margin:6px 0;border-top:1px solid var(--divider-color);"></div>`;

              return `<div style="width:100%;padding:2px 0;">
                <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid var(--divider-color);">
                  <ha-icon icon="mdi:chart-bar" style="--mdc-icon-size:17px;color:var(--primary-text-color);"></ha-icon>
                  <span style="font-size:0.88rem;font-weight:700;">Heute</span>
                </div>
                ${row('mdi:solar-power', 'PV erzeugt', fmtKwh(pvKwh), '#4CAF50')}
                ${row('mdi:home-lightning-bolt-outline', 'PV Eigenverbrauch', pvSelfUse !== null ? fmtKwh(pvSelfUse.toFixed(2)) : '—', '#f59e0b')}
                ${row('mdi:shield-sun', 'Autarkie', fmtPct(autarkie), autColor)}
                ${row('mdi:transmission-tower-export', 'Eingespeist', fmtKwh(pvExpKwh), '#8BC34A')}
                ${row('mdi:transmission-tower-import', 'Netzbezug', fmtKwh(gridImpKwh), '#5C6BC0')}
                ${row('mdi:home-lightning-bolt', 'Hausverbrauch', fmtKwh(hausKwh), '#f59e0b')}
                ${row('mdi:water-boiler', 'Heizstab', fmtKwh(hzKwh), '#2196F3')}
                ${sep()}
                ${row('mdi:pickaxe', 'Mining Energie', fmtKwh(mineKwh), '#f59e0b')}
                ${row('mdi:timer-outline', 'Uptime', upFmt, 'var(--secondary-text-color)')}
                <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:6px;">
                  ${modeBox('Eco', fmtH(ecoH), '#4CAF50')}
                  ${modeBox('Standard', fmtH(stdH), '#26C6DA')}
                  ${modeBox('Super', fmtH(supH), '#F7931A')}
                </div>
              </div>`;
            ]]]

      # ── Monat ────────────────────────────────────────────────────────
      - type: custom:button-card
        show_name: false
        show_icon: false
        show_state: false
        tap_action:
          action: none
        styles:
          card:
            - padding: 12px 16px
          custom_fields:
            stats_monat:
              - width: 100%
              - justify-self: stretch
              - box-sizing: border-box
        custom_fields:
          stats_monat: >
            [[[
              const pv   = parseFloat(states['input_number.pv_kwh_mtd']?.state ?? '0')
                         + parseFloat(states['sensor.pv_energy_daily']?.state ?? '0');
              const exp  = parseFloat(states['input_number.grid_export_mtd']?.state ?? '0')
                         + parseFloat(states['sensor.grid_export_daily']?.state ?? '0');
              const imp  = parseFloat(states['input_number.grid_import_mtd']?.state ?? '0')
                         + parseFloat(states['sensor.grid_import_daily']?.state ?? '0');
              const haus = parseFloat(states['input_number.house_kwh_mtd']?.state ?? '0')
                         + parseFloat(states['sensor.house_energy_daily']?.state ?? '0');
              const hz   = parseFloat(states['input_number.heizstab_kwh_mtd']?.state ?? '0')
                         + parseFloat(states['sensor.heizstab_energy_daily']?.state ?? '0');
              const mine = parseFloat(states['input_number.mining_kwh_mtd']?.state ?? '0')
                         + parseFloat(states['sensor.mining_energy_daily']?.state ?? '0');
              const upH  = parseFloat(states['input_number.mining_uptime_mtd_h']?.state ?? '0')
                         + parseFloat(states['sensor.miner_uptime_today_h']?.state ?? '0');
              const ecoM = parseFloat(states['input_number.miner_eco_mtd_h']?.state ?? '0')
                         + parseFloat(states['sensor.miner_eco_hours_today']?.state ?? '0');
              const stdM = parseFloat(states['input_number.miner_standard_mtd_h']?.state ?? '0')
                         + parseFloat(states['sensor.miner_standard_hours_today']?.state ?? '0');
              const supM = parseFloat(states['input_number.miner_super_mtd_h']?.state ?? '0')
                         + parseFloat(states['sensor.miner_super_hours_today']?.state ?? '0');

              const pvSelfUse = pv > 0 ? Math.max(0, pv - exp) : null;
              const autarkie  = haus > 0 ? Math.max(0, Math.min(100, (haus - imp) / haus * 100)) : null;
              const autColor  = autarkie === null ? 'var(--secondary-text-color)'
                : autarkie >= 80 ? '#4CAF50' : autarkie >= 50 ? '#f59e0b' : '#ef5350';

              const fmtKwh = v => {
                const n = parseFloat(v);
                if (isNaN(n)) return '—';
                return n >= 1000 ? (n / 1000).toFixed(2) + ' MWh' : n.toFixed(1) + ' kWh';
              };
              const fmtUp = v => {
                const n = parseFloat(v);
                if (isNaN(n) || n <= 0) return '0 h';
                const d = Math.floor(n / 24), h = Math.floor(n % 24);
                return d > 0 ? `${d}d ${h}h` : `${h} h`;
              };
              const fmtPct = v => v !== null ? v.toFixed(0) + ' %' : '—';

              const row = (icon, label, val, iconColor) =>
                `<div style="display:flex;align-items:center;padding:2px 0;gap:6px;width:100%;">
                  <ha-icon icon="${icon}" style="--mdc-icon-size:14px;color:${iconColor};flex-shrink:0;"></ha-icon>
                  <span style="color:var(--secondary-text-color);font-size:0.78rem;flex:1;min-width:0;">${label}</span>
                  <span style="font-size:0.85rem;font-weight:600;white-space:nowrap;">${val}</span>
                </div>`;
              const modeBox = (label, val, color) =>
                `<div style="background:var(--secondary-background-color);border-radius:8px;padding:5px 4px;text-align:center;">
                  <div style="font-size:0.65rem;color:${color};font-weight:600;">${label}</div>
                  <div style="font-size:0.85rem;font-weight:700;color:${color};">${val}</div>
                </div>`;
              const sep = () => `<div style="margin:6px 0;border-top:1px solid var(--divider-color);"></div>`;
              const month = new Date().toLocaleString('de-DE', {month: 'long'});

              return `<div style="width:100%;padding:2px 0;">
                <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid var(--divider-color);">
                  <ha-icon icon="mdi:calendar-month" style="--mdc-icon-size:17px;color:var(--primary-text-color);"></ha-icon>
                  <span style="font-size:0.88rem;font-weight:700;">${month}</span>
                </div>
                ${row('mdi:solar-power', 'PV erzeugt', fmtKwh(pv), '#4CAF50')}
                ${row('mdi:home-lightning-bolt-outline', 'PV Eigenverbrauch', pvSelfUse !== null ? fmtKwh(pvSelfUse) : '—', '#f59e0b')}
                ${row('mdi:shield-sun', 'Autarkie', fmtPct(autarkie), autColor)}
                ${row('mdi:transmission-tower-export', 'Eingespeist', fmtKwh(exp), '#8BC34A')}
                ${row('mdi:transmission-tower-import', 'Netzbezug', fmtKwh(imp), '#5C6BC0')}
                ${row('mdi:home-lightning-bolt', 'Hausverbrauch', fmtKwh(haus), '#f59e0b')}
                ${row('mdi:water-boiler', 'Heizstab', fmtKwh(hz), '#2196F3')}
                ${sep()}
                ${row('mdi:pickaxe', 'Mining Energie', fmtKwh(mine), '#f59e0b')}
                ${row('mdi:timer-outline', 'Uptime', fmtUp(upH), 'var(--secondary-text-color)')}
                <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:6px;">
                  ${modeBox('Eco', fmtUp(ecoM), '#4CAF50')}
                  ${modeBox('Standard', fmtUp(stdM), '#26C6DA')}
                  ${modeBox('Super', fmtUp(supM), '#F7931A')}
                </div>
              </div>`;
            ]]]

      # ── 2026 gesamt ──────────────────────────────────────────────────
      - type: custom:button-card
        show_name: false
        show_icon: false
        show_state: false
        tap_action:
          action: none
        styles:
          card:
            - padding: 12px 16px
          custom_fields:
            stats_ytd:
              - width: 100%
              - justify-self: stretch
              - box-sizing: border-box
        custom_fields:
          stats_ytd: >
            [[[
              const pv   = parseFloat(states['input_number.pv_kwh_ytd']?.state ?? '0')
                         + parseFloat(states['sensor.pv_energy_daily']?.state ?? '0');
              const exp  = parseFloat(states['input_number.grid_export_ytd']?.state ?? '0')
                         + parseFloat(states['sensor.grid_export_daily']?.state ?? '0');
              const imp  = parseFloat(states['input_number.grid_import_ytd']?.state ?? '0')
                         + parseFloat(states['sensor.grid_import_daily']?.state ?? '0');
              const haus = parseFloat(states['input_number.house_kwh_ytd']?.state ?? '0')
                         + parseFloat(states['sensor.house_energy_daily']?.state ?? '0');
              const hz   = parseFloat(states['input_number.heizstab_kwh_ytd']?.state ?? '0')
                         + parseFloat(states['sensor.heizstab_energy_daily']?.state ?? '0');
              const mine = parseFloat(states['input_number.mining_kwh_ytd']?.state ?? '0')
                         + parseFloat(states['sensor.mining_energy_daily']?.state ?? '0');
              const upH  = parseFloat(states['input_number.mining_uptime_ytd_h']?.state ?? '0')
                         + parseFloat(states['sensor.miner_uptime_today_h']?.state ?? '0');
              const ecoY = parseFloat(states['input_number.miner_eco_ytd_h']?.state ?? '0')
                         + parseFloat(states['sensor.miner_eco_hours_today']?.state ?? '0');
              const stdY = parseFloat(states['input_number.miner_standard_ytd_h']?.state ?? '0')
                         + parseFloat(states['sensor.miner_standard_hours_today']?.state ?? '0');
              const supY = parseFloat(states['input_number.miner_super_ytd_h']?.state ?? '0')
                         + parseFloat(states['sensor.miner_super_hours_today']?.state ?? '0');

              const pvSelfUse = pv > 0 ? Math.max(0, pv - exp) : null;
              const autarkie  = haus > 0 ? Math.max(0, Math.min(100, (haus - imp) / haus * 100)) : null;
              const autColor  = autarkie === null ? 'var(--secondary-text-color)'
                : autarkie >= 80 ? '#4CAF50' : autarkie >= 50 ? '#f59e0b' : '#ef5350';

              const fmtKwh = v => {
                const n = parseFloat(v);
                if (isNaN(n)) return '—';
                return n >= 1000 ? (n / 1000).toFixed(2) + ' MWh' : n.toFixed(1) + ' kWh';
              };
              const fmtUp = v => {
                const n = parseFloat(v);
                if (isNaN(n) || n <= 0) return '0 h';
                const d = Math.floor(n / 24), h = Math.floor(n % 24);
                return d > 0 ? `${d}d ${h}h` : `${h} h`;
              };
              const fmtPct = v => v !== null ? v.toFixed(0) + ' %' : '—';

              const row = (icon, label, val, iconColor) =>
                `<div style="display:flex;align-items:center;padding:2px 0;gap:6px;width:100%;">
                  <ha-icon icon="${icon}" style="--mdc-icon-size:14px;color:${iconColor};flex-shrink:0;"></ha-icon>
                  <span style="color:var(--secondary-text-color);font-size:0.78rem;flex:1;min-width:0;">${label}</span>
                  <span style="font-size:0.85rem;font-weight:600;white-space:nowrap;">${val}</span>
                </div>`;
              const modeBox = (label, val, color) =>
                `<div style="background:var(--secondary-background-color);border-radius:8px;padding:5px 4px;text-align:center;">
                  <div style="font-size:0.65rem;color:${color};font-weight:600;">${label}</div>
                  <div style="font-size:0.85rem;font-weight:700;color:${color};">${val}</div>
                </div>`;
              const sep = () => `<div style="margin:6px 0;border-top:1px solid var(--divider-color);"></div>`;

              return `<div style="width:100%;padding:2px 0;">
                <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid var(--divider-color);">
                  <ha-icon icon="mdi:calendar-today" style="--mdc-icon-size:17px;color:var(--primary-text-color);"></ha-icon>
                  <span style="font-size:0.88rem;font-weight:700;">2026 gesamt</span>
                </div>
                ${row('mdi:solar-power', 'PV erzeugt', fmtKwh(pv), '#4CAF50')}
                ${row('mdi:home-lightning-bolt-outline', 'PV Eigenverbrauch', pvSelfUse !== null ? fmtKwh(pvSelfUse) : '—', '#f59e0b')}
                ${row('mdi:shield-sun', 'Autarkie', fmtPct(autarkie), autColor)}
                ${row('mdi:transmission-tower-export', 'Eingespeist', fmtKwh(exp), '#8BC34A')}
                ${row('mdi:transmission-tower-import', 'Netzbezug', fmtKwh(imp), '#5C6BC0')}
                ${row('mdi:home-lightning-bolt', 'Hausverbrauch', fmtKwh(haus), '#f59e0b')}
                ${row('mdi:water-boiler', 'Heizstab', fmtKwh(hz), '#2196F3')}
                ${sep()}
                ${row('mdi:pickaxe', 'Mining Energie', fmtKwh(mine), '#f59e0b')}
                ${row('mdi:timer-outline', 'Uptime', fmtUp(upH), 'var(--secondary-text-color)')}
                <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:6px;">
                  ${modeBox('Eco', fmtUp(ecoY), '#4CAF50')}
                  ${modeBox('Standard', fmtUp(stdY), '#26C6DA')}
                  ${modeBox('Super', fmtUp(supY), '#F7931A')}
                </div>
              </div>`;
            ]]]

  # ── Mining Verlauf ───────────────────────────────────────────────────
  - !include mining_log.yaml
