type: picture-elements
card_mod:
  style: |
    ha-card {
      background: none;
      box-shadow: none;
      border: none;
      padding: 0;
      /* Hochkant-Bild (1094x1437, 12.09.2026 auf Pixelstil-Grafik getauscht,
         fast identisches Seitenverhaeltnis wie das alte 800x1050) auf
         voller Seitenbreite im 1-Spalten-
         Grundriss-Tab wurde riesig hoch (Nutzer-Feedback 24.08.2026:
         "soll noch auf die Seite passen"). 667px bleibt die Breiten-
         Obergrenze fuer breite Screens.
         Zusaetzlich (24.08.2026, Nutzer-Wunsch "nicht scrollbar"): Breite
         auch an die Fensterhoehe koppeln (gleiches 170px-Budget wie
         views/floorplan.yaml, siehe dort fuer Details), damit das
         Hochkant-Bild bei knapper Fensterhoehe automatisch schrumpft statt
         die Seite scrollbar zu machen. Drittes min()-Glied 100%: ohne das
         kann die hoehen-abgeleitete Breite bei schmalerem Fenster ueber die
         Spaltenbreite hinauswachsen (Bug, Nutzer-Feedback 24.08.2026
         Vollbild "Bild zu gross", siehe views/floorplan.yaml). */
      /* 26.09.2026: neues, weniger grelles Bild 1199x1312 (fast quadratisch).
         transparent.png auf dieselben Masse neu erzeugt, denn die %-Positionen
         aller Elemente beziehen sich auf dieses Traegerbild. Breitenobergrenze
         667px -> 800px, damit die maximale Hoehe (~876px) gleich bleibt. Alle
         Element-Positionen per Umriss-Abgleich alt->neu umgerechnet
         (Skalierung 0.896, Versatz), nicht neu geschaetzt. */
      width: min(800px, calc((100vh - 170px) * 1199 / 1312), 100%);
      width: min(800px, calc((100svh - 170px) * 1199 / 1312), 100%);
      aspect-ratio: 1199 / 1312;
      height: auto;
      margin: 0 auto;
      /* Nutzer-Feedback 24.08.2026: Hintergrund unten trotzdem abgeschnitten
         (schwarzer Rand). overflow:visible verhindert jedes Clipping durch
         die Karte selbst, hier und auf allen Kindelementen (img/#root),
         unabhaengig davon wie hui-picture-elements-card intern die Hoehe
         berechnet. */
      overflow: visible !important;
    }
    ha-card #root {
      overflow: visible !important;
    }
    ha-card img,
    ha-card hui-image {
      overflow: visible !important;
      height: auto !important;
      max-height: none !important;
    }
image: /local/garage_floorplan/transparent.png?version=F1A7B9340D388D02FAE5C51901CB2118
elements:
  - type: conditional
    title: Base
    conditions:
      []
    elements:
      - type: image
        tap_action:
          action: none
        hold_action:
          action: none
        # Tag/Nacht-Grundriss (26.09.2026, Nutzer-Wunsch): gleiches Kriterium wie
        # der View-Hintergrund (sun.sun above_horizon), native state_image-Umschaltung
        # des image-Elements, reaktiv ohne Reload. Die Nacht-Vorlage kam mit anderen
        # Massen (1086x1448); base_night.png ist per Umriss-Abgleich auf die
        # 1199x1312-Leinwand von base.png skaliert, damit alle %-Positionen fuer
        # beide Bilder gelten. Bei neuer Nacht-Vorlage diesen Schritt wiederholen.
        entity: sun.sun
        image: /local/garage_floorplan/base.png?version=AE860AAC9603D3C1A58425DF8407C622
        state_image:
          above_horizon: /local/garage_floorplan/base.png?version=AE860AAC9603D3C1A58425DF8407C622
          below_horizon: /local/garage_floorplan/base_night.png?version=668308AB46BB030E90EA5DAEDF717654
        filter: none
        style:
          left: 50%
          top: 50%
          width: 100%

  # RAUMNAME entfernt (27.09.2026, Nutzer-Wunsch): das Schild "Untergeschoss"
  # doppelte nur die Etagen-Kopfzeile ueber dem Grundriss. Anders als im
  # Obergeschoss gibt es hier bewusst keine Unterraum-Schilder, das Datenmodell
  # fuehrt Keller+Garage als EINEN Raum (packages/devices.yaml). Der Plan hat
  # deshalb jetzt gar kein Raumschild.

