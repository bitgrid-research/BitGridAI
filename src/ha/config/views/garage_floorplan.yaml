type: picture-elements
card_mod:
  style: |
    ha-card {
      background: none;
      box-shadow: none;
      border: none;
      padding: 0;
      /* Hochkant-Bild (800x1050) auf voller Seitenbreite im 1-Spalten-
         Grundriss-Tab wurde riesig hoch (Nutzer-Feedback 24.08.2026:
         "soll noch auf die Seite passen"). 667px bleibt die Breiten-
         Obergrenze fuer breite Screens.
         Zusaetzlich (24.08.2026, Nutzer-Wunsch "nicht scrollbar"): Breite
         auch an die Fensterhoehe koppeln (gleiches 170px-Budget wie
         views/floorplan.yaml, siehe dort fuer Details), damit das
         Hochkant-Bild bei knapper Fensterhoehe automatisch schrumpft statt
         die Seite scrollbar zu machen. Drittes min()-Glied 100%: ohne das
         kann die hoehen-abgeleitete Breite bei schmalerem Fenster ueber die
         Spaltenbreite hinauswachsen (Bug, Nutzer-Feedback 24.08.2026
         Vollbild "Bild zu gross", siehe views/floorplan.yaml). */
      width: min(667px, calc((100vh - 170px) * 800 / 1050), 100%);
      width: min(667px, calc((100svh - 170px) * 800 / 1050), 100%);
      aspect-ratio: 800 / 1050;
      height: auto;
      margin: 0 auto;
      /* Nutzer-Feedback 24.08.2026: Hintergrund unten trotzdem abgeschnitten
         (schwarzer Rand). overflow:visible verhindert jedes Clipping durch
         die Karte selbst, hier und auf allen Kindelementen (img/#root),
         unabhaengig davon wie hui-picture-elements-card intern die Hoehe
         berechnet. */
      overflow: visible !important;
    }
    ha-card #root {
      overflow: visible !important;
    }
    ha-card img,
    ha-card hui-image {
      overflow: visible !important;
      height: auto !important;
      max-height: none !important;
    }
