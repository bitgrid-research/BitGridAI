# ═══════════════════════════════════════════════════════════════════════
# ₿itsy-Tamagotchi (linke Spalte) — das Gesicht der Erklärschicht.
# Eingebunden via !include in:
#   - bitgrid_dashboard_v2.yaml  → Tab "₿itsy", grid-area: bitsy
#
# SPIEGEL der Hamster-Karte von Tab 1 (bitgrid_dashboard_v2.yaml, Home):
# identische Entscheidungs-Branches (Nacht / Übertemperatur / Eco / Standard /
# Super / Hausreserve / Halteband / Warte-auf-Sonne), identische Entities.
# Ändert sich die Logik dort, MUSS sie hier synchron nachgezogen werden.
# Bewusst dupliziert statt zentralisiert: der Endzustand ist, dass die
# Erklärung aus der explain/-Schicht publiziert wird (packages/bitsy.yaml)
# und dieser UI-JS-Zweig ganz verschwindet — bis dahin lohnt kein Refactor.
#
# Anders als Tab 1: Tamagotchi-Präsentation (großes Bild, Stimmungs-Chip,
# Sprechblase) statt Status-Karte mit Bitcoin-Fußleiste. Die Sprechblase
# bleibt IMMER regelbasiert-deterministisch; KI-Beratung (Hermes/Qwen)
# erscheint klar getrennt in der rechten Spalte (ki_beratung.yaml).
# ═══════════════════════════════════════════════════════════════════════
type: custom:button-card
show_name: false
show_icon: false
show_state: false
tap_action:
  action: none
custom_fields:
  bitsy: >
    [[[
      const fnum = (id) => {
        const v = parseFloat(states[id]?.state);
        return isNaN(v) ? null : v;
      };
      const cfg = (id, fb) => { const v = fnum(id); return v === null ? fb : v; };
      const pct = (v) => v.toLocaleString('de-DE', {maximumFractionDigits: 0});
      const kw  = (w) => (w / 1000).toLocaleString('de-DE', {minimumFractionDigits: 1, maximumFractionDigits: 1});

      const h = new Date().getHours();
      const night = states['binary_sensor.mvp_nacht_sperre_aktiv']?.state === 'on'
        || (h >= 22 || h < 6);
      const modeRaw = states['sensor.miner1_workmode_status']?.state
                  || states['sensor.miner2_workmode_status']?.state || '';
      const mode = (modeRaw === 'unavailable' || modeRaw === 'unknown') ? '' : modeRaw;
      const running = ['Eco', 'Standard', 'Super'].includes(mode);
      const socV   = fnum('sensor.battery_soc_pct');
      const pvV    = fnum('sensor.pv_power_w');
      const chipV  = fnum('sensor.miner_max_chip_temp_c');
      const socKnown = socV !== null;
      const soc    = socV ?? 0;
      const pvW    = pvV ?? 0;

      const socStop   = cfg('input_number.mvp_soc_stop_pct', 50);
      const ecoStart  = cfg('input_number.mvp_soc_eco_start_pct', 60);
      const socStd    = cfg('input_number.mvp_soc_std_pct', 75);
      const socStdStp = ecoStart;
      const socSuper  = cfg('input_number.mvp_soc_super_pct', 90);
      const socSupStp = socStd;
      const pvStartW  = cfg('input_number.mvp_pv_start_w', 6000);
      const maxChip   = cfg('input_number.mvp_tmax_std_threshold_c', 112);

      // Farb-Tokens aus themes/bitgrid.yaml
      const cEco = 'var(--bg-color-eco,#4CAF50)';
      const cStd = 'var(--bg-color-standard,#26C6DA)';
      const cSup = 'var(--bg-color-super,#F7931A)';
      const cRes = 'var(--bg-color-reserve,#EF5350)';
      const cIdl = 'var(--bg-color-idle,#9E9E9E)';
      const cPv  = 'var(--bg-color-pv,#EFB73C)';

      // Branches = Spiegel von Tab 1, plus Stimmung (mood) fürs Tamagotchi.
      let head, sub, img, mood, moodCol;
      if (!socKnown && !running) {
        head = 'Verbindung wird aufgebaut';
        sub  = 'Die Sensoren melden sich gerade nach einem Neustart.<br>'
             + 'Sobald Ladezustand und PV anliegen, sage ich dir, was los ist.';
        img  = 'bithamster_wait.png'; mood = 'wartet auf Daten'; moodCol = cIdl;
      } else if (night) {
        head = 'Nachtsperre aktiv';
        sub  = `Es ist ${h}:00 Uhr, Beginn des Nachtfensters von 22:00 bis 06:00 Uhr.<br>`
             + 'In dieser Zeit ist das Mining unabhängig vom Ladezustand ausgesetzt.<br>'
             + 'Der Normalbetrieb beginnt wieder ab 06:00 Uhr.';
        img  = 'bithamster_sleep.png'; mood = 'schläft'; moodCol = '#90caf9';
      } else if (chipV !== null && chipV >= maxChip) {
        head = 'Sicherheits-Stopp: zu heiß';
        sub  = `Die Chip-Temperatur liegt mit ${pct(chipV)} °C über der Sicherheitsgrenze von ${pct(maxChip)} °C.<br>`
             + 'Der Miner wird sofort gestoppt, nicht überstimmbar.<br>'
             + 'Ein Wiederanlauf erfolgt erst nach Abkühlung.';
        img  = 'bithamster_wait.png'; mood = 'alarmiert'; moodCol = cRes;
      } else if (mode === 'Eco') {
        head = 'Miner läuft sparsam (Eco)';
        sub  = `Der Ladezustand liegt mit ${pct(soc)} % im Eco-Band, die PV bei ${kw(pvW)} kW.<br>`
             + `Der Miner minet gedrosselt im Eco-Modus${pvW < pvStartW ? ' aus dem Akku weiter' : ''}.<br>`
             + `Unter ${pct(socStop)} % greift die Hausreserve, ab ${pct(socStd)} % schaltet er auf Standard.`;
        img  = 'bithamster_eco.png'; mood = 'zufrieden'; moodCol = cEco;
      } else if (mode === 'Standard') {
        head = 'Miner läuft in Standard';
        sub  = `Der Ladezustand liegt mit ${pct(soc)} % im Standard-Band.<br>`
             + 'Der Miner läuft im Standard-Modus.<br>'
             + `Ab ${pct(socSuper)} % folgt Super, unter ${pct(socStdStp)} % fällt er auf Eco zurück.`;
        img  = 'bithamster_standard.png'; mood = 'fleißig'; moodCol = cStd;
      } else if (mode === 'Super') {
        head = 'Miner läuft auf Volllast (Super)';
        sub  = `Der Ladezustand liegt mit ${pct(soc)} % im Super-Band (ab ${pct(socSuper)} %).<br>`
             + 'Der Miner läuft mit voller Last im Super-Modus.<br>'
             + `Unter ${pct(socSupStp)} % fällt er auf Standard zurück.`;
        img  = 'bithamster_super.png'; mood = 'voll im Flow'; moodCol = cSup;
      } else if (soc < socStop) {
        head = 'Akku lädt zuerst';
        sub  = `Der Ladezustand ist mit ${pct(soc)} % unter die Hausreserve von ${pct(socStop)} % gefallen.<br>`
             + 'Der Miner bleibt aus und lädt zuerst wieder auf.<br>'
             + `Ein Start ist erst ab ${pct(ecoStart)} % möglich.`;
        img  = 'bithamster_wait.png'; mood = 'besorgt'; moodCol = cRes;
      } else if (soc < ecoStart) {
        head = 'Akku im Halteband';
        sub  = `Der Ladezustand liegt mit ${pct(soc)} % im Halteband (${pct(socStop)}–${pct(ecoStart)} %).<br>`
             + 'Ein Neustart ist hier gesperrt, der Miner bleibt aus.<br>'
             + `Ein Start ist erst ab ${pct(ecoStart)} % möglich.`;
        img  = 'bithamster_wait.png'; mood = 'geduldig'; moodCol = cIdl;
      } else {
        head = 'Warte auf Sonne';
        sub  = `Der Ladezustand liegt mit ${pct(soc)} % im Eco-Band, doch die PV reicht mit ${kw(pvW)} kW nicht (nötig ${kw(pvStartW)} kW).<br>`
             + 'Der Miner bleibt aus.<br>'
             + `Ab ${kw(pvStartW)} kW startet er im Eco-Modus.`;
        img  = 'bithamster_wait.png'; mood = 'wartet auf Sonne'; moodCol = cPv;
      }

      // Hermes-Status nur als dezente Fußnote; Details in der rechten Spalte.
      const adv = states['sensor.bitsy_advice'];
      const hermesOn = adv && !['unavailable', 'unknown', ''].includes(adv.state);

      return `
        <style>
          @keyframes bgz-bitsy-float {
            0%, 100% { transform: translateY(0); }
            50%      { transform: translateY(-7px); }
          }
          @media (prefers-reduced-motion: reduce) {
            .bgz-bitsy-img { animation: none !important; }
          }
        </style>
        <div style="display:flex;flex-direction:column;align-items:center;gap:16px;width:100%">
          <img class="bgz-bitsy-img" src="/local/${img}?v=20260625"
               style="width:52%;max-width:260px;aspect-ratio:1;border-radius:50%;object-fit:cover;
                      border:3px solid color-mix(in srgb, ${moodCol} 55%, transparent);
                      box-shadow:0 0 34px color-mix(in srgb, ${moodCol} 30%, transparent);
                      animation:bgz-bitsy-float 6s ease-in-out infinite">
          <div style="display:inline-flex;align-items:center;gap:7px;padding:5px 14px;border-radius:999px;
                      border:1px solid color-mix(in srgb, ${moodCol} 40%, transparent);
                      background:color-mix(in srgb, ${moodCol} 12%, transparent)">
            <span style="width:8px;height:8px;border-radius:50%;background:${moodCol}"></span>
            <span style="font-size:var(--bg-fs-label);font-weight:700;text-transform:uppercase;
                         letter-spacing:0.07em;color:${moodCol}">${mood}</span>
          </div>
          <div style="position:relative;width:100%;margin-top:6px">
            <div style="position:absolute;top:-7px;left:50%;width:14px;height:14px;
                        transform:translateX(-50%) rotate(45deg);
                        background:rgba(255,255,255,0.055);
                        border-left:1px solid var(--divider-color);border-top:1px solid var(--divider-color)"></div>
            <div style="border:1px solid var(--divider-color);border-radius:16px;padding:18px 20px;
                        background:rgba(255,255,255,0.055)">
              <div style="font-size:var(--bg-fs-title);font-weight:700;line-height:1.15;
                          color:var(--primary-text-color);margin-bottom:10px">${head}</div>
              <div style="font-size:var(--bg-fs-body);color:var(--secondary-text-color);line-height:1.55">${sub}</div>
            </div>
          </div>
          <div style="font-size:var(--bg-fs-secondary);color:var(--secondary-text-color);opacity:0.6">
            Erklärung: regelbasiert, deterministisch · Hermes-Beratung: ${hermesOn ? 'aktiv (siehe rechts)' : 'offline'}
          </div>
        </div>`;
    ]]]
styles:
  card:
    - background: var(--ha-card-background)
    - border-radius: var(--ha-card-border-radius)
    - overflow: hidden
    - border: var(--ha-card-border-width) solid var(--ha-card-border-color)
    - box-shadow: var(--ha-card-box-shadow)
    - padding: 26px 22px 20px
  grid:
    - grid-template-areas: '"bitsy"'
    - grid-template-columns: 1fr
  custom_fields:
    bitsy:
      - width: 100%
      - justify-self: stretch
