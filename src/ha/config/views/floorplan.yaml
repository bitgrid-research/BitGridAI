      # (climate.wohnzimmer_ofen, 33.75%) gezogen, war 47.43%. Danach auf
      # Nutzer-Wunsch weiter nach unten auf die Hoehe der Bubble
      # "TV Wohnzimmer" (sensor.shellyplugsg3_9070694c99d4_leistung).
      # Feinjustage: 25 px tiefer in Schritten 10+10+5 (senkrecht
      # 1 px = 1/887 = 0.113 %), liegt damit nicht mehr in deren Flucht.
      top: 45.13%
      left: 70.62%
      transform: translate(-50%, -50%)
      # margin-right:-100%: button-card setzt max-width:fit-content, bei
      # absoluter Position = Restplatz bis zum rechten Bildrand. Ohne das
      # wird "GAESTEZIMMER" bei ~1400px Fensterbreite zu "GAESTEZI..." gekuerzt.
      # Der negative Rand vergroessert nur diesen Restplatz, left/translate
      # (Zentrierung) bleiben unveraendert.
