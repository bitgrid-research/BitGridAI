type: picture-elements
card_mod:
  style: |
    ha-card {
      background: none;
      box-shadow: none;
      border: none;
      padding: 0;
      /* Volle Seitenbreite im 1-Spalten-Grundriss-Tab (24.08.2026) würde bei
         2:1-Landschaftsbild auf breiten Screens/Tablets zu hoch werden.
         1663px bleibt die Breiten-Obergrenze fuer breite Screens.
         Zusaetzlich (24.08.2026, Nutzer-Wunsch "nicht scrollbar"): Breite auch
         an die Fensterhoehe koppeln, damit Kopfzeile + Bild immer ohne
         Scrollen passen. 170px Reserviert-Budget = aeussere Stack-Paddings
         (2x14px) + Haus/Garage-Kopfzeile + Sicherheitsabstand, ein erster
         Schaetzwert, ggf. nach Sichttest auf dem Tablet nachjustieren.
         Reihenfolge wichtig: die 100vh-Variante zuerst als Fallback fuer
         Engines ohne svh-Unterstuetzung, danach die 100svh-Variante
         (gewinnt per Kaskade, wird sonst als ungueltig verworfen).
         Drittes min()-Glied 100%: ohne das kann die hoehen-abgeleitete
         Breite bei schmalerem Fenster ueber die Spaltenbreite hinauswachsen
         (Bug, Nutzer-Feedback 24.08.2026 Vollbild "Bild zu gross"). */
      width: min(1663px, calc((100vh - 170px) * 1774 / 887), 100%);
      width: min(1663px, calc((100svh - 170px) * 1774 / 887), 100%);
      aspect-ratio: 1774 / 887;
      height: auto;
      margin: 0 auto;
      /* Nutzer-Feedback 24.08.2026: Hintergrund unten trotzdem abgeschnitten
         (schwarzer Rand). overflow:visible verhindert jedes Clipping durch
         die Karte selbst, hier und auf allen Kindelementen (img/#root),
         unabhaengig davon wie hui-picture-elements-card intern die Hoehe
         berechnet.
         26.09.2026, korrigiert nach Live-Check: Fenster-Icons (Punkt 4)
         liegen bewusst NICHT ausserhalb der 0-100%-Bildflaeche (ein erster
         Versuch mit top:-4%/104% liess sie ueber die Karte hinaus in die
         Etagen-Umschalter-Kopfzeile/Legende darunter rutschen — das Bild
         selbst zeichnet bereits einen Gras-Rand um das Haus, "ausserhalb des
         Gebaeudes" heisst hier also ein kleiner Versatz weiter Richtung
         Bildrand, innerhalb 0-100%, nicht ausserhalb der Karte). */
      overflow: visible !important;
    }
    ha-card #root {
      overflow: visible !important;
    }
    ha-card img,
    ha-card hui-image {
      overflow: visible !important;
      height: auto !important;
      max-height: none !important;
    }
image: /local/floorplan/transparent.png?version=099AC734B1AC1E24315EA02D07546A90
elements:
  - type: conditional
    title: Base
    conditions:
      []
    elements:
      - type: image
        tap_action:
          action: none
        hold_action:
          action: none
        # Tag/Nacht-Grundriss (26.09.2026, Nutzer-Wunsch): gleiches Kriterium wie
        # der View-Hintergrund (sun.sun above_horizon), native state_image-Umschaltung
        # des image-Elements, reaktiv ohne Reload. base_night.png hat identische
        # Masse und Umrisse wie base.png, alle %-Positionen gelten fuer beide.
        entity: sun.sun
        image: /local/floorplan/base.png?version=2350CF723E1CB2BDD4076DF6AC25C59A
        state_image:
          above_horizon: /local/floorplan/base.png?version=2350CF723E1CB2BDD4076DF6AC25C59A
          below_horizon: /local/floorplan/base_night.png?version=63BD476D3D52319852B4400403D2014C
        filter: none
        style:
          left: 50%
          top: 50%
          width: 100%

