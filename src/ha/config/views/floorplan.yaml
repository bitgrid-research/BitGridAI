    variables:
      color: >
        [[[ return (!entity || ['unavailable','unknown'].includes(entity.state)) ? 'var(--accent-color)' : (entity.state === 'on' ? 'var(--bg-color-reserve)' : 'var(--bg-color-idle)'); ]]]
    tap_action:
      action: more-info
    style:
      top: 6.50%
      left: 59.96%
      transform: translate(-50%, -50%)
