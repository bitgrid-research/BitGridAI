  # ALLE Positionen dieser Datei (Raumnamen, Leistungs-Badges, Heizungs- und
  # Fenster-Icons) per Overlay-Rendering auf das Bild selbst gelegt, Pixel-
  # Mittelpunkt des jeweiligen Objekts / 1774x887. Raumnamen liegen jetzt
  # auf freier Bodenflaeche statt auf Waenden. Fenster-Icons bleiben in
  # ihrer Aussenreihe, nur die fassadenparallele Koordinate folgt dem
  # gezeichneten Fenster. Bei einem neuen Grundrissbild alles neu tracen.
