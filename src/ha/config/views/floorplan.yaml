  # versetzt, damit sich Namensschild und Thermostat-Icon nicht ueberlappen.
  # Bewusst EIN Schild fuer "Wohnzimmer" (nicht zwei fuer Ofen-/Fenster-Zone):
  # das sind zwei Heizkreise im selben physischen Raum, kein separater Raum
