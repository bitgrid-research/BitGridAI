  # ═══════════════════════════════════════════════════════════════════════
  # FENSTER-ICONS (Punkt 4, Nutzer-Wunsch 26.09.2026) — template:
  # floorplan_icon_badge. Icon+Farbe: offen -> bg-color-reserve (Warnung),
  # zu -> bg-color-idle (neutral), unavailable -> accent-color.
  #
  # Position: die zur Fassade SENKRECHTE Koordinate (top fuer Nord/Sued,
  # left fuer Ost/West) bleibt exakt der bisherige, am Fensterbild
  # kalibrierte Wert (siehe git-Historie dieser Datei) — nur die dazu
  # PARALLELE Koordinate wird auf einen einheitlichen Aussen-Versatz
  # gesetzt, damit alle Fenster derselben Fassade in einer Flucht liegen.
  # Nord=oben/Sued=unten/West=links/Ost=rechts nach Nutzer-Angabe 26.09.2026
  # (oben im Bild = Norden).
  #
  # Werte ausserhalb 0-100% (top:-4%/104%) funktionieren NICHT: die Icons
  # rutschen dann ueber die Karte hinaus in die Nachbarkarte. Das Bild zeichnet
  # ohnehin einen Gras-Rand um das Haus, "ausserhalb des Gebaeudes" liegt also
  # bereits innerhalb der 0-100%-Bildflaeche.
  #
  # 27.09.2026, Nutzer-Wunsch "naeher an die Wand": Aussenreihen von
  # top 3.60%/96.61% und left 0.82%/99.29% dichter herangezogen. Hergeleitet,
  # nicht geschaetzt: Hausumriss per Alpha-Bounding-Box = x 3.10-97.01%,
  # y 9.24-92.00%; das Icon ist feste 40px, bei der ueblichen Renderbreite
  # 1663px also 2.41% breit und 4.81% hoch (Radius 1.20% / 2.41%). Die neuen
  # Werte setzen die Icon-Kante damit knapp an die Aussenwand. Die Sued-Reihe
  # brauchte danach noch 2.50% extra: die Alpha-Bounding-Box schliesst unten
  # den Schlagschatten des Hauses mit ein, die sichtbare Wandkante liegt also
  # hoeher als der Alpha-Rand. Alle vier Seiten am Rendering nachgemessen
  # (Restabstand jeweils 3-4px). ACHTUNG: das
  # Icon skaliert NICHT mit dem Bild, auf schmaleren Screens (Wandtablet)
  # ueberlappt es die Wand etwas staerker. Das ist bewusst in Kauf genommen.
  # 27.09.2026, Nutzer-Wunsch: die Sued-Reihe war danach zu dicht an der Wand,
  # 10 px tiefer gesetzt (senkrecht 1 px = 1/887 = 0.113 %), 92.10% -> 93.23%.
  # Nord, West und Ost bleiben unveraendert dicht an ihrer Wand.
  # ═══════════════════════════════════════════════════════════════════════
  # Nord-Reihe (top: 6.50%): wohnzimmer_ofen, gastezimmer, davids_zimmer
  - type: custom:button-card
    template: floorplan_icon_badge
