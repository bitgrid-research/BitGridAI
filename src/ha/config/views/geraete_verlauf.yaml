# ═══════════════════════════════════════════════════════════════════════
# Geräte-Verlauf (rechte Spalte) — Leistung 24 h + Tagesverbrauch.
# Eingebunden via !include in:
#   - bitgrid_dashboard_v2.yaml  → Tab "Geräte", grid-area: verlauf
# Leistung: Recorder-Rohdaten der Plug-Sensoren (exclude-basiert, also drin).
# Tagesverbrauch: Langzeit-Statistik der nativen kWh-Zähler (total_increasing),
# stat_type change = Tagesdelta, robust gegen Zähler-Resets der Plugs.
# ═══════════════════════════════════════════════════════════════════════
type: vertical-stack
cards:

  - type: history-graph
    title: Leistung (24 h)
    hours_to_show: 24
    entities:
      - entity: sensor.shellyplugsg3_9070694abdf4_leistung
        name: Kühlschränke
      - entity: sensor.shellyplugsg3_d885ac1e9adc_leistung
        name: Waschmaschine
      - entity: sensor.shellyplugsg3_9070694c99d4_leistung
        name: TV
      - entity: sensor.shellyplugsg3_d885ac18c3b4_leistung
        name: Büro
      - entity: sensor.shellyplusplugs_d4d4daf4eda4_leistung
        name: Lüftung
      - entity: sensor.shellyplugsg3_d0cf13db3a00_leistung
        name: Server, NAS, KI-Agent

  - type: statistics-graph
    title: Tagesverbrauch (14 Tage)
    chart_type: bar
    period: day
    days_to_show: 14
    stat_types:
      - change
    entities:
      - entity: sensor.shellyplugsg3_9070694abdf4_energie
        name: Kühlschränke
      - entity: sensor.shellyplugsg3_d885ac1e9adc_energie
        name: Waschmaschine
      - entity: sensor.shellyplugsg3_9070694c99d4_energie
        name: TV
      - entity: sensor.shellyplugsg3_d885ac18c3b4_energie
        name: Büro
      - entity: sensor.shellyplusplugs_d4d4daf4eda4_energie
        name: Lüftung
      - entity: sensor.shellyplugsg3_d0cf13db3a00_energie
        name: Server, NAS, KI-Agent
