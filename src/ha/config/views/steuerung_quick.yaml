                    - overflow: visible
                    - filter: *miner_icon_shadow
                    - color: "var(--secondary-text-color)"
                  name:
                    - overflow: visible
                    - text-shadow: *miner_text_shadow
                tap_action:
                  action: call-service
                  service: shell_command.miner2_reboot

