# ═══════════════════════════════════════════════════════════════════════
# UNTERGESCHOSS — Abschnitt "Historie" (Tab "EnergieInfo"). Vier
# bedingte Varianten (eine pro input_select.historie_zeitraum-Option,
# configuration.yaml) — custom:bitgrid-historie-chart kennt keine
# graph_span/statistics-Config wie apexcharts-card, jede Zeitraum-Option
# bekommt daher weiterhin ihren eigenen Kartenblock.
#
# 25.09.2026, Nutzer-Vorgabe "Graph im Stil von Tab Home/Steuerung": Wechsel
# von custom:apexcharts-card auf das eigene Element
# www/bitgrid_historie_chart.js (voller Kontext im Kopfkommentar dort) —
# beschriftete 17px-Achsen in Serienfarbe, dickere Linie mit dropShadow,
# eigene HTML-Legende (Icon + Live-Wert + Ø Zeitraum), gestricheltes Gitter,
# dunkler Tooltip. Datenweg bleibt derselbe (s. naechster Absatz), nur der
# Renderer wechselt.
#
# 25.08.2026, Nutzer-Frage: "wird das auch schoen in die DB geschrieben
# damit es schneller aufgerufen wird" — Nachtrag: die erste Version nutzte
# group_by (fragt HAs ROHE State-History ab, clientseitig neu gebuckett),
# das waere bei "30 Tage"/"12 Monate" unnoetig schwer (viele zehntausend
# Rohdatenpunkte fuer einen State-Klasse-measurement-Sensor). Jetzt
# stattdessen recorder/statistics_during_period (type: mean, period:
# hour/day/week) — nutzt HAs vorberechnete Langzeit-Statistik-Tabelle
# (statistics/statistics_short_term), serverseitig fertig aggregiert.
# Verifiziert 25.08.2026: recorder.purge_keep_days ist bereits auf 365
# gesetzt (configuration.yaml). Statistik-Daten fuer diese Sensoren
# existieren und der Abruf ist schnell (per WS-Call direkt getestet:
# 0.005s fuer 52 Wochen-Buckets, vs. 0.125s NUR fuer 24h Rohdaten mit
# 3689 Zeilen bei diesem Sensor).
#
# Eingebunden via !include in historie_raeume_cycler.yaml.
# ═══════════════════════════════════════════════════════════════════════
type: vertical-stack
cards:
  - type: conditional
    conditions:
      - entity: input_select.historie_zeitraum
        state: "Letzte 24 Stunden"
    card:
      type: custom:bitgrid-historie-chart
      entity: sensor.raum_untergeschoss_power_w
      name: Untergeschoss
      icon: mdi:home-floor-b
      color: "#f49891"
      span: 24h
      period: hour
  - type: conditional
    conditions:
      - entity: input_select.historie_zeitraum
        state: "Letzte 7 Tage"
    card:
      type: custom:bitgrid-historie-chart
      entity: sensor.raum_untergeschoss_power_w
      name: Untergeschoss
      icon: mdi:home-floor-b
      color: "#f49891"
      span: 7d
      period: hour
  - type: conditional
    conditions:
      - entity: input_select.historie_zeitraum
        state: "Letzte 30 Tage"
    card:
      type: custom:bitgrid-historie-chart
      entity: sensor.raum_untergeschoss_power_w
      name: Untergeschoss
      icon: mdi:home-floor-b
      color: "#f49891"
      span: 30d
      period: day
  - type: conditional
    conditions:
      - entity: input_select.historie_zeitraum
        state: "Letzte 12 Monate"
    card:
      type: custom:bitgrid-historie-chart
      entity: sensor.raum_untergeschoss_power_w
      name: Untergeschoss
      icon: mdi:home-floor-b
      color: "#f49891"
      span: 365d
      period: week
