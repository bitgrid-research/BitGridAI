          styles:
            card:
              - background: none
              - border: none
              - box-shadow: none
              - padding: 10px 16px 2px 16px
            name:
              - justify-self: center
              - font-size: 0.8em
              - font-weight: 700
              - letter-spacing: 0.06em
              - text-transform: uppercase
              - color: var(--secondary-text-color)
        # ── Verlauf: fruehere Antworten, scrollbar, neueste oben ──────────
        # Quelle: history in www/bithamster_ask.json (letzte 30, geschrieben
        # von bithamster_ki --watch). Gleicher Abruf-Cache wie die Antwort
        # oben (window._bgHamsterAsk); entity = Auftrags-Helfer, damit der
        # Verlauf nach jeder neuen Antwort mitzieht.
        - type: custom:button-card
          entity: input_text.bithamster_auftrag
          show_name: false
          show_icon: false
          show_state: false
          tap_action:
            action: none
          hold_action:
            action: none
          double_tap_action:
            action: none
          custom_fields:
            body: >
              [[[
                if (!window._bgHamsterAsk) window._bgHamsterAsk = { data: null, fetchedAt: 0, busy: false, cards: new Set(), timer: null };
                const A = window._bgHamsterAsk;
                A.cards.add(this);
                const dim = 'var(--secondary-text-color)';
                const white = 'var(--primary-text-color)';
                const kiC = 'var(--bgai-erklaerung-v3, #A2EFED)';
                const warnC = 'var(--bg-color-heat, #FF7043)';
                const LINE = 'background:linear-gradient(to right, transparent, var(--divider-color) 15%, var(--divider-color) 85%, transparent) top / 100% 1px no-repeat;';
                const esc = (t) => String(t || '').replace(/[&<>"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));
                // 15.11.2026: history[0] ist die aktuelle Antwort (oben schon gezeigt), nicht doppelt.
                const histAll = (A.data && Array.isArray(A.data.history)) ? A.data.history : [];
                const hist = histAll.filter((h, i) => !(i === 0 && h.generated_at === A.data.generated_at));
                const when = (iso) => { const t = Date.parse(iso); return isNaN(t) ? '' :
                  new Date(t).toLocaleString('de-DE', { weekday: 'short', day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }); };
                const topic = (h) => (h.task === 'tab' || h.task === 'tabcheck') ? `${esc(h.label)}: ${esc(h.tab)}` : h.task === 'frage' ? `„${esc(h.question)}“` : esc(h.label);
                const items = hist.map((h, i) => {
                  const a = h.answer || {};
                  const pts = (a.punkte || []).map(p => `<li style="margin-top:2px;">${esc(p)}</li>`).join('');
                  return `
                    <div style="padding:10px 0;${i ? LINE : ''}">
                      <div style="display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;">
                        <span style="font-size:var(--bg-fs-label);font-weight:700;letter-spacing:0.04em;color:${kiC};white-space:nowrap;">${when(h.generated_at)}</span>
                        <span style="color:${dim};min-width:0;">${topic(h)}</span>
                      </div>
                      ${h.ok && a.headline
                        ? `<div style="margin-top:3px;font-weight:700;">${esc(a.headline)}</div>
                           <div style="margin-top:2px;color:${dim};">${esc(a.text)}</div>
                           ${pts ? `<ul style="margin:4px 0 0 0;padding-left:20px;color:${dim};">${pts}</ul>` : ''}`
                        : `<div style="margin-top:3px;color:${warnC};">Keine Antwort: ${esc(h.error)}</div>`}
                    </div>`;
                }).join('');
                // Fester Scrollbereich (220 px): bei wenigen Eintraegen entstand mit
                // max-height gar keine Scrollflaeche (Nutzer-Befund 13.11.2026).
                // touch-action pan-y: Wischen auf dem Pi scrollt den Verlauf.
                // pointer-events:auto ist entscheidend: button-card gibt einer Karte
                // ohne Aktion die Klasse "disabled" mit pointer-events:none, das erbt
                // jedes Kind; ohne diese Zeile kam kein Mausrad und kein Wischen an.
                return `<style>.bgai-hamster-history::-webkit-scrollbar{width:6px}.bgai-hamster-history::-webkit-scrollbar-thumb{background:${kiC};border-radius:3px}</style>
                <div style="font-size:var(--bg-fs-body, 1rem);line-height:1.4;color:${white};text-align:left;">
                  <div style="display:flex;align-items:center;gap:8px;padding-top:10px;${LINE}">
                    <ha-icon icon="mdi:history" style="--mdc-icon-size:20px;width:20px;height:20px;flex:0 0 20px;color:${kiC};filter:drop-shadow(0 0 1.5px rgba(0,0,0,.75));"></ha-icon>
                    <span style="flex:1 1 auto;font-size:var(--bg-fs-label);font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:${kiC};">Verlauf (${hist.length})</span>
                  </div>
                  ${hist.length
                    ? `<div class="bgai-hamster-history" style="pointer-events:auto;height:220px;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;touch-action:pan-y;-webkit-overflow-scrolling:touch;margin-top:6px;padding:0 8px 0 10px;border-radius:10px;background:rgba(0,0,0,0.14);scrollbar-width:thin;scrollbar-color:${kiC} transparent;">${items}</div>`
                    : `<div style="margin-top:6px;color:${dim};">Noch keine Antworten gespeichert.</div>`}
                </div>`;
              ]]]
          styles:
            card:
              - background: none
              - box-shadow: none
              - border: none
              - border-radius: 0
              - padding: 4px 16px 4px 16px
            grid:
              - grid-template-areas: '"body"'
              - grid-template-columns: 1fr
            custom_fields:
              body:
                - width: 100%
                - justify-self: stretch
                - box-sizing: border-box
                - white-space: normal
                - overflow: visible
                - text-overflow: clip
