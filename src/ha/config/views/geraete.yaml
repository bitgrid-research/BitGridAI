# ═══════════════════════════════════════════════════════════════════════
# Geräte (linke Spalte) — Summenkarte + 4 Verbraucher-Kacheln.
# Eingebunden via !include in:
#   - bitgrid_dashboard_v2.yaml  → Tab "Geräte", grid-area: geraete
# Entity-Zuordnung und Tages-kWh-Sensoren: packages/devices.yaml.
# Kachel-Layout: button-card-Template device_tile (button_card_templates.yaml).
# ═══════════════════════════════════════════════════════════════════════
type: vertical-stack
cards:

  # ── Summenkarte: alle 4 Plugs zusammen ─────────────────────────────────
  - type: custom:button-card
    show_name: false
    show_icon: false
    show_state: false
    tap_action:
      action: none
    styles:
      card:
        - padding: 14px 16px
      grid:
        - grid-template-areas: '"summe"'
        - grid-template-columns: 1fr
      custom_fields:
        summe:
          - width: 100%
          - justify-self: stretch
    custom_fields:
      summe: >
        [[[
          const fmtW = v => {
            const n = parseFloat(v);
            if (isNaN(n)) return '—';
            return n >= 1000
              ? (n / 1000).toLocaleString('de-DE', {minimumFractionDigits: 2, maximumFractionDigits: 2}) + ' kW'
              : Math.round(n).toLocaleString('de-DE') + ' W';
          };
          const fmtKwh = v => {
            const n = parseFloat(v);
            return isNaN(n) ? '—'
              : n.toLocaleString('de-DE', {minimumFractionDigits: 2, maximumFractionDigits: 2}) + ' kWh';
          };
          const w = states['sensor.geraete_power_w']?.state;
          const e = states['sensor.geraete_energy_daily']?.state;
          return `<div style="display:flex;align-items:center;width:100%">
            <ha-icon icon="mdi:power-plug" style="--mdc-icon-size:20px;color:#A6A2D8;flex-shrink:0"></ha-icon>
            <span style="font-size:0.95rem;font-weight:700;margin-left:10px;flex:1">Geräte gesamt</span>
            <span style="font-size:1.3rem;font-weight:700;white-space:nowrap">${fmtW(w)}</span>
            <span style="font-size:0.8rem;color:var(--secondary-text-color);margin-left:12px;white-space:nowrap">Heute: ${fmtKwh(e)}</span>
          </div>`;
        ]]]

  # ── Verbraucher-Kacheln (2×2) ──────────────────────────────────────────
  - type: horizontal-stack
    cards:
      - type: custom:button-card
        template: device_tile
        entity: sensor.shellyplugsg3_9070694abdf4_leistung
        name: Kühlschränke
        icon: mdi:fridge
        variables:
          energy_daily: sensor.kuehlschraenke_energy_daily
      - type: custom:button-card
        template: device_tile
        entity: sensor.shellyplugsg3_d885ac1e9adc_leistung
        name: Waschmaschine
        icon: mdi:washing-machine
        variables:
          energy_daily: sensor.waschmaschine_energy_daily

  - type: horizontal-stack
    cards:
      - type: custom:button-card
        template: device_tile
        entity: sensor.shellyplugsg3_9070694c99d4_leistung
        name: TV
        icon: mdi:television
        variables:
          energy_daily: sensor.tv_energy_daily
      - type: custom:button-card
        template: device_tile
        entity: sensor.shellyplugsg3_d885ac18c3b4_leistung
        name: Büro
        icon: mdi:desktop-classic
        variables:
          energy_daily: sensor.buero_energy_daily
