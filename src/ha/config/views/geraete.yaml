# ═══════════════════════════════════════════════════════════════════════
# Geräte — Summenkarte + Batterie-Wächter + Raum-Gruppen.
# Eingebunden via !include in:
#   - bitgrid_dashboard_v2.yaml  → Tab "Geräte", grid-area: geraete
# Entity-Zuordnung und Tages-kWh-Sensoren: packages/devices.yaml.
#
# Kachel-Typen (button_card_templates.yaml):
#   device_tile   Strom-Verbraucher (Shelly): W + Tages-kWh
#   climate_tile  Thermostat (climate.*): Ist-Temperatur + Heizzustand + Batterie
#   window_tile   Fensterkontakt (binary_sensor.*_alarm): OFFEN/zu + Batterie
#   switch_tile   Lampe/Schalter (light.*|switch.*): an/aus, Tap toggelt
#   room_header   Raum-Überschrift (Farbe via variables.accent_color)
#
# Layout: EIN responsives Kachel-Raster (custom:grid-layout, auto-fill). Kacheln
# packen sich automatisch; Summenkarte, Batterie-Wächter und Raum-Überschriften
# spannen via grid-column 1/-1 über die volle Rasterbreite und trennen die Räume.
#
# Farbschema: Raum = EIN Farbton (Header = Basis). Geräte sind gleichmäßige Tint-
# Stufen dieses Tons (Richtung Weiß gemischt, hellstes Gerät = 55 % Weiß), in
# Kachel-Reihenfolge von dunkel nach hell. Cyan/Orange bleiben den Miner-Modi
# (Standard/Super) vorbehalten. Rot (#e66767) und Amber (#E6A100) sind semantisch
# reserviert: offenes Fenster / schwache Batterie (überschreiben das Icon).
# ═══════════════════════════════════════════════════════════════════════
type: custom:layout-card
layout_type: custom:grid-layout
layout:
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr))
  grid-gap: 10px
  max-width: 700px
  margin: 0
  padding: 0
cards:

  # ── Summenkarte: alle Strom-Plugs zusammen (volle Rasterbreite) ────────
  - type: custom:button-card
    view_layout:
      grid-column: 1 / -1
    show_name: false
    show_icon: false
    show_state: false
    tap_action:
      action: none
    styles:
      card:
        - padding: 14px 16px
      grid:
        - grid-template-areas: '"summe"'
        - grid-template-columns: 1fr
      custom_fields:
        summe:
          - width: 100%
          - justify-self: stretch
    custom_fields:
      summe: >
        [[[
          const fmtW = v => {
            const n = parseFloat(v);
            if (isNaN(n)) return '—';
            return n >= 1000
              ? (n / 1000).toLocaleString('de-DE', {minimumFractionDigits: 2, maximumFractionDigits: 2}) + ' kW'
              : Math.round(n).toLocaleString('de-DE') + ' W';
          };
          const fmtKwh = v => {
            const n = parseFloat(v);
            return isNaN(n) ? '—'
              : n.toLocaleString('de-DE', {minimumFractionDigits: 2, maximumFractionDigits: 2}) + ' kWh';
          };
          const w = states['sensor.geraete_power_w']?.state;
          const e = states['sensor.geraete_energy_daily']?.state;
          return `<div style="display:flex;align-items:center;width:100%">
            <ha-icon icon="mdi:power-plug" style="--mdc-icon-size:20px;color:#A6A2D8;flex-shrink:0"></ha-icon>
            <span style="font-size:0.95rem;font-weight:700;margin-left:10px;flex:1">Geräte gesamt</span>
            <span style="font-size:1.3rem;font-weight:700;white-space:nowrap">${fmtW(w)}</span>
            <span style="font-size:0.8rem;color:var(--secondary-text-color);margin-left:12px;white-space:nowrap">Heute: ${fmtKwh(e)}</span>
          </div>`;
        ]]]

  # ── Batterie-Wächter: Sensoren ≤ 50 % (Frühwarnung, volle Rasterbreite) ─
  - type: custom:button-card
    view_layout:
      grid-column: 1 / -1
    show_name: false
    show_icon: false
    show_state: false
    tap_action:
      action: none
    styles:
      card:
        - padding: 12px 16px
      grid:
        - grid-template-areas: '"bat"'
        - grid-template-columns: 1fr
      custom_fields:
        bat:
          - width: 100%
          - justify-self: stretch
    custom_fields:
      bat: >
        [[[
          const bats = Object.keys(states)
            .filter(e => e.startsWith('sensor.') && /batterie/.test(e)
              && states[e].attributes.device_class === 'battery')
            .map(e => {
              const raw = states[e].state;
              const v = parseInt(raw);
              const dead = isNaN(v);
              return {
                v: dead ? -1 : v,
                dead: dead,
                n: (states[e].attributes.friendly_name || e).replace(/ Batterie.*/i, '')
              };
            })
            .sort((a, b) => a.v - b.v);
          const flag = bats.filter(x => x.dead || x.v <= 50);
          const chip = x => {
            const c = (x.dead || x.v <= 20) ? '#e66767' : (x.v <= 50 ? '#E6A100' : '#7A9E7E');
            const val = x.dead ? 'leer?' : x.v + '%';
            return `<span style="display:inline-flex;align-items:center;gap:4px;margin:3px 12px 3px 0;white-space:nowrap">
              <ha-icon icon="mdi:battery-alert-variant-outline" style="--mdc-icon-size:16px;color:${c}"></ha-icon>
              <span style="font-size:0.8rem">${x.n}</span>
              <span style="font-size:0.8rem;font-weight:700;color:${c}">${val}</span></span>`;
          };
          const head = `<ha-icon icon="mdi:battery-70" style="--mdc-icon-size:18px;color:#A6A2D8"></ha-icon>
            <span style="font-size:0.82rem;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:#A6A2D8;margin-left:8px">Batterie-Wächter</span>`;
          const body = flag.length
            ? flag.map(chip).join('')
            : `<span style="font-size:0.85rem;color:var(--secondary-text-color)">Alle ${bats.length} Sensoren über 50 %.</span>`;
          return `<div><div style="display:flex;align-items:center;margin-bottom:4px">${head}</div>
            <div style="display:flex;flex-wrap:wrap">${body}</div></div>`;
        ]]]

