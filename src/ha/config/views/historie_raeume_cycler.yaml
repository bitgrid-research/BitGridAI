# ═══════════════════════════════════════════════════════════════════════
# HISTORIE — GRAPH-UMSCHALTER — Abschnitt "Historie" (Tab "EnergieInfo").
# 25.08.2026, Nutzer-Vorgabe: "immer nur einen graph anzeige und obendrüber
# mit den pfeilen durchwechseln kann durch die räume ähnlich wie beim
# floorplan tab" — gleiches Muster wie der Haus/Garage-Umschalter im Tab
# "Grundriss" (bitgrid_dashboard_v3.yaml, input_boolean.fp_view_garage),
# hier mit input_select.historie_raum (configuration.yaml) statt
# input_boolean, da 7 statt nur 2 Zustände.
#
# Nachträge seither:
# 1) "nur einen graph anzeigen keine 2 spalten 2 graphen" — Gesamtenergie
#    stand vorher fest neben diesem Umschalter in einer 2-Spalten-Zeile,
#    ist jetzt als zusätzliche Option ("Gesamtenergie") mit im selben
#    Umschalter, damit wirklich nur EIN Graph-Bereich existiert.
# 2) "bezeichner UNTERGESCHOSS wegmachen" (25.08.2026) — kein Textlabel mehr
#    zwischen den Pfeilen, war redundant zum apexcharts-eigenen Chart-Title.
# 3) "wechsel die position von unten die pfeile für raumwechsel soll oben
#    sein" — Pfeile jetzt wieder VOR den Graph-Karten (waren zwischenzeitlich
#    darunter, siehe Git-Historie), Zeitraum-Umschalter (historie_zeitraum_
#    cycler.yaml) wandert im Gegenzug in bitgrid_dashboard_v3.yaml nach
#    diesem Include, also unter den Graph.
# 4) 03.09.2026, gegenteiliger Nutzer-Wunsch: Raumname jetzt DOCH wieder
#    sichtbar, aber nicht mehr als apexcharts-Chart-Title (dort entfernt,
#    s. historie_*.yaml), sondern zwischen den Pfeilen hier — gleiches
#    Muster wie historie_zeitraum_cycler.yaml im selben Tab.
#
# input_select.select_previous / .select_next sind HAs eingebaute Services
# fürs Durchblättern mit Wraparound — kein eigenes JS für die Zyklus-Logik
# nötig. Raum-Reihenfolge identisch zum Abschnitt "Verbrauch nach Räumen
# (heute)" (verbrauch_nach_raeumen_heute.yaml).
#
# type: horizontal-stack statt custom:layout-card für die Pfeile: ein
# früherer Anlauf mit custom:layout-card (min-content-Spalten +
# justify-content) hat GAR NICHTS gerendert (leere Fläche, live bestätigt).
#
# Eingebunden via !include in bitgrid_dashboard_v3.yaml, Tab "EnergieInfo".
# ═══════════════════════════════════════════════════════════════════════
type: vertical-stack
cards:
  - type: horizontal-stack
    cards:
      - type: custom:button-card
        icon: mdi:chevron-left
        show_name: false
        show_icon: true
        show_state: false
        tap_action:
          action: call-service
          service: input_select.select_previous
          service_data:
            entity_id: input_select.historie_raum
        styles:
          card:
            - background: none
            - box-shadow: none
            - border: none
            - flex: "0 0 auto"
          icon:
            - color: var(--secondary-text-color)
            - width: 32px
            - height: 32px

      # Raumname (03.09.2026, Nutzer-Wunsch): aus dem Chart-Title der
      # apexcharts-cards raus (s. historie_*.yaml), stattdessen hier
      # zwischen den Pfeilen — gleiches Muster wie historie_zeitraum_
      # cycler.yaml im selben Tab.
      - type: custom:button-card
        show_name: false
        show_icon: false
        show_state: false
        entity: input_select.historie_raum
        tap_action:
          action: none
        styles:
          card:
            - background: none
            - box-shadow: none
            - border: none
            - padding: 4px 4px 0
            - flex: "1 1 auto"
          grid:
            - grid-template-areas: '"body"'
            - grid-template-columns: 1fr
          custom_fields:
            body:
              - width: 100%
              - justify-self: stretch
        custom_fields:
          body: >
            [[[
              return `<div style="text-align:center;font-size:1.0rem;font-weight:700;text-transform:uppercase;letter-spacing:0.07em;color:var(--secondary-text-color);margin-top:10px;">${entity.state}</div>`;
            ]]]

      - type: custom:button-card
        icon: mdi:chevron-right
        show_name: false
        show_icon: true
        show_state: false
        tap_action:
          action: call-service
          service: input_select.select_next
          service_data:
            entity_id: input_select.historie_raum
        styles:
          card:
            - background: none
            - box-shadow: none
            - border: none
            - flex: "0 0 auto"
          icon:
            - color: var(--secondary-text-color)
            - width: 32px
            - height: 32px

  - type: conditional
    conditions:
      - entity: input_select.historie_raum
        state: "Gesamtenergie"
    card: !include historie_gesamtenergie.yaml
  - type: conditional
    conditions:
      - entity: input_select.historie_raum
        state: "Untergeschoss"
    card: !include historie_untergeschoss.yaml
  - type: conditional
    conditions:
      - entity: input_select.historie_raum
        state: "Wohnzimmer"
    card: !include historie_wohnzimmer.yaml
  - type: conditional
    conditions:
      - entity: input_select.historie_raum
        state: "Küche"
    card: !include historie_kueche.yaml
  - type: conditional
    conditions:
      - entity: input_select.historie_raum
        state: "Schlafzimmer"
    card: !include historie_schlafzimmer1.yaml
  - type: conditional
    conditions:
      - entity: input_select.historie_raum
        state: "Büro"
    card: !include historie_buero.yaml
  - type: conditional
    conditions:
      - entity: input_select.historie_raum
        state: "Hauswirtschaft"
    card: !include historie_hauswirtschaft.yaml
