              custom_fields:
                body:
                  - width: 100%
                  - justify-self: stretch
                  - box-sizing: border-box
            custom_fields:
              body: >
                [[[
                  return `<div style="font-size:1.125rem;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:var(--secondary-text-color);opacity:0.65;text-shadow:0 0 2px rgba(0,0,0,.85),0 0 2px rgba(0,0,0,.85);">Status</div>`;
                ]]]
          - type: custom:button-card
            show_name: false
            show_icon: false
            show_state: false
            styles:
              card:
                - background: transparent
                - box-shadow: none
                - border: none
                - margin: 0 0 4px
                - padding: 0
              grid:
                - grid-template-areas: '"body"'
                - grid-template-columns: 1fr
              custom_fields:
                body:
                  - width: 100%
                  - justify-self: stretch
                  - box-sizing: border-box
            custom_fields:
              body: >
                [[[
                  const g = (id) => { const s = states[id]?.state; return (s===undefined||s==='unknown'||s==='unavailable') ? null : s; };
                  return window.bgMinerStatus(
                    g('sensor.miner2_tmax'),
                    g('sensor.miner2_cur_load'),
                    // Lab-Replay (17.10.2026): Laufzeit des abgespielten Tages aus dem
                    // Profil (abgeschlossene 10-min-Bloecke mit Stufe > 0 bis zum
                    // aktuellen Block). Prod hat kein lab_sim_profile: history_stats.
                    (() => {
                      const prof = states['input_boolean.simulation_mode']?.state === 'on' ? states['sensor.lab_sim_profile'] : null;
                      const steps = prof?.attributes?.steps;
                      const i = parseInt(states['input_number.sim_step']?.state, 10);
                      if (!Array.isArray(steps) || isNaN(i)) return g('sensor.miner2_uptime_today_h');
                      let blocks = 0;
                      for (let k = 0; k < i && k < steps.length; k++) if (steps[k][13] > 0) blocks++;
                      return blocks / 6;
                    })(),
                    g('sensor.mvp_saison_status')
                  );
                ]]]

          # ─────────────────────────────────────────
