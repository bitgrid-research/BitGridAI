                  const spm = (() => { const v=parseFloat(g('sensor.miner2_avg_shares_per_min')); return isNaN(v)?'—':v.toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2}); })();
                  return window.bgMinerDetail('mdi:pool', 'Pool', ok, open, [
                    ['mdi:web', 'URL:', g('sensor.miner2_pool') ?? '—'],
                    ['mdi:timer-sand', 'Latenz:', int0('sensor.miner2_ping') + ' ms'],
                    ['mdi:check-circle-outline', 'Akzeptierte Shares:', int0('sensor.miner2_accepted_shares')],
                    ['mdi:close-circle-outline', 'Abgelehnte Shares:', int0('sensor.miner2_rejected_shares') + ' (' + rejR + ' %)'],
                    ['mdi:clock-check', 'Letzter Share:', int0('sensor.miner2_latest_share') + ' s'],
                    ['mdi:timer-outline', 'Shares pro Minute:', spm],
                    ['mdi:calculator-variant-outline', 'Stratum-Schwierigkeit:', int0('sensor.miner2_stratum_difficulty')],
                    ['mdi:calculator-variant-outline', 'Netzwerk-Schwierigkeit:', (() => { const v=parseFloat(g('sensor.miner2_network_difficulty')); return isNaN(v)?'—':v.toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2}); })() + ' T'],
                  ]);
                ]]]

          # ─────────────────────────────────────────
          # LOG — siehe Kommentar bei Miner 1 oben.
          # ─────────────────────────────────────────
          - type: custom:button-card
            show_name: false
            show_icon: false
            show_state: false
            entity: input_boolean.miner2_detail_log
            tap_action:
              action: toggle
            styles:
              card:
                - background: rgba(255,255,255,0.04)
                - box-shadow: none
                - border: none
                - border-radius: 14px
                - overflow: hidden
                - margin: 0 8px 6px
                - padding: 2px 12px
              grid:
                - grid-template-areas: '"body"'
                - grid-template-columns: 1fr
              custom_fields:
                body:
                  - width: 100%
                  - justify-self: stretch
                  - box-sizing: border-box
            custom_fields:
              body: >
                [[[
                  const open = entity.state === 'on';
                  const rule = states['input_text.mvp_miner2_rule']?.state ?? '';
                  const ok = !['R1 Stopp', 'R2 Temp-Sperre'].includes(rule);
                  const entries = (states['sensor.miner_2_log']?.attributes?.entries || []).slice().reverse();
                  const rows = entries.length ? entries.map((e) => `
                    <div style="display:flex;gap:6px;padding:3px 0;border-bottom:1px solid rgba(255,255,255,0.06);">
                      <span style="color:var(--secondary-text-color);flex-shrink:0;">${e.time}</span>
                      <span style="opacity:0.55;flex-shrink:0;">${e.miner}</span>
                      <span style="font-weight:700;color:var(--primary-text-color);flex-shrink:0;">${e.rule}</span>
                      <span style="color:var(--secondary-text-color);overflow-wrap:anywhere;">${e.values}</span>
                    </div>`).join('') : '<div style="color:var(--secondary-text-color);">Noch keine Einträge</div>';
                  return window.bgMinerDetail('mdi:text-box-outline', 'Log', ok, open, [
                    ['text', `<div style="max-height:240px;overflow-y:auto;">${rows}</div>`],
                  ]);
                ]]]
