# ═══════════════════════════════════════════════════════════════════════
# Miner-Steuerung (lean) — Energie-Status-Buttons (Akku/PV/Überschuss/Netz/
# Haus/Miner/Heizstab) und die Avalon Q 01 / Q 02 Steuerung (Power/Auto/
# Display/Reboot + Standby/Eco/Standard/Super + Kennzahlen).
#
# Hamster-Status-Erklärung + Power-Flow wurden nach views/miner_status.yaml
# ausgelagert (nur Dev-"Miner"-Tab); auf dem Home-Tab stehen sie ohnehin.
# Eingebunden via !include in:
#   - bitgrid_dashboard_v1.yaml   → linke Spalte des Dev-"Miner"-Tabs
#                                 (unter miner_status.yaml)
#   - bitgrid_dashboard_v2.yaml  → Tab "Steuerung", Grid-Area "miner"
# Single source of truth. Runde Ecken via www/bitgrid_card_shape.js.
# ═══════════════════════════════════════════════════════════════════════
type: vertical-stack
cards:

  # ── Miner Spalten ────────────────────────────────────────────────────────
  - type: horizontal-stack
    cards:

      # ─────────────────────────────────────────────
      # MINER 1
      # ─────────────────────────────────────────────
      - type: vertical-stack
        card_mod:
          style: |
            :host {
              display: block;
              background: var(--ha-card-background) !important;
              border: var(--ha-card-border-width, 1px) solid var(--ha-card-border-color) !important;
              border-radius: 20px !important;
              box-shadow: var(--ha-card-box-shadow) !important;
              overflow: hidden !important;
              contain: paint !important;
              min-width: 0 !important;
            }
        cards:

          - type: custom:button-card
            template: miner_header
            entity: binary_sensor.miner1_available
            name: "Miner Avalon Q 01  ›"
            icon: mdi:memory
            styles:
              card:
                - background: transparent
                - box-shadow: none
                - border: none

          - type: horizontal-stack
            cards:

              - type: custom:button-card
                template: miner_btn
                entity: sensor.miner1_workmode_status
                name: Power
                icon: >
                  [[[
                    return entity.state === 'Standby' ? 'mdi:power-sleep' : 'mdi:power';
                  ]]]
                state_display: >
                  [[[
                    const s = entity.state;
                    if (['Eco','Standard','Super'].includes(s)) return 'An';
                    if (s === 'Standby') return 'Standby';
                    return 'Aus';
                  ]]]
                styles:
                  icon:
                    - width: 76px
                    - height: 76px
                    - color: >
                        [[[
                          const s = entity.state;
                          if (['Eco','Standard','Super'].includes(s)) return 'var(--bg-color-eco)';
                          if (s === 'Standby') return 'var(--accent-color)';
                          return 'var(--disabled-color)';
                        ]]]
                tap_action:
                  action: call-service
                  service: >
                    [[[
                      const on = ['Eco','Standard','Super'].includes(entity.state);
                      return on
                        ? 'shell_command.miner1_set_softoff'
                        : 'shell_command.miner1_set_softon';
                    ]]]

              - type: custom:button-card
                template: miner_btn
                entity: input_boolean.miner1_auto_load_management
                name: Auto
                icon: mdi:refresh-auto
                state_display: >
                  [[[
                    return entity.state === 'on' ? 'Ein' : 'Aus';
                  ]]]
                styles:
                  icon:
                    - width: 76px
                    - height: 76px
                    - color: >
                        [[[
                          return entity.state === 'on'
                            ? 'var(--bg-color-eco)' : 'var(--disabled-color)';
                        ]]]
                tap_action:
                  action: toggle

              - type: custom:button-card
                template: miner_btn
                entity: switch.miner1_lcdonoff_switch
                name: Display
                icon: mdi:fit-to-screen
                state_display: >
                  [[[
                    return entity.state === 'on' ? 'Ein' : 'Aus';
                  ]]]
                styles:
                  icon:
                    - width: 44px
                    - height: 44px
                    - color: >
                        [[[
                          return entity.state === 'on'
                            ? 'var(--bg-color-standard)' : 'var(--disabled-color)';
                        ]]]
                tap_action:
                  action: toggle

              - type: custom:button-card
                template: miner_btn
                name: Reboot
                icon: mdi:restart
                show_state: false
                styles:
                  icon:
                    - width: 44px
                    - height: 44px
                    - color: "var(--secondary-text-color)"
                tap_action:
                  action: call-service
                  service: shell_command.miner1_reboot

          - type: horizontal-stack
            card_mod:
              style: |
                :host {
                  display: flex !important;
                  align-items: stretch !important;
                  background: rgba(255,255,255,0.06);
                  border-radius: 14px !important;
                  overflow: hidden !important;
                  margin: 0 8px 8px;
                }
            cards:
              - type: custom:button-card
                entity: select.miner1_workmode_set
                name: Eco
                icon: mdi:leaf
                show_state: false
                tap_action:
                  action: call-service
                  service: select.select_option
                  service_data:
                    entity_id: select.miner1_workmode_set
                    option: Eco
                styles:
                  card:
                    - background: >
                        [[[return entity.state==='Eco'?'rgba(255,255,255,0.14)':'transparent']]]
                    - box-shadow: none
                    - border: none
                    - padding: 8px 4px
                    - height: 72px
                    - box-sizing: border-box !important
                    - margin: "0 !important"
                  icon:
                    - color: >
                        [[[return entity.state==='Eco'?'var(--bg-color-eco)':'rgba(255,255,255,0.3)']]]
                    - width: 24px
                    - height: 24px
                  name:
                    - font-size: 0.72rem
                    - font-weight: >
                        [[[return entity.state==='Eco'?'700':'400']]]
                    - color: >
                        [[[return entity.state==='Eco'?'var(--primary-text-color)':'var(--secondary-text-color)']]]
              - type: custom:button-card
                entity: select.miner1_workmode_set
                name: Standard
                icon: mdi:gauge
                show_state: false
                tap_action:
                  action: call-service
                  service: select.select_option
                  service_data:
                    entity_id: select.miner1_workmode_set
                    option: Standard
                styles:
                  card:
                    - background: >
                        [[[return entity.state==='Standard'?'rgba(255,255,255,0.14)':'transparent']]]
                    - box-shadow: none
                    - border: none
                    - padding: 8px 4px
                    - height: 72px
                    - box-sizing: border-box !important
                    - margin: "0 !important"
                  icon:
                    - color: >
                        [[[return entity.state==='Standard'?'var(--bg-color-standard)':'rgba(255,255,255,0.3)']]]
                    - width: 24px
                    - height: 24px
                  name:
                    - font-size: 0.72rem
                    - font-weight: >
                        [[[return entity.state==='Standard'?'700':'400']]]
                    - color: >
                        [[[return entity.state==='Standard'?'var(--primary-text-color)':'var(--secondary-text-color)']]]
              - type: custom:button-card
                entity: select.miner1_workmode_set
                name: Super
                icon: mdi:rocket-launch
                show_state: false
                tap_action:
                  action: call-service
                  service: select.select_option
                  service_data:
                    entity_id: select.miner1_workmode_set
                    option: Super
                styles:
                  card:
                    - background: >
                        [[[return entity.state==='Super'?'rgba(255,255,255,0.14)':'transparent']]]
                    - box-shadow: none
                    - border: none
                    - padding: 8px 4px
                    - height: 72px
                    - box-sizing: border-box !important
                    - margin: "0 !important"
                  icon:
                    - color: >
                        [[[return entity.state==='Super'?'var(--bg-color-super)':'rgba(255,255,255,0.3)']]]
                    - width: 24px
                    - height: 24px
                  name:
                    - font-size: 0.72rem
                    - font-weight: >
                        [[[return entity.state==='Super'?'700':'400']]]
                    - color: >
                        [[[return entity.state==='Super'?'var(--primary-text-color)':'var(--secondary-text-color)']]]

          # ─────────────────────────────────────────
          # Abschnitts-Überschrift vor den Detail-Listen
          # ─────────────────────────────────────────
          - type: custom:button-card
            show_name: false
            show_icon: false
            show_state: false
            styles:
              card:
                - background: transparent
                - box-shadow: none
                - border: none
                - border-top: 1px solid rgba(255,255,255,0.08)
                - margin: 4px 8px 0
                - padding: 10px 2px 4px
              grid:
                - grid-template-areas: '"body"'
                - grid-template-columns: 1fr
              custom_fields:
                body:
                  - width: 100%
                  - justify-self: stretch
                  - box-sizing: border-box
            custom_fields:
              body: >
                [[[
                  return `<div style="font-size:var(--bg-fs-label);font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:var(--secondary-text-color);opacity:0.65;">Details</div>`;
                ]]]

          # ─────────────────────────────────────────
          # DETAIL-ANSICHT — 6 aufklappbare Listen (Stromversorgung, Miner,
          # Hashboard, Kühlung, Pool, Log), Entities aus packages/avalonq_miner1.yaml
          # (1:1 der dortigen template-Sektion; Log zusätzlich aus
          # input_text.mvp_miner1_debug, packages/mvp_auto.yaml). Zustand pro
          # Liste in input_boolean.miner1_detail_* (packages/avalonq_miner1.yaml),
          # damit der Auf-/Zu-Zustand über Reloads hinweg erhalten bleibt
          # (kein window-Var-Hack wie bei der SoC-Trace oben: hier reicht
          # ein echter, reaktiver State, weil jede Sektion an genau einen
          # eigenen input_boolean gebunden ist → button-card rendert bei
          # jedem Tap zuverlässig neu). window.bgMinerDetail (Renderer)
          # ist gemeinsam über alle 12 Blöcke (2 Miner × 6 Listen) genutzt.
          #
          # Bewusst NICHT enthalten: Hashrate/Effizienz (THSspd,
          # Energy_per_TH) — das alte, immer sichtbare Kennzahlen-Panel
          # (Hashrate/Effizienz/Verbrauch/Lüfter/Temperaturen/"Status seit")
          # wurde am 24.08.2026 entfernt (Nutzer-Entscheidung: nur noch die
          # Akkordeon-Listen). Beide Werte stehen aktuell in keiner der 6
          # Listen — bei Bedarf in "Stromversorgung" oder "Kühlung" ergänzen.
          # ─────────────────────────────────────────
          - type: custom:button-card
            show_name: false
            show_icon: false
            show_state: false
            entity: input_boolean.miner1_detail_power
            tap_action:
              action: toggle
            styles:
              card:
                - background: rgba(255,255,255,0.04)
                - box-shadow: none
                - border: none
                - border-radius: 14px
                - overflow: hidden
                - margin: 0 8px 6px
                - padding: 2px 12px
              grid:
                - grid-template-areas: '"body"'
                - grid-template-columns: 1fr
              custom_fields:
                body:
                  - width: 100%
                  - justify-self: stretch
                  - box-sizing: border-box
            custom_fields:
              body: >
                [[[
                  if (!window.bgMinerDetail) {
                    window.bgMinerDetail = function(icon, title, ok, open, rows) {
                      const rowHtml = rows.map((row) => {
                        const [ic, label, val, col] = row;
                        if (ic === 'text') {
                          return `<div style="padding:2px 2px 6px;color:var(--secondary-text-color);font-size:var(--bg-fs-label);line-height:1.4;white-space:normal;">${label}</div>`;
                        }
                        return `
                        <div style="display:flex;align-items:center;padding:4px 2px;">
                          <ha-icon icon="${ic}" style="--mdc-icon-size:16px;color:var(--secondary-text-color);flex-shrink:0;margin-right:8px;"></ha-icon>
                          <span style="flex:1;color:var(--secondary-text-color);font-size:var(--bg-fs-secondary);text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${label}</span>
                          <span style="font-size:var(--bg-fs-secondary);font-weight:600;text-align:right;white-space:nowrap;padding-left:8px;color:${col || 'var(--primary-text-color)'};">${val}</span>
                        </div>`;
                      }).join('');
                      return `
                        <div style="display:flex;align-items:center;padding:10px 6px 10px 2px;cursor:pointer;">
                          <ha-icon icon="${icon}" style="--mdc-icon-size:20px;color:var(--secondary-text-color);margin-right:10px;flex-shrink:0;"></ha-icon>
                          <span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:var(--bg-fs-body);font-weight:700;color:var(--secondary-text-color);text-align:left;">${title}</span>
                          <ha-icon icon="${ok ? 'mdi:check-circle' : 'mdi:alert-circle'}" style="--mdc-icon-size:18px;color:${ok ? 'var(--bg-color-eco)' : 'var(--bg-color-reserve)'};margin-right:6px;flex-shrink:0;"></ha-icon>
                          <ha-icon icon="${open ? 'mdi:chevron-up' : 'mdi:chevron-down'}" style="--mdc-icon-size:20px;color:var(--secondary-text-color);flex-shrink:0;"></ha-icon>
                        </div>
                        ${open ? `<div style="padding:0 2px 8px;">${rowHtml}</div>` : ''}`;
                    };
                  }
                  const g = (id) => { const s = states[id]?.state; return (s===undefined||s==='unknown'||s==='unavailable') ? null : s; };
                  const num = (id, d) => { const v = parseFloat(g(id)); return v===null||isNaN(v) ? '—' : v.toLocaleString('de-DE',{minimumFractionDigits:d,maximumFractionDigits:d}); };
                  const open = entity.state === 'on';
                  const ok = states['switch.shellyplugsg3_dcb4d9c5567c']?.state === 'on';
                  return window.bgMinerDetail('mdi:flash-outline', 'Stromversorgung', ok, open, [
                    ['mdi:cog-outline', 'Modus:', g('sensor.miner1_workmode_status') ?? '—'],
                    ['mdi:cog-outline', 'Arbeitsstufe:', g('sensor.miner1_worklevel') ?? '—'],
                    ['mdi:lightning-bolt', 'Soll-Leistung:', num('sensor.miner1_mode_power_output',0) + ' W'],
                    ['mdi:lightning-bolt', 'Ist-Leistung:', num('sensor.miner1_cur_load',0) + ' W'],
                  ]);
                ]]]

          - type: custom:button-card
            show_name: false
            show_icon: false
            show_state: false
            entity: input_boolean.miner1_detail_miner
            tap_action:
              action: toggle
            styles:
              card:
                - background: rgba(255,255,255,0.04)
                - box-shadow: none
                - border: none
                - border-radius: 14px
                - overflow: hidden
                - margin: 0 8px 6px
                - padding: 2px 12px
              grid:
                - grid-template-areas: '"body"'
                - grid-template-columns: 1fr
              custom_fields:
                body:
                  - width: 100%
                  - justify-self: stretch
                  - box-sizing: border-box
            custom_fields:
              body: >
                [[[
                  const g = (id) => { const s = states[id]?.state; return (s===undefined||s==='unknown'||s==='unavailable') ? null : s; };
                  const open = entity.state === 'on';
                  const ok = states['binary_sensor.miner1_available']?.state === 'on';
                  return window.bgMinerDetail('mdi:memory', 'Miner', ok, open, [
                    ['mdi:lan-connect', 'Verbindung:', ok ? 'Verbunden' : 'Getrennt'],
                    ['mdi:timer-outline', 'Laufzeit:', g('sensor.miner1_uptime') ?? '—'],
                    ['mdi:fit-to-screen', 'LCD-Display:', states['binary_sensor.miner1_lcdonoff_status']?.state === 'on' ? 'An' : 'Aus'],
                    ['mdi:thermometer', 'Innentemperatur:', (() => { const v=parseFloat(g('sensor.miner1_itemp')); return isNaN(v)?'—':v.toLocaleString('de-DE',{minimumFractionDigits:1,maximumFractionDigits:1})+' °C'; })()],
                    ['mdi:lan', 'Netzwerkfehler (#):', g('sensor.miner1_network_errors') ?? '—'],
                    ['mdi:comment-text-outline', 'Status:', g('sensor.miner1_systemstatus') ?? '—'],
                    ['mdi:list-status', 'Statuscode:', g('sensor.miner1_state') ?? '—'],
                    ['mdi:identifier', 'ID:', g('sensor.miner1_id') ?? '—'],
                    ['mdi:chip', 'Firmware:', g('sensor.miner1_firmware') ?? '—'],
                    ['mdi:lan', 'MAC-Adresse:', g('sensor.miner1_mac_address') ?? '—'],
                    ['mdi:counter', 'CGMiner-Version:', g('sensor.miner1_cgminer_version') ?? '—'],
                    ['mdi:api', 'API-Version:', g('sensor.miner1_api_version_status') ?? '—'],
                  ]);
                ]]]

          - type: custom:button-card
            show_name: false
            show_icon: false
            show_state: false
            entity: input_boolean.miner1_detail_hashboard
            tap_action:
              action: toggle
            styles:
              card:
                - background: rgba(255,255,255,0.04)
                - box-shadow: none
                - border: none
                - border-radius: 14px
                - overflow: hidden
                - margin: 0 8px 6px
                - padding: 2px 12px
              grid:
                - grid-template-areas: '"body"'
                - grid-template-columns: 1fr
              custom_fields:
                body:
                  - width: 100%
                  - justify-self: stretch
                  - box-sizing: border-box
            custom_fields:
              body: >
                [[[
                  const g = (id) => { const s = states[id]?.state; return (s===undefined||s==='unknown'||s==='unavailable') ? null : s; };
                  const t1 = (id) => { const v=parseFloat(g(id)); return isNaN(v)?'—':v.toLocaleString('de-DE',{minimumFractionDigits:1,maximumFractionDigits:1})+' °C'; };
                  const open = entity.state === 'on';
                  const ok = states['sensor.miner1_api_litestats']?.state === 'OK';
                  const asics = g('sensor.miner1_total_asics');
                  const asicModel = g('sensor.miner1_asic_model');
                  const hbi = g('sensor.miner1_hbitemp'), hbo = g('sensor.miner1_hbotemp');
                  const hbiN = hbi!==null?parseFloat(hbi).toLocaleString('de-DE',{minimumFractionDigits:1,maximumFractionDigits:1}):'—';
                  const hboN = hbo!==null?parseFloat(hbo).toLocaleString('de-DE',{minimumFractionDigits:1,maximumFractionDigits:1}):'—';
                  const cpuFreq = (() => { const v=parseFloat(g('sensor.miner1_cpu_freq')); return isNaN(v)?'—':v.toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2}); })();
                  const hwErrR = (() => { const v=parseFloat(g('sensor.miner1_hardware_errorsr')); return isNaN(v)?'—':v.toLocaleString('de-DE',{minimumFractionDigits:3,maximumFractionDigits:3}); })();
                  return window.bgMinerDetail('mdi:expansion-card-variant', 'Hashboard', ok, open, [
                    ['mdi:cube-outline', 'Gefundene Blöcke:', g('sensor.miner1_found_blocks') ?? '—'],
                    ['mdi:memory', 'CPU-Modell:', g('sensor.miner1_cpu_model') ?? '—'],
                    ['mdi:sine-wave', 'CPU-Frequenz:', cpuFreq + ' MHz'],
                    ['mdi:chip', 'ASIC-Modell:', (asics ?? '—') + ' x · ' + (asicModel ?? '—')],
                    ['mdi:thermometer-check', 'ASIC-Temperatur (Soll):', t1('sensor.miner1_tart')],
                    ['mdi:thermometer-auto', 'ASIC-Temperatur (Ø):', t1('sensor.miner1_tavg')],
                    ['mdi:thermometer-high', 'ASIC-Temperatur (Max):', t1('sensor.miner1_tmax')],
                    ['mdi:thermometer-lines', 'Ein-/Austrittstemperatur:', hbiN + ' °C / ' + hboN + ' °C'],
                    ['mdi:alert-outline', 'Hardwarefehler (#):', g('sensor.miner1_hardware_errors') ?? '—'],
                    ['mdi:alert-outline', 'Hardwarefehler (%):', hwErrR + ' %'],
                  ]);
                ]]]

          - type: custom:button-card
            show_name: false
            show_icon: false
            show_state: false
            entity: input_boolean.miner1_detail_cooling
            tap_action:
              action: toggle
            styles:
              card:
                - background: rgba(255,255,255,0.04)
                - box-shadow: none
                - border: none
                - border-radius: 14px
                - overflow: hidden
                - margin: 0 8px 6px
                - padding: 2px 12px
              grid:
                - grid-template-areas: '"body"'
                - grid-template-columns: 1fr
              custom_fields:
                body:
                  - width: 100%
                  - justify-self: stretch
                  - box-sizing: border-box
            custom_fields:
              body: >
                [[[
                  const g = (id) => { const s = states[id]?.state; return (s===undefined||s==='unknown'||s==='unavailable') ? null : s; };
                  const int0 = (id) => { const v=parseFloat(g(id)); return isNaN(v)?'—':v.toLocaleString('de-DE',{maximumFractionDigits:0}); };
                  const open = entity.state === 'on';
                  const ok = states['sensor.miner1_fanerr']?.state !== '1';
                  return window.bgMinerDetail('mdi:fan', 'Kühlung', ok, open, [
                    ['mdi:fan', 'Lüfterleistung:', int0('sensor.miner1_fanr') + ' %'],
                    ['mdi:air-filter', 'Filterlaufzeit:', int0('sensor.miner1_filter') + ' Min.'],
                    ['mdi:fan', 'Drehzahl (Einlass):', int0('sensor.miner1_fan1') + ' / ' + int0('sensor.miner1_fan2') + ' rpm'],
                    ['mdi:fan', 'Drehzahl (Auslass):', int0('sensor.miner1_fan3') + ' / ' + int0('sensor.miner1_fan4') + ' rpm'],
                  ]);
                ]]]

          - type: custom:button-card
            show_name: false
            show_icon: false
            show_state: false
            entity: input_boolean.miner1_detail_pool
            tap_action:
              action: toggle
            styles:
              card:
                - background: rgba(255,255,255,0.04)
                - box-shadow: none
                - border: none
                - border-radius: 14px
                - overflow: hidden
                - margin: 0 8px 6px
                - padding: 2px 12px
              grid:
                - grid-template-areas: '"body"'
                - grid-template-columns: 1fr
              custom_fields:
                body:
                  - width: 100%
                  - justify-self: stretch
                  - box-sizing: border-box
            custom_fields:
              body: >
                [[[
                  const g = (id) => { const s = states[id]?.state; return (s===undefined||s==='unknown'||s==='unavailable') ? null : s; };
                  const int0 = (id) => { const v=parseFloat(g(id)); return isNaN(v)?'—':v.toLocaleString('de-DE',{maximumFractionDigits:0}); };
                  const open = entity.state === 'on';
                  const ok = states['binary_sensor.miner1_pool_status']?.state === 'on';
                  const rejR = (() => { const v=parseFloat(g('sensor.miner1_rejection_rate')); return isNaN(v)?'—':v.toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2}); })();
                  const spm = (() => { const v=parseFloat(g('sensor.miner1_avg_shares_per_min')); return isNaN(v)?'—':v.toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2}); })();
                  return window.bgMinerDetail('mdi:pool', 'Pool', ok, open, [
                    ['mdi:web', 'URL:', g('sensor.miner1_pool') ?? '—'],
                    ['mdi:timer-sand', 'Latenz:', int0('sensor.miner1_ping') + ' ms'],
                    ['mdi:check-circle-outline', 'Akzeptierte Shares:', int0('sensor.miner1_accepted_shares')],
                    ['mdi:close-circle-outline', 'Abgelehnte Shares:', int0('sensor.miner1_rejected_shares') + ' (' + rejR + ' %)'],
                    ['mdi:clock-check', 'Letzter Share:', int0('sensor.miner1_latest_share') + ' s'],
                    ['mdi:timer-outline', 'Shares pro Minute:', spm],
                    ['mdi:calculator-variant-outline', 'Stratum-Schwierigkeit:', int0('sensor.miner1_stratum_difficulty')],
