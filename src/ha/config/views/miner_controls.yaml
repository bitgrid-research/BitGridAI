          - type: horizontal-stack
            # 27.09.2026, Nutzer-Wunsch "Linien wie im Tab Home":
            # horizontaler Divider unter der Ueberschrift + vertikale
            # Striche zwischen den Tasten. Traeger ist #root des
            # horizontal-stacks, exakt wie in views/steuerung_quick.yaml
            # (dort 12.09.2026 live ausgehandelt): #root hat keinen von
            # www/bitgrid_card_shape.js erzwungenen Radius, die Linien
            # rendern deshalb garantiert gerade statt entlang gerundeter
            # Button-Ecken. Einziger Unterschied zum Home-Tab: dort
            # zeichnen ::before/::after die zwei vertikalen Striche, hier
            # sind DREI noetig (vier Tasten statt drei) — zwei Pseudo-
            # Elemente reichen dafuer nicht, darum alle vier Linien als
            # Mehrfach-Background-Layer. Verlauf statt echtem border,
            # weil ein border keine ausgefadeten Enden kann (gleiches
            # Muster wie ueberall sonst im Tab).
            card_mod:
              # ".": |-Punktform (nicht der einfache style: |-String):
              # vertical-/horizontal-stack-card ist in card-mod ein
              # Sonderfall, nur so greifen Regeln auf #root. Gleiche
              # Stelle, gleiche Begruendung wie in steuerung_quick.yaml.
              style:
                ".": |
                  #root {
                    position: relative;
                    padding-top: 12px;
                    background-image:
                      linear-gradient(to right, transparent, var(--divider-color) 15%, var(--divider-color) 85%, transparent),
                      linear-gradient(to bottom, transparent, var(--divider-color) 15%, var(--divider-color) 85%, transparent),
                      linear-gradient(to bottom, transparent, var(--divider-color) 15%, var(--divider-color) 85%, transparent),
                      linear-gradient(to bottom, transparent, var(--divider-color) 15%, var(--divider-color) 85%, transparent);
                    background-repeat: no-repeat;
                    background-size:
                      100% 2px,
                      2px calc(100% - 28px),
                      2px calc(100% - 28px),
                      2px calc(100% - 28px);
                    /* Vier gleich breite Tasten (horizontal-stack gibt
                       jedem Kind flex:1 1 0) => Grenzen bei 25/50/75 %,
                       minus 1px, damit der 2px-Strich mittig auf der
                       Grenze sitzt. Vertikal 8px ueber dem unteren Rand
                       und 8px unter dem horizontalen Strich (12px
                       padding-top + 8px = 20px, daher 100% - 28px). */
                    background-position:
                      left top,
                      left calc(25% - 1px) bottom 8px,
                      left calc(50% - 1px) bottom 8px,
                      left calc(75% - 1px) bottom 8px;
                  }
