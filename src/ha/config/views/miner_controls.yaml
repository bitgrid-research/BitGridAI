          # ─────────────────────────────────────────
          # DETAIL-ANSICHT — 6 aufklappbare Listen, siehe Kommentar bei Miner 1
          # oben. window.bgMinerDetail ist dort definiert, hier nur genutzt.
          # ─────────────────────────────────────────
          - type: custom:button-card
            show_name: false
            show_icon: false
            show_state: false
            entity: input_boolean.miner2_detail_power
            tap_action:
              action: toggle
            styles:
              card:
                - background: rgba(255,255,255,0.04)
                - box-shadow: none
                - border: none
                - border-radius: 14px
                - overflow: hidden
                - margin: 0 0 6px
                - padding: 2px 12px
              grid:
                - grid-template-areas: '"body"'
                - grid-template-columns: 1fr
              custom_fields:
                body:
                  - width: 100%
                  - justify-self: stretch
                  - box-sizing: border-box
            custom_fields:
              body: >
                [[[
                  // v2 (26.09.2026): Schatten auf Schrift + Icons (TS/IS, s.
                  // window.bgMinerStatus oben), Versionspruefung aus demselben
                  // Grund. ok: true = OK (gruener Haken), false = echte
                  // Stoerung (rotes Ausrufezeichen), Objekt {icon,color,title}
                  // = neutraler Status (Log: aktive Regel, keine Stoerung).
                  if (!window.bgMinerDetail || window.bgMinerDetail.v !== 2) {
                    window.bgMinerDetail = function(icon, title, ok, open, rows) {
                      const TS = 'text-shadow:0 0 2px rgba(0,0,0,.85),0 0 2px rgba(0,0,0,.85);';
                      const IS = 'filter:drop-shadow(0 0 1.5px rgba(0,0,0,.75));';
                      const st = ok === true ? {icon: 'mdi:check-circle', color: 'var(--bg-color-eco)', title: 'OK'}
                        : ok === false ? {icon: 'mdi:alert-circle', color: 'var(--bg-color-reserve)', title: 'Störung'}
                        : ok;
                      const rowHtml = rows.map((row) => {
                        const [ic, label, val, col] = row;
                        if (ic === 'text') {
                          return `<div style="padding:2px 2px 6px;color:var(--secondary-text-color);font-size:var(--bg-fs-label);line-height:1.4;white-space:normal;">${label}</div>`;
                        }
                        return `
                        <div style="display:flex;align-items:center;padding:4px 2px;">
                          <ha-icon icon="${ic}" style="--mdc-icon-size:16px;color:var(--secondary-text-color);flex-shrink:0;margin-right:8px;${IS}"></ha-icon>
                          <span style="flex:1;color:var(--secondary-text-color);font-size:var(--bg-fs-secondary);text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${label}</span>
                          <span style="font-size:var(--bg-fs-secondary);font-weight:600;text-align:right;white-space:nowrap;padding-left:8px;color:${col || 'var(--primary-text-color)'};">${val}</span>
                        </div>`;
                      }).join('');
                      return `
                        <div style="display:flex;align-items:center;padding:10px 6px 10px 2px;cursor:pointer;${TS}">
                          <ha-icon icon="${icon}" style="--mdc-icon-size:20px;color:var(--secondary-text-color);margin-right:10px;flex-shrink:0;${IS}"></ha-icon>
                          <span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:var(--bg-fs-body);font-weight:700;color:var(--secondary-text-color);text-align:left;">${title}</span>
                          <ha-icon icon="${st.icon}" title="${st.title}" style="--mdc-icon-size:18px;color:${st.color};margin-right:6px;flex-shrink:0;${IS}"></ha-icon>
                          <ha-icon icon="${open ? 'mdi:chevron-up' : 'mdi:chevron-down'}" style="--mdc-icon-size:20px;color:var(--secondary-text-color);flex-shrink:0;${IS}"></ha-icon>
                        </div>
                        ${open ? `<div style="padding:0 2px 8px;${TS}">${rowHtml}</div>` : ''}`;
                    };
                    window.bgMinerDetail.v = 2;
                  }
                  const g = (id) => { const s = states[id]?.state; return (s===undefined||s==='unknown'||s==='unavailable') ? null : s; };
                  const num = (id, d) => { const v = parseFloat(g(id)); return v===null||isNaN(v) ? '—' : v.toLocaleString('de-DE',{minimumFractionDigits:d,maximumFractionDigits:d}); };
                  const open = entity.state === 'on';
                  const ok = states['switch.shellyplugsg3_d0cf13d86254']?.state === 'on';
                  return window.bgMinerDetail('mdi:flash-outline', 'Stromversorgung', ok, open, [
                    ['mdi:cog-outline', 'Modus:', g('sensor.miner2_workmode_status') ?? '—'],
                    ['mdi:cog-outline', 'Arbeitsstufe:', g('sensor.miner2_worklevel') ?? '—'],
                    ['mdi:lightning-bolt', 'Soll-Leistung:', num('sensor.miner2_mode_power_output',0) + ' W'],
                    ['mdi:lightning-bolt', 'Ist-Leistung:', num('sensor.miner2_cur_load',0) + ' W'],
                  ]);
                ]]]

          - type: custom:button-card
            show_name: false
            show_icon: false
            show_state: false
            entity: input_boolean.miner2_detail_miner
            tap_action:
              action: toggle
            styles:
              card:
