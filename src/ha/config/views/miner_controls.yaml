                - padding: 2px 12px
              grid:
                - grid-template-areas: '"body"'
                - grid-template-columns: 1fr
              custom_fields:
                body:
                  - width: 100%
                  - justify-self: stretch
                  - box-sizing: border-box
            custom_fields:
              body: >
                [[[
                  const g = (id) => { const s = states[id]?.state; return (s===undefined||s==='unknown'||s==='unavailable') ? null : s; };
                  const open = entity.state === 'on';
                  const ok = states['binary_sensor.miner2_available']?.state === 'on';
                  return window.bgMinerDetail('mdi:memory', 'Miner', ok, open, [
                    ['mdi:lan-connect', 'Verbindung:', ok ? 'Verbunden' : 'Getrennt'],
                    ['mdi:timer-outline', 'Laufzeit:', g('sensor.miner2_uptime') ?? '—'],
                    ['mdi:fit-to-screen', 'LCD-Display:', states['binary_sensor.miner2_lcdonoff_status']?.state === 'on' ? 'An' : 'Aus'],
                    ['mdi:thermometer', 'Innentemperatur:', (() => { const v=parseFloat(g('sensor.miner2_itemp')); return isNaN(v)?'—':v.toLocaleString('de-DE',{minimumFractionDigits:1,maximumFractionDigits:1})+' °C'; })()],
                    ['mdi:lan', 'Netzwerkfehler (#):', g('sensor.miner2_network_errors') ?? '—'],
                    ['mdi:comment-text-outline', 'Status:', g('sensor.miner2_systemstatus') ?? '—'],
                    ['mdi:list-status', 'Statuscode:', g('sensor.miner2_state') ?? '—'],
                    ['mdi:identifier', 'ID:', g('sensor.miner2_id') ?? '—'],
                    ['mdi:chip', 'Firmware:', g('sensor.miner2_firmware') ?? '—'],
                    ['mdi:lan', 'MAC-Adresse:', g('sensor.miner2_mac_address') ?? '—'],
                    ['mdi:counter', 'CGMiner-Version:', g('sensor.miner2_cgminer_version') ?? '—'],
                    ['mdi:api', 'API-Version:', g('sensor.miner2_api_version_status') ?? '—'],
                  ]);
                ]]]

          - type: custom:button-card
            show_name: false
            show_icon: false
            show_state: false
            entity: input_boolean.miner2_detail_hashboard
            tap_action:
              action: toggle
            styles:
              card:
                - background: rgba(255,255,255,0.04)
                - box-shadow: none
                - border: none
                - border-radius: 14px
                - overflow: hidden
                - margin: 0 0 6px
                - padding: 2px 12px
              grid:
                - grid-template-areas: '"body"'
                - grid-template-columns: 1fr
              custom_fields:
                body:
                  - width: 100%
                  - justify-self: stretch
                  - box-sizing: border-box
            custom_fields:
              body: >
                [[[
                  const g = (id) => { const s = states[id]?.state; return (s===undefined||s==='unknown'||s==='unavailable') ? null : s; };
                  const t1 = (id) => { const v=parseFloat(g(id)); return isNaN(v)?'—':v.toLocaleString('de-DE',{minimumFractionDigits:1,maximumFractionDigits:1})+' °C'; };
                  const open = entity.state === 'on';
                  const ok = states['sensor.miner2_api_litestats']?.state === 'OK';
                  const asics = g('sensor.miner2_total_asics');
                  const asicModel = g('sensor.miner2_asic_model');
                  const hbi = g('sensor.miner2_hbitemp'), hbo = g('sensor.miner2_hbotemp');
                  const hbiN = hbi!==null?parseFloat(hbi).toLocaleString('de-DE',{minimumFractionDigits:1,maximumFractionDigits:1}):'—';
                  const hboN = hbo!==null?parseFloat(hbo).toLocaleString('de-DE',{minimumFractionDigits:1,maximumFractionDigits:1}):'—';
                  const cpuFreq = (() => { const v=parseFloat(g('sensor.miner2_cpu_freq')); return isNaN(v)?'—':v.toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2}); })();
                  const hwErrR = (() => { const v=parseFloat(g('sensor.miner2_hardware_errorsr')); return isNaN(v)?'—':v.toLocaleString('de-DE',{minimumFractionDigits:3,maximumFractionDigits:3}); })();
                  return window.bgMinerDetail('mdi:expansion-card-variant', 'Hashboard', ok, open, [
