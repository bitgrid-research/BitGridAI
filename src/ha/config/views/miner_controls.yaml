                    option: Standby
              - type: custom:button-card
                entity: select.miner2_workmode_set
                name: Eco
                icon: mdi:leaf
                show_state: false
                styles:
                  card:
                    - background: >
                        [[[
                          return entity.state === 'Eco'
                            ? '#4CAF50' : 'var(--secondary-background-color)';
                        ]]]
                    - border-radius: 10px
                    - padding: 10px 4px
                  icon:
                    - width: 26px
                    - height: 26px
                    - color: >
                        [[[
