# ═══════════════════════════════════════════════════════════════════════
# Miner-Steuerung (lean) — Energie-Status-Buttons (Akku/PV/Überschuss/Netz/
# Haus/Miner/Heizstab) und die Avalon Q 01 / Q 02 Steuerung (Power/Auto/
# Display/Reboot + Standby/Eco/Standard/Super + Kennzahlen).
#
# Hamster-Status-Erklärung + Power-Flow wurden nach views/miner_status.yaml
# ausgelagert (nur Dev-"Miner"-Tab); auf dem Home-Tab stehen sie ohnehin.
# Eingebunden via !include in:
#   - bitgrid_dashboard_v1.yaml   → linke Spalte des Dev-"Miner"-Tabs
#                                 (unter miner_status.yaml)
#   - bitgrid_dashboard_v2.yaml  → Tab "Steuerung", Grid-Area "miner"
# Single source of truth. Runde Ecken via www/bitgrid_card_shape.js.
# ═══════════════════════════════════════════════════════════════════════
type: vertical-stack
cards:

  # ── Miner Spalten ────────────────────────────────────────────────────────
  - type: horizontal-stack
    cards:

      # ─────────────────────────────────────────────
      # MINER 1
      # ─────────────────────────────────────────────
      - type: vertical-stack
        card_mod:
          style: |
            :host {
              display: block;
              background: var(--ha-card-background) !important;
              border: var(--ha-card-border-width, 1px) solid var(--ha-card-border-color) !important;
              border-radius: 20px !important;
              box-shadow: var(--ha-card-box-shadow) !important;
              overflow: hidden !important;
              contain: paint !important;
            }
        cards:

          - type: custom:button-card
            template: miner_header
            entity: binary_sensor.miner1_available
            name: "Miner Avalon Q 01  ›"
            icon: mdi:memory
            styles:
              card:
                - background: transparent
                - box-shadow: none
                - border: none

          - type: horizontal-stack
            cards:

              - type: custom:button-card
                template: miner_btn
                entity: sensor.miner1_workmode_status
                name: Power
                icon: >
                  [[[
                    return entity.state === 'Standby' ? 'mdi:power-sleep' : 'mdi:power';
                  ]]]
                state_display: >
                  [[[
                    const s = entity.state;
                    if (['Eco','Standard','Super'].includes(s)) return 'An';
                    if (s === 'Standby') return 'Standby';
                    return 'Aus';
                  ]]]
                styles:
                  icon:
                    - width: 44px
                    - height: 44px
                    - color: >
                        [[[
                          const s = entity.state;
                          if (['Eco','Standard','Super'].includes(s)) return 'var(--bg-color-eco)';
                          if (s === 'Standby') return 'var(--accent-color)';
                          return 'var(--disabled-color)';
                        ]]]
                tap_action:
                  action: call-service
                  service: >
                    [[[
                      const on = ['Eco','Standard','Super'].includes(entity.state);
                      return on
                        ? 'shell_command.miner1_set_softoff'
                        : 'shell_command.miner1_set_softon';
                    ]]]

              - type: custom:button-card
                template: miner_btn
                entity: input_boolean.miner1_auto_load_management
                name: Auto
                icon: mdi:refresh-auto
                state_display: >
                  [[[
                    return entity.state === 'on' ? 'Ein' : 'Aus';
                  ]]]
                styles:
                  icon:
                    - width: 44px
                    - height: 44px
                    - color: >
                        [[[
                          return entity.state === 'on'
                            ? 'var(--bg-color-eco)' : 'var(--disabled-color)';
                        ]]]
                tap_action:
                  action: toggle

              - type: custom:button-card
                template: miner_btn
                entity: switch.miner1_lcdonoff_switch
                name: Display
                icon: mdi:fit-to-screen
                state_display: >
                  [[[
                    return entity.state === 'on' ? 'Ein' : 'Aus';
                  ]]]
                styles:
                  icon:
                    - width: 44px
                    - height: 44px
                    - color: >
                        [[[
                          return entity.state === 'on'
                            ? 'var(--bg-color-standard)' : 'var(--disabled-color)';
                        ]]]
                tap_action:
                  action: toggle

              - type: custom:button-card
                template: miner_btn
                name: Reboot
                icon: mdi:restart
                show_state: false
                styles:
                  icon:
                    - width: 44px
                    - height: 44px
                    - color: "var(--secondary-text-color)"
                tap_action:
                  action: call-service
                  service: shell_command.miner1_reboot

          - type: horizontal-stack
            card_mod:
              style: |
                :host {
                  display: flex !important;
                  align-items: stretch !important;
                  background: rgba(255,255,255,0.06);
                  border-radius: 14px !important;
                  overflow: hidden !important;
                  margin: 0 8px 8px;
                }
            cards:
              - type: custom:button-card
                entity: select.miner1_workmode_set
                name: Eco
                icon: mdi:leaf
                show_state: false
                tap_action:
                  action: call-service
                  service: select.select_option
                  service_data:
                    entity_id: select.miner1_workmode_set
                    option: Eco
                styles:
                  card:
                    - background: >
                        [[[return entity.state==='Eco'?'rgba(255,255,255,0.14)':'transparent']]]
                    - box-shadow: none
                    - border: none
                    - padding: 8px 4px
                    - height: 72px
                    - box-sizing: border-box !important
                    - margin: "0 !important"
                  icon:
                    - color: >
                        [[[return entity.state==='Eco'?'var(--bg-color-eco)':'rgba(255,255,255,0.3)']]]
                    - width: 24px
                    - height: 24px
                  name:
                    - font-size: 0.72rem
                    - font-weight: >
                        [[[return entity.state==='Eco'?'700':'400']]]
                    - color: >
                        [[[return entity.state==='Eco'?'var(--primary-text-color)':'var(--secondary-text-color)']]]
              - type: custom:button-card
                entity: select.miner1_workmode_set
                name: Standard
                icon: mdi:gauge
                show_state: false
                tap_action:
                  action: call-service
                  service: select.select_option
                  service_data:
                    entity_id: select.miner1_workmode_set
                    option: Standard
                styles:
                  card:
                    - background: >
                        [[[return entity.state==='Standard'?'rgba(255,255,255,0.14)':'transparent']]]
                    - box-shadow: none
                    - border: none
                    - padding: 8px 4px
                    - height: 72px
                    - box-sizing: border-box !important
                    - margin: "0 !important"
                  icon:
                    - color: >
                        [[[return entity.state==='Standard'?'var(--bg-color-standard)':'rgba(255,255,255,0.3)']]]
                    - width: 24px
                    - height: 24px
                  name:
                    - font-size: 0.72rem
                    - font-weight: >
                        [[[return entity.state==='Standard'?'700':'400']]]
                    - color: >
                        [[[return entity.state==='Standard'?'var(--primary-text-color)':'var(--secondary-text-color)']]]
              - type: custom:button-card
                entity: select.miner1_workmode_set
                name: Super
                icon: mdi:rocket-launch
                show_state: false
                tap_action:
                  action: call-service
                  service: select.select_option
                  service_data:
                    entity_id: select.miner1_workmode_set
                    option: Super
                styles:
                  card:
                    - background: >
                        [[[return entity.state==='Super'?'rgba(255,255,255,0.14)':'transparent']]]
                    - box-shadow: none
                    - border: none
                    - padding: 8px 4px
                    - height: 72px
                    - box-sizing: border-box !important
                    - margin: "0 !important"
                  icon:
                    - color: >
                        [[[return entity.state==='Super'?'var(--bg-color-super)':'rgba(255,255,255,0.3)']]]
                    - width: 24px
                    - height: 24px
                  name:
                    - font-size: 0.72rem
                    - font-weight: >
                        [[[return entity.state==='Super'?'700':'400']]]
                    - color: >
                        [[[return entity.state==='Super'?'var(--primary-text-color)':'var(--secondary-text-color)']]]

          - type: custom:button-card
            show_name: false
            show_icon: false
            show_state: false
            styles:
              card:
                - padding: 12px 8px
                - background: transparent
                - box-shadow: none
                - border: none
              grid:
                - grid-template-areas: '"stats"'
                - grid-template-columns: 1fr
              custom_fields:
                stats:
                  - width: 100%
                  - justify-self: stretch
                  - align-self: stretch
                  - box-sizing: border-box
            custom_fields:
              stats: >
                [[[
                  const ths = states['sensor.miner1_thsspd']?.state ?? '—';
                  const jth = states['sensor.miner1_energy_per_th']?.state ?? '—';
                  const sw  = states['sensor.shellyplugsg3_dcb4d9c5567c_leistung']?.state ?? '—';
                  const fan = states['sensor.miner1_fanr']?.state ?? '—';
                  const tmax = states['sensor.miner1_tmax']?.state ?? '—';
                  const tavg = states['sensor.miner1_tavg']?.state ?? '—';
                  const hbi  = states['sensor.miner1_hbitemp']?.state ?? '—';
                  const hbo  = states['sensor.miner1_hbotemp']?.state ?? '—';
                  const statusEnt = states['sensor.miner1_workmode_status'];
                  const mode = statusEnt?.state ?? '—';
                  const parseIdt = (s) => (s && s !== 'unknown' && s !== 'unavailable' && !s.startsWith('1970'))
                    ? new Date(s.replace(' ', 'T')).getTime() / 1000 : 0;
                  const sinceTs  = Math.max(
                    parseIdt(states['input_datetime.mvp_miner1_last_upgrade']?.state),
                    parseIdt(states['input_datetime.mvp_miner1_last_downgrade']?.state)
                  );
                  const since    = sinceTs > 0
                    ? new Date(sinceTs * 1000).toLocaleTimeString('de-DE', {hour:'2-digit', minute:'2-digit'})
                    : '—';
                  const cd = states['sensor.miner_1_cooldown_status']?.state ?? '—';
                  const cdActive = cd !== '—' && cd !== 'unavailable' && cd !== 'unknown';
                  const cdColor = cdActive ? 'var(--accent-color)' : 'var(--secondary-text-color)';
                  const cdTag = cdActive
                    ? `<span style="margin-left:8px;font-size:0.78rem;color:var(--accent-color);font-weight:600;">${cd}</span>`
                    : '';
                  const tempColor = (v) => {
                    if (v === '—') return 'var(--secondary-text-color)';
                    const t = parseFloat(v);
                    if (mode === 'Standby' || mode === 'Idle' || mode === 'Off' || t < 45) return 'var(--secondary-text-color)';
                    if (mode === 'Eco')
                      return t >= 80 ? 'var(--bg-color-reserve)' : t >= 75 ? 'var(--accent-color)' : 'var(--bg-color-eco)';
                    if (mode === 'Standard')
                      return t >= 110 ? 'var(--bg-color-reserve)' : t >= 100 ? 'var(--bg-color-heat)' : 'var(--bg-color-eco)';
                    return t >= 110 ? 'var(--bg-color-reserve)' : t >= 100 ? 'var(--bg-color-heat)' : 'var(--bg-color-eco)';
                  };
                  const tmaxColor = tempColor(tmax);
                  const tavgColor = tempColor(tavg);
                  const hbiColor  = tempColor(hbi);
                  const hboColor  = tempColor(hbo);
                  const row = (icon, label, val, color) =>
                    `<div style="display:flex;align-items:center;padding:3px 0;">
                      <ha-icon icon="${icon}" style="--mdc-icon-size:16px;color:${color ?? 'var(--secondary-text-color)'};flex-shrink:0;margin-right:8px;"></ha-icon>
                      <span style="flex:1;color:${color ?? 'var(--secondary-text-color)'};font-size:0.85rem;">${label}:</span>
                      <span style="font-size:1rem;font-weight:600;color:${color ?? 'inherit'};text-align:right;white-space:nowrap;">${val}</span>
                    </div>`;
                  return `<div style="width:100%;padding:4px 0;text-align:left;">
                    ${row('mdi:speedometer','Hashrate', ths !== '—' ? ths + ' TH/s' : '—')}
                    ${row('mdi:lightning-bolt','Effizienz', jth !== '—' ? jth + ' J/TH' : '—')}
                    ${row('mdi:power-plug','Verbrauch', sw !== '—' ? sw + ' W' : '—')}
                    ${row('mdi:fan','Lüfter', fan !== '—' ? fan + ' %' : '—')}
                    ${row('mdi:thermometer-high','Höchsttemp.', tmax !== '—' ? tmax + ' °C' : '—', tmaxColor)}
                    ${row('mdi:thermometer-auto','Ø Temperatur', tavg !== '—' ? tavg + ' °C' : '—', tavgColor)}
                    ${row('mdi:thermometer-chevron-down','Einlass', hbi !== '—' ? hbi + ' °C' : '—', hbiColor)}
                    ${row('mdi:thermometer-chevron-up','Auslass', hbo !== '—' ? hbo + ' °C' : '—', hboColor)}
                    <div style="display:flex;align-items:center;padding:3px 0;">
                      <ha-icon icon="mdi:timer-outline" style="--mdc-icon-size:16px;color:${cdColor};flex-shrink:0;margin-right:8px;"></ha-icon>
                      <span style="flex:1;color:${cdColor};font-size:0.85rem;">Status seit:</span>
                      <span style="font-size:1rem;font-weight:600;display:flex;align-items:center;gap:4px;white-space:nowrap;">${since}&#160;&#160;${mode}${cdTag}</span>
                    </div>
                  </div>`;
                ]]]

      # ─────────────────────────────────────────────
      # 8px Spacer
      # ─────────────────────────────────────────────
      - type: custom:button-card
        show_name: false
        show_icon: false
        show_state: false
        styles:
          card:
            - background: transparent
            - box-shadow: none
            - width: 8px
            - min-width: 8px
            - max-width: 8px
            - padding: 0

      # ─────────────────────────────────────────────
      # MINER 2
