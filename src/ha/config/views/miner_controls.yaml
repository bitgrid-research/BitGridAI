          # ─────────────────────────────────────────
          # LOG — siehe Kommentar bei Miner 1 oben.
          # ─────────────────────────────────────────
          - type: custom:button-card
            show_name: false
            show_icon: false
            show_state: false
            entity: input_boolean.miner2_detail_log
            tap_action:
              action: toggle
            styles:
              card:
                - background: rgba(255,255,255,0.04)
                - box-shadow: none
                - border: none
                - border-radius: 14px
                - overflow: hidden
                - margin: 0 0 6px
                - padding: 2px 12px
              grid:
                - grid-template-areas: '"body"'
                - grid-template-columns: 1fr
              custom_fields:
                body:
                  - width: 100%
                  - justify-self: stretch
                  - box-sizing: border-box
            custom_fields:
              body: >
                [[[
                  const open = entity.state === 'on';
                  const rule = states['input_text.mvp_miner2_rule']?.state ?? '';
                  // Neutraler Regel-Status statt Stoerung, s. Log bei Miner 1.
                  const ok = rule === 'R1 Stopp'
                    ? {icon: 'mdi:pause-circle', color: 'var(--accent-color)', title: 'R1 Hausreserve: Miner pausiert, Akku lädt'}
                    : rule === 'R2 Temp-Sperre'
                      ? {icon: 'mdi:thermometer-alert', color: 'var(--bg-color-heat)', title: 'R2 Temperatur-Sperre'}
                      : true;
                  const entries = (states['sensor.miner_2_log']?.attributes?.entries || []).slice().reverse();
                  const rows = entries.length ? entries.map((e) => `
                    <div style="display:flex;gap:6px;padding:3px 0;border-bottom:1px solid rgba(255,255,255,0.06);">
                      <span style="color:var(--secondary-text-color);flex-shrink:0;">${e.time}</span>
                      <span style="opacity:0.55;flex-shrink:0;">${e.miner}</span>
                      <span style="font-weight:700;color:var(--primary-text-color);flex-shrink:0;">${e.rule}</span>
                      <span style="color:var(--secondary-text-color);overflow-wrap:anywhere;">${e.values}</span>
                    </div>`).join('') : '<div style="color:var(--secondary-text-color);">Noch keine Einträge</div>';
                  return window.bgMinerDetail('mdi:text-box-outline', 'Log', ok, open, [
                    ['text', `<div style="max-height:240px;overflow-y:auto;">${rows}</div>`],
                  ]);
                ]]]
