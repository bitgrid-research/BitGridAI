          # ═══════════════════════════════════════════════════════════
          # WETTER-SPALTE  —  eigener vertical-stack (Uhr+Icon / Stunden / Woche
          # / Sonnenstand), unabhaengige natuerliche Hoehe.
          # ═══════════════════════════════════════════════════════════
          - type: vertical-stack
            view_layout:
              grid-area: wetter
            cards:

              # ═══════════════════════════════════════════════════════════
              # UHR + ICON  —  Wetter-Gruppe, Lage 1 (clk; Anteil siehe layout)
              # clock-weather-card (HACS: pkissling/clock-weather-card), nur der
              # Heute-Bereich: Icon, aktuelle Lage, Uhr, Datum. Die Vorschaubalken
              # sind ausgeblendet (hide_forecast_section), sie stecken jetzt in
              # den eigenen Karten hrs (stündlich) und wek (5-Tage).
              # Runde Ecken: Theme liefert ha-card-border-radius, aber die Karte
              # clippt ihren Hintergrund nicht selbst darauf, das übernimmt
              # www/bitgrid_card_shape.js (card-mod ist hier nicht installiert).
              # fill-Icons statt animiert: farbig wie der Entwurf, aber leichter
              # für das Wandtablet (Qualitätsziel Nachhaltigkeit/Edge-Schonung).
              # ═══════════════════════════════════════════════════════════
              - type: custom:clock-weather-card
                entity: weather.forecast_home
                sun_entity: sun.sun
                # clock-weather-card-i18n kennt nur Kurz-Codes (de, en, …); 'de-DE'
                # fällt auf Englisch zurück. Luxon (date_pattern) rendert 'de'
                # ebenfalls deutsch, also deckt 'de' beides ab.
                locale: de
                time_format: '24'
                date_pattern: 'cccc, dd.LL.yyyy'
                weather_icon_type: fill
                animated_icon: false
                hide_today_section: false
                hide_forecast_section: true
                hide_clock: false
                hide_date: false


              # ═══════════════════════════════════════════════════════════
              # STUNDEN  —  Wetter-Gruppe, Lage 2 (hrs; Anteil siehe layout)
              # Eingebaute weather-forecast-Karte, stündlich: horizontaler
              # Zeitstrahl, der in den flachen Streifen passt (die
              # clock-weather-card rendert Vorschau nur als gestapelte Zeilen).
              # show_current aus, weil die Uhr-Karte (clk) die aktuelle Lage
              # schon zeigt. Runde Ecken: in www/bitgrid_card_shape.js mit
              # aufgenommen (HUI-WEATHER-FORECAST-CARD), damit sie wie die anderen
              # garantiert auf den Radius geclippt wird.
              # ═══════════════════════════════════════════════════════════
              - type: weather-forecast
                entity: weather.forecast_home
                forecast_type: hourly
                show_current: false
                show_forecast: true


              # ═══════════════════════════════════════════════════════════
              # WOCHE  —  Wetter-Gruppe, Lage 3 (wek; Anteil siehe layout)
              # clock-weather-card, nur der Vorschau-Bereich: 5-Tage-Balken.
              # hide_today_section blendet Uhr/Icon/Datum aus (stecken in clk).
              # Runde Ecken wie bei clk über www/bitgrid_card_shape.js.
              # ═══════════════════════════════════════════════════════════
              - type: custom:clock-weather-card
                entity: weather.forecast_home
                sun_entity: sun.sun
                locale: de
                time_format: '24'
                weather_icon_type: fill
                animated_icon: false
                forecast_rows: 5
                hide_today_section: true
                hide_forecast_section: false
                hide_clock: true
                hide_date: true


              # ═══════════════════════════════════════════════════════════
              # SONNENSTAND  —  Wetter-Gruppe unten (sun)
              # horizon-card (HACS: rejuvenate/lovelace-horizon-card): Sonne +
              # Mond über dem Horizont mit Auf-/Untergängen und Mondphase. Liest
              # sun.sun (und HA-Standort) automatisch, kein entity nötig.
              # Runde Ecken: Theme-Radius greift, den Horizont-Gradienten clippt
              # www/bitgrid_card_shape.js (card-mod ist hier nicht installiert).
              # ═══════════════════════════════════════════════════════════
              - type: custom:horizon-card
                language: de


  - title: Steuerung
    path: steuerung
    icon: mdi:pickaxe
    theme: BitGridAI
    panel: true
    cards:
      - type: custom:layout-card
        layout_type: custom:grid-layout
        layout:
          # Zwei gleich breite Spalten (wie Tab 1), Gruppentitel in einer
          # min-content-Zeile darüber. Keine feste Höhe: die Inhaltszeile wächst
          # mit dem (hohen) Miner-Block, die Seite scrollt. Die Regelschwellen-
          # Spalte ist kürzer und lässt darunter Leerraum (akzeptiert).
          # minmax(0, 1fr) statt 1fr: 1fr = minmax(auto, 1fr), und das auto-Minimum
          # ist die min-content-Breite. Der Miner-Block (7-Button-Energiezeile,
          # 2-Miner-Steuergrid) ist im min-content breiter als 50% und würde sonst
          # seine Spalte sprengen und die rechte auf ~0 drücken. minmax(0, …)
          # klemmt beide Spalten hart auf ihren 50%-Anteil (gleiche Technik wie
          # Tab 1 bei den Zeilen).
          grid-template-columns: minmax(0, 1fr) minmax(0, 1fr)
          grid-template-rows: min-content auto
          grid-template-areas: '"tl tr" "miner regel"'
          grid-gap: 14px
          padding: 14px
          box-sizing: border-box
        cards:

          # ── Gruppen-Titel links: MINER ──────────────────────────────
          - type: custom:button-card
            view_layout:
              grid-area: tl
            icon: mdi:pickaxe
            name: Miner
            show_state: false
            tap_action:
              action: none
            styles:
              card:
                - background: none
                - box-shadow: none
                - border: none
                - padding: 4px 4px 0
              grid:
                - grid-template-areas: '"i n"'
                - grid-template-columns: min-content 1fr
                - align-items: center
              img_cell:
                - justify-content: start
                - align-self: center
              icon:
                - color: var(--secondary-text-color)
                - width: 24px
                - height: 24px
              name:
                - font-size: 1.0rem
                - font-weight: 700
                - text-transform: uppercase
                - letter-spacing: 0.07em
                - color: var(--secondary-text-color)
                - justify-self: start
                - padding-left: 10px

          # ── Gruppen-Titel rechts: REGELSCHWELLEN ────────────────────
          - type: custom:button-card
            view_layout:
              grid-area: tr
            icon: mdi:tune-variant
            name: Regelschwellen
            show_state: false
            tap_action:
              action: none
            styles:
              card:
                - background: none
                - box-shadow: none
                - border: none
                - padding: 4px 4px 0
              grid:
                - grid-template-areas: '"i n"'
                - grid-template-columns: min-content 1fr
                - align-items: center
              img_cell:
                - justify-content: start
                - align-self: center
              icon:
                - color: var(--secondary-text-color)
                - width: 24px
                - height: 24px
              name:
                - font-size: 1.0rem
                - font-weight: 700
                - text-transform: uppercase
                - letter-spacing: 0.07em
                - color: var(--secondary-text-color)
                - justify-self: start
                - padding-left: 10px

          # ── Miner-Steuerungs-Grid links (geteilt, views/miner_controls.yaml) ──
          # Nur die Steuerungsspalte (Q01/Q02), NICHT die Stats-/Wetter-Spalte
          # (die steckt in views/miner_stats.yaml und bleibt dem Dev-Dashboard
          # vorbehalten). In vertical-stack gefasst, damit die geteilte Karte
          # ohne eigenes view_layout in die Grid-Area "miner" gelegt werden kann.
          - type: vertical-stack
            view_layout:
              grid-area: miner
            cards:
              - !include views/miner_controls.yaml

          # ── Regelschwellen rechts: SoC-Bänder + Start/Sicherheit/Nacht ──
          # Im schmaleren rechten 50%-Streifen vertikal gestapelt (statt
          # nebeneinander wie früher über die volle Breite).
          - type: vertical-stack
            view_layout:
              grid-area: regel
            cards:
              # ── SoC-Bänder: Visualisierung + 4 Schwellwert-Slider ─────────
              - type: vertical-stack
                card_mod:
                  style: |
                    :host {
                      background: var(--ha-card-background) !important;
                      border: var(--ha-card-border-width, 1px) solid var(--ha-card-border-color) !important;
                      border-radius: 20px !important;
                      box-shadow: var(--ha-card-box-shadow) !important;
                      overflow: hidden !important;
                      contain: paint !important;
                    }
                    #root {
                      gap: 0 !important;
                    }
                cards:
                  # SVG-Visualisierung: Sonnenbogen + Schwellwertlinien + Kreise
                  - type: custom:button-card
                    show_name: false
                    show_icon: false
                    show_state: false
                    tap_action:
                      action: none
                    styles:
                      card:
                        - padding: "6px 6px 2px 6px"
                        - background: "transparent"
                        - box-shadow: "none"
                      grid:
                        - grid-template-areas: '"chart"'
                        - grid-template-columns: "1fr"
                        - grid-template-rows: "auto"
                      custom_fields:
                        chart:
                          - width: "100%"
                          - overflow: "hidden"
                    custom_fields:
                      chart: >
                        [[[
                          const eco  = parseFloat(states['input_number.mvp_soc_eco_start_pct']?.state || 60);
                          const std  = parseFloat(states['input_number.mvp_soc_std_pct']?.state || 75);
                          const sup  = parseFloat(states['input_number.mvp_soc_super_pct']?.state || 90);
                          const stop = parseFloat(states['input_number.mvp_soc_stop_pct']?.state || 50);
                          // Eigene Runterschalt-Schwellen seit 23.08.2026 (vorher: Super kollabierte
                          // ueber den pauschalen Nachmittags-Cap, keine eigene Runterschalt-Marke).
                          const supOff = parseFloat(states['input_number.mvp_soc_super_off_pct']?.state || 95);
                          const stdOff = parseFloat(states['input_number.mvp_soc_std_off_pct']?.state || 83);
                          const soc  = parseFloat(states['sensor.battery_soc_pct']?.state);
                          const W=570, H=290, cL=48, cR=545, cT=30, cB=252;
                          const yS = s => cB - s*(cB-cT)/100;
                          const batMin = yS(20);
                          function tForY(ty) {
                            let lo=0, hi=1;
                            for(let i=0;i<60;i++){const m=(lo+hi)/2;const y=batMin*(1-m)*(1-m)*(1+2*m)+cT*m*m*(3-2*m);if(y>ty)lo=m;else hi=m;}
                            return (lo+hi)/2;
                          }
                          // Real sun times from sun.sun (next_* are UTC; if >20h ahead it's tomorrow → -24h)
                          const sa=states['sun.sun']?.attributes||{};
                          const nowMs=Date.now();
                          const sunMs=iso=>{if(!iso)return null;let ms=new Date(iso).getTime();if(ms-nowMs>20*3600000)ms-=86400000;return ms;};
                          const hrOf=ms=>{if(!ms)return null;const d=new Date(ms);return d.getHours()+d.getMinutes()/60;};
                          const riseH=hrOf(sunMs(sa.next_rising))??5.47;
                          const noonH=hrOf(sunMs(sa.next_noon))??13.58;
                          const setH=hrOf(sunMs(sa.next_setting))??21.68;
                          // Chart X for decimal hour h, clamped to [cL,cR]
                          const xH=h=>cL+Math.max(0,Math.min(1,(h-5.5)/17))*(cR-cL);
                          const xRise=xH(riseH),xNoon=xH(noonH),xSet=xH(setH);
                          // Battery ascending bezier: flat 20% until sunrise, then charge to 100% at noon
                          // Y formula: P0y=P1y=batMin, P2y=P3y=cT → tForY binary search valid for any X points
                          const hw=noonH-riseH; // morning window width in hours
                          const bP1x=xH(riseH+hw*0.35);
                          const bP3x=xNoon;
                          const bP2x=xH(riseH+hw*0.70);
                          function xForT(t){const u=1-t;return u*u*u*xRise+3*u*u*t*bP1x+3*u*t*t*bP2x+t*t*t*bP3x;}
                          function posC(s){const y=yS(s);return{x:xForT(tForY(y)),y};}
                          const ecoC=posC(eco),stdC=posC(std),supC=posC(sup);
                          const hausY=yS(stop);
                          const curY=isNaN(soc)?null:yS(Math.min(100,Math.max(0,soc)));
                          // Modus-/Schwellenfarben aus den Theme-Tokens (themes/bitgrid.yaml).
                          // Im SVG als style-Attribut setzen: var() wird in fill/stroke-
                          // ATTRIBUTEN nicht aufgelöst, in style dagegen schon (erbt vom View).
                          const cEco='var(--bg-color-eco,#4CAF50)',cStd='var(--bg-color-standard,#26C6DA)',cSup='var(--bg-color-super,#F7931A)',cRes='var(--bg-color-reserve,#EF5350)';
                          // Battery: flat 20% to sunrise → charge to noon → plateau → discharge to sunset → flat 20% to 23h
                          const aw=setH-(noonH+1.5); // afternoon window after plateau
                          const xDstart=xH(noonH+1.5),xDp1=xH(noonH+1.5+aw*0.30),xDp2=xH(noonH+1.5+aw*0.68);
                          function xForT_desc(t){const u=1-t;return u*u*u*xDstart+3*u*u*t*xDp1+3*u*t*t*xDp2+t*t*t*xSet;}
                          function posC_desc(s){const y=yS(s);return{x:xForT_desc(1-tForY(y)),y};}
                          const batD='M '+cL+','+batMin+' L '+xRise+','+batMin+
                                     ' C '+bP1x+','+batMin+' '+bP2x+','+cT+' '+xNoon+','+cT+
                                     ' L '+xDstart+','+cT+
                                     ' C '+xDp1+','+cT+' '+xDp2+','+batMin+' '+xSet+','+batMin+
                                     ' L '+cR+','+batMin;
                          // Sun: real sunrise→noon→sunset from sun.sun, asymmetric halves
                          const hs1=xNoon-xRise,hs2=xSet-xNoon;
                          const sunD='M '+xRise+','+cB+
                                     ' C '+(xRise+hs1*0.55)+','+cB+' '+(xNoon-hs1*0.35)+','+cT+' '+xNoon+','+cT+
                                     ' S '+(xNoon+hs2*0.55)+','+cB+' '+xSet+','+cB;
                          function mark(c,col,lbl,dotCol,dotR){
                            dotCol=dotCol||col; dotR=dotR||5;
                            const ly=Math.max(cT+8,c.y-22);
                            const hasLine=(c.y-6)>(ly+4);
                            return '<text x="'+c.x+'" y="'+ly+'" style="fill:'+col+'" font-size="10" font-family="Roboto,sans-serif" font-weight="600" text-anchor="middle">'+lbl+'</text>'+
                                   (hasLine?'<line x1="'+c.x+'" y1="'+(ly+4)+'" x2="'+c.x+'" y2="'+(c.y-6)+'" style="stroke:'+col+'" stroke-width="1.5" opacity="0.8"/>':'')+
                                   '<circle cx="'+c.x+'" cy="'+c.y+'" r="'+dotR+'" style="fill:'+dotCol+'" stroke="rgba(20,10,50,0.9)" stroke-width="2"/>';
                          }
                          // Runterschalt-Punkte dunkler als die Hochschalt-Punkte derselben Farbe,
                          // damit "hoch"/"runter" auch ohne Pfeil-Text auf einen Blick erkennbar ist.
                          const darken=col=>'color-mix(in srgb, '+col+' 55%, black)';
                          let s='<svg viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg" style="width:100%;display:block">';
                          s+='<circle cx="52" cy="11" r="4" style="fill:'+cEco+'"/><text x="59" y="15" fill="rgba(255,255,255,0.65)" font-size="9.5" font-family="Roboto,sans-serif">Schematik</text>';
                          s+='<line x1="148" y1="11" x2="162" y2="11" stroke="rgba(255,255,255,0.8)" stroke-width="2"/><circle cx="155" cy="11" r="3" fill="white"/><text x="167" y="15" fill="rgba(255,255,255,0.65)" font-size="9.5" font-family="Roboto,sans-serif">Verlauf heute</text>';
                          s+='<line x1="280" y1="11" x2="292" y2="11" stroke="rgba(255,180,0,0.8)" stroke-width="1.5" stroke-dasharray="3 2"/><circle cx="286" cy="11" r="3" fill="rgba(255,180,0,0.7)"/><text x="297" y="15" fill="rgba(255,255,255,0.65)" font-size="9.5" font-family="Roboto,sans-serif">Sonne</text>';
                          const yTicks=[0,20,40,60,80,100];
                          for(const p of yTicks){const y=yS(p);s+='<line x1="'+cL+'" y1="'+y+'" x2="'+cR+'" y2="'+y+'" stroke="rgba(255,255,255,0.07)" stroke-width="0.8"/><text x="'+(cL-4)+'" y="'+(y+3.5)+'" fill="rgba(255,255,255,0.5)" font-size="9" font-family="Roboto,sans-serif" text-anchor="end">'+p+'%</text>';}
                          for(let h=6;h<=22;h++){const x=xH(h);const major=(h%3===0);s+='<line x1="'+x+'" y1="'+cT+'" x2="'+x+'" y2="'+cB+'" stroke="rgba(255,255,255,'+(major?'0.07':'0.03')+')" stroke-width="0.8"/><text x="'+x+'" y="'+(cB+13)+'" fill="rgba(255,255,255,'+(major?'0.55':'0.3')+')" font-size="'+(major?'9':'8')+'" font-family="Roboto,sans-serif" text-anchor="middle">'+h+'</text>';}
                          s+='<text x="'+(cL+(cR-cL)/2)+'" y="'+(cB+25)+'" fill="rgba(255,255,255,0.35)" font-size="9" font-family="Roboto,sans-serif" text-anchor="middle">Uhrzeit</text>';
                          s+='<line x1="'+cL+'" y1="'+cT+'" x2="'+cL+'" y2="'+cB+'" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>';
                          s+='<line x1="'+cL+'" y1="'+cB+'" x2="'+cR+'" y2="'+cB+'" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>';
                          s+='<path d="'+sunD+' V'+cB+' H'+xRise+' Z" fill="rgba(255,165,0,0.12)"/>';
                          s+='<path d="'+sunD+'" fill="none" stroke="rgba(255,180,0,0.55)" stroke-width="1.5" stroke-dasharray="5 3"/>';
                          // Fetch today's real SoC history — WebSocket with fallback to input_text
                          if(!window._bgsocTrace) window._bgsocTrace={date:'',pts:[],status:'idle'};
                          const today=new Date().toISOString().slice(0,10);
                          if(window._bgsocTrace.date!==today && window._bgsocTrace.status!=='fetching'){
                            window._bgsocTrace.status='fetching';
                            const t0=new Date(); t0.setHours(0,0,0,0);
                            // Try callWS first, then connection.sendMessagePromise as fallback
                            const wsFn=hass?.callWS?.bind(hass)||(msg=>hass?.connection?.sendMessagePromise?.(msg));
                            const wsMsg={type:'history/history_during_period',start_time:t0.toISOString(),
                              entity_ids:['sensor.battery_soc_pct'],minimal_response:true,no_attributes:true};
                            const p=wsFn?.(wsMsg);
                            if(p) p.then(res=>{
                              const raw=res?.['sensor.battery_soc_pct']||[];
                              const bkts={};
                              for(const r of raw){
                                // lu can be seconds or ms; last_updated as ISO fallback
                                let ts=r.lu!==undefined?(r.lu>1e10?r.lu:r.lu*1000):(r.last_updated?Date.parse(r.last_updated):null);
                                if(!ts)continue;
                                const d=new Date(ts);
                                const h=d.getHours()+d.getMinutes()/60;
                                const bk=Math.round(h*6)/6;
                                const v=parseFloat(r.s??r.state);
                                if(!isNaN(v))bkts[bk]=v;
                              }
                              window._bgsocTrace={date:today,pts:Object.entries(bkts).sort((a,b)=>+a[0]-+b[0]).map(([h,v])=>[+h,v]),status:'ok'};
                            }).catch(()=>{window._bgsocTrace.status='error';});
                            else window._bgsocTrace.status='no-ws';
                          }
                          // Fallback: input_text.batt_soc_trace (30-min snapshots from automation)
                          let trace=window._bgsocTrace.pts;
                          if(trace.length===0){try{const raw=states['input_text.batt_soc_trace']?.state||'';const p=raw.split('|');if(p.length===2&&p[0]===today)trace=JSON.parse(p[1]);}catch(e){}}
                          const _dbg=window._bgsocTrace.status+'/'+trace.length+'pts';
                          const hasTrace=trace.length>3;
                          // Green schematic: full when no data, faded reference when real trace present
                          s+='<path d="'+batD+' V'+cB+' H'+cL+' Z" fill="rgba(76,175,80,'+(hasTrace?'0.04':'0.12')+')" />';
                          s+='<path d="'+batD+'" fill="none" style="stroke:'+cEco+'" stroke-width="'+(hasTrace?'1':'2')+'" opacity="'+(hasTrace?'0.25':'1')+'"/>';
                          s+='<line x1="'+cL+'" y1="'+hausY+'" x2="'+cR+'" y2="'+hausY+'" style="stroke:'+cRes+'" stroke-width="1.5" stroke-dasharray="5 4" opacity="0.75"/>';
                          s+='<text x="'+(cL+5)+'" y="'+(hausY-3)+'" style="fill:'+cRes+'" font-size="9.5" font-family="Roboto,sans-serif">Haus '+stop+'%</text>';
                          s+='<line x1="'+cL+'" y1="'+ecoC.y+'" x2="'+cR+'" y2="'+ecoC.y+'" style="stroke:'+cEco+'" stroke-width="0.8" stroke-dasharray="4 5" opacity="0.35"/>';
                          s+='<line x1="'+cL+'" y1="'+stdC.y+'" x2="'+cR+'" y2="'+stdC.y+'" style="stroke:'+cStd+'" stroke-width="0.8" stroke-dasharray="4 5" opacity="0.35"/>';
                          s+='<line x1="'+cL+'" y1="'+supC.y+'" x2="'+cR+'" y2="'+supC.y+'" style="stroke:'+cSup+'" stroke-width="0.8" stroke-dasharray="4 5" opacity="0.35"/>';
                          s+=mark(ecoC,cEco,'Eco '+eco+'%');
                          s+=mark(stdC,cStd,'Std '+std+'%');
                          s+=mark(supC,cSup,'Super '+sup+'%');
                          // Runterschalt-Schwellen auf dem absteigenden Ast (mvp_auto.yaml R4/R6):
                          // SoC-getrieben, nicht zeit-/sonnenstandgetrieben (der frühere pauschale
                          // "Eco-Cap ab Mittag" (P0a) wurde am 23.08.2026 entfernt — siehe
                          // docs/architecture/09_design_decisions/092_soc_saison_schwellen_vorschlag_de.md).
                          const supOffC=posC_desc(supOff),stdOffC=posC_desc(stdOff);
                          s+=mark(supOffC,cSup,'Super↓'+supOff+'%',darken(cSup),4);
                          s+=mark(stdOffC,cStd,'Std↓'+stdOff+'%',darken(cStd),4);
                          // Debug status (oben rechts, klein)
                          s+='<text x="'+(cR-2)+'" y="22" fill="rgba(255,255,255,0.35)" font-size="7.5" font-family="Roboto,sans-serif" text-anchor="end">'+_dbg+'</text>';
                          // Real trace: white polyline — only points within chart range [5h, 23h]
                          const visTrace=trace.filter(([h])=>h>=5.5&&h<=22.5);
                          if(visTrace.length>1){
                            const pts=visTrace.map(([h,v])=>xH(h).toFixed(1)+','+yS(v).toFixed(1)).join(' ');
                            s+='<polyline points="'+pts+'" fill="none" stroke="rgba(255,255,255,0.8)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
                          }
                          // Current live position dot at (now, soc)
                          if(curY!==null){
                            const nowH=new Date().getHours()+new Date().getMinutes()/60;
                            const nx=xH(nowH);
                            s+='<line x1="'+nx+'" y1="'+cT+'" x2="'+nx+'" y2="'+cB+'" stroke="rgba(255,255,255,0.18)" stroke-width="1" stroke-dasharray="2 3"/>';
                            s+='<circle cx="'+nx+'" cy="'+curY+'" r="5" fill="white" stroke="rgba(100,200,255,0.7)" stroke-width="2"/>';
                            s+='<text x="'+(nx+8)+'" y="'+Math.max(curY+4,cT+12)+'" fill="rgba(255,255,255,0.9)" font-size="10" font-family="Roboto,sans-serif" font-weight="600">'+Math.round(soc)+'%</text>';
                          }
                          s+='</svg>';
                          return s;
                        ]]]
