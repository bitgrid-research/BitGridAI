    cards:
      - type: custom:layout-card
        layout_type: custom:grid-layout
        layout:
          grid-template-columns: minmax(0, 1fr) minmax(0, 1fr)
          grid-template-rows: min-content auto
          grid-template-areas: '"tl tr" "liveness register"'
          grid-gap: 14px
          padding: 14px
          box-sizing: border-box
        cards:

          # ── Gruppen-Titel links: ZUSTAND ─────────────────────────────
          - type: custom:button-card
            view_layout:
              grid-area: tl
            icon: mdi:pulse
            name: Zustand
            show_state: false
            tap_action:
              action: none
            styles:
              card:
                - background: none
                - box-shadow: none
                - border: none
                - padding: 4px 4px 0
              grid:
                - grid-template-areas: '"i n"'
                - grid-template-columns: min-content 1fr
                - align-items: center
              img_cell:
                - justify-content: start
                - align-self: center
              icon:
                - color: var(--secondary-text-color)
                - width: 24px
                - height: 24px
              name:
                - font-size: 1.0rem
                - font-weight: 700
                - text-transform: uppercase
                - letter-spacing: 0.07em
                - color: var(--secondary-text-color)
                - justify-self: start
                - padding-left: 10px

          # ── Gruppen-Titel rechts: WÄCHTER ────────────────────────────
          - type: custom:button-card
            view_layout:
              grid-area: tr
            icon: mdi:shield-search
            name: Wächter
            show_state: false
            tap_action:
              action: none
            styles:
              card:
                - background: none
                - box-shadow: none
                - border: none
                - padding: 4px 4px 0
              grid:
                - grid-template-areas: '"i n"'
                - grid-template-columns: min-content 1fr
                - align-items: center
              img_cell:
                - justify-content: start
                - align-self: center
              icon:
                - color: var(--secondary-text-color)
                - width: 24px
                - height: 24px
              name:
                - font-size: 1.0rem
                - font-weight: 700
                - text-transform: uppercase
                - letter-spacing: 0.07em
                - color: var(--secondary-text-color)
                - justify-self: start
                - padding-left: 10px

          # ── Liveness + Gate-Diagnose links ───────────────────────────
          - type: vertical-stack
            view_layout:
              grid-area: liveness
            cards:
              - !include views/waechter_status.yaml

          # ── Register + Schwellen rechts ──────────────────────────────
          - type: vertical-stack
            view_layout:
              grid-area: register
            cards:
              - !include views/waechter_register.yaml

  - title: Grundriss
    path: floorplan
    icon: mdi:floor-plan
    theme: BitGridAI
    panel: true
    cards:
      - !include views/floorplan.yaml

  # ═══════════════════════════════════════════════════════════════════════
  # TAB (letzter): EINSTELLUNGEN  —  alle R1-R8-Schwellen aus mvp_auto.yaml
  # an einem Ort, editierbar (tap → nativer HA-Editor). Ergaenzt die
  # Kurzuebersicht im Steuerung-Tab um die neuen Runterschalt-/Notbremse-
  # Werte (R4/R6/R8), die bislang nirgends in der UI sichtbar waren.
  # Neu 23.08.2026, bewusst als letzter Tab (Zahnrad-Konvention), siehe
  # docs/architecture/09_design_decisions/092_soc_saison_schwellen_vorschlag_de.md.
  # ═══════════════════════════════════════════════════════════════════════
  - title: Einstellungen
    path: einstellungen
    icon: mdi:cog
    theme: BitGridAI
    panel: true
    cards:
      - type: custom:layout-card
        layout_type: custom:grid-layout
        layout:
          grid-template-columns: minmax(0, 1fr) minmax(0, 1fr)
          grid-gap: 14px
          padding: 14px
          box-sizing: border-box
        cards:
          - type: vertical-stack
            cards:
              - type: markdown
                content: "### Hochschalten (R3 / R5 / R7)"
              - type: custom:layout-card
                layout_type: custom:grid-layout
                layout:
                  grid-template-columns: "1fr"
                  grid-template-rows: repeat(4, auto)
                  grid-gap: 4px
                cards:
                  - type: custom:button-card
                    template: settings_row
                    entity: input_number.mvp_soc_eco_start_pct
                    name: Eco-Start SoC (R7)
                    label: "[[[ return Math.round(parseFloat(entity.state)) + ' %'; ]]]"
                    styles:
                      label:
                        - color: "var(--bg-color-eco)"
                  - type: custom:button-card
                    template: settings_row
                    entity: input_number.mvp_soc_std_pct
                    name: Standard-Start SoC (R5)
                    label: "[[[ return Math.round(parseFloat(entity.state)) + ' %'; ]]]"
                    styles:
                      label:
                        - color: "var(--bg-color-standard)"
                  - type: custom:button-card
                    template: settings_row
                    entity: input_number.mvp_soc_super_pct
                    name: Super-Start SoC (R3)
                    label: "[[[ return Math.round(parseFloat(entity.state)) + ' %'; ]]]"
                    styles:
                      label:
                        - color: "var(--bg-color-super)"
                  - type: custom:button-card
                    template: settings_row
                    entity: input_number.mvp_pv_start_w
                    name: PV-Kaltstart (R7-Bypass)
                    label: "[[[ return (parseFloat(entity.state)/1000).toFixed(1) + ' kW'; ]]]"
                    styles:
                      label:
                        - color: "var(--bg-color-pv)"
              - type: markdown
                content: "### Runterschalten (R1 / R4 / R6)"
              - type: custom:layout-card
                layout_type: custom:grid-layout
                layout:
                  grid-template-columns: "1fr"
                  grid-template-rows: repeat(3, auto)
                  grid-gap: 4px
                cards:
                  - type: custom:button-card
                    template: settings_row
                    entity: input_number.mvp_soc_super_off_pct
                    name: Super-Ausstieg SoC (R4)
                    label: "[[[ return Math.round(parseFloat(entity.state)) + ' %'; ]]]"
                    styles:
                      label:
                        - color: "color-mix(in srgb, var(--bg-color-super) 55%, black)"
                  - type: custom:button-card
                    template: settings_row
                    entity: input_number.mvp_soc_std_off_pct
                    name: Standard-Ausstieg SoC (R6)
                    label: "[[[ return Math.round(parseFloat(entity.state)) + ' %'; ]]]"
                    styles:
                      label:
                        - color: "color-mix(in srgb, var(--bg-color-standard) 55%, black)"
                  - type: custom:button-card
                    template: settings_row
                    entity: input_number.mvp_soc_stop_pct
                    name: Hausreserve / Stop SoC (R1)
                    label: "[[[ return Math.round(parseFloat(entity.state)) + ' %'; ]]]"
                    styles:
                      label:
                        - color: "var(--bg-color-reserve)"
          - type: vertical-stack
            cards:
              - type: markdown
                content: "### Akku-Notbremse (R8, unabhängig vom SoC)"
              - type: custom:layout-card
                layout_type: custom:grid-layout
                layout:
                  grid-template-columns: "1fr"
                  grid-template-rows: repeat(2, auto)
                  grid-gap: 4px
                cards:
                  - type: custom:button-card
                    template: settings_row
                    entity: input_number.mvp_batt_discharge_super_downgrade_w
                    name: Entladeschutz Super→Eco
                    label: "[[[ return Math.round(parseFloat(entity.state)) + ' W'; ]]]"
                    styles:
                      label:
                        - color: "var(--bg-color-super)"
                  - type: custom:button-card
                    template: settings_row
                    entity: input_number.mvp_batt_discharge_std_downgrade_w
                    name: Entladeschutz Standard→Eco
                    label: "[[[ return Math.round(parseFloat(entity.state)) + ' W'; ]]]"
                    styles:
                      label:
                        - color: "var(--bg-color-standard)"
              - type: markdown
                content: "### Sicherheit (R2)"
              - type: custom:layout-card
                layout_type: custom:grid-layout
                layout:
                  grid-template-columns: "1fr"
                  grid-template-rows: repeat(2, auto)
                  grid-gap: 4px
                cards:
                  - type: custom:button-card
                    template: settings_row
                    entity: input_number.mvp_tmax_std_threshold_c
                    name: Chip-Temp max (Super-Sperre 3h)
                    label: "[[[ return Math.round(parseFloat(entity.state)) + ' °C'; ]]]"
                    styles:
                      label:
                        - color: "var(--bg-color-heat)"
                  - type: custom:button-card
                    template: settings_row
                    entity: input_number.mvp_room_temp_eco_threshold_c
                    name: Raumtemp max (Eco-Zwang)
                    label: "[[[ return Math.round(parseFloat(entity.state)) + ' °C'; ]]]"
                    styles:
                      label:
                        - color: "#ffb74d"
              - type: markdown
                content: "### Nacht-Sperre"
              - type: custom:layout-card
                layout_type: custom:grid-layout
                layout:
                  grid-template-columns: "1fr"
                  grid-template-rows: repeat(3, auto)
                  grid-gap: 4px
                cards:
                  - type: custom:button-card
                    template: settings_row
                    entity: input_boolean.mvp_night_block_enabled
                    name: Nacht-Sperre aktiv
                    label: "[[[ return entity.state === 'on' ? 'AN' : 'AUS'; ]]]"
                    styles:
                      label:
                        - color: "[[[ return entity.state==='on' ? 'var(--bg-color-eco)' : 'var(--bg-color-idle)'; ]]]"
                  - type: custom:button-card
                    template: settings_row
                    entity: input_datetime.mvp_night_block_start
                    name: Nacht-Sperre ab
                    label: "[[[ return (entity.state || '00:00:00').slice(0,5); ]]]"
                    styles:
                      label:
                        - color: "#90caf9"
                  - type: custom:button-card
                    template: settings_row
                    entity: input_datetime.mvp_night_block_end
                    name: Nacht-Sperre bis
                    label: "[[[ return (entity.state || '00:00:00').slice(0,5); ]]]"
                    styles:
                      label:
                        - color: "#90caf9"
