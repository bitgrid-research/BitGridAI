  # TAB 7: WÄCHTER  —  2 Spalten. Der Meta-Watchdog: wer bewacht die Wächter.
  # Links: Liveness der Datenquellen + welches Gate gerade blockiert
  #        (waechter_status.yaml)
  # Rechts: Watchdog-Register mit last_triggered + Schwellen-Konsistenz
  #        (waechter_register.yaml)
  # Entstanden aus dem Befund 2026-07-17 (toter Anomalie-Alarm + Geisterschicht
