title: BitGridAI Home

# Geteilte custom:button-card-Templates (miner_header/miner_btn/...). Nötig,
# weil der Steuerung-Tab views/miner_controls.yaml per !include einbindet, das
# diese Templates referenziert. button_card_templates ist ein Pro-Dashboard-
# Root-Key, fehlt er hier, rendert button-card "Konfigurationsfehler".
# Gemeinsame Quelle mit bitgrid_dashboard_v1.yaml: button_card_templates.yaml.
button_card_templates: !include button_card_templates.yaml

# ═══════════════════════════════════════════════════════════════════════
# Kiosk-Home-Screen für Wandtablet, zwei Spalten-Gruppen. Höhe nicht mehr auf
# einen Bildschirm geklemmt: die Karten bekommen ihre natürliche Höhe und die
# Seite scrollt nach unten (wie Tab 2). Die %-Angaben unten sind nur noch grobe
# Orientierung, keine harten Spuren mehr.
#
#        ⚡ ENERGIE                  🌤 WETTER
#   ┌──────────────────────┐   ┌──────────────┐
#   │   Hamster   (40%)    │   │Uhr+Icon 22,5%│
#   ├──────────────────────┤   ├──────────────┤
#   │                      │   │Stunden    15%│
#   │  Energiefluss (60%)  │   ├──────────────┤
#   │                      │   │Woche    22,5%│
#   │                      │   ├──────────────┤
#   │                      │   │Sonnenst.  40%│
#   └──────────────────────┘   └──────────────┘
#
# Designprinzipien:
#   - 2-Spalten-Grid, beide Spalten 50% breit. Links und rechts sind in der
#     Hoehe ENTKOPPELT (feines 5-Zeilen-Raster, siehe layout unten):
#     links = Energie (Hamster 40% über Energiefluss 60%), rechts = Wetter in
#     vier Lagen (Uhr+Icon / Stunden / Woche / Sonnenstand = 22,5/15/22,5/40)
#   - Wetterkarte in drei Teile zerlegt: clock-weather-card (nur Uhr+Icon),
#     weather-forecast (stündlich, horizontaler Streifen), clock-weather-card
#     (5-Tage); darunter horizon-card. Alle lesen lokale Entities, kein Cloud-
#     Backhaul
#   - fester Radius 20px, dunkle Glaskarten erben aus dem Theme BitGridAI;
#     www/bitgrid_card_shape.js clippt die Custom-Cards UND die eingebaute
#     weather-forecast-Karte (Stunden) auf den Radius
#   - NaN-sicher: 'unavailable' → '—' statt 'NaN' (wichtig nach HA-Restart)
# ═══════════════════════════════════════════════════════════════════════

views:

  # Header-Titel = View-Titel, mittig zentriert via www/bitgrid_wide.js.
  # Version kommt aus pyproject.toml; deploy_ha.sh ersetzt den Versionsteil
  # beim Deploy durch ein sauberes v<semver> (ohne git-SHA/Build-Metadata).
  # Lovelace-View-Titel kennen kein Templating, daher Injection beim Deploy.
  # Der hier committete Wert ist nur Fallback fürs direkte Laden ohne Deploy.
  - title: BitGridAI - v0.2.0
    path: home
    icon: mdi:home
    theme: BitGridAI
    panel: true
    cards:
      - type: custom:layout-card
        layout_type: custom:grid-layout
        layout:
          grid-template-columns: 1fr 1fr
          # Beide Spalten 50% breit. KEINE feste Hoehe mehr: frueher klemmte
          # height = 100vh-Lock zusammen mit minmax(0,fr)-Spuren alles auf einen
          # Bildschirm (kein Scroll), was die Karten (v.a. clk mit Icon+Uhr) in
          # Bruchteil-Slots quetschte. Jetzt wie Tab 2 (Steuerung): jede
          # Inhaltszeile = auto und waechst mit ihrem Karteninhalt, die Seite
          # scrollt nach unten. Tradeoff: am Wandtablet jetzt Touch-Scroll statt
          # Vollbild-ohne-Scroll. Feintuning der Zeilen folgt iterativ.
          # Hinweis: die beiden Spalten teilen weiterhin die Zeilenspuren (ham/flu
          # links, clk/hrs/wek/sun rechts). Falls links/rechts dadurch in der
          # Hoehe auseinanderlaufen (Luecken), ist der naechste Schritt, jede
          # Spalte in einen eigenen vertical-stack zu kapseln.
          grid-template-rows: min-content auto
          grid-template-areas: '"tl tr" "energie wetter"'
          grid-gap: 14px
          padding: 14px
          box-sizing: border-box
        cards:


          # ── Gruppen-Titel links: ENERGIE ────────────────────────────
          - type: custom:button-card
            view_layout:
              grid-area: tl
            icon: mdi:lightning-bolt
            name: Energie
            show_state: false
            tap_action:
              action: none
            styles:
              card:
                - background: none
                - box-shadow: none
                - border: none
                - padding: 4px 4px 0
              grid:
                - grid-template-areas: '"i n"'
                - grid-template-columns: min-content 1fr
                - align-items: center
              img_cell:
                - justify-content: start
                - align-self: center
              icon:
                - color: var(--secondary-text-color)
                - width: 24px
                - height: 24px
              name:
                - font-size: 1.0rem
                - font-weight: 700
                - text-transform: uppercase
                - letter-spacing: 0.07em
                - color: var(--secondary-text-color)
                - justify-self: start
                - padding-left: 10px


          # ── Gruppen-Titel rechts: WETTER ────────────────────────────
          - type: custom:button-card
            view_layout:
              grid-area: tr
            icon: mdi:weather-partly-cloudy
            name: Wetter
            show_state: false
            tap_action:
              action: none
            styles:
              card:
                - background: none
                - box-shadow: none
                - border: none
                - padding: 4px 4px 0
              grid:
                - grid-template-areas: '"i n"'
                - grid-template-columns: min-content 1fr
                - align-items: center
              img_cell:
                - justify-content: start
                - align-self: center
              icon:
                - color: var(--secondary-text-color)
                - width: 24px
                - height: 24px
              name:
                - font-size: 1.0rem
                - font-weight: 700
                - text-transform: uppercase
                - letter-spacing: 0.07em
                - color: var(--secondary-text-color)
                - justify-self: start
                - padding-left: 10px

          # ═══════════════════════════════════════════════════════════
          # ENERGIE-SPALTE  —  eigener vertical-stack, fliesst in natuerlicher
          # Hoehe (Hamster ueber Energiefluss). Entkoppelt von der Wetter-Spalte:
          # keine geteilten Grid-Zeilen mehr, daher keine Zwangsstreckung/Luecken.
          # ═══════════════════════════════════════════════════════════
          - type: vertical-stack
            view_layout:
              grid-area: energie
            cards:

              # ═══════════════════════════════════════════════════════════
              # HAMSTER  —  Energie-Gruppe oben (ham)
              # ═══════════════════════════════════════════════════════════
              - type: custom:button-card
                show_name: false
                show_icon: false
                show_state: false
                tap_action:
                  action: none
                custom_fields:
                  hamster: >
                    [[[
                      const fnum = (id) => {
                        const v = parseFloat(states[id]?.state);
                        return isNaN(v) ? null : v;
                      };
                      const cfg = (id, fb) => { const v = fnum(id); return v === null ? fb : v; };
                      const pct = (v) => v.toLocaleString('de-DE', {maximumFractionDigits: 0});
                      const kw  = (w) => (w / 1000).toLocaleString('de-DE', {minimumFractionDigits: 1, maximumFractionDigits: 1});

                      const h = new Date().getHours();
                      const night = states['binary_sensor.mvp_nacht_sperre_aktiv']?.state === 'on'
                        || (h >= 22 || h < 6);
                      const modeRaw = states['sensor.miner1_workmode_status']?.state
                                  || states['sensor.miner2_workmode_status']?.state || '';
                      const mode = (modeRaw === 'unavailable' || modeRaw === 'unknown') ? '' : modeRaw;
                      const running = ['Eco', 'Standard', 'Super'].includes(mode);
                      const socV   = fnum('sensor.battery_soc_pct');
                      const pvV    = fnum('sensor.pv_power_w');
                      const minerV = fnum('sensor.miner_total_power_w');
                      const chipV  = fnum('sensor.miner_max_chip_temp_c');
                      const socKnown = socV !== null;
                      const soc    = socV ?? 0;
                      const pvW    = pvV ?? 0;

                      // Schwellen aus den HA-Config-Entities (Platzhalter-Legende soc_band_tagesverlauf.md)
                      const socStop   = cfg('input_number.mvp_soc_stop_pct', 50);
                      const ecoStart  = cfg('input_number.mvp_soc_eco_start_pct', 58);
                      const socStd    = cfg('input_number.mvp_soc_std_pct', 80);
                      const socStdStp = cfg('input_number.mvp_soc_std_stop_pct', 75);
                      const socSuper  = cfg('input_number.mvp_soc_super_pct', 90);
                      const socSupStp = cfg('input_number.mvp_soc_super_stop_pct', 85);
                      const pvStartW  = cfg('input_number.mvp_pv_start_w', 6000);
                      const maxChip   = cfg('input_number.mvp_tmax_std_threshold_c', 112);

                      // Erklärtext A (statisch/regelbasiert) aus soc_band_tagesverlauf.md,
                      // Platzhalter live aus den gebundenen Entities ersetzt. Zustand = sichtbare
                      // Wahrheit (Workmode + Temperatur + SoC), NICHT bg_decision_code (entkoppelt).
                      let head, sub, img;
                      if (!socKnown && !running) {
                        head = 'Verbindung wird aufgebaut';
                        sub  = 'Die Sensoren melden sich gerade nach einem Neustart.<br>'
                             + 'Sobald Ladezustand und PV anliegen, zeigt die Karte den Betriebszustand.';
                        img  = 'bithamster_wait.png';
                      } else if (night) {
                        head = 'Nachtsperre aktiv';
                        sub  = `Es ist ${h}:00 Uhr, Beginn des Nachtfensters von 22:00 bis 06:00 Uhr.<br>`
                             + 'In dieser Zeit ist das Mining unabhängig vom Ladezustand ausgesetzt.<br>'
                             + 'Der Normalbetrieb beginnt wieder ab 06:00 Uhr.';
                        img  = 'bithamster_sleep.png';
                      } else if (chipV !== null && chipV >= maxChip) {
                        head = 'Sicherheits-Stopp: zu heiß';
                        sub  = `Die Chip-Temperatur liegt mit ${pct(chipV)} °C über der Sicherheitsgrenze von ${pct(maxChip)} °C.<br>`
                             + 'Der Miner wird sofort gestoppt, nicht überstimmbar.<br>'
                             + 'Ein Wiederanlauf erfolgt erst nach Abkühlung.';
                        img  = 'bithamster_wait.png';
                      } else if (mode === 'Eco') {
                        head = 'Miner läuft sparsam (Eco)';
                        sub  = `Der Ladezustand liegt mit ${pct(soc)} % im Eco-Band, die PV bei ${kw(pvW)} kW.<br>`
                             + `Der Miner minet gedrosselt im Eco-Modus${pvW < pvStartW ? ' aus dem Akku weiter' : ''}.<br>`
                             + `Unter ${pct(socStop)} % greift die Hausreserve, ab ${pct(socStd)} % schaltet er auf Standard.`;
                        img  = 'bithamster_eco.png';
                      } else if (mode === 'Standard') {
                        head = 'Miner läuft in Standard';
                        sub  = `Der Ladezustand liegt mit ${pct(soc)} % im Standard-Band.<br>`
                             + 'Der Miner läuft im Standard-Modus.<br>'
                             + `Ab ${pct(socSuper)} % folgt Super, unter ${pct(socStdStp)} % fällt er auf Eco zurück.`;
                        img  = 'bithamster_standard.png';
                      } else if (mode === 'Super') {
                        head = 'Miner läuft auf Volllast (Super)';
                        sub  = `Der Ladezustand liegt mit ${pct(soc)} % im Super-Band (ab ${pct(socSuper)} %).<br>`
                             + 'Der Miner läuft mit voller Last im Super-Modus.<br>'
                             + `Unter ${pct(socSupStp)} % fällt er auf Standard zurück.`;
                        img  = 'bithamster_super.png';
                      } else if (soc < socStop) {
                        head = 'Akku lädt zuerst';
                        sub  = `Der Ladezustand ist mit ${pct(soc)} % unter die Hausreserve von ${pct(socStop)} % gefallen.<br>`
                             + 'Der Miner bleibt aus und lädt zuerst wieder auf.<br>'
                             + `Ein Start ist erst ab ${pct(ecoStart)} % möglich.`;
                        img  = 'bithamster_wait.png';
                      } else if (soc < ecoStart) {
                        head = 'Akku im Halteband';
                        sub  = `Der Ladezustand liegt mit ${pct(soc)} % im Halteband (${pct(socStop)}–${pct(ecoStart)} %).<br>`
                             + 'Ein Neustart ist hier gesperrt, der Miner bleibt aus.<br>'
                             + `Ein Start ist erst ab ${pct(ecoStart)} % möglich.`;
                        img  = 'bithamster_wait.png';
                      } else {
                        head = 'Warte auf Sonne';
                        sub  = `Der Ladezustand liegt mit ${pct(soc)} % im Eco-Band, doch die PV reicht mit ${kw(pvW)} kW nicht (nötig ${kw(pvStartW)} kW).<br>`
                             + 'Der Miner bleibt aus.<br>'
                             + `Ab ${kw(pvStartW)} kW startet er im Eco-Modus.`;
                        img  = 'bithamster_wait.png';
                      }

                      const stat = (label, value, sub) => `
                        <div style="flex:1;min-width:0;text-align:right">
                          <div style="font-size:var(--bg-fs-label);text-transform:uppercase;letter-spacing:0.06em;
                                      color:var(--secondary-text-color);opacity:0.65;margin-bottom:3px">${label}</div>
                          <div style="font-size:1.5rem;font-weight:700;line-height:1;
                                      white-space:nowrap">${value}</div>
                          ${sub ? `<div style="font-size:var(--bg-fs-secondary);color:var(--secondary-text-color);
                                      white-space:nowrap;margin-top:3px">${sub}</div>` : ''}
                        </div>`;

                      // Bitcoin-Fußleiste (wie altes Dashboard): Blockzeit, Kurs, Balance
                      const blockH   = fnum('sensor.bitcoin_block_height');
                      const balBtc   = fnum('sensor.pool_balance_btc');
                      const eurRate  = fnum('sensor.btc_eur_price');
                      const blockStr = blockH  !== null ? Math.round(blockH).toLocaleString('de-DE')          : '—';
                      const priceStr = eurRate !== null ? Math.round(eurRate).toLocaleString('de-DE') + ' €'  : '—';
                      const haveBal  = balBtc !== null && balBtc > 0;
                      const satsStr  = haveBal ? Math.round(balBtc * 1e8).toLocaleString('de-DE') + ' <span style="font-size:0.6em;font-weight:600;opacity:0.8">SATs</span>' : '—';
                      const euroSub  = (haveBal && eurRate !== null && eurRate > 0)
                        ? '≈ ' + (balBtc * eurRate).toLocaleString('de-DE', {minimumFractionDigits: 2, maximumFractionDigits: 2}) + ' €'
                        : '';

                      // ── Vergleich zu gestern ──────────────────────────────────────
                      // Kurs: % gegen den Tagesstart-Kurs (= gestriger Schlusskurs eines
                      // 24/7-Assets), gesichert um 00:00 in input_number.btc_eur_day_start
                      // (Automation pool_midnight_baseline_reset). Vor dem ersten
                      // Mitternachts-Lauf ist der Wert 0 → kein Delta, Karte bleibt sauber.
                      const up = '#4CAF50', down = '#EF5350';
                      // em-relativ: skaliert mit der jeweiligen Zeile. Das Inline-Delta hinter
                      // SATs steht auf der grossen Stat-Zeile und wird klein gehalten (0.5em),
                      // damit es nicht ueber den Kartenrand laeuft; das Euro-Delta in der
                      // kleinen Unterzeile bleibt bei 0.72em.
                      const dchip = (txt, col, em) => `<span style="font-size:${em || 0.72}em;font-weight:600;margin-left:4px;color:${col}">${txt}</span>`;
                      const eurPrev = fnum('input_number.btc_eur_day_start');
                      let priceSub = '';
                      if (eurRate !== null && eurPrev !== null && eurPrev > 0) {
                        const dp = (eurRate - eurPrev) / eurPrev * 100;
                        const s  = (dp >= 0 ? '+' : '−')
                                 + Math.abs(dp).toLocaleString('de-DE', {minimumFractionDigits: 2, maximumFractionDigits: 2});
                        priceSub = `<span style="font-weight:600;color:${dp >= 0 ? up : down}">(${s} %)</span>`;
                      }

                      // Balance: gestern geminte SATs (Tagesertrag). Gleiche Quellen und
                      // Priorität wie der Mining-Verlauf (views/miner_stats.yaml): Settlement-
                      // History → payout_history → pool_btc_daily_log, damit beide Karten
                      // exakt denselben Tageswert zeigen. Auszahlungs-robust, da der Ertrag
                      // (nicht das schwankende Pool-Guthaben) gezählt wird.
                      const yIso = (() => { const d = new Date(); d.setDate(d.getDate() - 1);
                        return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; })();
                      let yBtc = null;
                      (states['sensor.pool_settlement_history']?.attributes?.transactions ?? []).forEach(tx => {
                        const md = tx.mining_extra?.mining_date; if (!md) return;
                        const sd = new Date(md * 1000); sd.setUTCDate(sd.getUTCDate() - 1);
                        if (sd.toISOString().slice(0, 10) !== yIso) return;
                        const v = parseFloat(tx.amount ?? tx.changed_balance);
                        if (v > 0) yBtc = v;
                      });
                      if (yBtc === null) {
                        (states['sensor.pool_balance_btc']?.attributes?.payout_history ?? []).forEach(e => {
                          if (!e[0] || !e[2]) return;
                          const sd = new Date(e[0]); sd.setUTCDate(sd.getUTCDate() - 1);
                          if (sd.toISOString().slice(0, 10) === yIso) yBtc = e[2];
                        });
                      }
                      if (yBtc === null) {
                        const raw = states['input_text.pool_btc_daily_log']?.state ?? '';
                        (raw && raw !== 'unknown' && raw !== 'unavailable' ? raw.split('|') : []).forEach(e => {
                          const [d, b] = e.split(','); if (d === yIso) { const v = parseFloat(b); if (v > 0) yBtc = v; }
                        });
                      }
                      const haveYield = yBtc !== null && yBtc > 0;
                      const satsDelta = haveYield ? dchip('(+' + Math.round(yBtc * 1e8).toLocaleString('de-DE') + ')', up, 0.5) : '';
                      const euroDelta = (haveYield && eurRate !== null && eurRate > 0)
                        ? dchip('(+' + (yBtc * eurRate).toLocaleString('de-DE', {minimumFractionDigits: 2, maximumFractionDigits: 2}) + ' €)', up)
                        : '';
                      const satsLine = haveBal ? satsStr + satsDelta : satsStr;
                      const balSub   = euroSub ? euroSub + euroDelta : '';

                      return `
                        <div style="display:flex;flex-direction:column;height:100%;width:100%">
                          <div style="display:flex;gap:24px;align-items:center">
                            <img src="/local/${img}?v=20260625"
                                 style="width:24%;max-width:135px;aspect-ratio:1;border-radius:50%;flex-shrink:0;
                                        object-fit:cover;border:2px solid var(--divider-color)">
                            <div style="flex:1;min-width:0">
                              <div style="font-size:var(--bg-fs-title);font-weight:700;line-height:1.15;
                                          color:var(--primary-text-color);margin-bottom:12px">${head}</div>
                              <div style="font-size:var(--bg-fs-body);color:var(--secondary-text-color);line-height:1.55">${sub}</div>
                            </div>
                          </div>
                          <div style="display:flex;gap:20px;padding-top:14px;
                                      border-top:1px solid var(--divider-color)">
                            <div style="width:24%;max-width:135px;flex-shrink:0;text-align:center">
                              <div style="font-size:var(--bg-fs-label);text-transform:uppercase;letter-spacing:0.06em;
                                          color:var(--secondary-text-color);opacity:0.65;margin-bottom:3px">Blockzeit</div>
                              <div style="font-size:1.5rem;font-weight:700;line-height:1;white-space:nowrap">${blockStr}</div>
                            </div>
                            ${stat('Balance', satsLine, balSub)}
                            ${stat('Kurs', priceStr, priceSub)}
                          </div>
                        </div>`;
                    ]]]
                styles:
                  card:
                    # Neutrales Glas, identisch zu Wetter/Horizont: alle Werte
                    # aus dem Theme (ha-card-*), kein Modus-Tint mehr.
                    - background: var(--ha-card-background)
                    - border-radius: var(--ha-card-border-radius)
                    # Der sichtbare Radius wird (wie bei den anderen Karten) hart
                    # von www/bitgrid_card_shape.js erzwungen (BUTTON-CARD im Set);
                    # styles.card border-radius allein greift hier nicht sichtbar.
                    # overflow:hidden clippt zusaetzlich den Inhalt auf den Radius.
                    - overflow: hidden
                    - border: var(--ha-card-border-width) solid var(--ha-card-border-color)
                    - box-shadow: var(--ha-card-box-shadow)
                    - padding: 20px
                  grid:
                    - grid-template-areas: '"hamster"'
                    - grid-template-columns: 1fr
                  custom_fields:
                    hamster:
                      - height: 100%
                      - width: 100%
                      - justify-self: stretch
                      - align-self: stretch


              # ═══════════════════════════════════════════════════════════
              # ENERGIEFLUSS  —  Energie-Gruppe unten (flu, volle linke Breite)
              # ═══════════════════════════════════════════════════════════
              - type: custom:power-flow-card-plus
                # Runde Ecken/Hintergrund kommen vom Theme (ha-card-border-radius)
                # plus www/bitgrid_card_shape.js: PFCP clippt seinen Hintergrund
                # nicht selbst auf den Theme-Radius, und card-mod ist hier nicht
                # installiert. Das Modul injiziert den Radius in den Shadow-Root.
                # Zurückhaltende, aber klar sichtbare Palette für PV/Batterie/
                # Haus/Netz (harmoniert mit dem Blau-Violett-Verlauf des Themes);
                # die Miner-Bubbles sind der eigentliche Blickfang (Farbe nach
                # Leistung, siehe individual:). Früher stärker entsättigt, war auf
                # dem Wandtablet zu blass — jetzt einen Tick kräftiger.
                entities:
                  grid:
                    entity:
                      consumption: sensor.grid_import_w
                      production: sensor.grid_export_w
                    color:
                      consumption: "#8C97E6"   # Periwinkle
                      production: "#5BC287"    # Grün
                  solar:
                    entity: sensor.pv_power_w
                    color: "#EFB73C"           # Gold (Sonne)
                  battery:
                    entity: sensor.battery_power_flowchart_w
                    state_of_charge: sensor.battery_soc_pct
                    color:
                      consumption: "#4FBF86"   # laden, kräftiges Grün
                      production: "#82D2A0"     # entladen, helleres Grün
                  home:
                    entity: sensor.house_load_w
                    color: "#A6A2D8"           # Lavendel (etwas kräftiger, bleibt ruhiger als die Quellen)
                  # Zwei Miner statt eines Summen-Knotens (gleiche Shelly-Quellen,
                  # aus denen sensor.miner_total_power_w summiert). Die Bubble-Farbe
                  # wird NICHT hier statisch gesetzt, sondern live nach Leistung von
                  # www/bitgrid_card_shape.js eingefärbt (< 300 W grau, 300–800 W grün,
                  # 800–1600 W cyan, > 1600 W orange): das Modul liest den Shelly-Sensor und
                  # überschreibt die PFCP-CSS-Variable --individual-<slot>-color.
                  # color: hier ist nur der Fallback, falls das Modul (noch) nicht
                  # greift — neutrales Grau, damit nichts grell aufblitzt.
                  # Slot-Zuordnung über den Bubble-Namen (span.label).
                  individual:
                    - entity: sensor.shellyplugsg3_dcb4d9c5567c_leistung
                      name: Miner 1
                      icon: mdi:pickaxe
                      color: "#757575"
                      display_zero: false
                      display_zero_tolerance: 25
                    - entity: sensor.shellyplugsg3_d0cf13d86254_leistung
                      name: Miner 2
                      icon: mdi:pickaxe
                      color: "#757575"
                      display_zero: false
                      display_zero_tolerance: 25
                    - entity: sensor.ac_elwa_2_power1_solar
                      name: Heizstab
                      icon: mdi:water-boiler
                      color: "#5C9EE2"           # Blau (kräftiger), fügt sich in die Palette

          # ═══════════════════════════════════════════════════════════
          # WETTER-SPALTE  —  eigener vertical-stack (Uhr+Icon / Stunden / Woche
          # / Sonnenstand), unabhaengige natuerliche Hoehe.
          # ═══════════════════════════════════════════════════════════
          - type: vertical-stack
            view_layout:
              grid-area: wetter
            cards:

              # ═══════════════════════════════════════════════════════════
              # UHR + ICON  —  Wetter-Gruppe, Lage 1 (clk; Anteil siehe layout)
              # clock-weather-card (HACS: pkissling/clock-weather-card), nur der
              # Heute-Bereich: Icon, aktuelle Lage, Uhr, Datum. Die Vorschaubalken
              # sind ausgeblendet (hide_forecast_section), sie stecken jetzt in
              # den eigenen Karten hrs (stündlich) und wek (5-Tage).
              # Runde Ecken: Theme liefert ha-card-border-radius, aber die Karte
              # clippt ihren Hintergrund nicht selbst darauf, das übernimmt
              # www/bitgrid_card_shape.js (card-mod ist hier nicht installiert).
              # fill-Icons statt animiert: farbig wie der Entwurf, aber leichter
              # für das Wandtablet (Qualitätsziel Nachhaltigkeit/Edge-Schonung).
              # ═══════════════════════════════════════════════════════════
              - type: custom:clock-weather-card
                entity: weather.forecast_home
                sun_entity: sun.sun
                # clock-weather-card-i18n kennt nur Kurz-Codes (de, en, …); 'de-DE'
                # fällt auf Englisch zurück. Luxon (date_pattern) rendert 'de'
                # ebenfalls deutsch, also deckt 'de' beides ab.
                locale: de
                time_format: '24'
                date_pattern: 'cccc, dd.LL.yyyy'
                weather_icon_type: fill
                animated_icon: false
                hide_today_section: false
                hide_forecast_section: true
                hide_clock: false
                hide_date: false


              # ═══════════════════════════════════════════════════════════
              # STUNDEN  —  Wetter-Gruppe, Lage 2 (hrs; Anteil siehe layout)
              # Eingebaute weather-forecast-Karte, stündlich: horizontaler
              # Zeitstrahl, der in den flachen Streifen passt (die
              # clock-weather-card rendert Vorschau nur als gestapelte Zeilen).
              # show_current aus, weil die Uhr-Karte (clk) die aktuelle Lage
              # schon zeigt. Runde Ecken: in www/bitgrid_card_shape.js mit
              # aufgenommen (HUI-WEATHER-FORECAST-CARD), damit sie wie die anderen
              # garantiert auf den Radius geclippt wird.
              # ═══════════════════════════════════════════════════════════
              - type: weather-forecast
                entity: weather.forecast_home
                forecast_type: hourly
                show_current: false
                show_forecast: true


              # ═══════════════════════════════════════════════════════════
              # WOCHE  —  Wetter-Gruppe, Lage 3 (wek; Anteil siehe layout)
              # clock-weather-card, nur der Vorschau-Bereich: 5-Tage-Balken.
              # hide_today_section blendet Uhr/Icon/Datum aus (stecken in clk).
              # Runde Ecken wie bei clk über www/bitgrid_card_shape.js.
              # ═══════════════════════════════════════════════════════════
              - type: custom:clock-weather-card
                entity: weather.forecast_home
                sun_entity: sun.sun
                locale: de
                time_format: '24'
                weather_icon_type: fill
                animated_icon: false
                forecast_rows: 5
                hide_today_section: true
                hide_forecast_section: false
                hide_clock: true
                hide_date: true


              # ═══════════════════════════════════════════════════════════
              # SONNENSTAND  —  Wetter-Gruppe unten (sun)
              # horizon-card (HACS: rejuvenate/lovelace-horizon-card): Sonne +
              # Mond über dem Horizont mit Auf-/Untergängen und Mondphase. Liest
              # sun.sun (und HA-Standort) automatisch, kein entity nötig.
              # Runde Ecken: Theme-Radius greift, den Horizont-Gradienten clippt
              # www/bitgrid_card_shape.js (card-mod ist hier nicht installiert).
              # ═══════════════════════════════════════════════════════════
              - type: custom:horizon-card
                language: de


  - title: Steuerung
    path: steuerung
    icon: mdi:tune-variant
    theme: BitGridAI
    panel: true
    cards:
      - type: custom:layout-card
        layout_type: custom:grid-layout
        layout:
          # Zwei gleich breite Spalten (wie Tab 1), Gruppentitel in einer
          # min-content-Zeile darüber. Keine feste Höhe: die Inhaltszeile wächst
          # mit dem (hohen) Miner-Block, die Seite scrollt. Die Regelschwellen-
          # Spalte ist kürzer und lässt darunter Leerraum (akzeptiert).
          # minmax(0, 1fr) statt 1fr: 1fr = minmax(auto, 1fr), und das auto-Minimum
          # ist die min-content-Breite. Der Miner-Block (7-Button-Energiezeile,
          # 2-Miner-Steuergrid) ist im min-content breiter als 50% und würde sonst
          # seine Spalte sprengen und die rechte auf ~0 drücken. minmax(0, …)
          # klemmt beide Spalten hart auf ihren 50%-Anteil (gleiche Technik wie
          # Tab 1 bei den Zeilen).
          grid-template-columns: minmax(0, 1fr) minmax(0, 1fr)
          grid-template-rows: min-content auto
          grid-template-areas: '"tl tr" "miner regel"'
          grid-gap: 14px
          padding: 14px
          box-sizing: border-box
        cards:

          # ── Gruppen-Titel links: MINER ──────────────────────────────
          - type: custom:button-card
            view_layout:
              grid-area: tl
            icon: mdi:pickaxe
            name: Miner
            show_state: false
            tap_action:
              action: none
            styles:
              card:
                - background: none
                - box-shadow: none
                - border: none
                - padding: 4px 4px 0
              grid:
                - grid-template-areas: '"i n"'
                - grid-template-columns: min-content 1fr
                - align-items: center
              img_cell:
                - justify-content: start
                - align-self: center
              icon:
                - color: var(--secondary-text-color)
                - width: 24px
                - height: 24px
              name:
                - font-size: 1.0rem
                - font-weight: 700
                - text-transform: uppercase
                - letter-spacing: 0.07em
                - color: var(--secondary-text-color)
                - justify-self: start
                - padding-left: 10px

          # ── Gruppen-Titel rechts: REGELSCHWELLEN ────────────────────
          - type: custom:button-card
            view_layout:
              grid-area: tr
            icon: mdi:tune-variant
            name: Regelschwellen
            show_state: false
            tap_action:
              action: none
            styles:
              card:
                - background: none
                - box-shadow: none
                - border: none
                - padding: 4px 4px 0
              grid:
                - grid-template-areas: '"i n"'
                - grid-template-columns: min-content 1fr
                - align-items: center
              img_cell:
                - justify-content: start
                - align-self: center
              icon:
                - color: var(--secondary-text-color)
                - width: 24px
                - height: 24px
              name:
                - font-size: 1.0rem
                - font-weight: 700
                - text-transform: uppercase
                - letter-spacing: 0.07em
                - color: var(--secondary-text-color)
                - justify-self: start
                - padding-left: 10px

          # ── Miner-Steuerungs-Grid links (geteilt, views/miner_controls.yaml) ──
          # Nur die Steuerungsspalte (Q01/Q02), NICHT die Stats-/Wetter-Spalte
          # (die steckt in views/miner_stats.yaml und bleibt dem Dev-Dashboard
          # vorbehalten). In vertical-stack gefasst, damit die geteilte Karte
          # ohne eigenes view_layout in die Grid-Area "miner" gelegt werden kann.
          - type: vertical-stack
            view_layout:
              grid-area: miner
            cards:
              - !include views/miner_controls.yaml
              # Mining Verlauf unter den Minern (geteilte Karte, single source
              # of truth mit dem Dev-Dashboard). Breite Tabelle (min. 620px),
              # scrollt in der 50%-Spalte horizontal.
              - !include views/mining_log.yaml

          # ── Regelschwellen rechts: SoC-Bänder + Start/Sicherheit/Nacht ──
          # Im schmaleren rechten 50%-Streifen vertikal gestapelt (statt
          # nebeneinander wie früher über die volle Breite).
          - type: vertical-stack
            view_layout:
              grid-area: regel
            cards:
              - type: entities
                title: SoC-Bänder
                state_color: true
                # Eingabe-Boxen (input_number, mode: box) lesbar machen: das Theme
                # erreicht die MDC-Textfield-Füllung nicht (bleibt MWC-weiß), daher
                # per card-mod Füllung UND Schrift gemeinsam setzen (Glas-Look,
                # helle Schrift). Geteilter Block via Anker, s. zweite Karte.
                card_mod: &glass_inputs
                  style:
                    hui-input-number-entity-row:
                      $:
                        ha-textfield:
                          $: &glass_tf_css |
                            .mdc-text-field {
                              background-color: rgba(255,255,255,0.08) !important;
                              border-radius: 10px !important;
                              box-shadow: inset 0 0 0 1px rgba(255,255,255,0.14) !important;
                            }
                            .mdc-text-field__input {
                              color: var(--primary-text-color) !important;
                              caret-color: var(--primary-text-color) !important;
                            }
                            .mdc-line-ripple::before,
                            .mdc-line-ripple::after { display: none !important; }
                    hui-input-datetime-entity-row:
                      $:
                        ha-textfield:
                          $: *glass_tf_css
                entities:
                  - entity: input_number.mvp_soc_stop_pct
                    name: Stop SoC (Hausreserve)
                  - entity: input_number.mvp_soc_eco_start_pct
                    name: Eco-Start SoC
                  - entity: input_number.mvp_soc_std_pct
                    name: Standard-Start SoC
                  - entity: input_number.mvp_soc_std_stop_pct
                    name: Standard-Stop SoC (Deadband)
                  - entity: input_number.mvp_soc_super_pct
                    name: Super-Start SoC
                  - entity: input_number.mvp_soc_super_stop_pct
                    name: Super-Stop SoC (Deadband)
              - type: entities
                title: Start, Sicherheit & Nacht-Sperre
                state_color: true
                # Gleicher Glas-Look für die Eingabe-Boxen wie SoC-Bänder (Anker).
                card_mod: *glass_inputs
                entities:
                  - entity: input_number.mvp_pv_start_w
                    name: Eco-Start PV-Leistung
                  - entity: input_number.mvp_tmax_std_threshold_c
                    name: Chip-Temp Sicherheitsgrenze
                  - type: divider
                  - entity: input_boolean.mvp_night_block_enabled
                    name: Nacht-Sperre Mining
                  - entity: input_datetime.mvp_night_block_start
                    name: Nacht-Sperre Start
                  - entity: input_datetime.mvp_night_block_end
                    name: Nacht-Sperre Ende
