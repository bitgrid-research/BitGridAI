            icon: mdi:server-network
            name: Netzwerk
            show_state: false
            tap_action:
              action: none
            styles:
              card:
                - background: none
                - box-shadow: none
                - border: none
                - padding: 4px 4px 0
              grid:
                - grid-template-areas: '"i n"'
                - grid-template-columns: min-content 1fr
                - align-items: center
              img_cell:
                - justify-content: start
                - align-self: center
              icon:
                - color: var(--secondary-text-color)
                - width: 24px
                - height: 24px
              name:
                - font-size: 1.0rem
                - font-weight: 700
                - text-transform: uppercase
                - letter-spacing: 0.07em
                - color: var(--secondary-text-color)
                - justify-self: start
                - padding-left: 10px

          # ── Power-Law links ───────────────────────────────────────────
          - type: vertical-stack
            view_layout:
              grid-area: markt
            cards:
              - !include views/ki_powerlaw.yaml

          # ── Hashrate + Difficulty rechts ──────────────────────────────
          - type: vertical-stack
            view_layout:
              grid-area: netzwerk
            cards:
              - !include views/ki_hashrate.yaml
              - !include views/ki_difficulty.yaml

