# ═══════════════════════════════════════════════════════════════════════
# BitGridAI — "Glass"-Theme (iOS-Glassmorphism), gedämpft.
# Vibranter Farbverlauf als Hintergrund + dunkle, halbtransparente Glas-
# karten. WICHTIG: Nur die Dashboard-Karten sind transluzent. Dialoge,
# Menüs, Tooltips und Eingabefelder sind OPAK — transluzente Overlays
# machten More-Info-Dialoge unlesbar (Inhalt schien durch) und Tooltips
# weiß-auf-weiß.
#
# Stellschrauben: lovelace-background (der Verlauf), die Alpha-Werte in
# ha-card-background (wie stark das Glas durchscheint), ha-card-border-radius.
# ═══════════════════════════════════════════════════════════════════════
BitGridAI:
  # ── Marken-Akzente ──────────────────────────────────────────────────
  primary-color: "#4CAF50"
  accent-color: "#f59e0b"              # Amber: Standby/Cooldown/Übergangs-Warnung
  text-primary-color: "#ffffff"        # Text auf primary-color (Buttons)

  # ── Semantische Farb-Tokens (eine Quelle für Modus-/Statusfarben) ───
  # Analog zur Typo-Skala bg-fs-*: Dashboard, Views und www/bitgrid_card_
  # shape.js referenzieren var(--bg-color-*), statt Hex-Werte zu duplizieren.
  # Kurs-Chips (positiv/negativ) nutzen eco bzw. reserve mit. Bewusste
  # Ausnahme: die Pastell-Palette der power-flow-card-plus (siehe Kommentar
  # dort), die ruhiger wirken soll als die kräftigen Modus-Farben.
  bg-color-eco: "#4CAF50"        # Eco-Modus / positiv (= primary-color)
  bg-color-standard: "#26C6DA"   # Standard-Modus (Cyan)
  bg-color-super: "#F7931A"      # Super-Modus (Bitcoin-Orange)
  bg-color-reserve: "#EF5350"    # Hausreserve / Warnung / negativ
  bg-color-heat: "#FF7043"       # Temperatur-Warnstufe (100–109 °C, Chip-Temp)
  bg-color-pv: "#EFB73C"         # PV/Sonne (Gold, = PFCP-Solar-Bubble)
  bg-color-idle: "#757575"       # aus / inaktiv / unter Schwelle

  # ── Vibranter Verlaufs-Hintergrund (iOS-Look, kein Bild nötig) ──────
  lovelace-background: "linear-gradient(150deg, #21346f 0%, #4b2da0 46%, #9c3a72 100%)"
  primary-background-color: "#21346f"
  divider-color: "rgba(255,255,255,0.14)"

  # ── Typo (hell auf dunklem Glas) ────────────────────────────────────
  primary-text-color: "#f3f5fb"
  secondary-text-color: "rgba(233,237,247,0.72)"
  disabled-text-color: "rgba(233,237,247,0.40)"
  state-icon-color: "rgba(233,237,247,0.82)"

  # ── Typo-Skala (benannte Stufen statt Magic-Numbers in Custom-Cards) ─
  # Basis: HA-Default-Roboto wie in der clock-weather-card; nur EINE grosse
  # Stufe (Uhr ~3.5rem). Custom-Cards referenzieren var(--bg-fs-*), damit
  # Schriftgroessen projektweit aus einer Quelle kommen. Alle Stufen uniform
  # hochskalieren, falls auf dem Wandtablet aus Distanz zu klein.
  # 26.08.2026: kurzzeitig um ~20% hochskaliert, auf Nutzer-Wunsch wieder
  # zurueckgesetzt (BitcoinInfo-Tab sollte dieselbe Groesse wie alle anderen
  # Tabs haben, nicht projektweit groesser).
  bg-fs-hero: "3.5rem"        # eine grosse Kennzahl (wie die Uhr)
  bg-fs-title: "1.75rem"      # Karten-Headline / grosse Stat-Werte
  bg-fs-body: "1rem"          # Fliesstext (HA-Default)
  bg-fs-secondary: "0.875rem" # Sekundaertext
  bg-fs-label: "0.75rem"      # Mini-Labels (UPPERCASE)

  # ── Glaskarten (iOS-Look): dunkel-transluzent, gedämpfter als v1 ────
  # Original-Glas war 0.58/0.46 (zu durchsichtig), voll opak wirkte tot.
  # 0.78/0.68 behält den Glas-Effekt, lässt aber weniger durchscheinen.
  # Dialoge, Menüs und Tooltips (unten) bleiben voll opak, sonst unlesbar.
  ha-card-background: "linear-gradient(180deg, rgba(38,44,72,0.78) 0%, rgba(24,28,50,0.68) 100%)"
  card-background-color: "#1e2338"
  secondary-background-color: "#272d4a"
  ha-card-border-radius: "20px"
  ha-card-border-width: "1px"
  ha-card-border-color: "rgba(255,255,255,0.16)"
  ha-card-box-shadow: "0 8px 32px rgba(8,10,25,0.30)"

  # ── Dialoge & Menüs: opake Oberfläche ───────────────────────────────
  # ha-dialog und mwc-menu ziehen ihre Fläche aus --mdc-theme-surface
  # (Fallback: card-background-color). Beides explizit opak setzen, sonst
  # scheint der Dashboard-Inhalt durch den More-Info-Dialog.
  mdc-theme-surface: "#1e2338"
  ha-dialog-surface-background: "#1e2338"

  # ── Tooltips: dunkel-opak, helle Schrift ────────────────────────────
  # HA 2026.x nutzt ha-tooltip (Web-Awesome-basiert) mit eigenen Tokens;
  # ohne sie fällt der Hintergrund auf Weiß zurück, die Schrift kommt
  # aber hell aus dem Theme → weiß-auf-weiß. paper-tooltip-Variablen
  # bleiben für ältere Komponenten (z.B. Custom Cards) gesetzt.
  ha-tooltip-background-color: "#1e2338"
  ha-tooltip-text-color: "#f3f5fb"
  paper-tooltip-background: "#1e2338"
  paper-tooltip-text-color: "#f3f5fb"
  paper-tooltip-opacity: "1"

  # ── Eingabefelder (MWC-Select/TextField) ────────────────────────────
  # Füllfarbe explizit HELL setzen + Ink dunkel: eine Kombination, die in
  # jedem Kontext lesbar ist. Ohne explizite Füllfarbe fällt MWC je nach
  # Kontext auf Weiß oder die dunkle Surface zurück, was weiß-auf-weiß
  # bzw. schwarz-auf-dunkel erzeugte (unlesbare Textboxen in Dialogen).
  mdc-text-field-fill-color: "#e9ecf5"
  mdc-text-field-ink-color: "#1a1a2e"
  mdc-text-field-label-ink-color: "#3a3a5e"
  mdc-select-fill-color: "#e9ecf5"
  mdc-select-ink-color: "#1a1a2e"
  mdc-select-label-ink-color: "#3a3a5e"
  mdc-select-dropdown-icon-color: "#1a1a2e"

  # ── Eingabefelder, harter Fallback (card-mod) ────────────────────────
  # Die mdc-text-field-*-Tokens oben erreichen offenbar nicht mehr jeden
  # Kontext (Stand HA 2026.5.3): sowohl input_text-Zeilen (₿itsy-Chat) als
  # auch die Regelschwellen-Zahlenfelder in den Regler-Dialogen (input_
  # number more-info) zeigten fast-weiße, unlesbare Schrift auf hellem
  # Grund — die Tokens oben reichen also gerade NICHT bis in ha-textfield
  # hinein. card-mod (HACS, bereits als Resource geladen, siehe
  # configuration.yaml) kann global CSS injizieren statt pro Karte:
  # card-mod-root wirkt auf JEDE Karte, card-mod-more-info zusätzlich auf
  # Mehr-Info-Dialoge (dort leben die Regler-Zahlenfelder). $: durchdringt
  # eine Shadow-DOM-Ebene, damit die Ink-Farbe auch das tatsächliche
  # <input>-Element trifft, nicht nur die (offenbar ignorierte) Custom
  # Property.
  card-mod-theme: "BitGridAI"
  card-mod-root: |
    ha-textfield, mwc-textfield, ha-select, mwc-select {
      --mdc-text-field-fill-color: #e9ecf5 !important;
      --mdc-text-field-ink-color: #1a1a2e !important;
      --mdc-text-field-label-ink-color: #3a3a5e !important;
      --mdc-select-fill-color: #e9ecf5 !important;
      --mdc-select-ink-color: #1a1a2e !important;
    }
    ha-textfield $: {
      .mdc-text-field__input { color: #1a1a2e !important; }
      .mdc-floating-label { color: #3a3a5e !important; }
      .mdc-text-field__ripple { background-color: #e9ecf5 !important; }
    }
    /* input_text-Zeilen in entities-Karten (z.B. "Frag Bitsy") sitzen in
       hui-input-text-entity-row, einer eigenen Shadow-Root-Ebene vor dem
       ha-textfield oben: die Regeln darüber erreichen sie deshalb nicht,
       der zweifach verschachtelte $:-Durchstich hier schon. */
    hui-input-text-entity-row $: {
      ha-textfield {
        --mdc-text-field-fill-color: #e9ecf5 !important;
        --mdc-text-field-ink-color: #1a1a2e !important;
        --mdc-text-field-label-ink-color: #3a3a5e !important;
      }
      ha-textfield $: {
        .mdc-text-field__input { color: #1a1a2e !important; }
        .mdc-floating-label { color: #3a3a5e !important; }
        .mdc-text-field__ripple { background-color: #e9ecf5 !important; }
      }
    }
  card-mod-more-info: |
    ha-textfield, mwc-textfield {
      --mdc-text-field-fill-color: #e9ecf5 !important;
      --mdc-text-field-ink-color: #1a1a2e !important;
      --mdc-text-field-label-ink-color: #3a3a5e !important;
    }
    ha-textfield $: {
      .mdc-text-field__input { color: #1a1a2e !important; }
      .mdc-floating-label { color: #3a3a5e !important; }
      .mdc-text-field__ripple { background-color: #e9ecf5 !important; }
    }

  # ── Kopfleiste (transluzent, etwas deckender als v1: 0.30 → 0.55) ───
  app-header-background-color: "rgba(20,24,44,0.55)"
  app-header-text-color: "#f3f5fb"

  # ── Sidebar (dunkel, opak) ──────────────────────────────────────────
  sidebar-background-color: "#101324"
  sidebar-text-color: "#c8cdda"
  sidebar-icon-color: "#9aa0b4"
  sidebar-selected-text-color: "#4CAF50"
  sidebar-selected-icon-color: "#4CAF50"

  # ── v3-Farbpalette (24.08.2026, Nutzer-Vorgabe) ──────────────────────
  # Bewusst NUR als zusaetzliche, "-v3"-benannte Variablen im BESTEHENDEN
  # Theme deklariert, kein zweites Theme: v1/v2 referenzieren diese Namen
  # nirgends, bleiben also unveraendert. Nur bitgrid_dashboard_v3.yaml
  # und seine !include-Views (energieverlauf_tag.yaml, finanz_bilanz.yaml)
  # nutzen sie. Sidebar/Topbar bleiben bewusst gemeinsam (Nutzer-Entscheidung
  # 24.08.2026: strukturell nicht ohne echten Theme-Wechsel pro Dashboard
  # scopebar, siehe docs/architecture ADR-Notiz falls das nochmal aufkommt).
  #
  # Datenrollen — jede Farbe bedeutet dashboard-weit in v3 genau eine Sache:
  bgai-pv-v3: "#FFD24A"        # PV-Ertrag
  bgai-mining-v3: "#F7931A"    # Mining / Bitcoin
  bgai-home-v3: "#3FD07F"      # Zuhause / Akku
  bgai-grid-v3: "#7C83E8"      # Netz
  bgai-geraete-v3: "#C08AD8"   # Sonstige Geräte
  bgai-total-v3: "#C7D0E8"     # Summe / Gesamt-Profit (neutral, kein Rot bei negativ)
  bgai-alarm-v3: "#FF5C5C"     # Alarm / Not-Aus
  bgai-erklaerung-v3: "#A3E635" # BitHamster / Erklärung

  # Flächen/Text — nur per View-scoped card-mod in v3 angewendet (siehe
  # bitgrid_dashboard_v3.yaml je View), NICHT global gesetzt:
  bgai-card-bg-v3: "#182449"
  bgai-divider-v3: "#26356B"
  bgai-text-primary-v3: "#EAEFFB"
  bgai-text-secondary-v3: "#A8B3D4"
