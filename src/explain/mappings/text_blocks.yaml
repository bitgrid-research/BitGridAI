de:
  START_R1_SURPLUS_OK:
    example: "Miner läuft — deine Anlage erzeugt 2,1 kW mehr als du gerade verbrauchst."
    short: "PV-Überschuss vorhanden — Miner läuft"
    long: "PV-Leistung übersteigt Hausverbrauch um {surplus_kw:.1f} kW. Miner gestartet."
    trigger: "Deine Solaranlage erzeugt {surplus_kw:.1f} kW mehr als dein Haus gerade verbraucht"
    data_basis: "PV {pv_power_w:.0f} W · Haus {house_load_w:.0f} W · Überschuss {surplus_kw:.1f} kW · Prognose {pv_forecast_kw:.1f} kW"
    effect: "Miner gestartet — nutzt deinen Solarüberschuss"
    options: ""

  NOOP_R1_INSUFFICIENT_SURPLUS:
    example: "Miner wartet: 0,8 kW Überschuss — noch 0,7 kW bis zur Startschwelle von 1,5 kW."
    short: "Zu wenig PV-Überschuss — Miner wartet"
    long: "Aktueller Überschuss {surplus_kw:.1f} kW liegt unter der Startschwelle {surplus_min_kw:.1f} kW."
    trigger: "Deine Solaranlage erzeugt nur {surplus_kw:.1f} kW Überschuss — mindestens {surplus_min_kw:.1f} kW wären nötig"
    data_basis: "PV-Überschuss {surplus_kw:.1f} kW · Startschwelle {surplus_min_kw:.1f} kW · Prognose {pv_forecast_kw:.1f} kW"
    effect: "Miner bleibt gestoppt — zu wenig Solarstrom"
    options: "Miner startet ab {surplus_min_kw:.1f} kW Überschuss"

  NOOP_R1_PRICE_TOO_HIGH:
    example: "1 Strompreis zu hoch: 28 ct/kWh, Limit bei 25 ct — Miner wartet."
    short: "Strompreis zu hoch — Miner wartet"
    long: "Aktueller Preis {energy_price_ct_kwh:.1f} ct/kWh liegt über dem Limit {price_max_ct_kwh:.1f} ct/kWh."
    trigger: "Strompreis {energy_price_ct_kwh:.1f} ct/kWh ist zu hoch — Limit liegt bei {price_max_ct_kwh:.1f} ct/kWh"
    data_basis: "Strompreis {energy_price_ct_kwh:.1f} ct/kWh · Preislimit {price_max_ct_kwh:.1f} ct/kWh · Prognose {pv_forecast_kw:.1f} kW"
    effect: "Miner bleibt gestoppt — Preisschutz aktiv"
    options: "Miner startet wenn Preis unter {price_max_ct_kwh:.1f} ct/kWh sinkt"

  THROTTLE_R1_SURPLUS_THROTTLE:
    example: "Miner läuft gedrosselt — 1,0 kW Überschuss reicht für Eco-Betrieb, Voll-Last erst ab 1,5 kW."
    short: "Wenig Überschuss — Miner läuft gedrosselt (Eco)"
    long: "PV-Überschuss {surplus_kw:.1f} kW liegt im Eco-Band — Miner läuft gedrosselt, volle Last erst ab {surplus_min_kw:.1f} kW."
    trigger: "Deine Solaranlage erzeugt {surplus_kw:.1f} kW Überschuss — genug für gedrosselten Betrieb, aber nicht für Voll-Last ({surplus_min_kw:.1f} kW)"
    data_basis: "PV-Überschuss {surplus_kw:.1f} kW · Voll-Last-Schwelle {surplus_min_kw:.1f} kW · PV {pv_power_w:.0f} W · Prognose {pv_forecast_kw:.1f} kW"
    effect: "Miner läuft gedrosselt — fängt deinen Solarüberschuss ab, statt ihn einzuspeisen"
    options: "Voll-Last ab {surplus_min_kw:.1f} kW Überschuss"

  STOP_R2_SOC_HARD_MIN:
    example: "Miner gestoppt — Batterie nur noch 45 %, Hausreserve liegt bei 50 %."
    short: "Batterie kritisch — Miner gestoppt"
    long: "Batterieladung {battery_soc_pct:.0f} % liegt unter dem Sicherheitsminimum {soc_hard_min_pct:.0f} %."
    trigger: "Batterie ist nur noch {battery_soc_pct:.0f} % geladen — unter dem Sicherheitsminimum {soc_hard_min_pct:.0f} %"
    data_basis: "Batterie {battery_soc_pct:.0f} % · Sicherheitsminimum {soc_hard_min_pct:.0f} %"
    effect: "Miner gestoppt — Batterie schützen"
    options: "Miner startet wieder ab {soc_soft_min_pct:.0f} % · Prognose {pv_forecast_kw:.1f} kW"

  NOOP_R2_SOC_SOFT_MIN:
    example: "Miner wartet — Batterie erst bei 55 %, Start erst ab 58 %."
    short: "Batterie lädt — Miner wartet"
    long: "Batterieladung {battery_soc_pct:.0f} % liegt unter der Mindestschwelle {soc_soft_min_pct:.0f} %."
    trigger: "Batterie lädt erst auf {soc_soft_min_pct:.0f} % auf, bevor der Miner starten darf — aktuell {battery_soc_pct:.0f} %"
    data_basis: "Batterie {battery_soc_pct:.0f} % · Mindestschwelle {soc_soft_min_pct:.0f} %"
    effect: "Miner bleibt aus — Batterie lädt zuerst"
    options: "Miner startet ab {soc_soft_min_pct:.0f} % Ladezustand"

  STOP_R2_GRID_IMPORT_EXCEEDED:
    example: "Miner gestoppt — 620 W Netzbezug, Limit ist 300 W."
    short: "Zu viel Netzbezug — Miner gestoppt"
    long: "Netzbezug {grid_import_w:.0f} W überschreitet das erlaubte Limit {max_grid_import_w:.0f} W."
    trigger: "Das System bezieht {grid_import_w:.0f} W aus dem Stromnetz — erlaubt sind {max_grid_import_w:.0f} W"
    data_basis: "Netzbezug {grid_import_w:.0f} W · Limit {max_grid_import_w:.0f} W"
    effect: "Miner gestoppt — Stromnetz entlasten"
    options: "Miner startet wenn Netzbezug unter {max_grid_import_w:.0f} W sinkt"

  STOP_R3_OVERTEMP:
    example: "Zu heiß — Miner gestoppt bei 89 °C, Sicherheitsgrenze ist 85 °C."
    short: "Übertemperatur — Miner gestoppt"
    long: "Chip-Temperatur {miner_temp_c:.0f}°C überschreitet die Sicherheitsgrenze {max_chip_temp_c:.0f}°C."
    trigger: "Chip-Temperatur {miner_temp_c:.0f}°C liegt über dem Sicherheitslimit von {max_chip_temp_c:.0f}°C"
    data_basis: "Chip-Temperatur {miner_temp_c:.0f}°C · Limit {max_chip_temp_c:.0f}°C"
    effect: "Miner gestoppt — Überhitzungsschutz"
    options: "Miner startet nach Abkühlung unter {max_chip_temp_c:.0f}°C"

  STOP_R3_COMM_TIMEOUT:
    example: "Miner nicht erreichbar — kein Signal seit 90 Sekunden, Timeout-Limit ist 60 s."
    short: "Miner nicht erreichbar — gestoppt"
    long: "Kein Heartbeat vom Miner seit {miner_heartbeat_age_sec:.0f} s (Limit: {comm_timeout_sec:.0f} s)."
    trigger: "Der Miner antwortet seit {miner_heartbeat_age_sec:.0f} Sekunden nicht mehr"
    data_basis: "Kein Signal seit {miner_heartbeat_age_sec:.0f} s · Timeout-Limit {comm_timeout_sec:.0f} s"
    effect: "Miner gestoppt — Verbindung unterbrochen"
    options: "Miner startet nach Wiederverbindung"

  NOOP_R4_FORECAST_PV_INSUFFICIENT:
    example: "Prognose zu schwach: nur 1,2 kW erwartet — mindestens 2,0 kW wären nötig."
    short: "PV-Prognose zu schwach — Miner wartet"
    long: "Vorhergesagte PV-Leistung {pv_forecast_kw:.1f} kW reicht nicht für den Mindestüberschuss {min_predicted_surplus_kw:.1f} kW."
    trigger: "In den nächsten Stunden werden nur {pv_forecast_kw:.1f} kW PV erwartet — mindestens {min_predicted_surplus_kw:.1f} kW wären nötig"
    data_basis: "PV-Prognose {pv_forecast_kw:.1f} kW · Mindestüberschuss {min_predicted_surplus_kw:.1f} kW"
    effect: "Miner startet nicht — Prognose zu schwach"
    options: "Miner startet wenn Prognose ≥ {min_predicted_surplus_kw:.1f} kW"

  NOOP_R4_FORECAST_PRICE_SPIKE:
    example: "Miner wartet — Strompreis steigt laut Prognose über 30 ct/kWh, Starten lohnt sich nicht."
    short: "Strompreis-Anstieg erwartet — Miner wartet"
    long: "Hoher Strompreis in den nächsten Stunden erwartet. Kein Start, um Netzbezug zu vermeiden."
    trigger: "Für die nächsten Stunden ist ein Strompreis-Anstieg vorhergesagt"
    data_basis: "Preis-Peak in Prognose erkannt"
    effect: "Miner startet nicht — Preisanstieg erwartet"
    options: "Miner startet wenn kein Preisanstieg erwartet wird"

  NOOP_R5_DEADBAND_ACTIVE:
    example: "Entscheidung stabil gehalten — letzte Änderung war vor 10 Minuten."
    short: "Stabilisierungsphase — Entscheidung gehalten"
    long: "Entscheidung bleibt stabil bis {valid_until}. Schnelles Schalten wird vermieden."
    trigger: "Die letzte Entscheidung liegt erst {blocks_since_last_change} Intervalle zurück — häufiges Schalten wird vermieden"
    data_basis: "Letzte Änderung vor {blocks_since_last_change} Intervallen"
    effect: "Entscheidung unverändert — schnelles Ein-/Ausschalten vermeiden"
    options: "Nächste Entscheidung ab {valid_until}"

  NOOP_R5_MIN_RUNTIME_NOT_REACHED:
    example: "Miner läuft weiter — Mindestlaufzeit: noch 20 Minuten bis zum frühesten Stopp."
    short: "Mindestlaufzeit läuft — Miner bleibt an"
    long: "Miner läuft seit {blocks_since_last_change} Intervallen. Mindestlaufzeit: {min_runtime_blocks} Intervalle."
    trigger: "Miner läuft erst seit {blocks_since_last_change} von {min_runtime_blocks} Pflicht-Intervallen"
    data_basis: "Läuft seit {blocks_since_last_change} / {min_runtime_blocks} Intervallen (je 10 min)"
    effect: "Miner läuft weiter — Mindestlaufzeit einhalten"
    options: "Stopp frühestens nach {min_runtime_blocks} Intervallen"

  NOOP_R5_MIN_PAUSE_NOT_REACHED:
    example: "Miner bleibt aus — Mindestpause: noch 10 Minuten bis zum frühesten Start."
    short: "Mindestpause läuft — Miner bleibt aus"
    long: "Miner ist seit {blocks_since_last_change} Intervallen gestoppt. Mindestpause: {min_pause_blocks} Intervalle."
    trigger: "Miner ist erst seit {blocks_since_last_change} von {min_pause_blocks} Pflicht-Pausen-Intervallen gestoppt"
    data_basis: "Gestoppt seit {blocks_since_last_change} / {min_pause_blocks} Intervallen (je 10 min)"
    effect: "Miner bleibt aus — Mindestpause einhalten"
    options: "Miner startet frühestens nach {min_pause_blocks} Intervallen"

  NOOP_MANUAL_MODE:
    example: "Manueller Modus aktiv — das System trifft keine automatischen Entscheidungen."
    short: "Manueller Modus aktiv"
    long: "Das System ist im manuellen Modus. Automatische Start- und Stopp-Entscheidungen sind deaktiviert."
    trigger: "Du hast den manuellen Modus aktiviert"
    data_basis: "Betriebsmodus: Manuell"
    effect: "Keine automatische Aktion — du entscheidest"
    options: "Automatik aktivieren: Betriebsmodus auf Automatik setzen"

  STOP_R1_SOC_RESERVE_STOP:
    example: "Miner gestoppt: Akku nur noch 48 %, Hausreserve liegt bei 50 %."
    short: "Hausreserve unterschritten, Miner gestoppt"
    long: "Ladezustand {battery_soc_pct:.0f} % liegt unter der Hausreserve {soc_stop_pct:.0f} %."
    trigger: "Akku ist auf {battery_soc_pct:.0f} % gefallen, unter der Hausreserve von {soc_stop_pct:.0f} %"
    data_basis: "Akku {battery_soc_pct:.0f} % · Hausreserve {soc_stop_pct:.0f} %"
    effect: "Miner gestoppt, Reserve fürs Haus freihalten"
    options: "Miner startet erst wieder, wenn der Akku die Startschwelle erreicht"

  NOOP_R1_SOC_RESERVE_STOP:
    example: "Akku bei 48 % unter der Reserve, im Assistenzmodus bleibt es ein Hinweis."
    short: "Hausreserve unterschritten (Assistenzmodus)"
    long: "Ladezustand {battery_soc_pct:.0f} % unter Hausreserve {soc_stop_pct:.0f} %. Im Assistenzmodus kein automatischer Stopp."
    trigger: "Akku {battery_soc_pct:.0f} % liegt unter der Hausreserve {soc_stop_pct:.0f} %"
    data_basis: "Akku {battery_soc_pct:.0f} % · Hausreserve {soc_stop_pct:.0f} % · Modus Assistenz"
    effect: "Kein automatischer Stopp, im Assistenzmodus entscheidest du"
    options: "Im Vollautomatik-Modus würde der Miner hier stoppen"

  NOOP_R1_SOC_HOLD:
    example: "Miner wartet: Akku 55 %, Startgrenze liegt bei 58 %."
    short: "Akku im Halteband, Miner wartet"
    long: "Ladezustand {battery_soc_pct:.0f} % liegt zwischen Reserve und Eco-Start {soc_eco_start_pct:.0f} %. Kein Neustart."
    trigger: "Akku {battery_soc_pct:.0f} % liegt noch unter der Startgrenze {soc_eco_start_pct:.0f} %"
    data_basis: "Akku {battery_soc_pct:.0f} % · Eco-Start {soc_eco_start_pct:.0f} %"
    effect: "Miner bleibt aus, Akku lädt erst weiter"
    options: "Start ab {soc_eco_start_pct:.0f} % Akku"

  NOOP_R1_SOC_HOLD_PV:
    example: "Akku bereit (60 %), aber nur 3200 W Sonne, Frischstart braucht 6000 W."
    short: "Akku reicht, Sonne zu schwach"
    long: "Akku {battery_soc_pct:.0f} % im Eco-Band, aber PV {pv_power_w:.0f} W unter Frischstart-Schwelle {pv_start_w:.0f} W."
    trigger: "Akku wäre bereit ({battery_soc_pct:.0f} %), aber PV {pv_power_w:.0f} W liegt unter der Frischstart-Schwelle {pv_start_w:.0f} W"
    data_basis: "Akku {battery_soc_pct:.0f} % · PV {pv_power_w:.0f} W · Frischstart ab {pv_start_w:.0f} W"
    effect: "Miner bleibt aus, Kaltstart wartet auf Sonne"
    options: "Eco-Start ab {pv_start_w:.0f} W PV"

  THROTTLE_R1_ECO:
    example: "Miner startet sparsam: 6300 W Sonne, Akku 64 %, Eco-Modus."
    short: "Genug Sonne, Eco-Start"
    long: "Akku {battery_soc_pct:.0f} % im Eco-Band, PV {pv_power_w:.0f} W über Frischstart {pv_start_w:.0f} W. Miner im Eco."
    trigger: "Genug Sonne für den Eco-Start: {pv_power_w:.0f} W PV bei {battery_soc_pct:.0f} % Akku"
    data_basis: "Akku {battery_soc_pct:.0f} % · PV {pv_power_w:.0f} W · Frischstart ab {pv_start_w:.0f} W"
    effect: "Miner läuft im Eco-Modus, sparsam auf Solarüberschuss"
    options: "Standard ab {soc_standard_pct:.0f} % Akku"

  START_R1_STANDARD:
    example: "Miner auf Standard: Akku 80 %, Standard-Band erreicht."
    short: "Miner läuft auf Standard"
    long: "Akku {battery_soc_pct:.0f} % erreicht das Standard-Band ({soc_standard_pct:.0f} %). Miner auf Standard."
    trigger: "Akku ist auf {battery_soc_pct:.0f} % gestiegen, Standard-Band ab {soc_standard_pct:.0f} %"
    data_basis: "Akku {battery_soc_pct:.0f} % · Standard ab {soc_standard_pct:.0f} % · Super ab {soc_super_pct:.0f} %"
    effect: "Miner auf Standard-Leistung, mehr Akku trägt mehr Last"
    options: "Super ab {soc_super_pct:.0f} % Akku"

  START_R1_SUPER:
    example: "Voll geladen: Akku 91 %, Miner auf Super (volle Last)."
    short: "Miner läuft auf Super (volle Last)"
    long: "Akku {battery_soc_pct:.0f} % erreicht das Super-Band ({soc_super_pct:.0f} %). Miner auf volle Last."
    trigger: "Akku ist über {soc_super_pct:.0f} %, voller Speicher, Miner auf Super"
    data_basis: "Akku {battery_soc_pct:.0f} % · Super ab {soc_super_pct:.0f} %"
    effect: "Miner auf volle Leistung im Super-Modus"
    options: "Läuft auf Super, solange der Akku ≥ {soc_super_pct:.0f} % bleibt"

  NOOP_NIGHT_BLOCK:
    example: "Nachtruhe: 23 Uhr, Mining pausiert bis 6 Uhr."
    short: "Nachtsperre, Mining pausiert"
    long: "Uhrzeit {hour} Uhr liegt im Nachtfenster {night_start_hour} bis {night_end_hour} Uhr. Kein Mining."
    trigger: "Es ist {hour} Uhr, im Nachtfenster {night_start_hour} bis {night_end_hour} Uhr pausiert das Mining"
    data_basis: "Uhrzeit {hour} Uhr · Nachtsperre {night_start_hour} bis {night_end_hour} Uhr"
    effect: "Mining nachts ausgesetzt, unabhängig vom Akkustand"
    options: "Normalbetrieb wieder ab {night_end_hour} Uhr"

en:
  START_R1_SURPLUS_OK:
    short: "PV surplus available — miner running"
    long: "PV output exceeds house load by {surplus_kw:.1f} kW. Miner started."
    trigger: "Your solar panels produce {surplus_kw:.1f} kW more than your house consumes right now"
    data_basis: "PV {pv_power_w:.0f} W · house {house_load_w:.0f} W · surplus {surplus_kw:.1f} kW"
    effect: "Miner started — using your solar surplus"
    options: ""

  STOP_R3_OVERTEMP:
    short: "Safety stop: overtemperature"
    long: "Chip temperature {miner_temp_c:.0f}°C exceeds safety limit {max_chip_temp_c:.0f}°C."
    trigger: "Chip temperature {miner_temp_c:.0f}°C is above the safety limit of {max_chip_temp_c:.0f}°C"
    data_basis: "Chip temp {miner_temp_c:.0f}°C · limit {max_chip_temp_c:.0f}°C"
    effect: "Miner stopped — overheat protection"
    options: "Miner restarts after cooldown below {max_chip_temp_c:.0f}°C"

  NOOP_R5_DEADBAND_ACTIVE:
    short: "Hold phase active"
    long: "Decision remains stable until {valid_until}. Rapid switching is avoided."
    trigger: "Last decision was only {blocks_since_last_change} intervals ago — rapid switching is avoided"
    data_basis: "Last change {blocks_since_last_change} intervals ago"
    effect: "Decision unchanged — avoid rapid switching"
    options: "Next decision from {valid_until}"
